# ⚠️ 这份文件在 apps/postgres/manifests/ 下的那一份是**生成产物**——
# 源头是 templates/apps-postgres-manifests/cluster.yaml,改动请改模板,
# 不要直接改生成结果(下次渲染会被覆盖,CI 的 --check 也会报漂移)。
# 之所以要模板化:`instances` 是 HA 副本数,prod 必须和 local-lite 不同,
# 见 ADR-059 和 environments/resource-profiles.yaml。
# 共享 Postgres 迁移到 CloudNativePG operator 管理(见 ADR-038 的评估
# 结论、ADR-033 的备份/恢复验证)。老的 statefulset.yaml 顶部早就写了
# "cloud-full/prod 起换成 CloudNativePG operator,到时候这个文件整体
# 替换"——这次是提前把这条路走通,不是临时起意(那份文件 2026-08-13
# 确认迁移稳定后已经删除)。
#
# local-lite 现实是单节点机器,`instances: 1`——真正有意义的多副本 HA
# 要等接入 cloud-full/生产、有多个节点能分布副本才有意义(ADR-038 已经
# 记录过这个结论),这次迁移换的是"operator 管理带来的运维能力"(原生
# 备份/恢复、更规范的升级路径),不是"现在就有高可用"。
#
# 名字故意叫 postgres-cnpg,不是直接叫 postgres——迁移过程中旧的
# StatefulSet(已删除)和这个 Cluster 曾经在同一个 namespace 里并存过,
# 两边不能抢同一个 Service 名字。切流量走的是 service.yaml:那份文件
# 名字还是 `postgres`,原来 selector 指向老 StatefulSet,已经改成
# ExternalName 别名到这个 Cluster 自动生成的 `postgres-cnpg-rw` 这个
# Service,所有组件现在连的 `postgres.data.svc.cluster.local` 这个域名
# 不用改一个字,不需要逐个组件改连接串/Secret。
#
# imageName 锁定 16.x(和旧实例的大版本一致)——不想把"换 operator"和
# "顺带大版本升级"这两个风险叠在一起做,CNPG operator 默认拉的是 18.4,
# 显式锁定版本。2026-08-15 版本审计后从 16.6 补丁升级到 16.15(同一
# 大版本内的补丁,不是这里说的大版本升级,见 docs/project/roadmap.md P1.6)——
# PostgreSQL 18 作为 major upgrade 仍然是单独评估的事,不是这次做的。
#
# superuserSecret 直接复用现有的 postgres-root 这个 Secret(username=
# postgres,password=<既有值>,key 名字正好符合 CNPG 的约定)——这样迁移
# 完之后 superuser 密码不变,不用同步更新到任何用到它的地方。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cnpg
  namespace: data
spec:
  # 规格分档,见 environments/resource-profiles.yaml
  instances: {{RES:postgres_instances}}
  # 2026-08-14:见 ADR-041(队列资源管理)——Postgres 是共享底座,挂了会
  # 带崩一大片消费方,归 platform-critical 档,节点资源紧张时最后才会被
  # 考虑驱逐。CNPG 的 Cluster CRD 原生支持这个字段
  # (`kubectl explain cluster.spec.priorityClassName` 确认过),不需要
  # 像大多数 Helm chart 那样绕弯子。
  priorityClassName: platform-critical
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  superuserSecret:
    name: postgres-root
  enableSuperuserAccess: true
  # 2026-08-13 切完流量之后实测踩到的坑:CNPG 默认把
  # ssl_min_protocol_version 设成 TLSv1.3(比大多数生产环境的默认值都
  # 严格),Hive Metastore(apache/hive:3.1.3 镜像自带的 JDBC 驱动比较老)
  # 连接时直接报 "SSL error: Received fatal alert: protocol_version"——
  # 不是被拒绝重试明文连接,是 SSL 握手本身就失败,整个连接失败,
  # schematool 判定"schema 不存在"要重新 initSchema,pod 陷入
  # 崩溃重启循环(实测确认,不是猜的,`schematool -info` 的输出里能直接
  # 看到这行 SSL 报错)。旧的 postgres:16.6 官方镜像默认没开 SSL,所有
  # 现有组件的连接方式从来没考虑过这一层,不是只有 Hive Metastore 会踩到
  # ——降到 TLSv1.2(仍然是加密连接,只是对老客户端更宽容),一次性在
  # Cluster 这一层解决,不用逐个组件的连接串加 sslmode=disable。
  postgresql:
    parameters:
      ssl_min_protocol_version: "TLSv1.2"
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
