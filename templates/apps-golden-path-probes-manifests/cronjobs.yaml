# startingDeadlineSeconds 一律设成**和自己的调度周期相同**(*/10 → 600,
# */30 → 1800),不是随便取的 120。
#
# 2026-08-28 实测:cloud-full 开机之后,`*/30` 的 catalog 探针在门户上红了
# 27 分钟——不是链路真的断了,是开机那一刻上一个整点已经过去超过 120 秒,
# CronJob 控制器直接跳过,只能等下一个半点。deadline 和周期对齐之后,含义
# 变成"开机时如果上一个计划时刻还在本周期内,就立刻补跑一次",开机后第一
# 眼看到的就是真实状态。周期内最多补跑 1 次,不会触发 k8s 的
# "too many missed start times (>100)" 保护。
#
# 同一类问题在 OpenMetadata 那边更严重(它写死 60 秒,结果三个采集/质量
# CronJob 建出来 5 天一次都没跑过),见 scripts/fix-openmetadata-cronjob-deadline.sh。
# 黄金链路探针的 CronJob(ADR-079)。**这是渲染产物的源文件**,改这里。
#
# **三条链路三个 CronJob,不是一个 CronJob 跑三条。** 这样
# kube-state-metrics 天然给出每条链路的
# `kube_cronjob_status_last_successful_time`,看板和告警都不用再引
# Pushgateway 这类新组件——是刻意的设计,不是拆得太碎。
#
# 探针账号 goldenpath_probe **不在 OPA 的服务账号豁免名单里**,走的是和
# 真实用户一样的授权路径(grant 在 platform/iam/table-access-grants.csv)。
# 用豁免账号探测的话,OPA 的 grants 同步挂了探针也照样绿。
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goldenpath-query
  namespace: monitoring
  labels:
    platform/golden-path: "query"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  # 探针本身卡住也算失败:不设这个的话,一个卡死的探针会让
  # last_successful_time 一直不更新,而 Job 永远不结束、也不算 Failed。
  startingDeadlineSeconds: 600
  jobTemplate:
    # **标签要打在 jobTemplate 上,不能只打在 CronJob 上** —— CronJob 自己的
    # labels 不会传给它生出来的 Job,而下面那条 ArgoCD 自定义健康检查认的
    # 正是 Job 上的这个标签。
    metadata:
      labels:
        platform/golden-path: "probe"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          # 标签要同时打在 Job **和它的 Pod** 上。2026-08-29 实测:只打在 Job
          # 上时,ADR-079 那段 `batch/Job` 的健康检查 Lua 确实生效了,但
          # ArgoCD 还会把 Job 底下的 **Pod** 算进应用健康——失败 Pod 走内置
          # 的 Pod 判定直接 Degraded,于是 golden-path-probes 这个 Application
          # 还是黄的,ADR-079 想解决的"常年黄灯"没真的解决。
          labels:
            platform/golden-path: "probe"
        spec:
          priorityClassName: batch
          restartPolicy: Never
          containers:
            - name: probe
              image: python:3.12-slim
              command: ["python3", "/probe/probe.py", "query"]
              env:
                - name: TRINO_USER
                  value: goldenpath_probe
                - name: TRINO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trino-service-account
                      key: password-goldenpath_probe
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: golden-path-probes
---
apiVersion: batch/v1
kind: CronJob
metadata:
