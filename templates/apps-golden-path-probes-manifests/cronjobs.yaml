---
# 查询审计这条链路(ADR-066)。**它和别的探针不是一个性质的**:别的链路
# 断了,修好之后一切照旧;审计断了,**那段时间的记录永远补不回来** ——
# Trino 的 event listener 是 fail-open 的(否则 Kafka 挂了 Trino 起不来),
# 事件会静默丢失,Kafka 保留期一到就没了。
#
# 已有的 `AuditSinkJobNotRunning` 告警盯的是"作业还在不在";这条盯的是
# **表里有没有新行** —— 作业在跑但消费停滞(反压、写 Iceberg 一直失败)
# 那种情况,前者看不出来。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goldenpath-audit
  namespace: monitoring
  labels:
    platform/golden-path: "audit"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        platform/golden-path: "probe"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            platform/golden-path: "probe"
        spec:
          priorityClassName: batch
          restartPolicy: Never
          containers:
            - name: probe
              image: python:3.12-slim
              command: ["python3", "/probe/probe.py", "audit"]
              env:
                - name: TRINO_USER
                  value: goldenpath_probe
                - name: TRINO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trino-service-account
                      key: password-goldenpath_probe
                - name: AUDIT_MAX_AGE_MIN
                  # 探针自己每 10 分钟查一次,那次查询本身就会被审计记下来,
                  # 所以正常情况下审计表里总有几分钟内的新行。给
                  # {{RES:goldenpath_audit_max_age_min}} 分钟是为了容忍一次
                  # checkpoint 延迟和一次探针失败,不是因为链路真的那么慢。
                  value: "{{RES:goldenpath_audit_max_age_min}}"
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: golden-path-probes

---
# 数据目录里那份 Trino 连接配置的完整性(2026-09-02 加)。
#
# **为什么值得单独一条探针**:这个配置上的 username 掉过两次,而它掉了之后
# 的表现是 483 条 pydantic 校验错误 + 一句毫不相干的 AttributeError 收尾,
# 没人会从里面读出"少了个用户名";而且失败是渐进的(数据质量只是 6 条坏
# 1 条,目录本身照常能查),很容易被当成"某条测试写错了"放着。
#
# 结构照抄 goldenpath-catalog(它需要 OPENMETADATA_TOKEN)。
# **探针名写在 command 的最后一个元素,不是 args** —— 这两个字段这里都存在,
# 第一版改了 args,结果 CronJob 跑的还是 catalog 这条探针、还"通过"了,
# 日志里写着 `链路 [catalog] 通` 才看出来。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goldenpath-catalog-connection
  namespace: monitoring
  labels:
    platform/golden-path: catalog-connection
spec:
  schedule: '*/30 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    metadata:
      labels:
        platform/golden-path: catalog-connection
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            platform/golden-path: catalog-connection
        spec:
          priorityClassName: batch
          restartPolicy: Never
          containers:
          - name: probe
            image: python:3.12-slim
            command:
            - python3
            - /probe/probe.py
            - catalog-connection
            env:
            - name: TRINO_USER
              value: goldenpath_probe
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-service-account
                  key: password-goldenpath_probe
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openmetadata-quality-alerts-token
                  key: token
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: probe
              mountPath: /probe
          volumes:
          - name: probe
            configMap:
              name: golden-path-probes

---
# GitOps 本身还通不通(2026-09-03 加)。
#
# **为什么值得单独一条探针。** 一个 Application 拉不到 chart 时会停在
# `sync=Unknown`,而 `health` 仍然是 Healthy —— 活对象好好跑着,只是 git 里
# 改的任何配置都同步不下去了,而 ArgoCD 界面上不会红。
#
# 2026-09-03 一天之内在三个组件上撞到(trino / minio / ingress-nginx,都是
# 境外 helm repo 拉不动)。其中 ingress-nginx 那次的代价最直观:它因为内存
# 上限太小反复 OOM,把整个平台的外部访问搞断了,而"把上限调大"这个修复
# **同步不下去** —— 改完之后活对象纹丝不动,回头看 conditions 才发现。
#
# 这条探针需要读 argocd 命名空间的 Application 对象,所以有自己的
# ServiceAccount 和一条只读的 ClusterRole(下面)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goldenpath-gitops
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: goldenpath-gitops-read
rules:
  # 只读,而且只读 Application 这一种资源 —— 探针不需要别的
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goldenpath-gitops-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: goldenpath-gitops-read
subjects:
  - kind: ServiceAccount
    name: goldenpath-gitops
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goldenpath-gitops
  namespace: monitoring
  labels:
    platform/golden-path: "gitops"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        platform/golden-path: "probe"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            platform/golden-path: "probe"
        spec:
          priorityClassName: batch
          restartPolicy: Never
          serviceAccountName: goldenpath-gitops
          containers:
            - name: probe
              image: python:3.12-slim
              # 探针名是 command 的最后一个元素,不是 args —— 这两个字段
              # 这里都存在,改错了会静默跑成另一条探针还"通过"。
              command: ["python3", "/probe/probe.py", "gitops"]
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: golden-path-probes
