  # 探针本身卡住也算失败:不设这个的话,一个卡死的探针会让
  # last_successful_time 一直不更新,而 Job 永远不结束、也不算 Failed。
  startingDeadlineSeconds: 600
  jobTemplate:
    # **标签要打在 jobTemplate 上,不能只打在 CronJob 上** —— CronJob 自己的
    # labels 不会传给它生出来的 Job,而下面那条 ArgoCD 自定义健康检查认的
    # 正是 Job 上的这个标签。
    metadata:
      labels:
        platform/golden-path: "probe"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          # 标签要同时打在 Job **和它的 Pod** 上。2026-08-29 实测:只打在 Job
          # 上时,ADR-079 那段 `batch/Job` 的健康检查 Lua 确实生效了,但
          # ArgoCD 还会把 Job 底下的 **Pod** 算进应用健康——失败 Pod 走内置
          # 的 Pod 判定直接 Degraded,于是 golden-path-probes 这个 Application
          # 还是黄的,ADR-079 想解决的"常年黄灯"没真的解决。
          labels:
            platform/golden-path: "probe"
        spec:
          priorityClassName: batch
          restartPolicy: Never
          containers:
            - name: probe
              image: python:3.12-slim
              command: ["python3", "/probe/probe.py", "streaming"]
              env:
                - name: TRINO_USER
                  value: goldenpath_probe
                - name: TRINO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trino-service-account
                      key: password-goldenpath_probe
                - name: MAX_AGE_MIN
                  # producer 每 5 分钟发一批、Flink 每分钟 checkpoint,
                  # 正常情况下数据不会超过几分钟旧。给 {{RES:goldenpath_streaming_max_age_min}}
                  # 分钟是为了容忍一次 producer 失败 + 一次 checkpoint 延迟,
                  # 不是因为链路真的那么慢。
                  value: "{{RES:goldenpath_streaming_max_age_min}}"
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: golden-path-probes
