# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/platform-apps/kube-prometheus-stack.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
# local-lite: 缩短 retention、去掉持久化,只求验证指标链路能跑通。
# cloud-full/prod 起需要持久化存储,到时候用 environments/ 里的 values
# 覆盖,不改这个文件的结构。
#
# 2026-08-12 打开了 Alertmanager(ADR-034)——之前关掉是图省资源,但代价是
# "系统坏了要靠人肉巡检才知道",今晚 cert-manager 崩了 8 小时才被发现,
# 撑不住无人值守。chart 自带的 defaultRules(见下面没有改动的部分,
# `defaultRules.create` 是 chart 默认值 true,一直在生效,只是之前没地方
# 路由)已经覆盖了 Pod 崩溃重启、Job 失败等常见场景,打开 Alertmanager 当天
# 就抓到一个真实问题(iam-sync CronJob 的 DeadlineExceeded,见 ADR-031)。
#
# 还没配外部通知渠道(Slack/邮件/PagerDuty)——没有对应的 webhook/凭据,
# 这次只是让告警"可查"(Alertmanager 自己的 UI、Prometheus /alerts 页面),
# 不是"会推送"。真要做到有人告警会收到通知,需要人提供一个接收端(公司
# 内部的 webhook 地址,或者 Slack/邮件配置),这个 Secret 不应该由自动化
# 流程自己造。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 2026-08-22 从 https://prometheus-community.github.io/helm-charts
    # 换成同一个组织发布的 OCI 仓库。**不是换了 chart 来源方**,是同一批
    # 人发布的同一个 chart 的另一种分发形式(digest 可核对)。
    #
    # 换的原因是实测出来的:传统 Helm 仓库每次同步都要先拉整个
    # index.yaml,prometheus-community/grafana 这两个 index 都超过 1.4MB,
    # 从这台境内云主机实测下载速度只有约 12KB/s,单是这一个文件就要两分钟
    # 以上,直接打爆 ArgoCD 的执行超时——repo-server 日志里连续多轮
    # `helm pull ... context deadline exceeded`,Application 长期卡在
    # Sync Status = Unknown(底层 Pod 健康,纯粹是比较逻辑拉不到 chart)。
    # OCI 不需要 index:直接按名字+版本取 manifest,同一台机器上实测
    # 894KB 的 chart 几秒钟就拉完了。
    #
    # 这条对"上生产"是实质性的:生产大概率也在境内网络,任何依赖境外
    # GitHub Pages 上巨型 index.yaml 的 Application,一旦需要真正重新
    # 同步(升版本、改 values)就会卡死。
    #
    # **grafana 的 alloy/loki 两个 chart 还没有这条路可走**——Grafana 目前
    # 没有把 chart 发到 OCI 仓库(ghcr.io/grafana/{helm-charts,charts}/alloy
    # 三个路径实测全是 403/not found),那两个仍然走 index.yaml,是已知
    # 遗留风险,记在 docs/project/roadmap.md。
    # repoURL 里带上 chart 名,和这个仓库已有的 OCI 来源写法保持一致
    # (apps/definitions/kserve-crd.yaml、mlflow.yaml 都是这么写的),
    # 不要只写到命名空间——`scripts/validate-charts.py` 认的是这一种。
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart: kube-prometheus-stack
    targetRevision: 88.2.0
    helm:
      valuesObject:
        crds:
          enabled: false
        alertmanager:
          enabled: true
          alertmanagerSpec:
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 128Mi}
            storage: {}
            # 让 Alertmanager 收编 monitoring 命名空间里的 AlertmanagerConfig
            # CR(见 platform/alertmanager-notification/)。外部通知渠道拆在
            # 那边而不是写在下面的 config 里,是因为它按环境条件生成
            # (ADR-060),而这份 values 三个环境共用。
            #
            # 空的 selector = 匹配该命名空间下所有 AlertmanagerConfig。没有
            # 任何 CR 时这个设置零影响(当前 local-lite/cloud-full 就是这种
            # 情况),不是"打开了一个没验证过的东西"。
            alertmanagerConfigSelector: {}
            # 默认策略(OnNamespace)会给每条 AlertmanagerConfig 的路由自动
            # 加一个 `namespace = monitoring` 的 matcher——那样外部通知就只能
            # 收到 monitoring 命名空间自己的告警,整个集群其它命名空间的告警
            # 全都路由不过去,是个很容易踩、而且要等真出故障才会发现的坑。
            alertmanagerConfigMatcherStrategy:
              type: None
          config:
            route:
              receiver: "null"
              routes:
                # Watchdog 是 chart 自带的"心跳"告警,设计上永远 firing,
                # 用来验证告警链路本身没死——单独路由到 null,不是要忽略
                # 告警,是这条本来就不该被当成"有问题"处理。
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              # ============================================================
              # **2026-08-22 更新:开关已经不在这里了。** 下面这一整段注释
              # 模板留着仍然有用(它是各家渠道字段怎么填的参考),但"这个
              # 环境要不要往外推告警"现在是
              # environments/<env>/config.yaml 的 `alert_notification_mode`
              # 一个键决定的,生成产物在 platform/alertmanager-notification/,
              # 机制见 ADR-060。原因很简单:注释不会生效,也没有任何机制
              # 保证它和现实不脱节;用户要的是"留好配置项、能够生效",不是
              # "留好说明书"。要接企业微信/邮件这类原生渠道,照下面的字段
              # 模板改 platform/alertmanager-notification/ 的那个 CR。
              #
              # 2026-08-13 预留:邮箱/企业微信/Slack/飞书等通知渠道(见
              # ADR-034"预留通知渠道"一节)。用户明确要求先把结构搭好,现在
              # 不需要真的能收到通知——下面全部注释掉,route 也没有指向
              # 它们,对现在"能查不推送"的现状(ADR-034)零影响。这是
              # "照抄可用、换成真实凭据就生效"的模板,不是随手写的占位符。
              #
              # 激活步骤(以任意一个为例):
              #   1. 取消对应 receivers 条目的注释,REPLACE_ME 换成真实值;
              #      密码/token 类敏感值不要直接写在这个文件里——建一个
              #      Secret,在 alertmanagerSpec.secrets 里挂载,用下面
              #      标了 _file 后缀的字段引用挂载路径(和这个仓库其他敏感
              #      凭据"不进 Git 明文"的处理方式一致)。
              #   2. 在上面 route.routes 里加一条 matchers 规则,receiver
              #      指到对应渠道名字——只在 receivers 里配、不在 route 里
              #      指过去,不会有任何告警真的路由过去。
              #
              # - name: "email"
              #   email_configs:
              #     - to: "REPLACE_ME@example.com"
              #       send_resolved: true
              #   # smarthost/from/auth 是全局设置,需要在这个 config 顶层
              #   # (和 route/receivers 同级)加一段:
              #   #   global:
              #   #     smtp_smarthost: "smtp.example.com:587"
              #   #     smtp_from: "alertmanager@example.com"
              #   #     smtp_auth_username: "REPLACE_ME"
              #   #     smtp_auth_password_file: /etc/alertmanager/secrets/<secret名>/<key名>
              #
              # - name: "wechat"
              #   # 企业微信是 Alertmanager 原生支持的渠道(wechat_configs),
              #   # 不需要额外的转换服务。corp_id/agent_id 在企业微信管理
              #   # 后台"应用管理"里创建一个自建应用拿到,api_secret 是该
              #   # 应用的 Secret。
              #   wechat_configs:
              #     - corp_id: "REPLACE_ME"
              #       api_secret_file: /etc/alertmanager/secrets/<secret名>/<key名>
              #       agent_id: "REPLACE_ME"
              #       to_user: "@all"
              #       send_resolved: true
              #
              # - name: "slack"
              #   # Slack incoming webhook URL,在 Slack 里建一个
              #   # "Incoming Webhook" App 拿到。
              #   slack_configs:
              #     - api_url_file: /etc/alertmanager/secrets/<secret名>/<key名>
              #       channel: "#alerts"
              #       send_resolved: true
              #
              # 飞书(Feishu/Lark)没有 Alertmanager 原生 receiver——飞书
              # "自定义机器人"webhook 要求的 JSON 格式和 Alertmanager 发出
              # 的 webhook payload 不兼容,需要一个小的转换服务(接收
              # webhook_configs 发来的请求、转换格式、转发给飞书机器人的
              # webhook)才能真正用起来,不是填几个字段就行——真要激活时
              # 需要额外部署这个转换服务,这次预留范围里先不展开实现。
              #
              # 其他主流办公/协作软件(钉钉、Microsoft Teams、Telegram、
              # Discord 等):大部分和 Slack/企业微信一样有 Alertmanager
              # 原生 receiver(msteams_configs/telegram_configs/
              # discord_configs),或者和飞书一样需要走 webhook_configs +
              # 一个转换服务(钉钉自定义机器人的格式也和 Alertmanager 原生
              # webhook 不兼容)。真要接入哪个,照上面的模板抄一份改字段
              # 即可,这次不逐个预写,等真的要用再加,避免维护一堆没人验证
              # 过是否正确的死配置。
              # ============================================================
        # k3s 把 controller-manager/scheduler/kube-proxy 内置在同一个二进制
        # 里,不像标准 kubeadm 集群那样有独立的、chart 期望的 metrics
        # 端口可以抓——这三个开着只会产生"Down"假阳性(实测确认过:
        # KubeControllerManagerDown/KubeProxyDown/KubeSchedulerDown 一直在
        # firing,不是真的挂了,是根本抓不到指标)。关掉抓取 + 对应的默认
        # 告警规则组,不是关掉告警能力本身。
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeScheduler: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        prometheus:
          prometheusSpec:
            # **2026-08-28 之前这里是写死的 `retention: 6h` + `storageSpec: {}`,
            # 而且 cloud-full 也照着走。** 后果比"看不到历史"严重:
            #
            #   - 指标存在 emptyDir 里,**云主机每次重启全部清零**——这周做的
            #     成本、容量、黄金链路历史,每次开机都从头开始;
            #   - 6 小时之后连"过去 24 小时"这种最基本的看板视图都是半空的;
            #   - 「管理驾驶舱」(E 线)要的按月聚合,在这个前提下根本无从谈起
            #     ——ADR-069 里说"没有月度聚合"时,我以为那只是没写查询,
            #     实际上是**数据压根不存在**。
            #
            # 那行注释写的是"local-lite: 缩短 retention、去掉持久化",本意
            # 只针对笔记本那一档,但值写死了,cloud-full 跟着一起短。改成按
            # 环境分档。
            retention: {{RES:prometheus_retention}}
            resources:
              requests:
                cpu: {{RES:prometheus_cpu}}
                memory: {{RES:prometheus_memory_request}}
              limits:
                memory: {{RES:prometheus_memory_limit}}
            storageSpec: {{RES:prometheus_storage_spec}}
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: clientSecret
          grafana.ini:
            server:
              # OAuth 回调地址(redirect_uri)是从 root_url 拼出来的,不写死会
              # 默认成 localhost:3000(以前端口转发时代的地址),导致回调地址
              # 和 Keycloak client 里注册的对不上。2026-08-16 cloud-full 真实
              # 故障:local-lite 靠 colima 自动转发 80/443 不需要端口,
              # cloud-full 的 ingress-nginx 是 NodePort 32460,不带端口会
              # 404(完整根因见 platform/apps/keycloak.yaml 的 KC_HOSTNAME
              # 说明)。
              root_url: {{EXTERNAL_SCHEME}}://grafana.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: "openid profile email"
              # auth_url 是浏览器要跳转去的地址,现在走真实 Ingress(见
              # platform/apps/keycloak.yaml),不再需要额外的端口转发;
              # token_url/api_url 是 Grafana 后端自己在集群内部发起的请求,
              # 走 service 的集群内域名,两者不一样是正常的,不是配置错了。
              auth_url: {{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth
              token_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/token
              api_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/userinfo
              # 2026-08-11 起改成按 Keycloak group 映射角色(见 ADR-028、
              # platform/iam/),和 ArgoCD RBAC 那条是同一次改的。JMESPath
              # 没有真正的三元表达式,`条件 && '值' || '值'` 是 Grafana 官方
              # 文档推荐的写法。没匹配到任何已知 group 的人落到 Viewer,不是
              # 空权限——和 ArgoCD 故意"零权限报错"的姿态不一样,是因为
              # Grafana 看板本身信息敏感度低,给个只读兜底比强制报错更实用。
              role_attribute_path: "contains(groups, 'platform-team') && 'Admin' || (contains(groups, 'data-analysts') && 'Editor' || (contains(groups, 'algorithm-team') && 'Editor' || 'Viewer'))"
          persistence:
            enabled: false
          # 集中日志(见 platform/apps/loki.yaml),这样 Grafana 里指标
          # (Prometheus)和日志(Loki)能在同一个界面查,不用切换工具。
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.{{DOMAIN_SUFFIX}}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        # 2026-08-12 补上 limits,和 cert-manager 那次是同一轮扫描发现的
        # 同一类缺口。
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
        kube-state-metrics:
          # 把这两个 pod 标签暴露成 `kube_pod_labels` 的维度,**这是"成本
          # 按组归属"能不能成立的前提**(ADR-069)。
          #
          # OpenCost 自己的指标(container_cpu_allocation 等)只带
          # namespace/pod/node,不带任意 pod 标签,所以"这个组花了多少钱"
          # 算不出来——而只有配额没有账单,配额就变成办公室政治
          # (ADR-064/069 都点了这一条)。把队列标签暴露出来之后,Grafana
          # 里就能 `on(namespace,pod) group_left(...) kube_pod_labels` join
          # 出按组的成本。
          #
          # **只放行这两个标签,不开全量**:kube-state-metrics 默认不暴露
          # 任意标签是有道理的,pod 标签是用户可控的高基数维度,全放开会
          # 让 Prometheus 的时间序列数量失控。
          metricLabelsAllowlist:
            - pods=[kueue.x-k8s.io/queue-name,app.kubernetes.io/managed-by]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
