# 这个文件是 templates/ 下的**源文件**,渲染产物在
# apps/kafka/manifests/kafka-cluster.yaml(ArgoCD 读的还是那个路径,
# Application 的 path: 没变)。改动改这里,不要改生成产物。
#
# 副本数和三个 replication factor 必须一起切:单节点 KRaft 下
# replication.factor 写 3 会让 topic 根本建不出来(可用 broker 不够),
# 反过来 3 broker 却留着 factor 1,等于白搭了三台机器——任何一台挂了
# 数据就丢。min.insync.replicas 取 2(不是 3)是 Kafka 的常规做法:
# 3 副本 + isr 2 允许挂一台还能继续写,isr 3 挂一台就直接停写。
# 基于 Strimzi 官方最小单节点示例(https://strimzi.io/examples/latest/kafka/
# kafka-single-node.yaml)改的,KRaft 模式(不需要 ZooKeeper),controller/broker
# 合一节点,存储从官方示例的 100Gi 降到 local-lite 能接受的 5Gi。
# 依赖 kafka-operator 先把 CRD 装好,Job/CR 会自动重试直到 CRD 就绪,不需要
# 手动排队(和 hive-metastore 依赖 postgres 是同一个处理方式)。
#
# 【可插拔基础设施,见 ADR-030】Kafka 和 Postgres/S3 不是同一类"改个连接
# 串"的覆盖点——这份 manifest 本身就是在自建一整个 Kafka 集群,不是某个
# 组件连外部 Kafka 的客户端配置。公司已经有生产 Kafka 的话,做法是这整个
# `KafkaNodePool`/`Kafka` 资源都不部署(对应
# `kafka-cluster`/`kafka-operator` 这两个 Application 保持 park 在
# `environments/cloud-full/pending-definitions/`,不 un-park),下游需要连
# Kafka 的组件(现在
# 还没有——这个仓库目前没有任何 SeaTunnel job/Kafka Connect 之类的真实
# 消费者接进来)配置指向公司已有的 broker 地址即可。kafka-operator 本身
# (Strimzi operator)不受影响,不管连哪个 Kafka,operator 只是用来管理
# `KafkaNodePool`/`Kafka` 这类自建集群资源的,公司已有 Kafka 场景下这个
# operator 也一样不需要装。
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: platform-kafka
spec:
  # 规格分档,见 environments/resource-profiles.yaml
  replicas: {{RES:kafka_replicas}}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{RES:kafka_storage_size}}
        kraftMetadata: shared
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1024Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: platform-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # 2026-08-15 版本审计:Kafka 4.3.1 已发布(修了 Streams RocksDB 原生
    # 内存泄漏,KAFKA-20616/20688),但**没有升级**——Strimzi operator 当前
    # 是 1.1.0(也是目前最新发布版),它的 kafka-versions.yaml 支持列表里
    # 只有 4.3.0,还没收录 4.3.1,升上去 Strimzi 会拒绝这个 CR。等 Strimzi
    # 出支持 4.3.1 的新版本再跟着升,不是这个项目选择不升级。见
    # docs/project/roadmap.md P1.6。
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: {{RES:kafka_replication_factor}}
      transaction.state.log.replication.factor: {{RES:kafka_replication_factor}}
      transaction.state.log.min.isr: {{RES:kafka_min_insync_replicas}}
      default.replication.factor: {{RES:kafka_replication_factor}}
      min.insync.replicas: {{RES:kafka_min_insync_replicas}}
  entityOperator:
    topicOperator: {}
    userOperator: {}
