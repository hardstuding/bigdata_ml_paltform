# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/permission-request-app-
# oauth2-proxy.yaml + environments/<env>/config.yaml——改动请改模板
# 文件,不要直接改这份生成结果(下次渲染会被覆盖)。见
# environments/cloud-full/config.yaml 顶部说明背景。
#
# 和 MLflow(ADR-019)、Spark History Server(ADR-029)是同一个 oauth2-proxy
# 模式。这里刻意**不设 allowed_groups**——权限申请门户本来就该是"任何登录
# 用户都能提申请",谁能审批是 app 自己内部按 platform-team 判断的(见
# ADR-032),不是 oauth2-proxy 这一层的事,卡在这一层反而会出现"想申请
# algorithm-team 权限,但没有 algorithm-team 权限进不了申请页面"的死锁。
#
# pass_access_token 是这个组件比 MLflow/Spark History Server 多开的一个
# 选项:app 自己要读 token 里的 groups claim 判断谁是审批人,legacy config
# 格式没有单独一个"把 groups 转成请求头"的选项,只能把整个 access token
# 传下去,app 自己解。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: permission-request-app-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            # 2026-08-16 cloud-full 真实故障(和 platform-portal-oauth2-proxy
            # 同一个坑,那边有完整两层说明:①redirect_url 不带端口 404,
            # ②修完之后 Keycloak 的 issuer 带了端口,自动 discovery 校验
            # 不通过 + 集群内部又连不上带端口的外部地址,改成关掉自动
            # discovery,手动分开配置)。
            oidc_issuer_url = "http://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform"
            skip_oidc_discovery = true
            login_url = "http://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth"
            redeem_url = "http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/token"
            oidc_jwks_url = "http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/certs"
            profile_url = "http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/userinfo"
            redirect_url = "http://permission-request.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/oauth2/callback"
            upstreams = [ "http://permission-request-app.permission-request-app.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
            pass_access_token = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - permission-request.{{DOMAIN_SUFFIX}}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: permission-request-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
