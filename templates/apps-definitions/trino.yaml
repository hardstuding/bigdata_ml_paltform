# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/trino.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
# 官方 trinodb/charts,没有 Bitnami 依赖。local-lite 用 coordinator-only 模式
# (server.workers: 0,coordinator 顺带干 worker 的活),真正给作业用的规模
# 到 cloud-full 再拆成独立 worker。
#
# iceberg catalog 接的是 apps/hive-metastore + apps/minio,S3 密钥不写死在
# values 里(公开仓库),通过 env 注入 + Trino 自带的 ${ENV:VAR} 语法引用,
# 见 https://trino.io/docs/current/security/secrets.html。
#
# OAuth2 登录:Trino 的 OAuth2 认证硬性要求自己开 HTTPS 监听器(不像
# ArgoCD/Grafana 可以完全交给 ingress 边缘终结),证书来自 apps/trino-tls/
# (cert-manager 自签,见 docs/decisions/016)。Ingress 也在 apps/trino-tls/
# 里手写(chart 自带的 ingress.enabled 硬编码只转发到 8080/http,没法指到
# 我们要用的 8443/https,helm template 验证过),不用这份 chart 自己的
# ingress 配置(留 false)。ingress-nginx 默认不校验后端证书,自签名不影响
# 浏览器侧(浏览器全程只跟 ingress-nginx 打 HTTP 交道)。
#
# 服务账号(PASSWORD 认证,和 OAUTH2 并存):OAuth2 的 Authorization Code
# 模式是给人在浏览器操作设计的,Superset 的 SQL Lab 要拿一个后端到后端的
# 身份连 Trino,走不了这条路。Trino 原生支持
# `http-server.authentication.type=OAUTH2,PASSWORD` 多种认证方式并存,
# 服务端按顺序尝试,客户端发 HTTP Basic Auth 的用户名密码会自然落到
# PASSWORD 这条(不会被硬塞进 OAuth2 流程)。密码文件(bcrypt 哈希)和
# password-authenticator.properties 都由
# scripts/00-generate-secrets.sh 生成进 trino-service-account 这个 Secret,
# 见 docs/decisions/021。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://trinodb.github.io/charts
    chart: trino
    targetRevision: 1.42.2
    helm:
      valuesObject:
        # 2026-08-15 版本审计时曾经把 image.tag 显式覆盖成 483(chart
        # 1.42.2 打包的默认版本还是 480)。2026-08-16 在 cloud-full 上
        # 真正跑起来才发现:`helm template` 渲染 diff 只比出"就改了一行
        # tag",没能测出运行时行为差异——Trino 483 对
        # `http-server.http.port` 这个属性收紧了校验,我们关了
        # `http-server.http.enabled`(只用 OAuth2+HTTPS)之后,chart 自己
        # 无条件生成的 `http-server.http.port={{ .Values.service.port }}`
        # 这行在 483 上直接报 "Configuration property ... was not used"
        # 拒绝启动,480 上不报这个错。回退到 chart 默认的 480,不再单独
        # 覆盖——教训是"渲染结果一致"不等于"运行时行为一致",发布说明/
        # 真实拉起来跑一遍才是可信的验证,纯 diff 比对不够,以后同类版本
        # 覆盖不能只靠这一步。见 docs/BACKLOG.md P1.6。
        server:
          workers: 0
          config:
            query:
              maxMemory: "1GB"
            authenticationType: OAUTH2,PASSWORD
            https:
              enabled: true
              port: 8443
              keystore:
                path: /secrets/trino-tls/tls-combined.pem
        additionalConfigProperties:
          - http-server.http.enabled=false
          # http-server.authentication.type 管的是"接受哪些认证方式"
          # (OAUTH2 给人用、PASSWORD 给服务账号用),不等于"网页界面默认
          # 用哪个"——Web UI 自己另外认 web-ui.authentication.type,不设
          # 的话会退回显示 Trino 自己的用户名密码表单,不会自动跳
          # Keycloak。这个是分开配的,2026-08-16 真实故障排查时才发现。
          - web-ui.authentication.type=oauth2
          # 2026-08-16 真实故障(用户实测:Trino Web UI 打开是自己的用户名
          # 密码表单,不是跳 Keycloak):issuer 之前没带端口,和 Keycloak
          # 修完 KC_HOSTNAME 之后实际签发的 issuer(带 :32460)对不上。
          # Trino 原生 OAuth2 支持手动分开指定 auth-url(浏览器跳转用,
          # 带端口,外部路径)/token-url/jwks-url/userinfo-url(Trino 服务端
          # 自己发起,不带端口,内部路径能连通)。
          #
          # 第一版这几行部署后实测又崩了一次:Trino 默认还是会在启动时去抓
          # `.well-known/openid-configuration` 做 discovery(哪怕已经手动
          # 配了上面几个 url),抓的地址是 issuer 拼出来的,带 :32460,
          # 集群内部连不通,直接 `Failed communicating with server` 崩溃
          # 退出(`kubectl logs --previous` 看到的真实报错,不是猜的)——
          # 之前"配了这几个 url 就不需要 discovery"这句话是没验证过的
          # 假设,是错的。显式关掉 `oidc.discovery=false` 才是真的跳过
          # 这次启动时的探测。
          - http-server.authentication.oauth2.issuer=http://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform
          - http-server.authentication.oauth2.auth-url=http://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth
          - http-server.authentication.oauth2.token-url=http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/token
          - http-server.authentication.oauth2.jwks-url=http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/certs
          - http-server.authentication.oauth2.userinfo-url=http://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/userinfo
          - http-server.authentication.oauth2.oidc.discovery=false
          - http-server.authentication.oauth2.client-id=trino
          - http-server.authentication.oauth2.client-secret=${ENV:OAUTH2_CLIENT_SECRET}
          - http-server.authentication.oauth2.principal-field=preferred_username
          - internal-communication.shared-secret=${ENV:INTERNAL_SHARED_SECRET}
          # http-server.http.enabled=false 之后,Trino 算自己的 internal
          # announcement URI 时找不到 http 端口可用,报 "internalUri is null"
          # 崩溃启动。加这行让它改用 https 端口算这个内部 URI。
          - internal-communication.https.required=true
          # ingress-nginx 默认给转发的请求加 X-Forwarded-* 头,Trino/Jetty
          # 默认不信任、直接拒绝(报 406 "does not allow processing of the
          # X-Forwarded-For header"),要显式打开。
          - http-server.process-forwarded=true
          # 服务账号用的 PASSWORD 认证方式,指到 secretMounts 挂进去的那份
          # password-authenticator.properties(内容是 password-authenticator.name=file
          # + file.password-file 指向同目录的 password.db)。
          - password-authenticator.config-files=/secrets/trino-service-account/password-authenticator.properties
        # 2026-08-16:接入 OPA 细粒度访问控制(ADR-051)。第一版直接把
        # access-control.name/opa.policy.uri 塞进 additionalConfigProperties
        # (混进主 config.properties),实测启动直接拒绝:"Configuration
        # property 'access-control.name' was not used. Did you mean to use
        # 'access-control.config-files'?"——Trino 要求访问控制配置必须是
        # 单独一个文件,通过 access-control.config-files 引用,不能塞进主
        # 配置文件。chart 原生的 accessControl(type: properties)就是干
        # 这个的,会自己生成独立文件并接好 access-control.config-files,不用
        # 自己手写文件名/路径。上线前已经审计过现在实际在用 Trino 的身份并
        # 补齐 apps/opa/policy/trino.rego 里的服务账号白名单
        # (superset_service/dbt_demo_service/table_registration_service),
        # 回滚方式是 revert 这一条改动,ArgoCD 会自动同步回去。
        accessControl:
          type: properties
          properties: |
            access-control.name=opa
            opa.policy.uri=http://opa.opa.svc.cluster.local:8181/v1/data/trino/allow
        # 证书文件故意不放在 /etc/trino/ 底下:那整个目录已经是 chart 自己的
        # ConfigMap(config-volume)挂载点,再往它下面嵌套挂一个 Secret 的
        # subPath 文件会导致 kubelet 创建目录失败(实测报 runc "mounting a
        # directory onto a file (or vice-versa)"),两个不同来源的卷不能这样
        # 嵌套挂载。放一个独立的顶层路径,keystore.path 允许指向任意绝对路径,
        # 不要求必须在 /etc/trino/ 下面。
        secretMounts:
          - name: trino-tls
            secretName: trino-tls
            path: /secrets/trino-tls/tls-combined.pem
            subPath: tls-combined.pem
          - name: trino-service-account-props
            secretName: trino-service-account
            path: /secrets/trino-service-account/password-authenticator.properties
            subPath: password-authenticator.properties
          - name: trino-service-account-db
            secretName: trino-service-account
            path: /secrets/trino-service-account/password.db
            subPath: password.db
        coordinator:
          # chart 默认的 livenessProbe 硬编码打 http 端口(8080)的 /v1/info
          # (deployment-coordinator.yaml 模板里直接写死 httpGet,不是靠
          # values 生成的,试过 coordinator.livenessProbe.exec 覆盖,helm
          # template 验证过完全不生效——values 只能覆盖这个探针的几个数字
          # 字段,换不了探针类型)。我们关了 http-server.http.enabled,这个
          # 探针永远失败,kubelet 每隔几十秒就以为 Trino 挂了强杀重启一次
          # ——进程其实完全正常,readiness/startup 探针用的是 exec 健康检查
          # 脚本不挑端口,一直没受影响,所以 pod 表面看是 Running/Ready,
          # 实际在不停被杀重启,很容易被忽略过去。chart 这条路走不通,改成
          # ArgoCD 的 ignoreDifferences(见下面 spec.ignoreDifferences)+
          # 一次性手动 patch,细节和取舍见 docs/decisions/017 的更新记录。
          jvm:
            maxHeapSize: "1536m"
          config:
            nodeScheduler:
              includeCoordinator: true
            query:
              maxMemoryPerNode: "1GB"
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              memory: 2Gi
        env:
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-root
                key: rootUser
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-root
                key: rootPassword
          - name: OAUTH2_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: trino-oidc-secret
                key: clientSecret
          - name: INTERNAL_SHARED_SECRET
            valueFrom:
              secretKeyRef:
                name: trino-internal-secret
                key: secret
        # 【可插拔基础设施,见 ADR-030】s3.* 这几行是 Trino 自己独立配置的
        # S3A 属性,和 apps/hive-metastore/manifests/core-site-configmap.yaml
        # 是两份各自独立的配置(不是共用一份),接外部 S3 要同步改两边,改
        # 一边不够。真实 S3 一般要把 s3.path-style-access 改成 false、
        # s3.endpoint 直接删掉用默认值,详细取舍见那份 core-site-
        # configmap.yaml 里的说明。
        catalogs:
          iceberg: |
            connector.name=iceberg
            iceberg.catalog.type=hive_metastore
            hive.metastore.uri=thrift://hive-metastore.data.svc.cluster.local:9083
            fs.native-s3.enabled=true
            s3.endpoint=http://minio.minio.svc.cluster.local:9000
            s3.region=us-east-1
            s3.path-style-access=true
            s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
            s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
  destination:
    server: https://kubernetes.default.svc
    namespace: trino
  # chart 的 coordinator Deployment 模板把 livenessProbe 硬编码成打
  # http-server.http.enabled=false 之后已经关掉的 8080 端口(见上面
  # coordinator 那段注释),values 覆盖不了探针类型。让 ArgoCD 不要管这个
  # 字段,靠 scripts/07-fix-trino-liveness-probe.sh 一次性 kubectl patch 成
  # exec 探针——这是 ArgoCD 官方支持的"上游 chart 没暴露某个字段,交给别的
  # 机制管"模式,不是绕过 GitOps,ignoreDifferences 本身就在 git 里声明。
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: trino-coordinator
      jsonPointers:
        - /spec/template/spec/containers/0/livenessProbe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 2026-08-16 实测发现:ignoreDifferences 只管"要不要标成 OutOfSync",
      # 不管"真正 sync 时补丁要不要带上这个字段"——一次真实触发的 sync 里,
      # ArgoCD 仍然把 livenessProbe 整个对象的 httpGet 和已经手动 patch 成
      # 的 exec 合并在一起提交,K8s API 拒绝("may not specify more than 1
      # handler type"),sync 卡死重试。加这个选项让 sync 补丁也跳过
      # ignoreDifferences 列出的字段,不是新加的 workaround,是让原来的
      # ignoreDifferences 真正达到设计时想要的效果。
      - RespectIgnoreDifferences=true
