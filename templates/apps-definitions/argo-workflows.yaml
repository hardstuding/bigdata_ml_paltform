# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/argo-workflows.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
# 官方 argo-helm 仓库(和 ArgoCD 自己用的是同一个 repoURL,argoproj 官方
# 维护)。SSO 用 server.sso(不是 server.authModes: [server]/[client] 那两种
# 更简单但没有真实身份的模式):这个和 ArgoCD 自己的内置 OIDC 是同一种设计
# ——只有一个 issuer 字段,服务端自己发起 OIDC discovery/token 交换也用它,
# 不像 Grafana/JupyterHub 那样能把"浏览器跳转用的地址"和"后端自己发请求
# 用的地址"分开配(见 ADR-025)。好在 keycloak.{{DOMAIN_SUFFIX}} 已经在
# platform/coredns-custom/ 的自定义 DNS zone 里(当初是给 ArgoCD/Trino 配的,
# 见 ADR-016/017),这里直接复用,不需要再加什么。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.24
    helm:
      valuesObject:
        # 这个 chart 默认靠一个 pre-install Job 从 raw.githubusercontent.com
        # 实时下载完整版 CRD 再 apply。之前用 HTTP_PROXY/HTTPS_PROXY 指向
        # colima 宿主机本地代理(192.168.5.2:1087)让 local-lite 能连上,
        # 但这个地址只在这台 Mac 上存在——2026-08-16 云端部署时发现
        # cloud-full(独立公网出口)连不到这个代理,Job 卡死超时。改成把
        # 7 个 CRD vendor 进仓库(apps/argo-workflows-crds/manifests/),
        # 由 scripts/25-install-argo-workflows-crds.sh 一次性
        # `kubectl apply --server-side` 装好,GitOps 同步路径完全不再
        # 依赖任何网络/代理,local-lite 和 cloud-full 用同一份操作,不用
        # 各自适配网络环境。crds.install 关掉,不用 chart 自带的下载 Job。
        crds:
          install: false
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        server:
          authModes:
            - sso
          sso:
            enabled: true
            issuer: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform"
            clientId:
              name: argo-workflows-oidc-secret
              key: client-id
            clientSecret:
              name: argo-workflows-oidc-secret
              key: client-secret
            # 2026-08-16 cloud-full 真实故障:local-lite 靠 colima 自动转发
            # 80/443 不需要端口,cloud-full 的 ingress-nginx 是 NodePort
            # 32460,不带端口登录跳转回来会 404(完整根因见
            # platform/apps/keycloak.yaml 的 KC_HOSTNAME 说明)。issuer 不用
            # 改端口——服务端自己发起的 discovery 请求走集群内部路径,
            # Keycloak 的 KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true 会让它拿到
            # 的 token_endpoint 也不带端口,跟这里保持一致能连通。
            redirectUrl: "{{EXTERNAL_SCHEME}}://argo-workflows.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/oauth2/callback"
            scopes:
              - openid
              - profile
              - email
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - argo-workflows.{{DOMAIN_SUFFIX}}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
