# 平台门户,见 docs/decisions/047-platform-portal.md。2026-08-20 起
# (BACKLOG 2.1)用构建期固化依赖 + 源码的自建镜像(apps/platform-portal/
# Dockerfile,GitHub Actions 推到 GHCR),不再是运行时 pip install 官方
# python:3.12-slim 镜像那套——见 apps/permission-request-app/deployment.yaml
# 顶部注释,同一个原因。这个组件没有状态(不写数据库,现场探测现场展示),
# 不需要 PVC。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-portal
  namespace: platform-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-portal
  template:
    metadata:
      labels:
        app: platform-portal
    spec:
      # 见 ADR-041(队列资源管理):人在看这个页面找工具入口,归 interactive 档。
      priorityClassName: interactive
      # 只读队列用量和作业列表(ADR-067),权限见 manifests/rbac.yaml。
      # 没有这个 SA 的话页面照样打开,只是那两块显示"读不到"——这是刻意
      # 设计的降级,门户不能因为少个权限就打不开。
      serviceAccountName: platform-portal
      containers:
        - name: app
          # 2026-08-20(BACKLOG 2.1):构建期固化依赖 + 源码,见
          # apps/platform-portal/Dockerfile。这个 digest 是
          # linux/amd64+linux/arm64 多架构 manifest list 的 digest(见
          # apps/permission-request-app/deployment.yaml 顶部的详细说明,
          # 同一次重新构建),对应 commit
          # eac7f6052f00883fe46fd076248a224eecce695d(2026-08-23 ADR-067 那次改造)。
          # 已核实是 amd64+arm64 双架构 manifest list。
          image: crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/platform-portal:49d1d1cd0392a161a22a9184659ebdba1159c176
          env:
            # 2026-08-16 真实故障:门户列出的 13 个工具链接全部没带端口,
            # cloud-full 的 ingress-nginx 是 NodePort(32460 http、32535
            # https),点开必然 404。按 zhenghe 的要求做成配置参数(见
            # src/app.py 里怎么用这两个变量),不是写死——以后接真实域名+
            # 标准 80/443 端口时,把这两个值删掉/留空就行,不用再改代码。
            # **域名也必须是配置,不能写死。** 2026-08-29 之前 app.py 里
            # 有 16 处硬编码的 `local-lite.test`,后果是 prod 部署之后门户上
            # 每一个工具链接都指向一个不存在的域名——而门户恰恰是新用户
            # 进平台的第一个页面。
            - name: PUBLIC_DOMAIN_SUFFIX
              value: "{{DOMAIN_SUFFIX}}"
            - name: PUBLIC_SCHEME
              value: "{{EXTERNAL_SCHEME}}"
            - name: PUBLIC_HTTP_PORT_SUFFIX
              value: "{{HTTP_PORT_SUFFIX}}"
            - name: PUBLIC_HTTPS_PORT_SUFFIX
              value: "{{HTTPS_PORT_SUFFIX}}"
            # 角色工作台(我的表权限 / 待我审批)要调 permission-request-app
            # 的只读接口,共用它那份内部 token。**optional: true 是有意的**:
            # 没有这个 Secret 时门户照常起,首页少这两块而已 —— 一个附属服务
            # 的凭据不该让整个门户起不来。
            - name: PERMISSION_APP_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-internal
                  key: token
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
---
apiVersion: v1
kind: Service
metadata:
  name: platform-portal
  namespace: platform-portal
spec:
  selector:
    app: platform-portal
  ports:
    - port: 8080
      targetPort: 8080
      name: http
