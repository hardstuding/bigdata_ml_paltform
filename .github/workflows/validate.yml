# push/PR 前拦一部分配置错误——这次很多坑(chart 版本写错、字段名写错、
# YAML 缩进错了)都是 push 上去等 ArgoCD 报错才发现的,这个 workflow 能在
# 那之前拦住其中一部分(不是全部,helm template 只验证"渲染得出来",不验证
# "部署到真实集群里跑不跑得起来",见 scripts/validate-charts.py 开头的说明)。
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: helm template 渲染校验(所有 ArgoCD Application,扫 apps/definitions/ 这份 cloud-full 渲染结果,见 scripts/validate-charts.py 开头说明)
        run: python3 scripts/validate-charts.py

      - name: Airflow DAG 单一源码校验(ConfigMap 里的内容不能和 apps/airflow/dags/*.py 漂移)
        run: python3 scripts/sync-airflow-dags-configmap.py --check

      - name: 内嵌脚本单一源码校验(ConfigMap 里的脚本不能和 scripts/ 下的权威源漂移)
        run: python3 scripts/check-embedded-scripts.py

      - name: 环境配置单一源码校验(cloud-full 部署文件不能和 templates/ + environments/cloud-full/config.yaml 渲染结果漂移)
        run: python3 scripts/render-environment-config.py cloud-full --check

  test-flask-apps:
    # 2026-08-16 新增:3 个自建 Flask 工具(platform-portal/permission-
    # request-app/table-registration-app)之前完全没有自动化测试,补测试
    # 的同时顺手接进 CI——测试写了没人跑等于没测试,见 docs/BACKLOG.md
    # P1"三个自建 Flask 工具补测试"那条。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖(和各 app 的 requirements.txt 版本锁定保持一致,见
          apps/*/requirements.txt——2026-08-20 起是构建镜像用的同一份
          锁定文件,不是运行时现装那套了)
        run: |
          pip install flask==3.1.3 requests==2.34.2 trino==0.338.0 pytest

      - name: platform-portal 测试
        run: cd apps/platform-portal && python3 -m pytest tests/ -v

      - name: table-registration-app 测试
        run: cd apps/table-registration-app && python3 -m pytest tests/ -v

      - name: permission-request-app 测试
        run: cd apps/permission-request-app && python3 -m pytest tests/ -v
