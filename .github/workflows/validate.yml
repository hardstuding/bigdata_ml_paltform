# push/PR 前拦一部分配置错误——这次很多坑(chart 版本写错、字段名写错、
# YAML 缩进错了)都是 push 上去等 ArgoCD 报错才发现的,这个 workflow 能在
# 那之前拦住其中一部分(不是全部,helm template 只验证"渲染得出来",不验证
# "部署到真实集群里跑不跑得起来",见 scripts/validate-charts.py 开头的说明)。
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: helm template 渲染校验(所有 ArgoCD Application,扫 apps/definitions/ 这份 cloud-full 渲染结果,见 scripts/validate-charts.py 开头说明)
        run: python3 scripts/validate-charts.py

      - name: Airflow DAG 单一源码校验(ConfigMap 里的内容不能和 apps/airflow/dags/*.py 漂移)
        run: python3 scripts/sync-airflow-dags-configmap.py --check

      - name: 内嵌脚本单一源码校验(ConfigMap 里的脚本不能和 scripts/ 下的权威源漂移)
        run: python3 scripts/check-embedded-scripts.py

      - name: NetworkPolicy 消费者白名单校验(新命名空间用共享服务不能漏加白名单)
        run: python3 scripts/check-networkpolicy-consumers.py

      - name: 每个工作负载都得有 image(见脚本头部那次真实事故)
        run: python3 scripts/check-workloads-have-image.py

      - name: Trino 组成员 ConfigMap 和 memberships.csv 没漂移
        run: python3 scripts/sync-trino-groups-configmap.py --check

      - name: platform/iam 三份数据自洽(每个人都得属于某个组)
        run: python3 scripts/check-iam-consistency.py

      - name: examples/ 下的作业模板能用(字段对得上 submit_job)
        run: python3 scripts/check-job-examples.py

      - name: 每个要构建的镜像都有 paths 触发(漏了的话改 Dockerfile 不会重建)
        run: python3 scripts/check-build-triggers.py

      # 内部包发布逻辑(ADR-083)。产物是一个静态索引,结构写错的表现不是
      # 报错,是 pip install 报 404,而 CronJob 本身是绿的。
      - name: 内部包发布逻辑测试
        run: |
          pip install --quiet build pyyaml pytest
          python3 -m pytest tests/test_publish_internal_packages.py -q

      - name: ArgoCD 自定义健康检查的 Lua 真跑一遍
        run: |
          pip install --quiet lupa pyyaml pytest
          python3 -m pytest tests/test_argocd_health_lua.py -q

      # render-jobs 的校验逻辑:依赖是不是在镜像里、owner_group 和提交人所属
      # 的组对不对得上、参数名/环境名合不合法。这些都是"不挡住的话要等作业
      # 半夜真跑起来才暴露"的问题。
      - name: render-jobs 校验逻辑
        run: python3 -m pytest tests/test_render_jobs.py -q

      - name: 镜像版本锁定校验(不允许 latest 这类浮动 tag,见 ADR-010)
        run: python3 scripts/check-image-tags.py

      - name: 环境配置单一源码校验(cloud-full 部署文件不能和 templates/ + environments/cloud-full/config.yaml 渲染结果漂移)
        run: python3 scripts/render-environment-config.py cloud-full --check

      # "三档环境改配置切换"是这个仓库的三条底线之一。机制(ADR-059)早就有,
      # 但 2026-08-29 盘点发现 56 个组件里只有 9 个真的用了占位符——机制存在
      # 不等于被用。这个检查要求写死的必须显式登记豁免并写明理由,让"漏了"
      # 和"想清楚了不做"能区分开。
      - name: 规格分档校验(组件里不能有未登记的写死资源规格)
        run: python3 scripts/check-resource-profiles.py

      # 一份没有东西逼它跟上现实的服务清单,三个月后就是一份过期清单,
      # 比没有更糟——这个仓库已经在 project/capability-matrix.md / BACKLOG / ADR 里各栽过一次
      # 「文档和事实反了」。所以目录和覆盖检查是一起加的,不是先写文档
      # 再想办法维护。
      - name: 服务目录覆盖校验(新组件必须登记归属)+ 生成的 md 不能漂移
        run: python3 scripts/check-service-catalog.py --check-doc

      # 文档之间交叉引用很密(ADR 互引、README 指 getting-started、CLAUDE.md
      # 指 current-work)。任何一次目录调整都可能留下死链,而死链不会让任何
      # 东西报错——只会让下一个人点过去发现 404,然后不再信任这些链接。
      # 2026-08-29 第一次跑这个检查,当场发现 14 条**在此之前就已经坏了**的
      # 链接(ADR 文件名改过、相对路径深度不对)。
      - name: 文档死链检查
        run: python3 scripts/check-doc-links.py

      # 能力表被证伪过四次(见 capability-matrix.md 底部那节),四次的共同点
      # 都是"标着 ✅ 但没人真的跑过"。这个检查卡的就是那个失效模式:✅ 的
      # 行不许把验证级别写成「未验证」/「计划中」。
      - name: 能力表自洽检查
        run: python3 scripts/check-capability-matrix.py

      # 同一份源码被复制进多个应用的那几份副本(现在是 shared/flask_identity.py
      # → 三个 Flask 应用的 src/identity.py)。和 check-embedded-scripts 是
      # 不同场景:那个管 ConfigMap 里的副本,这个管应用 src/ 里的副本。
      - name: 复制源码防漂移
        run: python3 scripts/check-duplicated-sources.py

      # 一键拉起路径和 scripts/README.md 的部署主线表两边一致。这个仓库的
      # 核心要求之一就是"从空环境可恢复、可重复的一键部署",它的失效方式
      # 很隐蔽:新加了一个部署必需的步骤,只写进文档没进 bootstrap-all.sh
      # (或者反过来)。2026-08-30 加这个检查时当场发现文档漏了 11 步。
      - name: 一键拉起路径覆盖检查
        run: python3 scripts/check-bootstrap-coverage.py

      # ADR 索引的状态列是从每份 ADR 自己的 `状态:` 行生成的。手写两份的
      # 后果 2026-08-30 实测过:索引里 10 条写着"未部署验证",而它们早就
      # 部署并实机验证过了。这个检查也会拦住"有 ADR 文件但索引里没列"。
      - name: ADR 索引防漂移
        run: python3 scripts/sync-adr-index.py --check

      # 有 Secret 被 manifest 引用、却既没有脚本创建它、也没登记进"必须人工
      # 提供"的清单 —— 那个 Secret 就是没人管的。表现是某个 Pod 起不来,而
      # 报错不会告诉你是缺凭据。
      - name: 人工凭据清单完整性
        run: python3 scripts/list-manual-credentials.py --check

      # 文档里的 SDK 调用示例,参数要真的能和签名对上。
      # 2026-08-29 发现 usage-guide 里写着 `submit_job("train.py")`,而真实
      # 签名第一个参数是 name —— 照着文档写必然报错,而这种错不会被任何
      # 东西发现:文档不执行,读文档的人会以为是自己环境的问题。
      # prod 渲染产物里不能出现开发环境的域名/NodePort。
      # 2026-08-29 第一次跑就发现:门户 16 处硬编码之外,Superset / Airflow /
      # MLflow / Spark History 的 **SSO 配置**里也写死了
      # keycloak.local-lite.test —— prod 部署之后这几个组件登录全是坏的,
      # 而 ArgoCD 会是绿的、Pod 会是健康的。
      # Superset 的 configOverrides 和 JupyterHub 的 extraConfig 是"把 Python
      # 当配置塞进 YAML",**只在组件启动时才执行** —— 写错一个括号的表现是
      # pod CrashLoopBackOff,而 push 和 ArgoCD 全是绿的。
      - name: YAML 里内嵌的 Python 语法校验
        run: python3 scripts/check-embedded-python-syntax.py

      - name: prod 渲染产物不能含开发环境域名
        run: python3 scripts/check-prod-no-dev-domain.py

      - name: 文档里的 SDK 示例签名校验
        run: |
          pip install --quiet ./platform-sdk
          python3 scripts/check-doc-examples.py

      # jobs/ 下的作业定义 → Argo CronWorkflow 的生成物不能漂移,而且作业
      # 定义本身要合法(name 能当 K8s 资源名、cron 是五段式、owner_group 是
      # platform/iam/ 里真实存在的组)。owner_group 写错的后果特别隐蔽:
      # 作业会一直排队等一个不存在的 Kueue 队列,而 Workflow 状态上看不出原因。
      - name: 定时作业定义校验 + 生成物不漂移
        run: python3 scripts/render-jobs.py cloud-full --check

      # 流作业同理。checkpoint_interval 写错的表现特别隐蔽:JobManager 起不来,
      # 而从 FlinkDeployment 的状态上看只是「一直在 DEPLOYING」。
      - name: 流作业定义校验 + 生成物不漂移
        run: python3 scripts/render-streams.py cloud-full --check

      # 三档都要能渲染出来。只校验 cloud-full 的话,prod/local-lite 缺一个
      # RES 键要等到真去部署那一档才会发现——而那时候人已经在等着上生产了。
      - name: 三档环境都能渲染(prod/local-lite 缺键会在这里就报出来)
        run: |
          for env in local-lite cloud-full prod; do
            echo "--- $env ---"
            python3 scripts/render-environment-config.py "$env" >/dev/null
          done
          git checkout -- .   # 渲染会改工作区,校验完还原,不影响后面的步骤

  opa-test:
    # 2026-08-23 新增:apps/opa/policy/ 下的 Rego 策略(Trino 表级访问控制
    # ADR-051 + 列级脱敏/行级过滤 ADR-063)有真实的单元测试,写了没人跑
    # 等于没测试,和 test-flask-apps 那条是同一个道理接进 CI。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.1

      - name: opa test(apps/opa/policy 下的 Rego 策略 + 单元测试)
        run: opa test apps/opa/policy -v

  test-flask-apps:
    # 2026-08-16 新增:3 个自建 Flask 工具(platform-portal/permission-
    # request-app/table-registration-app)之前完全没有自动化测试,补测试
    # 的同时顺手接进 CI——测试写了没人跑等于没测试,见 docs/project/roadmap.md
    # P1"三个自建 Flask 工具补测试"那条。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖(和各 app 的 requirements.txt 版本锁定保持一致,见
          apps/*/requirements.txt——2026-08-20 起是构建镜像用的同一份
          锁定文件,不是运行时现装那套了)
        run: |
          pip install flask==3.1.3 requests==2.34.2 trino==0.338.0 pytest

      - name: platform-portal 测试
        run: cd apps/platform-portal && python3 -m pytest tests/ -v

      - name: table-registration-app 测试
        run: cd apps/table-registration-app && python3 -m pytest tests/ -v

      - name: permission-request-app 测试
        run: cd apps/permission-request-app && python3 -m pytest tests/ -v
