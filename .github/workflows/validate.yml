# push/PR 前拦一部分配置错误——这次很多坑(chart 版本写错、字段名写错、
# YAML 缩进错了)都是 push 上去等 ArgoCD 报错才发现的,这个 workflow 能在
# 那之前拦住其中一部分(不是全部,helm template 只验证"渲染得出来",不验证
# "部署到真实集群里跑不跑得起来",见 scripts/validate-charts.py 开头的说明)。
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: helm template 渲染校验(所有 ArgoCD Application,扫 apps/definitions/ 这份 cloud-full 渲染结果,见 scripts/validate-charts.py 开头说明)
        run: python3 scripts/validate-charts.py

      - name: Airflow DAG 单一源码校验(ConfigMap 里的内容不能和 apps/airflow/dags/*.py 漂移)
        run: python3 scripts/sync-airflow-dags-configmap.py --check

      - name: 内嵌脚本单一源码校验(ConfigMap 里的脚本不能和 scripts/ 下的权威源漂移)
        run: python3 scripts/check-embedded-scripts.py

      - name: NetworkPolicy 消费者白名单校验(新命名空间用共享服务不能漏加白名单)
        run: python3 scripts/check-networkpolicy-consumers.py

      - name: 每个工作负载都得有 image(见脚本头部那次真实事故)
        run: python3 scripts/check-workloads-have-image.py

      - name: Trino 组成员 ConfigMap 和 memberships.csv 没漂移
        run: python3 scripts/sync-trino-groups-configmap.py --check

      - name: platform/iam 三份数据自洽(每个人都得属于某个组)
        run: python3 scripts/check-iam-consistency.py

      - name: examples/ 下的作业模板能用(字段对得上 submit_job)
        run: python3 scripts/check-job-examples.py

      - name: 每个要构建的镜像都有 paths 触发(漏了的话改 Dockerfile 不会重建)
        run: python3 scripts/check-build-triggers.py

      - name: ArgoCD 自定义健康检查的 Lua 真跑一遍
        run: |
          pip install --quiet lupa pyyaml pytest
          python3 -m pytest tests/test_argocd_health_lua.py -q

      - name: 镜像版本锁定校验(不允许 latest 这类浮动 tag,见 ADR-010)
        run: python3 scripts/check-image-tags.py

      - name: 环境配置单一源码校验(cloud-full 部署文件不能和 templates/ + environments/cloud-full/config.yaml 渲染结果漂移)
        run: python3 scripts/render-environment-config.py cloud-full --check

      # "三档环境改配置切换"是这个仓库的三条底线之一。机制(ADR-059)早就有,
      # 但 2026-08-29 盘点发现 56 个组件里只有 9 个真的用了占位符——机制存在
      # 不等于被用。这个检查要求写死的必须显式登记豁免并写明理由,让"漏了"
      # 和"想清楚了不做"能区分开。
      - name: 规格分档校验(组件里不能有未登记的写死资源规格)
        run: python3 scripts/check-resource-profiles.py

      # 三档都要能渲染出来。只校验 cloud-full 的话,prod/local-lite 缺一个
      # RES 键要等到真去部署那一档才会发现——而那时候人已经在等着上生产了。
      - name: 三档环境都能渲染(prod/local-lite 缺键会在这里就报出来)
        run: |
          for env in local-lite cloud-full prod; do
            echo "--- $env ---"
            python3 scripts/render-environment-config.py "$env" >/dev/null
          done
          git checkout -- .   # 渲染会改工作区,校验完还原,不影响后面的步骤

  opa-test:
    # 2026-08-23 新增:apps/opa/policy/ 下的 Rego 策略(Trino 表级访问控制
    # ADR-051 + 列级脱敏/行级过滤 ADR-063)有真实的单元测试,写了没人跑
    # 等于没测试,和 test-flask-apps 那条是同一个道理接进 CI。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.1

      - name: opa test(apps/opa/policy 下的 Rego 策略 + 单元测试)
        run: opa test apps/opa/policy -v

  test-flask-apps:
    # 2026-08-16 新增:3 个自建 Flask 工具(platform-portal/permission-
    # request-app/table-registration-app)之前完全没有自动化测试,补测试
    # 的同时顺手接进 CI——测试写了没人跑等于没测试,见 docs/BACKLOG.md
    # P1"三个自建 Flask 工具补测试"那条。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖(和各 app 的 requirements.txt 版本锁定保持一致,见
          apps/*/requirements.txt——2026-08-20 起是构建镜像用的同一份
          锁定文件,不是运行时现装那套了)
        run: |
          pip install flask==3.1.3 requests==2.34.2 trino==0.338.0 pytest

      - name: platform-portal 测试
        run: cd apps/platform-portal && python3 -m pytest tests/ -v

      - name: table-registration-app 测试
        run: cd apps/table-registration-app && python3 -m pytest tests/ -v

      - name: permission-request-app 测试
        run: cd apps/permission-request-app && python3 -m pytest tests/ -v
