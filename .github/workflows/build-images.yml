# 见 docs/project/roadmap.md 2.1("引入镜像构建流程,停止用运行时 pip install")。
# 三个自建 Flask 工具(platform-portal/permission-request-app/
# table-registration-app)之前是官方 python:3.12-slim 镜像 + 容器启动时
# 现装依赖,2026-08-16 一晚因为这个模式产生过四次真实故障——这个 workflow
# 把构建挪到 push 时用 CI 做,推到 GHCR(ghcr.io,GitHub 自带的容器仓库,
# 用内置的 GITHUB_TOKEN 就能推,不需要额外配置密钥)。iam-sync
# (2026-08-20 加入这个 matrix)同一个动机,但保留了它本来就需要的运行时
# `git clone`(拉最新 platform/iam/ 数据),只把"装 git/kubectl/pyyaml
# 这几个工具"这件事挪到构建期。superset(同一天加入)之前已经用
# apps/superset-image/Dockerfile 解决了运行时装依赖的问题,但是手动登
# cloud-full 云主机现场 build + 手动导出本地缓存,这次接进同一条自动化
# 流水线,不用再手动登云主机操作。
#
# app 名字和 GHCR 里的镜像名不是永远一一对应(superset 的构建目录是
# apps/superset-image,推上去的镜像名是 superset,不带 -image 后缀,和
# `local/superset:6.1.0-custom` 这个本地约定保持一致)——用 matrix
# include 显式声明每一项的 context/image 对应关系,不是靠目录名硬编码
# 推导。
#
# 镜像 tag 用 commit SHA(不用 latest 这种可变 tag——deployment.yaml 里
# 引用哪个 tag 就是哪个 commit 构建出来的,可追溯,不会出现"同一个 tag
# 不同时间部署得到不同内容"这类问题,这也是 2026-08-16 那晚真实踩过的坑
# 之一)。GHCR 包的可见性(public/private)在仓库的 Packages 设置里管理,
# 不受这个 workflow 控制——这个仓库是公开仓库,包默认应该跟着公开,但
# 第一次构建后要去 GitHub 网页确认一下(Package -> Package settings ->
# Change visibility),不是这个 workflow 能自动保证的。
#
# **只建 linux/amd64**。2026-08-23 起三档环境统一 x86_64(生产是已有的
# x86_64 服务器,cloud-full 是 x86_64 ECS),arm64 那条腿没有落脚点了。
# 这段注释在 2026-08-28 之前还写着"必须多架构构建",而下面的 build 步骤
# 早就只建 amd64——**注释和代码互相矛盾,这比没有注释更危险**,所以一起
# 改掉,顺带删了不再需要的 `docker/setup-qemu-action`(交叉构建才用得上,
# 每次构建都白跑一步)。
#
# 历史包袱备查:当年要建 arm64,是因为本机开发环境是 Mac M2 上的 colima
# (aarch64)。那条线上踩过一个真实的坑——iam-sync 镜像里打包的 kubectl
# 如果是 amd64、靠 QEMU 在 arm64 节点上模拟执行,会触发 client-go 的一个
# 并发 bug(concurrent map writes,栈在
# k8s.io/client-go/restmapper/discovery.go)。现在没有 arm64 节点了,这个
# 坑不会再出现,但记着它,免得以后有人重新引入 arm64 时再踩一遍。
name: Build Images

on:
  push:
    branches: [main]
    paths:
      - "apps/permission-request-app/**"
      - "apps/table-registration-app/**"
      - "apps/platform-portal/**"
      - "apps/iam-sync/Dockerfile"
      - "apps/superset-image/Dockerfile"
      - "apps/argo-workflows-training-image/Dockerfile"
      - "apps/feast/feature-server-image/Dockerfile"
      - "apps/spark-iceberg-image/Dockerfile"
      - "apps/flink-iceberg-image/Dockerfile"
      - "apps/kafka-producer-image/Dockerfile"
      - "apps/hive-metastore-image/Dockerfile"
      - ".github/workflows/build-images.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: apps/permission-request-app
            image: permission-request-app
          - context: apps/table-registration-app
            image: table-registration-app
          - context: apps/platform-portal
            image: platform-portal
          - context: apps/iam-sync
            image: iam-sync
          - context: apps/superset-image
            image: superset
          - context: apps/hive-metastore-image
            image: hive-metastore
          - context: apps/argo-workflows-training-image
            image: argo-workflows-training
          - context: apps/feast/feature-server-image
            image: feast-feature-server
          - context: apps/spark-iceberg-image
            image: spark-iceberg
          - context: apps/flink-iceberg-image
            image: flink-iceberg
          - context: apps/kafka-producer-image
            image: kafka-device-events-producer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **只建 amd64。** 2026-08-23 起三档环境统一 x86_64(生产是已有的
      # x86_64 服务器,云主机规格购买时定死,本机 colima 也重建成 x86_64
      # + Rosetta),见 docs/operations/cpu-architecture.md。
      #
      # 之前建 arm64 的唯一理由是本机开发环境是 Mac M2;统一之后这条腿
      # 是纯浪费——构建时间翻倍,而且 apps/flink-iceberg-image 还得为它
      # 单独写一条"只建 amd64"的特例(apache-flink 没有 aarch64 wheel,
      # arm64 那条腿在 QEMU 下必然构建失败)。那条特例这次一起删掉了。
      # 阿里云 ACR:**没配 secrets 时这一步自动跳过**,不会让流水线变红。
      # 为什么需要它(2026-08-28 实测,见 docs/project/roadmap.md「镜像拉取」那条):
      # 境内云主机拉 GHCR 的大镜像会直接卡死——`docker pull` 3.44GB 的
      # spark-iceberg 是 25 秒 0 字节,NJU 镜像站能拿 manifest 但拉 blob
      # 超时;当天只能手工搬 1.3GB 的 tar 上去,和「一键部署」直接冲突。
      # ACR 和 ECS 同地域走内网,是这个问题的正解。
      #
      # 需要的 4 个仓库 secret(**由仓库所有者自己在 GitHub 上设置,
      # 任何 AI/协作者都不应该经手这些值**):
      #   ACR_REGISTRY   例:registry.cn-wulanchabu.aliyuncs.com
      #   ACR_NAMESPACE  ACR 里的命名空间名
      #   ACR_USERNAME   ACR 的登录账号
      #   ACR_PASSWORD   ACR 的访问凭证(不是阿里云主账号密码)
      # 设置办法见 docs/operations/image-registry.md。
      # secret 通过 env 传进来,不直接插值进 shell —— 值里如果带引号或
      # 反引号,`${{ }}` 直接展开会变成 shell 注入面。
      - name: 检查有没有配 ACR
        id: acr
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "没有配 ACR secrets,跳过推送到阿里云(这不是错误)"
          fi

      - name: Log in to ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push (只有 GHCR)
        if: steps.acr.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest

      # 一次构建推两个 registry,不是构建两次——buildx 把同一份产物推到多个
      # tag,两边内容(和 digest)完全一致,不会出现"ACR 上那份和 GHCR 上
      # 那份其实不一样"这种最难查的问题。
      - name: Build and push (GHCR + ACR)
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:latest
