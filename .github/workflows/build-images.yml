# 见 docs/BACKLOG.md 2.1("引入镜像构建流程,停止用运行时 pip install")。
# 三个自建 Flask 工具(platform-portal/permission-request-app/
# table-registration-app)之前是官方 python:3.12-slim 镜像 + 容器启动时
# 现装依赖,2026-08-16 一晚因为这个模式产生过四次真实故障——这个 workflow
# 把构建挪到 push 时用 CI 做,推到 GHCR(ghcr.io,GitHub 自带的容器仓库,
# 用内置的 GITHUB_TOKEN 就能推,不需要额外配置密钥)。iam-sync
# (2026-08-20 加入这个 matrix)同一个动机,但保留了它本来就需要的运行时
# `git clone`(拉最新 platform/iam/ 数据),只把"装 git/kubectl/pyyaml
# 这几个工具"这件事挪到构建期。superset(同一天加入)之前已经用
# apps/superset-image/Dockerfile 解决了运行时装依赖的问题,但是手动登
# cloud-full 云主机现场 build + 手动导出本地缓存,这次接进同一条自动化
# 流水线,不用再手动登云主机操作。
#
# app 名字和 GHCR 里的镜像名不是永远一一对应(superset 的构建目录是
# apps/superset-image,推上去的镜像名是 superset,不带 -image 后缀,和
# `local/superset:6.1.0-custom` 这个本地约定保持一致)——用 matrix
# include 显式声明每一项的 context/image 对应关系,不是靠目录名硬编码
# 推导。
#
# 镜像 tag 用 commit SHA(不用 latest 这种可变 tag——deployment.yaml 里
# 引用哪个 tag 就是哪个 commit 构建出来的,可追溯,不会出现"同一个 tag
# 不同时间部署得到不同内容"这类问题,这也是 2026-08-16 那晚真实踩过的坑
# 之一)。GHCR 包的可见性(public/private)在仓库的 Packages 设置里管理,
# 不受这个 workflow 控制——这个仓库是公开仓库,包默认应该跟着公开,但
# 第一次构建后要去 GitHub 网页确认一下(Package -> Package settings ->
# Change visibility),不是这个 workflow 能自动保证的。
#
# **必须多架构构建(linux/amd64 + linux/arm64)**,不能只建 amd64:
# local-lite(colima,跑在 Apple Silicon 上默认是 aarch64)和 cloud-full
# (阿里云 ECS,x86_64)都会拉这些镜像跑同一批组件(见
# environments/local-lite/config.yaml 的 enabled_components,这三个
# Flask 应用和 iam-sync 都在里面)。iam-sync 这个尤其关键——它的镜像里
# 打包了 kubectl,这个仓库已经真实踩过"amd64 的 kubectl 靠 QEMU 在 arm64
# 节点上模拟执行,会触发 client-go 的一个真实并发 bug(concurrent map
# writes,栈在 k8s.io/client-go/restmapper/discovery.go)"这个坑(见
# apps/iam-sync/manifests/cronjob.yaml 里退役前那段 initContainer 的
# 注释,当时的解法是运行时动态探测架构装原生二进制)——只建 amd64 镜像会
# 在 local-lite 上把这个已经修好的坑重新引入,不是"能用但慢",是真的会
# 崩。`docker/setup-qemu-action` + `buildx` 在 GitHub Actions 的
# ubuntu-latest runner(amd64)上交叉构建 arm64 镜像,`apt-get install
# kubectl` 这类命令在交叉构建时会装对应目标架构的包(dpkg 自己识别构建
# 目标架构,不需要额外配置)。
name: Build Images

on:
  push:
    branches: [main]
    paths:
      - "apps/permission-request-app/**"
      - "apps/table-registration-app/**"
      - "apps/platform-portal/**"
      - "apps/iam-sync/Dockerfile"
      - "apps/superset-image/Dockerfile"
      - ".github/workflows/build-images.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: apps/permission-request-app
            image: permission-request-app
          - context: apps/table-registration-app
            image: table-registration-app
          - context: apps/platform-portal
            image: platform-portal
          - context: apps/iam-sync
            image: iam-sync
          - context: apps/superset-image
            image: superset
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (交叉构建 arm64 需要)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
