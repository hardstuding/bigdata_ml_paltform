# ArgoCD 是唯一允许手动 helm install/upgrade 的组件(GitOps 引擎本身,见 ADR-005)。
# 这是通用部分,任何环境(本机/云/IDC)都适用。本机特有的代理设置拆到
# argocd-values.local-proxy.yaml,由 scripts/01-bootstrap-argocd.sh 按需叠加,
# 不要把本机网络的限制带进这个通用文件里。
#
# server.insecure=true:让 argocd-server 自己不再起 TLS,改由 ingress-nginx
# 在边缘终结(local-lite 阶段先不接 TLS,见 docs/decisions/016)。这是官方推荐的
# "跑在反向代理后面"的标准姿势,不是本地专用的临时妥协,cloud-full/prod 也这样配,
# 区别只是那边 ingress 会挂真实证书。
# 之前一直没给 ArgoCD 自己这几个组件配 resources.limits——它是 GitOps 引擎
# 本身,是这个仓库“先做一遍资源清单扫描、补全所有组件 limits”那次审计的
# 盲区(那次只扫了 platform/apps/、apps/definitions/,没扫这个 bootstrap
# 文件)。排查 spark-operator 那次 GitOps 同步异常(revision 更新了但子
# Application 的 spec 没跟着变)时发现 argocd-repo-server 有过 3 次
# 重启(exitCode 0,不是典型的 OOMKilled),且完全没配内存上限——不能排除
# 是资源相关问题的一个诱因,先补上,数值参照 `kubectl top pod -n argocd`
# 实测(application-controller 常驻 ~640Mi,是唯一吃内存大户,其余都是几十Mi)。
#
# 2026-08-12 更正:controller 的 limits 一开始定的 1024Mi,结果几十分钟后
# 就在真实使用中被 OOMKilled(反复重启,导致所有 Application 的 sync 操作
# 卡在 Running 不动,排查了好一阵才发现)——`kubectl top` 那次测的 640Mi
# 只是瞬时静态值,没考虑到它要跟踪这个平台全部 25+ 个 Application 及其名下
# 资源的实时状态,遇到批量 sync/patch 操作时的内存峰值远不止这个数。调高到
# 2048Mi,留够真实操作时的峰值余量,不要只信一次性的 top 快照。
#
# 2026-08-14 再次更正:2048Mi 还是不够——排查 Feast 集成那轮资源紧张期间
# (Airflow scheduler 反复长出两个并存 ReplicaSet、子 Application 的
# .spec.source 一度没跟上最新 git 内容)时发现,即使当时机器相对"安静"
# (Airflow/Trino 都已经 park 掉),controller 实测常驻内存也有 1814Mi,
# 已经是 2048Mi 限制的 88.6%,`kubectl get pod ... lastState` 确认过去确实
# 发生过真实的 OOMKilled(exitCode 137,不是猜测)。这台机器全平台 25+
# 个 Application 的常态基线本身就已经很接近这个组件的旧上限,再叠加一次
# 真实的批量 sync 就会触发。调到 3072Mi,留出比当前观测到的常驻值更明显
# 的余量。同时 repoServer 之前完全没有实测数据支撑 512Mi 这个数字(只是
# "先给个安全下限"),这次同一次排查里也确认了它同样有过 OOMKilled 记录
# (`lastState` 里 reason 是 OOMKilled,即使 exitCode 显示 0——k8s 对这种
# 情况的上报本身就不总是一致,不能只信 exitCode 字段),渲染 Airflow 这类
# 大 chart 时的内存峰值明显超出 512Mi,调到 1024Mi。
#
# 这次调整**只动 limits,不动 requests**——这台机器(colima,11GB)整体
# 内存基线已经在 86% 上下,如果连 requests 一起大幅调高,会挤占其他组件的
# 可调度余量,风险比现在的问题更大。只放宽 limits 是为了不让 controller/
# repo-server 在真正需要更多内存时被自己的人为上限误杀,不代表这台机器
# 的物理内存瓶颈被解决了——如果以后同时启用的重量级组件更多,这两个数字
# 大概率还要继续往上调,这是这台机器资源规模下的结构性限制,不是一次性
# 调参就能"修好"的问题。
controller:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 3072Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1024Mi
  # 2026-08-16:上面 configs.params 里的 controller.repo.server.timeout.
  # seconds 只调大了"controller 等 repo-server 这整个 RPC 调用"的耐心,
  # repo-server 自己内部执行 `helm pull` 这类子进程还有一个独立的、更早
  # 触发的超时(ARGOCD_EXEC_TIMEOUT,默认 90 秒)——实测抓到日志:
  # "helm pull ... kube-prometheus-stack failed timeout after 1m30s",
  # 就是卡在这一层,不是 RPC 层。两个超时管的是不同层级,得一起调大才
  # 真的有效,只改一个没用。
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: "180s"

dex:
  # 2026-08-16 真实事故:128Mi 内存限制对 dex-server v2.45.1 现在的实际
  # 需求来说太紧,内存压力下直接以 SIGSEGV(容器退出码139)崩溃重启,
  # 不是干净的 OOMKilled(所以从 `kubectl get pods` 的 STATUS 一栏看着
  # 像随机崩溃,不容易联想到内存)。cloud-full 集群上实测确认:把限制
  # 提到 512Mi 之后 pod 立刻变成 1/1 Running,0 次重启,这个数值是真实
  # 验证过、不是拍脑袋加大的。这份 values 文件目前 local-lite/cloud-full
  # 共用(环境 overlay 重构还没做,见 docs/BACKLOG.md P1),没有单独区分
  # 环境资源预算,128Mi 这个值本来是照 local-lite 的紧张内存配的,但连
  # cloud-full(64GB 内存充裕)都撑不住,说明这个限制对 dex-server 本身
  # 已经过时,不只是"local-lite 该有的紧张预算被沿用到了不该紧张的地方"
  # 这么简单——local-lite 上大概率也有同样的问题,只是当时没有专门查过
  # 这一个 pod 的崩溃原因。
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local-lite.test

# argocd-server 自己也要向 issuer 发起 OIDC discovery/token 交换请求,不只是
# 浏览器跳转要用这个域名——集群内部 DNS 不认识 keycloak.local-lite.test 这种
# 自造域名,用 hostAliases 让它解析到 ingress-nginx 的 ClusterIP,和浏览器走
# 同一个 Ingress 入口(只是浏览器经 127.0.0.1、pod 内部经集群网络到达同一个
# Service)。cloud-full/prod 用真实 DNS 后这段要删掉。
global:
  hostAliases:
    - ip: 10.43.102.204 # ingress-nginx-controller 的 ClusterIP,变了要同步改
      hostnames:
        - keycloak.local-lite.test

configs:
  params:
    server.insecure: true
    # 2026-08-16 真实故障(docs/BACKLOG.md P1.8):alloy/loki/
    # kube-prometheus-stack 这几个 Application 的 chart 源
    # (prometheus-community.github.io/grafana.github.io 的 helm-charts
    # 仓库)从这台云主机实测抓取 index.yaml 经常要 20-25 秒(和这个仓库
    # 到处踩过的"访问境外域名慢"是同一类问题,不是这几个仓库本身有错),
    # 加上 chart 渲染本身的时间,容易超过 controller 调 repo-server 的
    # 默认 60 秒 deadline,导致 ComparisonError("context deadline
    # exceeded")、Sync Status 卡在 Unknown——底层 Pod 一直是健康的,纯粹
    # 是这一层比较逻辑超时,调大这个值不改变任何运行时行为,只是给"抓
    # chart 源"这件事更多耐心。
    controller.repo.server.timeout.seconds: "180"
  cm:
    # 协议是 http:server.insecure=true 之后 argocd-server 自己不再有 TLS,
    # 由 ingress-nginx 接收明文流量。cloud-full/prod 接真实域名 + cert-manager
    # 之后这里要同步改成 https。
    # 2026-08-16 cloud-full 真实故障:这个 url 是 ArgoCD 拼 OAuth 回调地址
    # 的依据(和 Grafana 的 root_url 同一个机制),local-lite 靠 colima
    # 自动转发 80/443 不需要端口,cloud-full 的 ingress-nginx 是 NodePort
    # 32460,不带端口登录跳转回来会 404(完整根因见
    # platform/apps/keycloak.yaml 里 KC_HOSTNAME 那段说明)。
    url: http://argocd.local-lite.test:32460
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.local-lite.test/auth/realms/platform
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email"]
    # 2026-08-16 真实故障:这个集群的 ingress-nginx 是裸机部署,没有云
    # LoadBalancer 控制器给 Ingress 的 `.status.loadBalancer` 填 IP——
    # ArgoCD 默认的 Ingress 健康检查就是在等这个字段,裸机场景下永远等不到,
    # Application 永远卡在 Progressing。之前一直没暴露是因为大部分组件的
    # 首次 sync 没有主动等健康状态就过去了,这次云端重新拉起
    # trino/superset 这批组件、手动触发 sync 时才真正卡住(sync 操作本身
    # 停在 "waiting for healthy state of ... Ingress" 不再往下走,
    # superset 的 `init` Job 因此一直没机会创建)。改成"这个 Ingress
    # 对象存在就算健康",不再等一个裸机环境本来就不会有的字段——ArgoCD
    # 官方文档自己的 resource.customizations 示例就是这个场景。
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "裸机 ingress-nginx 没有云 LoadBalancer,不等 status.loadBalancer"
      return hs
    # 同一个问题的另一个表现:ingress-nginx-controller 自己的 Service 是
    # type: LoadBalancer(EXTERNAL-IP 永远 <pending>),ArgoCD 默认的
    # Service 健康检查也在等同一个不存在的云 LB 状态。这条会覆盖所有
    # Service 类型的默认健康检查,不只是 LoadBalancer——但这个集群是单
    # 裸机节点,ClusterIP/NodePort 类型的 Service 本来创建出来就应该算
    # 健康,不会因为这条覆盖丢失真实的异常检测能力。
    resource.customizations.health.Service: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "裸机没有云 LoadBalancer,不等 status.loadBalancer"
      return hs
  rbac:
    # 2026-08-11 起改成按 Keycloak group 做角色映射(见 ADR-028、
    # platform/iam/):group 名字从 token 的 groups claim 里读("roles" 这个
    # 默认 client scope 上加了 group-membership mapper,见 ADR-028),
    # ArgoCD 默认就认 groups claim,不需要额外配 oidc.config 指定claim名字。
    # policy.default 留空(不是 role:admin 了)——不在任何已知 group 里的人
    # 登进来是"零权限",不是兜底 admin,这是刻意的:宁可漏权限报错让人来问,
    # 不要漏配置导致意外授权。
    policy.csv: |
      g, platform-team, role:admin
      g, data-analysts, role:readonly
      g, algorithm-team, role:readonly
      g, viewers, role:readonly
