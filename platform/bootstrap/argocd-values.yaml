# ArgoCD 是唯一允许手动 helm install/upgrade 的组件(GitOps 引擎本身,见 ADR-005)。
# 这是通用部分,任何环境(本机/云/IDC)都适用。本机特有的代理设置拆到
# argocd-values.local-proxy.yaml,由 scripts/01-bootstrap-argocd.sh 按需叠加,
# 不要把本机网络的限制带进这个通用文件里。
server:
  service:
    type: ClusterIP

configs:
  cm:
    # 本地调试用 localhost,以后接了真实域名/ingress 记得改成实际外部地址,
    # 否则 OIDC 回调会跳回 localhost。
    url: http://localhost:8080
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email"]
  rbac:
    # local-lite 简化处理:登录即 admin,只有我一个受信用户在用。接入更多人
    # 或者上 cloud-full/prod 之前,要换成按 Keycloak group 做角色映射
    # (见 docs/decisions/006-ai-agent-identity-v1.md 的"用真实需求驱动"原则)。
    policy.default: role:admin
