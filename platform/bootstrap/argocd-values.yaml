# ArgoCD 是唯一允许手动 helm install/upgrade 的组件(GitOps 引擎本身,见 ADR-005)。
# 这是通用部分,任何环境(本机/云/IDC)都适用。本机特有的代理设置拆到
# argocd-values.local-proxy.yaml,由 scripts/01-bootstrap-argocd.sh 按需叠加,
# 不要把本机网络的限制带进这个通用文件里。
#
# server.insecure=true:让 argocd-server 自己不再起 TLS,改由 ingress-nginx
# 在边缘终结(local-lite 阶段先不接 TLS,见 docs/decisions/016)。这是官方推荐的
# "跑在反向代理后面"的标准姿势,不是本地专用的临时妥协,cloud-full/prod 也这样配,
# 区别只是那边 ingress 会挂真实证书。
# 之前一直没给 ArgoCD 自己这几个组件配 resources.limits——它是 GitOps 引擎
# 本身,是这个仓库“先做一遍资源清单扫描、补全所有组件 limits”那次审计的
# 盲区(那次只扫了 platform/apps/、apps/definitions/,没扫这个 bootstrap
# 文件)。排查 spark-operator 那次 GitOps 同步异常(revision 更新了但子
# Application 的 spec 没跟着变)时发现 argocd-repo-server 有过 3 次
# 重启(exitCode 0,不是典型的 OOMKilled),且完全没配内存上限——不能排除
# 是资源相关问题的一个诱因,先补上,数值参照 `kubectl top pod -n argocd`
# 实测(application-controller 常驻 ~640Mi,是唯一吃内存大户,其余都是几十Mi)。
controller:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1024Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

dex:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local-lite.test

# argocd-server 自己也要向 issuer 发起 OIDC discovery/token 交换请求,不只是
# 浏览器跳转要用这个域名——集群内部 DNS 不认识 keycloak.local-lite.test 这种
# 自造域名,用 hostAliases 让它解析到 ingress-nginx 的 ClusterIP,和浏览器走
# 同一个 Ingress 入口(只是浏览器经 127.0.0.1、pod 内部经集群网络到达同一个
# Service)。cloud-full/prod 用真实 DNS 后这段要删掉。
global:
  hostAliases:
    - ip: 10.43.102.204 # ingress-nginx-controller 的 ClusterIP,变了要同步改
      hostnames:
        - keycloak.local-lite.test

configs:
  params:
    server.insecure: true
  cm:
    # 协议是 http:server.insecure=true 之后 argocd-server 自己不再有 TLS,
    # 由 ingress-nginx 接收明文流量。cloud-full/prod 接真实域名 + cert-manager
    # 之后这里要同步改成 https。
    url: http://argocd.local-lite.test
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.local-lite.test/auth/realms/platform
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email"]
  rbac:
    # 2026-08-11 起改成按 Keycloak group 做角色映射(见 ADR-028、
    # platform/iam/):group 名字从 token 的 groups claim 里读("roles" 这个
    # 默认 client scope 上加了 group-membership mapper,见 ADR-028),
    # ArgoCD 默认就认 groups claim,不需要额外配 oidc.config 指定claim名字。
    # policy.default 留空(不是 role:admin 了)——不在任何已知 group 里的人
    # 登进来是"零权限",不是兜底 admin,这是刻意的:宁可漏权限报错让人来问,
    # 不要漏配置导致意外授权。
    policy.csv: |
      g, platform-team, role:admin
      g, data-analysts, role:readonly
      g, algorithm-team, role:readonly
      g, viewers, role:readonly
