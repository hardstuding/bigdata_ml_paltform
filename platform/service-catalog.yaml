# 统一服务目录 —— 一个地方回答:这个服务是干什么的、谁负责、出问题看哪里。
#
# **为什么需要它**(docs/roles.md 里「统一服务目录」一直标着「完全没做」):
# 平台现在有 56 个组件。一个新人(或者一个新接手的 AI)看到某个东西挂了,
# 要翻 ADR、翻 Application、翻注释才能拼出「它是干嘛的、坏了影响谁」。
# 排障 Runbook 回答的是「这个症状怎么处理」,这份目录回答的是它前面那个
# 问题:「这是什么、归谁、坏了要紧吗」。
#
# **怎么保证它不腐烂**:`scripts/check-service-catalog.py` 要求
# `environments/*/config.yaml` 的 `enabled_components` 里每一项,要么在
# 下面 `services` 里有条目,要么在 `infra_only` 里显式登记并写明理由。
# 加了新组件却忘了登记,CI 直接红。**这条约束比目录内容本身更重要**——
# 没有它,这份文件三个月后就会变成一份过期清单。
#
# **owner 字段**:现在只有 platform-team 一个运维组(见 platform/iam/),
# 所以绝大多数条目都是它。这不是偷懒填的默认值,是当前组织的真实状态;
# 等团队分化了,改这里就是改归属。

# 责任组必须是 platform/iam/groups.yaml 里真实存在的组。
services:

  # ---------- 面向用户的入口(坏了用户直接感知)----------
  - name: platform-portal
    用途: 平台统一门户,列出所有工具入口 + 六条链路状态 + 我的作业 + 队列配额
    类别: 入口
    owner: platform-team
    面向用户: true
    请求路径上: true
    依赖: [keycloak, kueue, kube-prometheus-stack]
    排障: docs/operations/troubleshooting.md 的「网络与 Ingress 层」

  - name: keycloak
    # platform/apps/ 那一层的组件不在 enabled_components 里(它们是平台
    # 底座,不参与"按环境启用"),用 component 显式指出它的定义在哪。
    component: platform/apps/keycloak.yaml
    用途: 统一身份认证(OIDC),所有组件的登录都走它
    类别: 入口
    owner: platform-team
    面向用户: true
    请求路径上: true
    依赖: [postgres]
    排障: docs/operations/troubleshooting.md 的「认证 SSO 层」
    备注: 它挂了等于整个平台登录不了,是全平台唯一的单点

  - name: trino
    用途: 交互式 SQL 查询引擎,读写 Iceberg 湖仓;权限走 OPA
    类别: 数据
    owner: platform-team
    面向用户: true
    请求路径上: true
    依赖: [hive-metastore, minio, opa, keycloak]
    排障: docs/operations/troubleshooting.md 的「各组件专属故障」
    备注: startupProbe 预算 610s,机器满载时启动会超过两分钟(2026-08-29)

  - name: superset
    用途: BI 看板,数据源是 Trino;用 impersonation 继承 Trino 的表权限
    类别: 数据
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [trino, postgres, keycloak]
    排障: ADR-077(汉化)/ ADR-051(权限)

  - name: jupyterhub
    用途: 多用户 Notebook,镜像里带 platform_sdk,可直接提交作业
    类别: AI/ML
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [keycloak, argo-workflows, minio]
    排障: ADR-058

  - name: airflow
    用途: 任务调度(dbt / SeaTunnel / Feast 物化等 DAG)
    类别: 数据
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [postgres, trino, minio]
    排障: docs/operations/troubleshooting.md 的「各组件专属故障」

  - name: openmetadata
    用途: 数据目录 / 血缘 / 表安全等级标注 / 数据质量断言
    类别: 治理
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [postgres, opensearch, trino, minio]
    排障: ADR-065 / ADR-070 / ADR-082
    备注: 采集管道的 CronJob 由它自己生成,startingDeadlineSeconds 要用
          scripts/fix-openmetadata-cronjob-deadline.sh 放大,否则永不触发

  - name: mlflow
    用途: 实验跟踪 + 模型注册表;上线前的审批章也打在这里
    类别: AI/ML
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [postgres, minio, keycloak]
    排障: ADR-026 / ADR-080

  - name: argo-workflows
    用途: 训练/批处理的工作流编排,notebook 里 SDK 触发的就是它
    类别: AI/ML
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [keycloak, minio]
    排障: BACKLOG 1.5(SSO RBAC 那次)

  - name: permission-request-app
    用途: 表权限申请 + 分级审批 + 到期自动回收
    类别: 治理
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [postgres, keycloak, opa]
    排障: ADR-044 / ADR-045 / ADR-050

  - name: table-registration-app
    用途: 建表登记 + 回写负责人/安全等级到目录
    类别: 治理
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [trino, openmetadata, keycloak]
    排障: ADR-043

  - name: spark-history-server
    用途: 看已结束 Spark 作业的执行详情,日志读 s3a://spark-logs/
    类别: 数据
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [minio]
    排障: ADR-036

  # ---------- 数据平面(用户不直接打开,但坏了业务就断)----------
  - name: hive-metastore
    用途: Iceberg 表的元数据服务,Trino/Spark/Flink 共用同一份
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: [postgres]
    排障: apps/hive-metastore/manifests/deployment.yaml 顶部注释
    备注: 版本锁 3.1.3,不能升 4.x(Iceberg 的 Hive 客户端只会发 get_table)

  - name: minio
    用途: 对象存储,湖仓 warehouse / 模型产物 / Spark 事件日志 / 备份都在它上面
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: []
    排障: docs/operations/troubleshooting.md 的「存储与 S3A 层」
    备注: 有 NetworkPolicy 白名单,新增消费方要同时加白名单(踩过三次)

  - name: postgres
    用途: 元数据库(Keycloak / Airflow / Superset / MLflow / OpenMetadata / HMS 共用)
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: []
    排障: ADR-033(备份恢复)
    备注: CloudNativePG 管理;每天备份到 MinIO,但那不是异地备份

  - name: opa
    用途: Trino 的细粒度访问控制策略引擎(行列级 + 表级)
    类别: 治理
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: []
    排障: ADR-051 / ADR-078

  - name: kafka-cluster
    用途: 消息总线,承载审计事件流和设备事件流
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: []
    排障: ADR-062

  - name: flink-audit-sink
    用途: 把 Trino 的查询审计从 Kafka 落进 Iceberg 审计表
    类别: 治理
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [kafka-cluster, hive-metastore, minio]
    排障: ADR-066

  - name: flink-streaming-demo
    用途: 设备事件流式聚合写 Iceberg,验证流处理链路
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [kafka-cluster, hive-metastore, minio]
    排障: ADR-062

  - name: feast
    用途: 特征存储,离线读 Iceberg、在线走 Redis
    类别: AI/ML
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [trino, minio, hive-metastore]
    排障: ADR-042

  - name: seatunnel
    用途: 数据集成(把外部数据源搬进湖仓)
    类别: 数据
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [minio, hive-metastore]
    排障: ADR-054

  - name: schema-registry
    用途: Karapace,Kafka 消息的 schema 契约与兼容性校验
    类别: 治理
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [kafka-cluster]
    排障: ADR-068
    备注: Flink 作业还没接,schema 目前仍写死在 SQL 里

  # ---------- 平台自身的可观测与治理 ----------
  - name: golden-path-probes
    用途: 六条真实业务链路的探针,回答「一件真实的事现在做不做得成」
    类别: 可观测
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [trino, openmetadata, mlflow, kserve-resources]
    排障: ADR-079
    备注: 探针失败会让这个 Application 黄一阵,下次跑通自愈(ADR-079 末尾)

  - name: opencost
    用途: 按命名空间/按组算成本,给管理驾驶舱和容量看板供数
    类别: 可观测
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: []
    排障: ADR-069

  - name: kueue
    用途: 按组分配计算配额,同 cohort 内空闲可互借
    类别: 平台
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: []
    排障: ADR-064

  - name: iam-sync
    用途: 把 platform/iam/ 里的组织架构同步进 Keycloak
    类别: 治理
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [keycloak]
    排障: scripts/12-sync-iam.py

  - name: postgres-backup
    用途: 每天把 Postgres 全量备份传到 MinIO
    类别: 平台
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [postgres, minio]
    排障: ADR-033

  - name: kserve-resources
    用途: 在线推理服务的运行时(sklearn / xgboost / triton 等)
    类别: AI/ML
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: [minio, mlflow]
    排障: ADR-027 / ADR-075
    备注: deploymentMode 是 Standard(不装 Knative),所以做不了 canary 灰度

  # ---------- 平台底座(platform/apps/,不参与按环境启用)----------
  - name: ingress-nginx
    component: platform/apps/ingress-nginx.yaml
    用途: 集群入口,所有从外面进来的 HTTP 请求都经过它
    类别: 入口
    owner: platform-team
    面向用户: false
    请求路径上: true
    依赖: []
    排障: docs/operations/troubleshooting.md 的「网络与 Ingress 层」
    备注: cloud-full 上走 NodePort(和别的项目共享节点,抢不到 80/443)

  - name: cert-manager
    component: platform/apps/cert-manager.yaml
    用途: 证书签发。三档环境共用 platform-issuer 这个名字,背后接自签还是真实 CA 由环境配置决定
    类别: 平台
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: []
    排障: ADR-060

  - name: kube-prometheus-stack
    component: platform/apps/kube-prometheus-stack.yaml
    用途: 指标采集 + Alertmanager + Grafana,门户的链路状态也读它
    类别: 可观测
    owner: platform-team
    面向用户: true
    请求路径上: false
    依赖: [keycloak]
    排障: docs/operations/troubleshooting.md
    备注: cloud-full 保留 15 天 + 20Gi 持久卷;在 2026-08-28 之前是 6h + emptyDir,指标每次开机清零

  - name: loki
    component: platform/apps/loki.yaml
    用途: 日志聚合,和指标同一个 Grafana 界面
    类别: 可观测
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [minio]
    排障: ADR-020 / ADR-061

  - name: alloy
    component: platform/apps/alloy.yaml
    用途: 日志采集 agent,把所有 pod 的 stdout 送进 Loki
    类别: 可观测
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: [loki]
    排障: ADR-020

  - name: opensearch
    component: opensearch.yaml
    用途: OpenMetadata 的搜索后端(目录里搜表靠它)
    类别: 治理
    owner: platform-team
    面向用户: false
    请求路径上: false
    依赖: []
    排障: scripts/20-configure-openmetadata-search-truststore.sh

# 这些是支撑性资源,不构成"一个服务",不单独立目录条目。
# 写在这里是为了让"没登记"和"不需要登记"能区分开——直接不写的话,
# 下次有人加了新组件忘了登记,检查器分不出来是遗漏还是有意。
infra_only:
  platform/apps/alertmanager-notification.yaml: 告警路由与出口配置,归属 kube-prometheus-stack
  platform/apps/prometheus-rules.yaml: 告警规则,归属 kube-prometheus-stack
  platform/apps/cert-manager-issuers.yaml: ClusterIssuer 定义,归属 cert-manager
  platform/apps/coredns-custom.yaml: 集群内 DNS 补充记录,归属集群本身
  platform/apps/grafana-overview-dashboard.yaml: 看板定义,归属 kube-prometheus-stack
  platform/apps/grafana-audit-dashboard.yaml: 看板定义,归属 kube-prometheus-stack
  platform/apps/grafana-capacity-dashboard.yaml: 看板定义,归属 kube-prometheus-stack
  platform/apps/grafana-cost-dashboard.yaml: 看板定义,归属 opencost
  platform/apps/grafana-goldenpath-dashboard.yaml: 看板定义,归属 golden-path-probes
  platform/apps/grafana-inference-dashboard.yaml: 看板定义,归属 kserve-resources
  kserve-inference-monitoring.yaml: PodMonitor,归属 kserve-resources(推理指标)
  airflow-db-init.yaml: 一次性建库 Job,归属 airflow
  keycloak-db-init.yaml: 一次性建库 Job,归属 keycloak
  mlflow-db-init.yaml: 一次性建库 Job,归属 mlflow
  openmetadata-db-init.yaml: 一次性建库 Job,归属 openmetadata
  superset-db-init.yaml: 一次性建库 Job,归属 superset
  cloudnative-pg-operator.yaml: operator,归属 postgres
  kafka-operator.yaml: operator(Strimzi),归属 kafka-cluster
  spark-operator.yaml: operator,归属 spark 作业
  flink-kubernetes-operator.yaml: operator,归属两个 flink 作业
  kserve-crd.yaml: CRD,归属 kserve-resources
  kueue-queues.yaml: 队列定义,归属 kueue
  mlflow-oauth2-proxy.yaml: 认证边车,归属 mlflow
  platform-portal-oauth2-proxy.yaml: 认证边车,归属 platform-portal
  permission-request-app-oauth2-proxy.yaml: 认证边车,归属 permission-request-app
  spark-history-server-oauth2-proxy.yaml: 认证边车,归属 spark-history-server
  table-registration-app-oauth2-proxy.yaml: 认证边车,归属 table-registration-app
  network-policies.yaml: 集群级网络策略,归属平台本身
  resource-quotas.yaml: 命名空间配额,归属平台本身
  platform-iam-rbac.yaml: RBAC,归属平台本身
  platform-sdk-submitter-rbac.yaml: RBAC,归属 jupyterhub 的 SDK 提交路径
  trino-tls.yaml: Trino 的证书,归属 trino
  trino-groups.yaml: Trino 的组成员文件,归属 trino
  trino-liveness-fix.yaml: 巡检修复 CronJob,归属 trino
  openmetadata-quality-alerts.yaml: 质量告警 CronJob,归属 openmetadata
  alert-echo-sink.yaml: 告警出口的验证终点,归属告警链路(ADR-081)
  argo-training-workflow-template.yaml: WorkflowTemplate,归属 argo-workflows
  dbt-demo.yaml: dbt 项目,归属 airflow 的 dbt_demo DAG
  kafka-producer-device-events.yaml: 造数 CronJob,归属 flink-streaming-demo
