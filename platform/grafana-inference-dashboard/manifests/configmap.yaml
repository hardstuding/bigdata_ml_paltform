# 在线推理看板(C 线「推理可观测性」)。走 kube-prometheus-stack 的 Grafana
# sidecar 自动发现(带 grafana_dashboard 标签的 ConfigMap),和另外五块看板
# 同一个机制。
#
# **指标从哪来**:apps/kserve-inference-monitoring/ 里的 PodMonitor 抓
# kserve-demo 命名空间里 predictor pod 的 :8080/metrics。指标名是 KServe
# 官方文档列的 Python 模型服务器指标(request_preprocess_seconds /
# request_predict_seconds / request_postprocess_seconds,都是 histogram),
# 不是猜的。
#
# **为什么专门留了一个「有没有在抓」的面板**:这个仓库被"看起来配好了"
# 坑过太多次。看板全是空的时候,第一个要回答的问题是"是没流量,还是根本
# 没抓到",而不是去猜 PromQL 写错没有。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-inference-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-inference.json: |
    {
      "title": "在线推理",
      "uid": "platform-inference",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "title": "推理请求速率(QPS)",
          "type": "timeseries",
          "description": "request_predict_seconds 的 _count 求速率。没有曲线通常不是没流量,是 PodMonitor 没抓到——先看下面那个「有没有在抓」面板。",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (inferenceservice) (rate(request_predict_seconds_count[5m]))",
              "legendFormat": "{{inferenceservice}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "推理延迟 P50 / P95 / P99",
          "type": "timeseries",
          "description": "只画 P95。平均值会把长尾抹平,而线上真正被投诉的就是长尾。",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, inferenceservice) (rate(request_predict_seconds_bucket[5m])))",
              "legendFormat": "P95 {{inferenceservice}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.5, sum by (le, inferenceservice) (rate(request_predict_seconds_bucket[5m])))",
              "legendFormat": "P50 {{inferenceservice}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, inferenceservice) (rate(request_predict_seconds_bucket[5m])))",
              "legendFormat": "P99 {{inferenceservice}}",
              "refId": "C"
            }
          ]
        },
        {
          "id": 3,
          "title": "预处理 / 预测 / 后处理 各占多少时间",
          "type": "timeseries",
          "description": "慢在哪一段很关键:预处理慢是特征工程的问题,预测慢才是模型或资源的问题。",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (inferenceservice) (rate(request_preprocess_seconds_sum[5m])) / sum by (inferenceservice) (rate(request_preprocess_seconds_count[5m]))",
              "legendFormat": "预处理 {{inferenceservice}}",
              "refId": "A"
            },
            {
              "expr": "sum by (inferenceservice) (rate(request_predict_seconds_sum[5m])) / sum by (inferenceservice) (rate(request_predict_seconds_count[5m]))",
              "legendFormat": "预测 {{inferenceservice}}",
              "refId": "B"
            },
            {
              "expr": "sum by (inferenceservice) (rate(request_postprocess_seconds_sum[5m])) / sum by (inferenceservice) (rate(request_postprocess_seconds_count[5m]))",
              "legendFormat": "后处理 {{inferenceservice}}",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "有没有在抓(scrape 目标数)",
          "type": "timeseries",
          "description": "**这个面板是给'看板全是空的'那一刻用的**:0 说明 PodMonitor 没生效(标签没对上/命名空间没匹配/推理服务没起来),不是没有流量。这个仓库被'看起来配好了'坑过太多次。",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(up{job=~\".*kserve.*\"})",
              "legendFormat": "up 的目标数",
              "refId": "A"
            }
          ]
        }
      ]
    }
