# 在线推理看板(C 线「推理可观测性」)。走 kube-prometheus-stack 的 Grafana
# sidecar 自动发现(带 grafana_dashboard 标签的 ConfigMap)。
#
# **指标名是在集群上 curl 出来的,不是照文档写的**。这里踩了一次:KServe
# 官方文档讲的是它自己的 Python 模型服务器(request_predict_seconds,端口
# 8080),而我们的推理服务是 modelFormat: mlflow,跑起来是 **MLServer**,
# 暴露的是另一套(model_infer_request_*、rest_server_request_duration_seconds_*,
# 端口 8082)。第一版整套写错,curl 一遍才发现。
# 换 runtime 时这份要重新核对。
#
# 抓取那一半见 apps/kserve-inference-monitoring/manifests/podmonitor.yaml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-inference-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-inference.json: |
    {
      "title": "在线推理",
      "uid": "platform-inference",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "title": "推理请求速率",
          "type": "timeseries",
          "description": "MLServer 的 model_infer_request_{success,failure}_total。成功和失败画在一起——只看总量看不出错误率在涨。",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (model) (rate(model_infer_request_success_total[5m]))",
              "legendFormat": "成功 {{model}}",
              "refId": "A"
            },
            {
              "expr": "sum by (model) (rate(model_infer_request_failure_total[5m]))",
              "legendFormat": "失败 {{model}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "title": "推理错误率",
          "type": "timeseries",
          "description": "clamp_min 是为了零流量时不出现 0/0 的 NaN 断线——断线和'错误率 0'在图上看起来很像,但含义完全相反。",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (model) (rate(model_infer_request_failure_total[5m]))\n/ clamp_min(sum by (model) (rate(model_infer_request_success_total[5m]))\n           + sum by (model) (rate(model_infer_request_failure_total[5m])), 0.0001)",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "推理延迟 P50 / P95 / P99",
          "type": "timeseries",
          "description": "只有平均值是不够的:线上真正被投诉的是长尾。",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le, model) (rate(model_infer_request_duration_bucket[5m])))",
              "legendFormat": "P50 {{model}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, model) (rate(model_infer_request_duration_bucket[5m])))",
              "legendFormat": "P95 {{model}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, model) (rate(model_infer_request_duration_bucket[5m])))",
              "legendFormat": "P99 {{model}}",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP 层:按状态码的请求速率",
          "type": "timeseries",
          "description": "model_infer_* 是模型这一层的;这个是 HTTP 这一层的。两层对不上时,差额就是还没进到模型就被拒掉的请求(鉴权、请求体格式)。",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status_code) (rate(rest_server_request_duration_seconds_count{path=~\".*infer.*\"}[5m]))",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "有没有在抓(scrape 目标数)",
          "type": "timeseries",
          "description": "**这个面板是给「看板全是空的」那一刻用的**:0 说明 PodMonitor 没生效(标签没对上 / 命名空间没匹配 / 端口写错 / 推理服务没起来),不是没有流量。第一版就把端口写成了 8080(照 KServe 文档),而实际跑的 MLServer 在 8082。",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(up{job=\"kserve-inference\"} == 1)",
              "legendFormat": "抓到的目标数",
              "refId": "A"
            }
          ]
        }
      ]
    }
