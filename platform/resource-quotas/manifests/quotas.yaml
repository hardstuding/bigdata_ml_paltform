# ResourceQuota,见 docs/decisions/040-enterprise-governance-roadmap.md
# 里"资源隔离"这条需求和 docs/architecture.md"还没定的事"的对应记录。
#
# 这些是**保护性上限**,不是精确的容量分配承诺——local-lite 这台机器
# 总共只有 4 vCPU / 10Gi 内存,下面每个命名空间的配额单独看都在合理
# 范围内,但全部同时打满会远超机器总容量。这是刻意的:这个项目一贯的
# 工作模式是"一次验证一个组件、验证完 park 回去"(见
# environments/cloud-full/pending-definitions/README.md),不是所有
# 组件同时常驻满载。这里要防的是"一个组件本身出问题失控增长,把整台
# 机器拖死"(2026-08-08 真实发生过:同时部署 Kafka/Spark Operator/
# Airflow 把 6GB 内存打满,kernel OOM,连 argocd-application-controller
# 都被连带杀掉),不是要在多个组件之间做精确的资源仲裁。
#
# 只覆盖当前会常驻/被多个使用者共享的命名空间;kafka/seatunnel/
# opensearch 这几个 park 状态下命名空间还不存在,ResourceQuota 是
# namespaced 对象建不出来,等它们被 un-park 时需要补一份同款配额
# (park/unpark 流程见对应组件的 pending-definitions 目录说明)。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: trino
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 3Gi
    limits.memory: 5Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: jupyterhub
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 5Gi
    limits.memory: 6Gi
---
# 2026-09-02 调大(2Gi/3Gi → 4Gi/7Gi)。**这个命名空间的组件构成变了**:
# 原来只有 superset 本体一个 Deployment,现在还有 Celery worker、beat 和
# 一个 Redis(ADR-091,告警与报表要靠它们才真的能跑)。
#
# **这是这个仓库第四次栽在同一个坑上**(前三次记在下面 openmetadata 那段
# 的注释里)。表现每次都一样阴险:Deployment 期望 1 副本、实际 0 个 Pod,
# `kubectl get pods` 里**什么都看不到** —— 不是 Pending、不是 CrashLoop,
# 是压根没建出来。只有 `describe deploy` 的 Conditions 里那句
# `ReplicaFailure / FailedCreate` 和事件里的 `exceeded quota` 能看出来。
#
# **判据**:往一个命名空间加新组件时,把新增的 requests/limits 加进去算一遍,
# 不要等它建不出 Pod 才发现。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: superset
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 5Gi
    # 9Gi 不是常驻用量(常驻约 4.5Gi),留的是**上限之和**的余量:
    # superset 1Gi + worker 3Gi + beat 768Mi + redis 128Mi,再加上
    # superset-init-db 那个 Job(1Gi)和偶尔并存的一次性 pod。
    limits.memory: 9Gi
---
# 2026-08-28 调大一次(6Gi → 9Gi)。这个命名空间不只跑 OpenMetadata 本体,
# 还要跑它派生出来的采集/数据质量 Job(每个 limits.memory 1.5Gi)。常驻部分
# (openmetadata + opensearch)实测已经占到 4864Mi,6Gi 的上限只剩 1280Mi,
# 比一个采集 Job 要的 1536Mi 还少 —— 结果是 CronJob 到点了也建不出 Pod,
# 事件里是 `exceeded quota: compute-quota`。
# **这个坑这个仓库栽第三次了**(前两次:2026-08-19 MLflow 改 resources 被
# quota 卡住、2026-08-23 采集 Job 要 4Gi 被卡住),每次的表现都一样阴险:
# Job 显示 Running 0/1、一个 Pod 都没有,只有 describe 才看得到 FailedCreate。
# 这次留出 9Gi = 常驻 4864Mi + 两个并发 Job 3Gi + 约 1Gi 余量。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: openmetadata
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.memory: 9Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: airflow
spec:
  hard:
    # 2026-08-29 调大(6Gi → 12Gi,requests 4Gi → 8Gi)。
    #
    # **Airflow 的任务并发是被这个配额悄悄卡住的**,而且超了不是排队,是
    # 任务**直接失败**:KubernetesExecutor 每个任务要在 airflow 命名空间起
    # 一个 worker pod,起不出来就
    # `exceeded quota: compute-quota ... Forbidden`,DAG Run 变红。
    # 实测:三条 DAG 同时被解除暂停各跑一次,常驻组件占掉约 4Gi 之后,
    # seatunnel 那条的 worker pod 只要 512Mi 都建不出来。
    #
    # **这个坑这个仓库栽第四次了**(2026-08-19 MLflow 改 resources、
    # 08-23 OpenMetadata 采集 Job 要 4Gi、08-28 OpenMetadata 命名空间、
    # 这次)。表现每次都不完全一样,但根子是同一个:配额是按"当时跑着的
    # 东西"配的,而任何新增的按需 pod 都从同一个池子里扣。
    #
    # 12Gi = 常驻约 4Gi + 同时跑 4~6 个任务 pod 的余量。真要上生产,worker
    # 的规格和这个上限要一起重新算(见 environments/resource-profiles.yaml
    # 的 airflow_worker_pod_*)。
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: spark-operator
spec:
  hard:
    # 2026-08-22:原来的 4Gi/6Gi 只够 spark-history-server +
    # spark-operator-{controller,webhook} 这几个常驻组件(实测占了
    # requests.memory=3826Mi),给 spark-iceberg-demo 的 driver+executor
    # (各请求 1024m -> 换算成 ~1433Mi,算上 overhead)完全没有余量——第
    # 一次真实提交作业时直接被 quota 拒绝(ContainerCreating 后 driver pod
    # 被 "exceeded quota: compute-quota" 拒绝创建)。加够一个 demo 作业的
    # 量,不是给生产规模留的。
    requests.cpu: "3"
    requests.memory: 7Gi
    limits.memory: 10Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: mlflow
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 3Gi
