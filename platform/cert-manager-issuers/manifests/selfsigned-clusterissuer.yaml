# cert-manager 装了很久但一直没真正用起来(见 docs/decisions/016)。第一个
# 真实用途是 Trino:它的 OAuth2 认证硬性要求自己的 HTTPS 监听器打开
# (http-server.https.enabled=true),这不是浏览器可见的证书,只是
# ingress-nginx 到 Trino 之间集群内部的一跳,不需要被 Mac 信任,自签名就够。
#
# local-lite 阶段只需要这一个最简单的 SelfSigned ClusterIssuer,不建 CA 层级
# (CA 层级是为了让多个证书共享同一个根、方便浏览器一次性信任,这里用不上)。
# cloud-full/prod 接真实域名后,应该换成 ACME(Let's Encrypt)或者公司内部 CA
# 的 ClusterIssuer,业务证书(Certificate 资源)不用跟着改,只需要改
# `issuerRef.name`。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-lite-selfsigned
spec:
  selfSigned: {}
