# 平台自己的告警规则(ADR-071)。
#
# **在这份文件之前,这个平台一条自定义告警规则都没有。** Alertmanager 装了、
# 外部通知渠道的配置模板也留好了(platform/alertmanager-notification/),
# 但中间"什么情况该告警"这一层是空的——也就是说那套通知设施从来没有东西
# 可以送。
#
# 选题标准是**"坏了不会有任何人发现"**,不是"重要的组件"。Trino 挂了会有
# 一堆人来问,不需要告警;而下面这几条的共同点是:没有人天天盯着它们,
# 坏了可以安静地坏几周。
#
# `for` 都给得比较长(10~30 分钟),因为这几件事都不是秒级要救的:目的是
# "别让它悄悄坏几周",不是"三分钟内响应"。给短了只会制造噪音,而**被习惯
# 性忽略的告警比没有告警更糟**。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: platform.audit
      rules:
        # 审计链路断了。这条是 ADR-066 里那个取舍的**必要配套**:
        # Trino 的 event listener 配了
        # `terminate-on-initialization-failure=false`(否则 Kafka 挂了
        # Trino 起不来),代价就是审计事件会**静默丢失**。没有这条告警,
        # 那个取舍是不成立的。
        - alert: AuditSinkJobNotRunning
          expr: |
            sum(flink_jobmanager_numRunningJobs{namespace="flink", pod=~"trino-audit-sink-.*"}) < 1
            or absent(flink_jobmanager_numRunningJobs{namespace="flink", pod=~"trino-audit-sink-.*"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Trino 查询审计的 Flink 作业没在跑"
            description: >-
              审计事件还在往 Kafka 里写,但没有人在消费落库。Kafka 保留期一到
              就永久丢失(cloud-full 30 天)。**审计记录补不回来**,越早处理越好。
              查:kubectl -n flink get flinkdeployment trino-audit-sink

        # 上面那条盯的是"作业还在不在"。这条盯的是**指标本身抓不抓得到**。
        # `absent()` 单独成条、不和上面合并:两种情况的处置方向不一样。
        #
        # **2026-08-30 更正注释**:这里原来写着"这条盯的是……作业在跑但消费
        # 停滞……用 Kafka 的消费位点推进速度看" —— 而下面的表达式只是
        # `absent(...)`,压根没看位点。**注释描述的是一个这条规则没做的事**,
        # 比没有注释更糟:读的人会以为停滞这种情况已经被盯住了。
        #
        # "作业在跑但消费停滞"现在由**黄金链路探针的 audit 那条**负责
        # (apps/golden-path-probes/,判据是 `audit.query_events` 里有没有
        # 新行)—— 那才是业务结果判据,比任何 Flink 指标都直接。
        - alert: FlinkMetricsMissing
          expr: absent(flink_jobmanager_numRunningJobs)
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "抓不到任何 Flink 指标"
            description: >-
              可能是 PodMonitor 没选中(端口名 metrics 是否声明),也可能
              Flink 那边的 metrics reporter 没配上。**这条本身不代表作业有
              问题,但它意味着上面那条审计告警是瞎的**——盯不到指标就等于
              没有监控。

    - name: platform.quota
      rules:
        # 队列配额配错的典型表现:作业永远排队,而且**不报错**。
        # ADR-064 里专门警告过这个(local-lite 那一档配额刻意给得很松,
        # 就是为了避免这种情况)。inadmissible 意味着"按当前配额,这个作业
        # 永远不可能被放行",不是"再等等就好了"。
        - alert: KueueWorkloadsInadmissible
          expr: sum by (cluster_queue) (kueue_pending_workloads{status="inadmissible"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "队列 {{ $labels.cluster_queue }} 里有作业永远排不上"
            description: >-
              inadmissible 不是"排队等资源",是"按当前配额永远放行不了"——
              多半是作业要的资源超过了这个组的配额上限(标称 + 可借)。
              查:kubectl get clusterqueue {{ $labels.cluster_queue }} -o yaml

    - name: platform.goldenpath
      rules:
        # 黄金链路(ADR-079)。**这一组和这份文件里其它组的性质不一样**:
        # 其它组盯的是"某个组件坏了",这一组盯的是"**一件真实的事做不成了**"。
        #
        # 判据用 `last_successful_time` 而不是"最近有没有失败的 Job":
        # 探针**卡住不结束**的时候不会产生 Failed Job,但也不会有新的成功
        # ——这两种情况都该告警,而只有前者能被"有失败 Job"抓到。
        - alert: GoldenPathBroken
          expr: |
            (time() - max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob=~"goldenpath-.*"})) > 3600
            or absent(kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob=~"goldenpath-query"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "黄金链路 {{ $labels.cronjob }} 超过 1 小时没有成功过"
            description: >-
              这不是"某个组件不健康",是**一条真实链路做不成事了**。
              goldenpath-query 覆盖 Trino/Iceberg/MinIO/Hive Metastore/OPA,
              goldenpath-streaming 覆盖 Kafka/Flink/Iceberg 的数据新鲜度,
              goldenpath-catalog 覆盖 OpenMetadata 采集。
              查:kubectl -n monitoring logs job/$(kubectl -n monitoring get job
              -l job-name --sort-by=.metadata.creationTimestamp -o name | tail -1)

    - name: platform.backup
      rules:
        # 2026-08-26 实机发现的:一次 postgres 备份因为"云主机刚开机、
        # Postgres 还没起来"失败了(pg_dumpall: Connection refused,重试 5 次
        # 放弃),**而没有任何东西会告诉人**。是我在做别的事时顺手 kubectl
        # 看到的。
        #
        # 备份失败比这份文件里其它几条都更要紧:它是**最后一道防线**,
        # 而且失败之后一切照常——不影响任何人当天的工作,只在真的需要恢复
        # 的那一刻才发现没有可用备份。ADR-072 升级 OpenMetadata 前那次备份
        # 就是唯一的回退路径。
        - alert: BackupJobFailed
          expr: |
            sum by (namespace, job_name) (kube_job_status_failed{namespace="data", job_name=~"postgres-backup-.*"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres 备份任务失败:{{ $labels.job_name }}"
            description: >-
              备份是最后一道防线,失败之后一切照常、只在真要恢复时才发现没有。
              常见原因是云主机刚开机时 Postgres 还没起来。
              查:kubectl -n data logs job/{{ $labels.job_name }}

        # 上面那条盯的是"跑了但失败"。这条盯更隐蔽的:**根本没跑过**
        # ——CronJob 被误删、schedule 写错、集群长时间停机。表现是一切正常,
        # 只是备份越来越旧。
        - alert: BackupTooOld
          expr: |
            (time() - max(kube_cronjob_status_last_schedule_time{namespace="data", cronjob="postgres-backup"})) > 172800
            or absent(kube_cronjob_status_last_schedule_time{namespace="data", cronjob="postgres-backup"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Postgres 备份超过 48 小时没有触发过"
            description: >-
              备份 CronJob 每天 02:00 跑一次,48 小时没触发说明连着漏了两轮
              (或者 CronJob 根本不在了)。**这条在云主机长期停机时也会响,
              那是预期行为**——停机期间确实没有新备份,值得知道。

    - name: platform.newcomponents
      rules:
        # 下面这几个组件都是 2026-08-23 新加的,共同点是**没人会天天看**:
        # 坏了不影响任何人当下的工作,只会在几周后需要它的时候发现是空的。
        - alert: SchemaRegistryDown
          expr: kube_deployment_status_replicas_available{namespace="schema-registry", deployment="karapace"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Schema Registry 不可用"
            description: >-
              新 schema 注册不了,而且**兼容性校验也就不生效了**——这段时间里
              上游可以随便改字段,没有东西拦。

        - alert: CostMetricsMissing
          expr: absent(node_total_hourly_cost)
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "OpenCost 没有在出成本数据"
            description: >-
              成本看板会是空的。这条是 info 不是 warning:少一段成本数据不
              影响任何人干活,但拖久了会让"这个组花了多少"的历史出现空洞。
              先看 opencost 的日志有没有连上 Prometheus。
