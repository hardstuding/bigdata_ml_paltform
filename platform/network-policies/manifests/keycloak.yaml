# 推广 NetworkPolicy 到核心命名空间的第一个(见 docs/decisions/035-
# network-policy.md 的"后果"部分——试点阶段刻意跳过了 Keycloak/data
# (Postgres)/MinIO,这次补上)。Keycloak 是这几个里最简单的一个:查过
# platform/coredns-custom/manifests/configmap.yaml 确认所有 pod 对
# *.local-lite.test 的 DNS 查询都解析到 ingress-nginx-controller 的
# ClusterIP,意味着**所有**走 OIDC discovery 的组件(ArgoCD/Grafana/
# JupyterHub/Argo Workflows/Trino/Superset/OpenMetadata/MLflow/
# permission-request-app 等)都是经 ingress-nginx 连过来的,不是直连
# keycloak 这个 namespace 的 Service——不需要给每个消费组件的 namespace
# 单独开一条规则,只要放行 ingress-nginx 一个来源就够。
#
# iam-sync 这个 CronJob 虽然也在 keycloak namespace 里,靠 `pods/exec` 进
# keycloak-keycloakx-0 同步数据(见 ADR-031)——`kubectl exec` 走的是
# API server → 目标节点的 kubelet → 容器运行时这条路径,不经过 pod 自己的
# 网络接口,不受 NetworkPolicy(只管 pod 间网络流量)影响,不需要额外
# 放行规则。
#
# 端口是容器端口 8080(keycloakx 的 http 端口,`kubectl get pod
# keycloak-keycloakx-0 -o jsonpath='{.spec.containers[0].ports}'` 实测
# 确认——不是 Service 暴露的 80/8443/9000 那几个,这是试点阶段已经踩过、
# 写在 ADR-035 里的教训:NetworkPolicy 匹配容器端口,不是 Service 端口)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-keycloak
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# 目前 keycloak 没有配 ServiceMonitor/PodMonitor(实测确认,
# `kubectl get servicemonitor,podmonitor -A | grep keycloak` 没有结果),
# 这条规则暂时没有真实的抓取目标可验证——和 ADR-035 里
# permission-request-app 那次 allow-monitoring-scrape 的情况一样,提前把
# "以后配了监控也不会被网络策略挡住"这条规则写好,不是发现问题才加。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# **集群内直连 Keycloak 的组件**(不经 ingress-nginx)。
#
# 文件顶部那句"所有走 OIDC discovery 的组件都是经 ingress-nginx 连过来的,
# 只放行 ingress-nginx 一个来源就够" —— **这个判断今天不再成立了**。有几个
# 组件是在**服务端**发 discovery/JWKS 请求的,走的是集群内 Service 地址:
#
#   openbao     OIDC discovery / JWKS(ADR-089)
#   minio       MINIO_IDENTITY_OPENID_CONFIG_URL(ADR-088)
#   jupyterhub  hub 侧的 OIDC 配置
#
# **2026-09-01 一天之内因为这个撞了两次**:scripts/50 报
# `error checking oidc discovery URL`;MinIO 一直 `Waiting for OpenID to be
# initialized` 然后被探针杀掉重启。两次的表象完全不同,根因是同一个 ——
# 都是 default-deny 挡住了服务端到 Keycloak 的直连。
#
# 往这个平台加新的"服务端连 Keycloak"的组件时,记得回来加一行。
#
# **它不像别的组件那样经 ingress-nginx 过来** —— 那条路是给"浏览器发起的
# OIDC 跳转"的,而 discovery 是 OpenBao 自己在服务端发的请求,走的是集群内
# 的 Service 地址(见 apps/components/openbao.yaml 里 configUrl 的说明:
# 刻意不绕公网)。所以顶部那句"只放行 ingress-nginx 就够"对它不成立。
#
# **2026-09-01 实测撞到**:scripts/50 配 oidc 时报
# `error checking oidc discovery URL`,而从 openbao pod 里 wget 那个地址是
# `Connection refused` —— 被 default-deny 挡了。这是这个仓库反复发作的
# "新调用方忘了加白名单",这次发生在**组件之间**,而
# scripts/check-netpol-covers-callers.py 只扫 platform-sdk 的源码,覆盖不到。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-side-oidc
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jupyterhub
      ports:
        - protocol: TCP
          port: 8080

