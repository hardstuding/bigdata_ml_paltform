# 推广 NetworkPolicy 到核心命名空间,见 docs/decisions/035-network-policy.md
# 的"后果"部分和 keycloak.yaml 顶部的说明。这个是这几个里入站来源最杂的
# 一个——共享 Postgres 实例(见 ADR-008),好几个组件各自的
# create-db-job.yaml + 各自的运行时连接都要连进来,不是单一入口。
#
# 消费者列表是查代码库里所有引用 `postgres.data.svc.cluster.local` 的
# manifest 得出的,不是凭印象列的:
#   - data(同一个命名空间,postgres-backup、hive-metastore)
#   - keycloak(keycloak-create-db 这个 Job + keycloakx 运行时连接)
#   - mlflow / openmetadata / superset / airflow(各自的 create-db-job.yaml
#     + 组件本身运行时连接——这几个组件目前大多是 park 状态,不是当前
#     活跃流量,但写策略时按"迟早会被拉起来"覆盖,不是只覆盖此刻在跑的,
#     不然某天拉起 MLflow 会因为一条网络策略连不上库,查半天才发现是这里
#     漏了,这种"过一阵子才会被发现的坑"就是 ADR-035 明确想避免的那类)
#
# 端口是 5432(容器端口和 Service 端口一致,`kubectl get pod postgres-0
# -o jsonpath='{.spec.containers[0].ports}'` 确认过)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-postgres
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmetadata
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: superset
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
      ports:
        - protocol: TCP
          port: 5432
---
# 2026-08-13 补充(CloudNativePG 迁移,见 ADR-038):CNPG 的实例 pod 和
# 老的 StatefulSet 用的是完全不同的一套 label(`cnpg.io/cluster=<name>`,
# 不是 `app: postgres`),上面那条 `allow-consumers-to-postgres` 的
# podSelector 匹配不到它,需要单独一条。而且这条不只是给"消费者"用的
# 5432 端口——CNPG operator(在 cnpg-system 这个 namespace 里)要定期
# 连实例 pod 的 8000 端口(status,容器自己声明的端口名,`kubectl get pod
# ... -o jsonpath='{.spec.containers[0].ports}'` 确认过)上报健康状态,
# 一开始漏了这条,新 Cluster 卡在
# "Instance Status Extraction Error: HTTP communication issue"
# 起不来(实测确认,不是猜的)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-and-operator-to-cnpg
  namespace: data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres-cnpg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmetadata
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: superset
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
      ports:
        - protocol: TCP
          port: 5432
---
# 2026-08-13 补充:un-park Trino 验证部署时实测发现的真实缺口——
# hive-metastore(同样在 data 命名空间)从 ADR-035 推广 NetworkPolicy
# 到现在,一直没有任何 ingress 允许规则,只被 default-deny 挡住了自己
# (Trino 查 `SHOW SCHEMAS FROM iceberg` 报 "Failed connecting to Hive
# metastore",不是超时慢, 是连接被拒,`kubectl get networkpolicy -n data`
# 逐条查证实确认根本没有覆盖到 app=hive-metastore 这个 pod)。消费者
# 列表按代码库里实际引用 `hive-metastore.data.svc.cluster.local:9083`
# 的地方定的(不是凭印象列):trino(Iceberg catalog)、spark-operator
# (apps/spark-iceberg-demo 的 SparkApplication 建在这个命名空间)、
# airflow(seatunnel_device_events 这个 DAG 的 worker pod 建在 airflow
# 命名空间里)。端口 9083(`kubectl get pod ... -o jsonpath=
# '{.spec.containers[0].ports}'` 确认过是 thrift 协议)。
#
# 2026-08-14 补充(ADR-042):feast——feature-server 的 offline_store 是
# Spark,读 iceberg.demo.orders 要连 Hive Metastore;feast_materialize.py
# 这个 Airflow DAG 的 KubernetesPodOperator 也是建在 feast 命名空间(不是
# airflow 命名空间),同样需要这条。和 minio.yaml 那条缺口是同一次实测
# 发现的,一起补。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-hive-metastore
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: hive-metastore
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trino
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spark-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: feast
        # 2026-08-20 新增:train-from-feast-features 这个 WorkflowTemplate
        # (BACKLOG P1.7)第一次真正触发时报 Hive Metastore
        # "Connection refused"——argo-workflows 命名空间之前只被
        # minio.yaml 加过白名单(拿 S3 那次),没人想到它读特征时也要
        # 连 Hive Metastore 拿 Iceberg 表元数据,和 trino/spark-operator/
        # airflow/feast 是同一类需求,这次一并补上。
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
      ports:
        - protocol: TCP
          port: 9083
---
# 这个命名空间里其他资源(比如 postgres-backup 这个 CronJob 起的 pod)
# 不需要被别的东西连进来,不需要单独的 ingress 规则,default-deny 之后
# 保持全拒绝就是对的——它们只是 Postgres 的消费者/维护者,不是被消费方。
#
# 目前没有配 postgres-exporter 之类的东西给 Prometheus 抓(实测确认
# `kubectl get servicemonitor,podmonitor -A | grep postgres` 没有结果),
# 但和 keycloak.yaml/minio.yaml 保持同一个思路:提前把"以后配了监控也
# 不会被网络策略挡住"这条规则写好,不是等发现问题才补。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
