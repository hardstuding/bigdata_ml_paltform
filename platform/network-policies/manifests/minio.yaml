# 推广 NetworkPolicy 到核心命名空间,见 docs/decisions/035-network-policy.md
# 的"后果"部分和 keycloak.yaml 顶部的说明。
#
# 消费者列表是查代码库里所有引用 `minio.minio.svc.cluster.local` 的
# manifest 得出的:
#   - data(hive-metastore、postgres-backup)
#   - spark-operator(spark-history-server 也部署在这个命名空间,还有
#     各个 SparkApplication 的 driver/executor)
#   - mlflow、trino、airflow(SeaTunnel 的 DAG 任务 pod)、seatunnel——
#     这几个目前大多是 park 状态,和 postgres.yaml 一样按"迟早会被拉起来"
#     覆盖,不是只覆盖此刻在跑的。
#   - feast(2026-08-14 新增,ADR-042):feature-server 的 registry 走
#     s3://,离线存储 Spark 也要连 MinIO 的 S3A——部署时漏加这条,实测
#     `EndpointConnectionError` 才发现(这条 NetworkPolicy 是
#     default-deny-ingress 之外唯一放行的口子,新命名空间不在这份列表里
#     就是连不通,不是配置错)。
#   - minio(同命名空间自己)——2026-08-13 推倒重建测试实测踩到的坑:
#     minio 官方 chart 的 buckets(见 apps/definitions/minio.yaml 的
#     `buckets:` 字段)是靠一个 Helm post-install hook Job(`minio-post-job`,
#     也建在 minio 这个命名空间里)调 `mc mb` 建的,这个 Job 连自己
#     命名空间里的 minio pod 都会被 default-deny 挡住(报 "connection
#     refused",不是超时)。之前从来没暴露过是因为这个 Job 是
#     post-install(只在最初第一次装的时候跑,那时候这条 NetworkPolicy
#     还没加),这次是真的从空集群重装才第一次触发。
#
# 端口只放行 9000(API,S3A 客户端连的端口)。9001(console,管理界面)
# 没有开——实测确认 `kubectl get ingress -n minio` 没有资源,这个管理界面
# 现在压根没有任何入口能访问到(没有 Ingress,也没有任何组件的代码引用
# 这个端口),不放行不影响任何现有功能,真要用再加。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-minio
  namespace: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spark-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trino
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seatunnel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: feast
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
