# 推广 NetworkPolicy 到核心命名空间,见 docs/decisions/035-network-policy.md
# 的"后果"部分和 keycloak.yaml 顶部的说明。
#
# 消费者列表是查代码库里所有引用 `minio.minio.svc.cluster.local` 的
# manifest 得出的:
#   - data(hive-metastore、postgres-backup)
#   - spark-operator(spark-history-server 也部署在这个命名空间,还有
#     各个 SparkApplication 的 driver/executor)
#   - mlflow、trino、airflow(SeaTunnel 的 DAG 任务 pod)、seatunnel——
#     这几个目前大多是 park 状态,和 postgres.yaml 一样按"迟早会被拉起来"
#     覆盖,不是只覆盖此刻在跑的。
#   - feast(2026-08-14 新增,ADR-042):feature-server 的 registry 走
#     s3://,离线存储 Spark 也要连 MinIO 的 S3A——部署时漏加这条,实测
#     `EndpointConnectionError` 才发现(这条 NetworkPolicy 是
#     default-deny-ingress 之外唯一放行的口子,新命名空间不在这份列表里
#     就是连不通,不是配置错)。
#   - dbt(2026-08-16 新增,ADR-053):dbt_demo DAG 的 KubernetesPodOperator
#     任务 pod 建在 dbt 这个命名空间,build 完要把 manifest.json/
#     catalog.json 上传到 MinIO——和上面 feast 那条是完全一样的坑,同样是
#     cloud-full 第一次真正端到端跑通 dbt_demo 才实测到
#     `EndpointConnectionError`/`Connection refused` 才发现漏了这条。
#   - argo-workflows(2026-08-19 新增,第一次接入 Argo Workflows 编排训练
#     那次):训练 pod 要把模型 artifact 存进 MinIO,和上面 feast/dbt 是
#     完全一样的坑——同一晚跑第一个训练 workflow 才实测到
#     `EndpointConnectionError` 才发现漏了这条,这条 NetworkPolicy 是
#     "新命名空间要用 MinIO,必须记得同步加这里"这类问题的第四次复现,
#     以后新增任何要连 MinIO 的组件,第一时间就该想到检查这份列表,不用
#     再重新排查一遍。
#   - jupyterhub(2026-08-19 新增,ADR-058 platform_sdk 第一批验证):
#     notebook 里 `mlflow_setup()` 记录实验/上传模型 artifact 会连 MinIO,
#     第五次复现同一类坑——这次吸取教训,提交前直接查过这份列表确认漏了
#     才加,不是等实测报错才发现(虽然同一晚验证 singleuser 自己的出站
#     NetworkPolicy 时确实先踩了一次 ConnectionRefused,但那次是
#     singleuser 出站策略的问题,和这份 MinIO 入站白名单是两个独立的坑)。
#   - platform-sdk-demo(2026-08-19 新增,ADR-058 第三批,验证"环境
#     一致"的 Airflow platform_sdk_demo DAG):这次提交前就主动查过这份
#     列表补上,不是等实测报错才发现——前面 jupyterhub 那条教训直接生效。
#   - minio(同命名空间自己)——2026-08-13 推倒重建测试实测踩到的坑:
#     minio 官方 chart 的 buckets(见 apps/definitions/minio.yaml 的
#     `buckets:` 字段)是靠一个 Helm post-install hook Job(`minio-post-job`,
#     也建在 minio 这个命名空间里)调 `mc mb` 建的,这个 Job 连自己
#     命名空间里的 minio pod 都会被 default-deny 挡住(报 "connection
#     refused",不是超时)。之前从来没暴露过是因为这个 Job 是
#     post-install(只在最初第一次装的时候跑,那时候这条 NetworkPolicy
#     还没加),这次是真的从空集群重装才第一次触发。
#
# 端口只放行 9000(API,S3A 客户端连的端口)。9001(console,管理界面)
# 没有开——实测确认 `kubectl get ingress -n minio` 没有资源,这个管理界面
# 现在压根没有任何入口能访问到(没有 Ingress,也没有任何组件的代码引用
# 这个端口),不放行不影响任何现有功能,真要用再加。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-minio
  namespace: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spark-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trino
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seatunnel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: feast
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dbt
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jupyterhub
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-sdk-demo
        - namespaceSelector:
            matchLabels:
              # kserve-demo(2026-08-28 补)。KServe 的 storage-initializer 要从
              # MinIO 拉模型产物,不放行的话推理服务永远起不来,报
              #   Could not connect to the endpoint URL: "http://minio.minio...:9000/mlflow"
              #
              # **这个遗漏是怎么躲过检查的**:`scripts/check-networkpolicy-consumers.py`
              # 扫的是仓库里的 manifest,而 kserve-demo 这个命名空间是
              # `scripts/11-deploy-demo-inference-service.sh` **运行时 kubectl
              # 建出来的**(它是一次性 demo 资源,不归 ArgoCD 管),所以检查器
              # 看不到它。结果就是:NetworkPolicy 上线(ADR-035)之后这条推理
              # 链路其实已经断了,而没人发现——因为从那以后没人再跑过 scripts/11。
              #
              # 和 08-27 发现"MLflow 注册表空了三天"是同一类:**能力表记的是
              # 某天验证过,而验证过的东西后来被别的改动打断了**。
              kubernetes.io/metadata.name: kserve-demo
        # flink(2026-08-22 新增,docs/decisions/062-flink-streaming-pipeline.md):
        # Flink 流式作业的 JobManager/TaskManager 直连 MinIO(S3A)写
        # Iceberg warehouse——和 spark-operator 是同一类需求,提前加上,
        # 不等实测报错才发现(这个仓库已经因为"等实测才发现"在
        # feast/dbt/argo-workflows/jupyterhub/platform-sdk-demo 上踩过
        # 五次同样的坑,见上面几条注释)。
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink
        - namespaceSelector:
            matchLabels:
              # openmetadata(2026-08-29 补,ADR-082)。dbt 血缘采集任务要从
              # MinIO 读 s3://lakehouse/dbt-artifacts/ 下的
              # manifest.json/catalog.json。不放行的话采集 Job 会跑起来、
              # 然后报 `Failed to list objects in S3 bucket 'lakehouse':
              # Could not connect to the endpoint URL` —— 实测确认过。
              #
              # **又是运行时建的消费关系,静态检查器扫不到**:这条 dbt
              # 管道是 `scripts/43` 调 OpenMetadata API 建出来的,采集 Job
              # 由 OpenMetadata 自己在 openmetadata 命名空间里生成,仓库的
              # manifest 里没有任何一处写着"openmetadata 要读 MinIO"。和
              # kserve-demo 那次(上面那条)是同一个盲区,所以这次一并把
              # openmetadata 登记进 check-networkpolicy-consumers.py 的
              # 手工白名单,让检查器至少知道有这么一个消费者。
              kubernetes.io/metadata.name: openmetadata
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: minio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
