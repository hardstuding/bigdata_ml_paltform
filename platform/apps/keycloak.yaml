# 2026-08-09 教训:一开始用 start-dev 自带的临时 H2,colima/pod 重启一次就把
# platform realm 和所有 OIDC client 全部清空(H2 数据不落盘),ArgoCD/Grafana
# 的登录跟着失效,而且这个丢失是静默的——ArgoCD Application 依然显示 Healthy,
# 因为它管的是 Deployment 起没起来,不知道内容(realm)被吃了。改成接共享
# Postgres(和 hive-metastore/mlflow 等其他组件一样的库,见 apps/postgres/),
# 数据落盘,不再怕重启。DB 由 apps/keycloak-db-init 建,见那边的 create-db-job.yaml。
# 仍然保留 start-dev 参数(只是放开了 hostname 严格校验等开发期便利,不代表用
# 临时数据库,--db 可以单独指定为 postgres),cloud-full/prod 再切到 start
# (生产模式)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.2.2
    helm:
      valuesObject:
        replicas: 1
        command:
          - "/opt/keycloak/bin/kc.sh"
        args:
          - "start-dev"
        extraEnv: |
          - name: KEYCLOAK_ADMIN
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: username
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: password
          - name: KC_HOSTNAME_STRICT
            value: "false"
          - name: KC_PROXY_HEADERS
            value: "xforwarded"
        database:
          vendor: postgres
          hostname: postgres.data.svc.cluster.local
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db
          existingSecretKey: password
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1024Mi
        # local-lite:走真实 Ingress,不再靠 apps/keycloak-local-access 那个专用
        # Service + 端口转发。/auth 前缀是 chart 自己保留的旧路径约定(见
        # docs/operations/troubleshooting.md),不是随手加的。
        ingress:
          enabled: true
          ingressClassName: nginx
          rules:
            - host: keycloak.local-lite.test
              paths:
                - path: /auth/
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
