# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/platform-apps/keycloak.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
# 2026-08-09 教训:一开始用 start-dev 自带的临时 H2,colima/pod 重启一次就把
# platform realm 和所有 OIDC client 全部清空(H2 数据不落盘),ArgoCD/Grafana
# 的登录跟着失效,而且这个丢失是静默的——ArgoCD Application 依然显示 Healthy,
# 因为它管的是 Deployment 起没起来,不知道内容(realm)被吃了。改成接共享
# Postgres(和 hive-metastore/mlflow 等其他组件一样的库,见 apps/postgres/),
# 数据落盘,不再怕重启。DB 由 apps/keycloak-db-init 建,见那边的 create-db-job.yaml。
# 仍然保留 start-dev 参数(只是放开了 hostname 严格校验等开发期便利,不代表用
# 临时数据库,--db 可以单独指定为 postgres),cloud-full/prod 再切到 start
# (生产模式)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.2.2
    helm:
      valuesObject:
        replicas: 1
        command:
          - "/opt/keycloak/bin/kc.sh"
        args:
          - "start-dev"
        extraEnv: |
          - name: KEYCLOAK_ADMIN
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: username
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: password
          # 2026-08-16 cloud-full 真实故障(用户实测:登录跳转到 Keycloak
          # 直接 404):KC_HOSTNAME_STRICT=false 靠 X-Forwarded-* 头推断
          # 自己的外部地址,但 ingress-nginx 在这台机器上是 NodePort
          # (32460/32535),它自己内部监听的还是 80/443,X-Forwarded-Port
          # 反映的是它自己的端口,不知道外面真正访问的是 32460——Keycloak
          # 生成的 discovery 文档/authorization_endpoint 全部丢了端口,
          # 浏览器跳过去必然 404。这不是某一个接 SSO 的组件的问题(一开始
          # 只发现 platform-portal 一个,后来查 scripts/03-configure-
          # keycloak.sh 发现 argocd/grafana/jupyterhub/trino/superset/
          # openmetadata/mlflow/argo-workflows 全部受影响),根源在
          # Keycloak 自己,改成显式声明 hostname(带端口)+ strict=true,
          # 一处修好比逐个组件在 redirect_uri 上打补丁更对。local-lite 上
          # ingress-nginx 靠 colima 直接转发 80/443,不需要端口——这个仓库
          # 目前没有环境 overlay 机制(见 docs/project/roadmap.md P1.3),以后谁在
          # local-lite 上验证登录流程,这两行要临时改回
          # KC_HOSTNAME_STRICT=false 那个版本。
          - name: KC_HOSTNAME
            value: "http://keycloak.local-lite.test:32460/auth"
          - name: KC_HOSTNAME_STRICT
            value: "true"
          # 加了固定 KC_HOSTNAME 之后实测抓到第二个问题:argo-workflows/
          # trino/superset 这几个走"discovery 文档自动发现 token_endpoint"
          # 的组件,服务端在集群内部换 token 时也会拿到这个写死的外部地址
          # (带 :32460),但集群内部 Pod 连不通这个 NodePort(实测
          # HTTP:000,连接不上——NodePort 只在节点对外网卡上监听,ClusterIP
          # 上没有这个端口)。Keycloak 26 的 hostname v2 provider 专门支持
          # 这个场景拆开处理:frontchannel(浏览器要跳转去的 authorization_
          # endpoint)固定用上面配的 KC_HOSTNAME,backchannel(服务端自己发
          # 现/请求的 token_endpoint 等)改成"跟着请求方是怎么连进来的动态
          # 决定"——集群内部服务本来就是用 keycloak.local-lite.test(不带
          # 端口,coredns-custom 解析到 ingress-nginx 的 ClusterIP:80)发起
          # 请求,拿到的 discovery 文档里 backchannel 地址会正确地也不带
          # 端口,回到内部能连通的地址,不需要额外配置区分"谁在问"。
          - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
            value: "true"
          - name: KC_PROXY_HEADERS
            value: "xforwarded"
          # 审计日志(见 docs/decisions/024):jboss-logging 这个事件监听器
          # chart 自带,默认就在,只是日志级别不够 + realm 没开事件开关(那个
          # 开关在 realm 配置里,scripts/03-configure-keycloak.sh 负责开,
          # 这两个环境变量单独控制"开了之后打印成什么级别")。事件本身就是
          # 走 Keycloak 自己的应用日志(Quarkus 发行版默认输出到 stdout),
          # Alloy 已经在采集所有 pod 的 stdout 进 Loki,不需要额外接收端。
          - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL
            value: "info"
          - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL
            value: "warn"
        # 【可插拔基础设施】公司已经有自己的 Postgres 了,不想再多跑一份
        # 我们打包的 Postgres?改这 5 行指向你自己的实例就行,chart 原生就
        # 支持独立配 hostname/port/database/username/existingSecret,不需要
        # 改代码。同时要做两件事:1) 别装
        # apps/definitions/keycloak-db-init.yaml(那个 Job 会尝试
        # CREATE DATABASE,对着别人的生产库这么干大概率没权限,也不合适——
        # 数据库/用户应该由你们自己的 DBA 按平时的流程建);2) 手动建一个
        # `keycloak-db` Secret,key 是 `password`,值是 DBA 给你的密码。
        # 默认(不改这段)是接本仓库自带的 Postgres(见 apps/postgres/),
        # 数据库由 keycloak-db-init 那个 Job 自动建。见 ADR-030。
        database:
          vendor: postgres
          hostname: postgres.data.svc.cluster.local
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db
          existingSecretKey: password
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1024Mi
        # local-lite:走真实 Ingress,不再靠 apps/keycloak-local-access 那个专用
        # Service + 端口转发。/auth 前缀是 chart 自己保留的旧路径约定(见
        # docs/operations/troubleshooting.md),不是随手加的。
        ingress:
          enabled: true
          ingressClassName: nginx
          rules:
            - host: keycloak.local-lite.test
              paths:
                - path: /auth/
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
