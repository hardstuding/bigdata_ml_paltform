# local-lite: 关掉 Alertmanager、缩短 retention、去掉持久化,只求验证指标链路能跑通。
# cloud-full/prod 起需要打开 Alertmanager + 持久化存储,到时候用 environments/
# 里的 values 覆盖,不改这个文件的结构。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0
    helm:
      valuesObject:
        crds:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 6h
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1024Mi
            storageSpec: {}
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: clientSecret
          grafana.ini:
            server:
              # OAuth 回调地址(redirect_uri)是从 root_url 拼出来的,不写死会
              # 默认成 localhost:3000(以前端口转发时代的地址),导致回调地址
              # 和 Keycloak client 里注册的对不上。
              root_url: http://grafana.local-lite.test/
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: "openid profile email"
              # auth_url 是浏览器要跳转去的地址,现在走真实 Ingress(见
              # platform/apps/keycloak.yaml),不再需要额外的端口转发;
              # token_url/api_url 是 Grafana 后端自己在集群内部发起的请求,
              # 走 service 的集群内域名,两者不一样是正常的,不是配置错了。
              auth_url: http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/auth
              token_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/token
              api_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/userinfo
              # 2026-08-11 起改成按 Keycloak group 映射角色(见 ADR-028、
              # platform/iam/),和 ArgoCD RBAC 那条是同一次改的。JMESPath
              # 没有真正的三元表达式,`条件 && '值' || '值'` 是 Grafana 官方
              # 文档推荐的写法。没匹配到任何已知 group 的人落到 Viewer,不是
              # 空权限——和 ArgoCD 故意"零权限报错"的姿态不一样,是因为
              # Grafana 看板本身信息敏感度低,给个只读兜底比强制报错更实用。
              role_attribute_path: "contains(groups, 'platform-team') && 'Admin' || (contains(groups, 'data-analysts') && 'Editor' || (contains(groups, 'algorithm-team') && 'Editor' || 'Viewer'))"
          persistence:
            enabled: false
          # 集中日志(见 platform/apps/loki.yaml),这样 Grafana 里指标
          # (Prometheus)和日志(Loki)能在同一个界面查,不用切换工具。
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.local-lite.test
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
