# local-lite: 缩短 retention、去掉持久化,只求验证指标链路能跑通。
# cloud-full/prod 起需要持久化存储,到时候用 environments/ 里的 values
# 覆盖,不改这个文件的结构。
#
# 2026-08-12 打开了 Alertmanager(ADR-034)——之前关掉是图省资源,但代价是
# "系统坏了要靠人肉巡检才知道",今晚 cert-manager 崩了 8 小时才被发现,
# 撑不住无人值守。chart 自带的 defaultRules(见下面没有改动的部分,
# `defaultRules.create` 是 chart 默认值 true,一直在生效,只是之前没地方
# 路由)已经覆盖了 Pod 崩溃重启、Job 失败等常见场景,打开 Alertmanager 当天
# 就抓到一个真实问题(iam-sync CronJob 的 DeadlineExceeded,见 ADR-031)。
#
# 还没配外部通知渠道(Slack/邮件/PagerDuty)——没有对应的 webhook/凭据,
# 这次只是让告警"可查"(Alertmanager 自己的 UI、Prometheus /alerts 页面),
# 不是"会推送"。真要做到有人告警会收到通知,需要人提供一个接收端(公司
# 内部的 webhook 地址,或者 Slack/邮件配置),这个 Secret 不应该由自动化
# 流程自己造。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0
    helm:
      valuesObject:
        crds:
          enabled: false
        alertmanager:
          enabled: true
          alertmanagerSpec:
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 128Mi}
            storage: {}
          config:
            route:
              receiver: "null"
              routes:
                # Watchdog 是 chart 自带的"心跳"告警,设计上永远 firing,
                # 用来验证告警链路本身没死——单独路由到 null,不是要忽略
                # 告警,是这条本来就不该被当成"有问题"处理。
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
        # k3s 把 controller-manager/scheduler/kube-proxy 内置在同一个二进制
        # 里,不像标准 kubeadm 集群那样有独立的、chart 期望的 metrics
        # 端口可以抓——这三个开着只会产生"Down"假阳性(实测确认过:
        # KubeControllerManagerDown/KubeProxyDown/KubeSchedulerDown 一直在
        # firing,不是真的挂了,是根本抓不到指标)。关掉抓取 + 对应的默认
        # 告警规则组,不是关掉告警能力本身。
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeScheduler: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        prometheus:
          prometheusSpec:
            retention: 6h
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1024Mi
            storageSpec: {}
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: clientSecret
          grafana.ini:
            server:
              # OAuth 回调地址(redirect_uri)是从 root_url 拼出来的,不写死会
              # 默认成 localhost:3000(以前端口转发时代的地址),导致回调地址
              # 和 Keycloak client 里注册的对不上。
              root_url: http://grafana.local-lite.test/
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: "openid profile email"
              # auth_url 是浏览器要跳转去的地址,现在走真实 Ingress(见
              # platform/apps/keycloak.yaml),不再需要额外的端口转发;
              # token_url/api_url 是 Grafana 后端自己在集群内部发起的请求,
              # 走 service 的集群内域名,两者不一样是正常的,不是配置错了。
              auth_url: http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/auth
              token_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/token
              api_url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/protocol/openid-connect/userinfo
              # 2026-08-11 起改成按 Keycloak group 映射角色(见 ADR-028、
              # platform/iam/),和 ArgoCD RBAC 那条是同一次改的。JMESPath
              # 没有真正的三元表达式,`条件 && '值' || '值'` 是 Grafana 官方
              # 文档推荐的写法。没匹配到任何已知 group 的人落到 Viewer,不是
              # 空权限——和 ArgoCD 故意"零权限报错"的姿态不一样,是因为
              # Grafana 看板本身信息敏感度低,给个只读兜底比强制报错更实用。
              role_attribute_path: "contains(groups, 'platform-team') && 'Admin' || (contains(groups, 'data-analysts') && 'Editor' || (contains(groups, 'algorithm-team') && 'Editor' || 'Viewer'))"
          persistence:
            enabled: false
          # 集中日志(见 platform/apps/loki.yaml),这样 Grafana 里指标
          # (Prometheus)和日志(Loki)能在同一个界面查,不用切换工具。
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.local-lite.test
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
