# 平台自定义告警规则(ADR-071)。在这之前这个平台一条自定义规则都没有——
# Alertmanager 和外部通知渠道的配置都留好了,但中间"什么情况该告警"这层
# 是空的,那套通知设施从来没有东西可以送。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-rules
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/prometheus-rules/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
