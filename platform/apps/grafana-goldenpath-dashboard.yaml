# 黄金链路看板(ADR-079)。和 grafana-cost/capacity 同一个模式。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-goldenpath-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/grafana-goldenpath-dashboard/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
