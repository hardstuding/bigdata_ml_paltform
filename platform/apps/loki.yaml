# 集中日志(架构缺口清单里提过的一条:这次调试全程靠一个个 kubectl
# logs/crictl logs 查,没有集中日志聚合)。官方 grafana/loki chart,
# SingleBinary 模式(local-lite 单节点,不需要 SimpleScalable/Distributed
# 那种需要对象存储的模式)。
#
# useTestSchema: true——不是"测试用不能用于真实场景"的意思,是 chart 自己
# 提供的一个开箱即用 schema_config 预设(v13/tsdb),不用手写 schema_config
# 那一大段(官方文档原话:主要用于快速验证,没有独立的存储生命周期管理,但
# 数据本身是真实落盘的,不是内存态)。和 kube-prometheus-stack 里 Prometheus
# 关掉持久化、缩短 retention 是同一个"local-lite 不追求生产级可靠性,先验证
# 链路能跑通"的取舍。
#
# chunksCache/resultsCache(chart 默认各带一个 memcached)关掉——默认值给
# chunks-cache 分配的内存是 8Gi,这台机器的量级完全不需要,开着反而先把内存
# 打爆。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 2026-08-22:chart 从"同步时去 grafana.github.io 拉"改成 vendor 进
    # 这个仓库(platform/loki-chart/,由 scripts/28-vendor-helm-chart.sh 生成)。
    #
    # 原因是实测出来的硬限制:从境内云主机拉 grafana.github.io 的
    # index.yaml(1.4MB+)只有约 12KB/s,而 **helm 自己有一个写死的 120 秒
    # HTTP 超时**(repo-server 日志 time_ms=120030,而 ARGOCD_EXEC_TIMEOUT
    # 明明配的是 180s)——**这个问题没法靠调大 ArgoCD 的超时解决**,helm
    # 会先自己放弃。后果不只是"状态显示 Unknown":在一个全新集群上,这个
    # Application 根本装不起来,一键部署直接断在这里。
    #
    # kube-prometheus-stack 靠换官方 OCI 仓库绕过去了(OCI 不需要 index),
    # 但 Grafana 目前没发 OCI(ghcr.io 下三个候选路径实测全是
    # 403/not found),只剩 vendor 这条路。见 ADR-061。
    #
    # 升级 chart 版本:改 scripts/28-vendor-helm-chart.sh 的调用参数重跑,
    # 不是改这里的 targetRevision——targetRevision 现在指的是这个 git 仓库
    # 的分支,不是 chart 版本。chart 版本记在 platform/loki-chart/VENDORED.md。
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/loki-chart
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          useTestSchema: true
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        test:
          enabled: false
        lokiCanary:
          enabled: false
        minio:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
