# 平台总览看板(E 线第一版)。和其它三个看板同一个模式。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-overview-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/grafana-overview-dashboard/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
