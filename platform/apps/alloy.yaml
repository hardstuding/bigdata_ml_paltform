# 采日志送到 Loki 的 agent。用官方 Grafana Alloy,不用 Promtail——Promtail 已经
# EOL(2026-03-02 停止维护,官方明确建议迁移到 Alloy),这时候再新装一个
# Promtail 等于一上线就是要迁移的技术债,没有理由不直接用 Alloy。
#
# 2026-08-09 实测:官方更推荐的 loki.source.kubernetes(通过 K8s API 的
# containerLogs 接口拉日志,不需要 hostPath)在这台机器上完全拉不到数据——
# 报同一个这次调试全程反复出现的 "Internal Privoxy Error"(API server 转发
# 到 kubelet 的路径上被本机代理拦截,和 kubectl logs/exec 是同一个坑,见
# troubleshooting.md)。这不是 Alloy 或者配置的问题,是这台机器的网络环境。
# 改用传统的 hostPath 挂载 /var/log/pods 直接读日志文件(discovery.kubernetes
# 只用来拿 pod 元数据做 relabel,不通过它的日志接口),完全绕开 API
# server->kubelet 这条路径,不受本机代理影响。cloud-full/IDC 网络环境正常的话
# 两种方式都能用,但既然这种方式更不依赖网络环境、更贴近生产常见做法,直接
# 保留这个,不用等以后再切回去。
#
# mounts.dockercontainers 也要开:/var/log/pods/.../0.log 实际是个符号链接,
# 指向 /var/lib/docker/containers/<容器id>/<容器id>-json.log(colima 这个
# profile 的容器运行时是 docker,不是纯 containerd,日志走的是 docker 的
# json-file 日志驱动)。只挂 /var/log 的话这个符号链接在容器里指向一个不存在
# 的路径,读不到任何内容,报 "no such file or directory" 但看起来文件明明在。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 2026-08-22:chart 从"同步时去 grafana.github.io 拉"改成 vendor 进
    # 这个仓库(platform/alloy-chart/,由 scripts/28-vendor-helm-chart.sh 生成)。
    #
    # 原因是实测出来的硬限制:从境内云主机拉 grafana.github.io 的
    # index.yaml(1.4MB+)只有约 12KB/s,而 **helm 自己有一个写死的 120 秒
    # HTTP 超时**(repo-server 日志 time_ms=120030,而 ARGOCD_EXEC_TIMEOUT
    # 明明配的是 180s)——**这个问题没法靠调大 ArgoCD 的超时解决**,helm
    # 会先自己放弃。后果不只是"状态显示 Unknown":在一个全新集群上,这个
    # Application 根本装不起来,一键部署直接断在这里。
    #
    # kube-prometheus-stack 靠换官方 OCI 仓库绕过去了(OCI 不需要 index),
    # 但 Grafana 目前没发 OCI(ghcr.io 下三个候选路径实测全是
    # 403/not found),只剩 vendor 这条路。见 ADR-061。
    #
    # 升级 chart 版本:改 scripts/28-vendor-helm-chart.sh 的调用参数重跑,
    # 不是改这里的 targetRevision——targetRevision 现在指的是这个 git 仓库
    # 的分支,不是 chart 版本。chart 版本记在 platform/alloy-chart/VENDORED.md。
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/alloy-chart
    helm:
      valuesObject:
        alloy:
          mounts:
            varlog: true
            dockercontainers: true
          configMap:
            content: |
              discovery.kubernetes "pod" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pod.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action = "replace"
                  target_label = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  action = "replace"
                  target_label = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "job"
                  separator = "/"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "__path__"
                  separator = "/"
                  replacement = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
