apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      valuesObject:
        controller:
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          # 2026-08-16 云端要开公网访问才发现:裸机没有云 LoadBalancer,
          # Service type: LoadBalancer 实际走的是 kube-proxy 的 NodePort
          # 机制(随机高位端口,这次是 32460/32535)。想让公网走标准
          # 80/443 端口,手动加 iptables REDIRECT 规则把流量转到这两个
          # NodePort 试过,会和 k3s 自己的 KUBE-SERVICES 链在 nat 表
          # PREROUTING 里的处理顺序打架(REDIRECT 是 terminating target,
          # 排在 KUBE-SERVICES 前面的话,原本该由 KUBE-SERVICES 做的
          # NodePort→真实 pod IP 转换根本不会执行,后面这个"端口"其实
          # 没有真正监听;排在后面又变成对已经被 REDIRECT 消费掉的包
          # 不起作用)——裸机场景更标准的做法是让 controller 直接绑定
          # 宿主机网络(hostNetwork),完全绕开 kube-proxy/NodePort 这层,
          # 容器的 80/443 就是宿主机真实的 80/443,不需要任何额外转发。
          # 这台机器全程只有 1 个节点、1 个 replica,不会有端口冲突。
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          service:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # chart 自己的 admission-create/-patch 这两个 hook Job 会在集群里对
  # ValidatingWebhookConfiguration 做一次性的 `kubectl patch` 注入
  # caBundle(chart 渲染出的 desired manifest 里这个字段本来就是空的,
  # 靠这个命令式 patch 补上,不是 Helm values 能声明的)。不 ignore 的话
  # selfHeal 会把这个字段改回空,导致 Ingress 的 admission webhook 证书
  # 校验失败(2026-08-16 云端部署时实测复现过,superset 等组件的 sync
  # 因此卡在 "certificate signed by unknown authority"),和 Trino
  # liveness probe(见 apps/definitions/trino.yaml)是同一类"命令式补丁 +
  # ignoreDifferences"模式。
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: ingress-nginx-admission
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
