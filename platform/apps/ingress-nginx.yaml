apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      valuesObject:
        controller:
          replicaCount: 1
          # 2026-08-16 真实故障:登录 SSO 之后跳回来 502,ingress-nginx
          # 日志报 "upstream sent too big header while reading response
          # header from upstream"——oauth2-proxy 在 /oauth2/callback 这一步
          # 种下的 Set-Cookie(带完整 JWT access/id/refresh token)超过了
          # nginx 默认的响应头缓冲区大小。调大是这类 OIDC 反向代理场景的
          # 标准做法,不是这个项目独有的问题,全局设置一次,不用给每个
          # 接了 oauth2-proxy 的 Ingress 单独加 annotation。
          config:
            proxy-buffer-size: "16k"
            proxy-buffers-number: "4"
            # **nginx 默认 worker_processes=auto,也就是 CPU 核数。** 这台
            # 节点 16 核 → 16 个 worker 进程,每个都带自己的连接池和缓冲区。
            # 这个平台的流量是"十几个人偶尔点几下页面",4 个 worker 绰绰
            # 有余,而 16 个的内存占用是实打实的。
            #
            # 这和同一天在 Superset 的 celery worker 上撞到的是**同一个
            # 模式**:组件默认按 CPU 核数起并发,而这台机器核多、负载轻,
            # 默认值反而成了内存压力的来源。
            worker-processes: "4"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # 2026-09-03:256Mi → 512Mi。**在 256Mi 上被 OOMKilled 了
              # 40 次**,而且后果不是"偶尔慢一下" —— controller 被杀之后
              # readiness 探针失败,**整个平台的外部访问全断**(所有域名
              # 都连不上,包括 SSH 之外的一切)。发现时它已经在
              # `Running 0/1` 的状态下转了几个小时,CPU 1960m 全耗在 GC 上。
              #
              # 这是集群级组件,和另一个项目共享同一个 k3s —— 它 OOM 的
              # 时候两边一起断。调大上限对两边都只有好处。
              memory: 512Mi
          # 2026-08-16 云端要开公网访问时试过 hostNetwork(绑定宿主机
          # 80/443,绕开 kube-proxy NodePort 这层)——**行不通,已回退**:
          # 这台节点是和 Codex 的 bigdata_ai_platform_v2 共享的同一个
          # k3s 集群(见 docs/project/current-work.md 的相关记录),Codex 那边的
          # traefik 已经用 k3s 自带的 svclb 机制常驻占了宿主机 80/443,
          # 两边没法同时 hostNetwork 抢同一对端口。裸机+单节点没有云
          # LoadBalancer,`service: type: LoadBalancer` 实际走的是
          # kube-proxy NodePort(随机高位端口,目前是 32460/32535)——
          # 公网想用标准 80/443,得等真实域名+TLS 项目落地(那时候会有
          # 独立的公网入口方案,不需要这台节点自己抢 80/443),现阶段
          # 公网访问只能用这两个 NodePort 高位端口。
          #
          # 2026-08-16 抢占式实例迁移后真实踩到:不固定 nodePorts 的话,
          # Service 每次重建(比如这次镜像克隆+新实例)k8s 都会重新随机
          # 分配高位端口——这次导致端口从 32460/32535 变成了 31265/32644,
          # 而阿里云安全组规则是按具体端口号开的,新端口没开,造成公网
          # access 直接断掉且没有任何明显报错(NodePort 本身在集群内没问题,
          # 只是外部连不进来),差点被当成"没问题"而漏掉。固定成显式值,
          # 端口号就不会再因为 Service 重建而漂移,安全组规则也能对应固定
          # 下来,不用每次迁移后重新对齐。
          service:
            type: LoadBalancer
            nodePorts:
              http: 32460
              https: 32535
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # chart 自己的 admission-create/-patch 这两个 hook Job 会在集群里对
  # ValidatingWebhookConfiguration 做一次性的 `kubectl patch` 注入
  # caBundle(chart 渲染出的 desired manifest 里这个字段本来就是空的,
  # 靠这个命令式 patch 补上,不是 Helm values 能声明的)。不 ignore 的话
  # selfHeal 会把这个字段改回空,导致 Ingress 的 admission webhook 证书
  # 校验失败(2026-08-16 云端部署时实测复现过,superset 等组件的 sync
  # 因此卡在 "certificate signed by unknown authority"),和 Trino
  # liveness probe(见 apps/definitions/trino.yaml)是同一类"命令式补丁 +
  # ignoreDifferences"模式。
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: ingress-nginx-admission
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
