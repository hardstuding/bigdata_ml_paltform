# Grafana 自动发现机制:kube-prometheus-stack 的 sidecar 会扫描全部命名空间
# 里带 grafana_dashboard: "1" 这个 label 的 ConfigMap,自动加载成看板,不用
# 手动在 Grafana UI 里导入。见 ADR-024。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-audit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-audit.json: |
    {
      "title": "平台审计日志",
      "uid": "platform-audit",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Keycloak 登录失败次数",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"keycloak\"} |= \"LOGIN_ERROR\" [$__interval]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Trino 查询数量",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"trino\"} |= \"QueryMonitor\" [$__interval]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Keycloak 登录/管理员事件(原始日志)",
          "type": "logs",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "{namespace=\"keycloak\"} |= \"org.keycloak.events\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Trino 查询时间线(原始日志)",
          "type": "logs",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "expr": "{namespace=\"trino\"} |= \"QueryMonitor\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
