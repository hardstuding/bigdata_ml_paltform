# k3s 自带的 CoreDNS Corefile 里已经有 `import /etc/coredns/custom/*.server`
# 和 `import /etc/coredns/custom/*.override`(kube-system/coredns ConfigMap,
# 不用我们管),这是 k3s 官方留的自定义 DNS 入口,不用改动 CoreDNS 主配置。
#
# 背景:*.local-lite.test 这些域名只在 Mac 的 /etc/hosts 里配了,集群内部的
# pod 完全不认识,任何需要主动发起 OIDC discovery(fetch
# /.well-known/openid-configuration)的组件(目前是 ArgoCD、接下来是
# Trino/Superset/OpenMetadata/MLflow)都会 UnknownHostException。一开始给
# ArgoCD 用的是 chart 自己的 `global.hostAliases`(见
# platform/bootstrap/argocd-values.yaml),但不是所有 chart 都支持
# hostAliases(Trino 官方 chart 就不支持,实测确认过),per-pod hostAliases
# 这条路走不通。改成在集群 DNS 层面一次性解决,所有 pod 都能解析,不用每个
# chart 单独想办法。
#
# 全部指向 ingress-nginx-controller 这个 Service——和浏览器走同一个 Ingress
# 入口,只是浏览器经 127.0.0.1,pod 内部经集群网络到达同一个 Service。
# cloud-full/prod 用真实 DNS 后,这个 ConfigMap 整个删掉。
#
# 2026-08-13 推倒重建测试实测踩到的真实坑:这里原来是硬编码
# ingress-nginx-controller 的 ClusterIP 字面量(`10.43.102.204`)——
# ClusterIP 是集群创建时按 Service CIDR 分配的,不是固定不变的值,重建
# 集群之后 ingress-nginx-controller 分到了一个新的 ClusterIP
# (`10.43.157.123`),这份写死旧 IP 的 ConfigMap 完全没跟着变,导致
# ArgoCD/Trino/Superset/OpenMetadata/MLflow/Argo Workflows 这些做 OIDC
# discovery 的组件全部连超时(`curl` 直接确认过:DNS 解析"成功"但解出来
# 的 IP 是废的,TCP connect 5 秒超时)——是那种平时改动配置根本不会触发、
# 只有整个集群重建才会暴露的坑。
#
# 改用 `rewrite name ... answer auto` + `kubernetes` 插件:把
# *.local-lite.test 的查询在内部重写成
# ingress-nginx-controller.ingress-nginx.svc.cluster.local 这个稳定的
# k8s Service DNS 名字,交给 kubernetes 插件按当前实际的 ClusterIP 解析,
# `answer auto` 让返回给客户端的记录名字自动换回原本查询的域名——服务
# 的 ClusterIP 不管怎么变、集群重建几次,这里都不用跟着改。
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # 用 *.server(不是 *.override!)：k3s 默认 Corefile 的主 `.:53` 块里已经有
  # 一个 `hosts /etc/coredns/NodeHosts {...}`,CoreDNS 不允许同一个 server
  # block 里出现两个 hosts 插件实例(实测报错 "this plugin can only be used
  # once per Server Block")。`*.server` 文件是在主 block **外面**导入的,
  # 相当于新开一个专门服务 local-lite.test 这个 zone 的独立 server block,
  # 不会跟主 block 的 hosts 插件冲突,CoreDNS 按最长后缀匹配自动把
  # *.local-lite.test 的查询路由到这个 block。
  local-lite.server: |
    local-lite.test:53 {
      rewrite name regex (.*)\.local-lite\.test\.$ ingress-nginx-controller.ingress-nginx.svc.cluster.local answer auto
      kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
      }
    }
