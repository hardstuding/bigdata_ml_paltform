# 规格分档:同一份组件定义,三个环境给不同的资源规格。
#
# **为什么需要这个**:`docs/BACKLOG.md` 1.1 把"组件选择"和"规格分档"拆成
# 两半,前半在 2026-08-20 做完了(enabled_components),后半一直没做。后果是
# 所有组件的 resources/副本数写死的是 local-lite 那套小规格(Trino
# coordinator 300m CPU、server.workers: 0),**照搬到生产硬件上等于用一台
# 笔记本的配置跑生产**——这是"改配置就能上生产"这条核心承诺最大的窟窿。
#
# **为什么三个环境并排写在同一个文件里**,而不是各自散在
# environments/<env>/config.yaml:并排能一眼看出差异(prod 的 Trino 到底比
# local-lite 大多少),也不容易出现"加了新键但漏配某个环境"——渲染时缺键
# 直接报错,不给默认值兜底(和这个项目其它地方"不用默认值悄悄兜底"的
# 一贯做法一致)。
#
# **用法**:组件文件里写 `{{RES:trino_coordinator_cpu}}`,渲染时按当前
# 环境取值。新增一个可调项 = 这里加一行(三个环境都要给值)+ 组件文件里
# 用占位符。
#
# **覆盖范围**:helm 类组件(资源写在 `apps/components/<x>.yaml` 的
# `helm.valuesObject` 里)和裸 manifest 类组件都能覆盖。裸 manifest 的做法是
# 把源文件挪进 `templates/`,渲染产物仍然落在 ArgoCD 原本读的路径上,
# **Application 的 `path:` 不用改**(见 templates/apps-postgres-manifests/,
# 那是 Postgres HA 副本数的样本)。目前只铺了 Trino 和 Postgres 两个样本,
# 其余组件按需补占位符,是机械工作。详见 ADR-059。

local-lite:
  # 本机 colima,6G/4vCPU,能跑起来就行
  trino_coordinator_cpu: "300m"
  trino_coordinator_memory_request: "1Gi"
  trino_coordinator_memory_limit: "2Gi"
  trino_jvm_max_heap: "1536m"
  trino_query_max_memory: "1GB"
  trino_query_max_memory_per_node: "1GB"
  # 0 = coordinator 兼职干 worker 的活,单机不值得再起独立 worker
  trino_workers: "0"
  # 单节点机器,多副本没有意义(ADR-038 记录过这个结论)
  # Kafka 单节点 KRaft:副本数 1 时三个 replication factor 只能是 1,
  # 否则 topic 建不出来(可用 broker 不够)。
  # Keycloak 会话超时(秒)。开发联调放宽:8h 空闲 / 24h 最长,理由见
  # templates/scripts/03-configure-keycloak.sh 里那段注释。
  keycloak_sso_session_idle_timeout: "28800"
  keycloak_sso_session_max_lifespan: "86400"
  kafka_replicas: "1"
  kafka_replication_factor: "1"
  kafka_min_insync_replicas: "1"
  kafka_storage_size: "5Gi"
  postgres_instances: "1"

  # --- 下面这批(Superset/Airflow/MLflow/OpenSearch/MinIO)是
  # apps/components/*.yaml 里原来写死的数字原样照抄,local-lite/cloud-full
  # 两档的值必须和改造前逐字节一致(单节点机器,没有理由现在就不一样)。

  superset_node_replicas: 1
  superset_node_cpu: "200m"
  superset_node_memory_request: "512Mi"
  superset_node_memory_limit: "1024Mi"
  # 没有 Redis/Celery broker,worker 起来也没用,见 superset.yaml 里的注释
  superset_worker_replicas: 0

  airflow_apiserver_replicas: 1
  airflow_apiserver_cpu: "150m"
  airflow_apiserver_memory_request: "512Mi"
  airflow_apiserver_memory_limit: "1024Mi"
  airflow_scheduler_replicas: 1
  airflow_scheduler_cpu: "150m"
  airflow_scheduler_memory_request: "512Mi"
  airflow_scheduler_memory_limit: "1024Mi"
  airflow_dagprocessor_replicas: 1
  airflow_dagprocessor_cpu: "100m"
  airflow_dagprocessor_memory_request: "512Mi"
  airflow_dagprocessor_memory_limit: "1024Mi"
  airflow_triggerer_replicas: 1
  airflow_triggerer_cpu: "100m"
  airflow_triggerer_memory_request: "256Mi"
  airflow_triggerer_memory_limit: "512Mi"
  # KubernetesExecutor 每个任务起的 pod 模板,不是常驻副本
  airflow_worker_pod_cpu: "50m"
  airflow_worker_pod_memory_request: "256Mi"
  airflow_worker_pod_memory_limit: "512Mi"

  mlflow_cpu: "200m"
  mlflow_memory_request: "1024Mi"
  mlflow_memory_limit: "2560Mi"

  opensearch_single_node: "true"
  opensearch_replicas: 1
  opensearch_cpu: "300m"
  opensearch_memory_request: "768Mi"
  opensearch_memory_limit: "1280Mi"
  opensearch_storage_size: "5Gi"

  minio_replicas: 1
  minio_storage_size: "8Gi"
  minio_cpu: "100m"
  minio_memory_request: "256Mi"
  minio_memory_limit: "512Mi"

  # 2026-08-22 新增(docs/decisions/062-flink-streaming-pipeline.md):
  # Kafka 流式接入的 demo 生产者 + Flink Kubernetes Operator + Flink
  # 流式作业本身。本机 colima 单节点,给能跑起来就行的最小值——和 Trino/
  # Kafka 那批一样不追求性能,只追求"能装下、能跑通"。
  kafka_producer_cpu: "50m"
  kafka_producer_memory_request: "64Mi"
  kafka_producer_memory_limit: "128Mi"

  # Operator 本身很轻(和 kafka-operator 同一个量级),常驻但空闲时几乎不
  # 吃资源。
  flink_operator_cpu: "100m"
  flink_operator_memory_request: "256Mi"
  flink_operator_memory_limit: "512Mi"

  # JobManager/TaskManager 的 resource 字段是 FlinkDeployment CRD 自己的
  # schema(cpu 是纯数字,memory 是 Flink MemorySize 字符串),不是 K8s
  # 原生 resources 块的格式,见 flinkdeployment.yaml 里的注释。
  # **这四个值不能按"够小就行"随便给**——2026-08-22 在 cloud-full 上真实
  # 撞到:taskmanager 给 768m,Flink 直接拒绝启动,报
  # `IllegalConfigurationException: Sum of configured Framework Heap
  # Memory (128mb), Framework Off-Heap (128mb), Managed (128mb) and
  # Network (64mb) exceed configured Total Flink Memory (320mb)`。
  #
  # 原因:Flink 的 memory 是**进程总内存**,要先扣掉 JVM overhead(10%,
  # 下限 192m)和 metaspace(默认 256m),剩下的才是 "Total Flink Memory",
  # 而框架自己就要占掉 128+128+128+64 = 448m。768m 扣完只剩 320m,不够。
  # 实际下限大约是 900m 出头,给 1792m 留出真正跑任务的 task heap。
  flink_jobmanager_cpu: 0.3
  flink_jobmanager_memory: "1024m"
  flink_taskmanager_cpu: 0.3
  flink_taskmanager_memory: "1792m"
  # 单节点机器,并行度 1 就够,提高了也排不上更多 slot。
  flink_job_parallelism: 1
  # --- Kueue 队列配额(ADR-064)---
  # **local-lite 这一档刻意给得很松,是有意的**:Kueue 只按配额决定放不放行,
  # 它不知道机器上还剩多少 CPU;配额给小了,作业会卡在 Kueue 这一关永远
  # 不被 admit,而不是像现在这样至少能被调度器试着排一下。单机开发环境
  # 需要的是"Kueue 装着但基本不挡路",不是按生产比例做仲裁。
  kueue_controller_cpu: "50m"
  kueue_controller_memory_request: "128Mi"
  kueue_controller_memory_limit: "512Mi"
  kueue_platform_team_cpu: "4"
  kueue_platform_team_memory: "8Gi"
  kueue_platform_team_borrow_cpu: "4"
  kueue_platform_team_borrow_memory: "8Gi"
  kueue_data_analysts_cpu: "4"
  kueue_data_analysts_memory: "8Gi"
  kueue_data_analysts_borrow_cpu: "4"
  kueue_data_analysts_borrow_memory: "8Gi"
  kueue_algorithm_team_cpu: "4"
  kueue_algorithm_team_memory: "8Gi"
  kueue_algorithm_team_borrow_cpu: "4"
  kueue_algorithm_team_borrow_memory: "8Gi"
  # 审计 topic(ADR-066)。本机磁盘小,保留 3 天够开发验证用。
  audit_topic_partitions: "1"
  audit_topic_retention_ms: "259200000"
  # Karapace(ADR-068)。local-lite 连 Kafka 都没启用,这几个值只是占位。
  karapace_replicas: "1"
  karapace_cpu: "50m"
  karapace_memory_request: "256Mi"
  karapace_memory_limit: "512Mi"
  # OpenCost(ADR-069)。**单价填 0**:本机开发环境没有真实成本,填一个
  # 假的单价只会让本地看到的数字和云上完全对不上,反而误导。local-lite
  # 也没启用 opencost,这几个值只是为了让渲染不缺键。
  cost_cpu_hourly: "0"
  cost_ram_gb_hourly: "0"
  cost_storage_gb_hourly: "0"
  opencost_cpu: "50m"
  opencost_memory_request: "128Mi"
  opencost_memory_limit: "256Mi"





cloud-full:
  # 阿里云 ECS 16 vCPU / 64 GiB,当前实际在跑的就是这一档
  trino_coordinator_cpu: "300m"
  trino_coordinator_memory_request: "1Gi"
  trino_coordinator_memory_limit: "2Gi"
  trino_jvm_max_heap: "1536m"
  trino_query_max_memory: "1GB"
  trino_query_max_memory_per_node: "1GB"
  trino_workers: "0"
  # 也是单节点 ECS,同上
  # 同上,单节点 ECS。
  # 同 local-lite:这仍然是给人调试用的环境,不是生产。
  keycloak_sso_session_idle_timeout: "28800"
  keycloak_sso_session_max_lifespan: "86400"
  kafka_replicas: "1"
  kafka_replication_factor: "1"
  kafka_min_insync_replicas: "1"
  kafka_storage_size: "5Gi"
  postgres_instances: "1"

  # 和 local-lite 完全一样的数字——渲染 cloud-full 之后 apps/definitions/
  # 必须和改造前逐字节一致,这是这次改动"零行为变化"的验收标准。

  superset_node_replicas: 1
  superset_node_cpu: "200m"
  superset_node_memory_request: "512Mi"
  superset_node_memory_limit: "1024Mi"
  superset_worker_replicas: 0

  airflow_apiserver_replicas: 1
  airflow_apiserver_cpu: "150m"
  airflow_apiserver_memory_request: "512Mi"
  airflow_apiserver_memory_limit: "1024Mi"
  airflow_scheduler_replicas: 1
  airflow_scheduler_cpu: "150m"
  airflow_scheduler_memory_request: "512Mi"
  airflow_scheduler_memory_limit: "1024Mi"
  airflow_dagprocessor_replicas: 1
  airflow_dagprocessor_cpu: "100m"
  airflow_dagprocessor_memory_request: "512Mi"
  airflow_dagprocessor_memory_limit: "1024Mi"
  airflow_triggerer_replicas: 1
  airflow_triggerer_cpu: "100m"
  airflow_triggerer_memory_request: "256Mi"
  airflow_triggerer_memory_limit: "512Mi"
  airflow_worker_pod_cpu: "50m"
  airflow_worker_pod_memory_request: "256Mi"
  airflow_worker_pod_memory_limit: "512Mi"

  mlflow_cpu: "200m"
  mlflow_memory_request: "1024Mi"
  mlflow_memory_limit: "2560Mi"

  opensearch_single_node: "true"
  opensearch_replicas: 1
  opensearch_cpu: "300m"
  opensearch_memory_request: "768Mi"
  opensearch_memory_limit: "1280Mi"
  opensearch_storage_size: "5Gi"

  minio_replicas: 1
  minio_storage_size: "8Gi"
  minio_cpu: "100m"
  minio_memory_request: "256Mi"
  minio_memory_limit: "512Mi"

  # 和 local-lite 完全一样——同为单节点机器,同样的道理(见上面 Trino/
  # Kafka 那批注释),这次新增的 Flink/Kafka 生产者也不例外。
  kafka_producer_cpu: "50m"
  kafka_producer_memory_request: "64Mi"
  kafka_producer_memory_limit: "128Mi"

  flink_operator_cpu: "100m"
  flink_operator_memory_request: "256Mi"
  flink_operator_memory_limit: "512Mi"

  # **这四个值不能按"够小就行"随便给**——2026-08-22 在 cloud-full 上真实
  # 撞到:taskmanager 给 768m,Flink 直接拒绝启动,报
  # `IllegalConfigurationException: Sum of configured Framework Heap
  # Memory (128mb), Framework Off-Heap (128mb), Managed (128mb) and
  # Network (64mb) exceed configured Total Flink Memory (320mb)`。
  #
  # 原因:Flink 的 memory 是**进程总内存**,要先扣掉 JVM overhead(10%,
  # 下限 192m)和 metaspace(默认 256m),剩下的才是 "Total Flink Memory",
  # 而框架自己就要占掉 128+128+128+64 = 448m。768m 扣完只剩 320m,不够。
  # 实际下限大约是 900m 出头,给 1792m 留出真正跑任务的 task heap。
  flink_jobmanager_cpu: 0.3
  flink_jobmanager_memory: "1024m"
  flink_taskmanager_cpu: 0.3
  flink_taskmanager_memory: "1792m"
  flink_job_parallelism: 1
  # --- Kueue 队列配额(ADR-064)---
  # 单节点 16 vCPU / 64GiB(见 environments/cloud-full/STATUS.md)。常驻服务
  # 已经占掉一大半,下面这些是留给**批作业**的份额,三个组标称合计
  # 8 CPU / 16Gi。算法组给最多——训练任务是这台机器上最重的负载。
  # borrowingLimit 等于自己的标称值,意思是"最多再借一份自己那么多",
  # 不至于一个组把整个 cohort 吃光。
  kueue_controller_cpu: "100m"
  kueue_controller_memory_request: "256Mi"
  kueue_controller_memory_limit: "512Mi"
  kueue_platform_team_cpu: "2"
  kueue_platform_team_memory: "4Gi"
  kueue_platform_team_borrow_cpu: "2"
  kueue_platform_team_borrow_memory: "4Gi"
  kueue_data_analysts_cpu: "2"
  kueue_data_analysts_memory: "4Gi"
  kueue_data_analysts_borrow_cpu: "2"
  kueue_data_analysts_borrow_memory: "4Gi"
  kueue_algorithm_team_cpu: "4"
  kueue_algorithm_team_memory: "8Gi"
  kueue_algorithm_team_borrow_cpu: "4"
  kueue_algorithm_team_borrow_memory: "8Gi"
  # 审计 topic(ADR-066)。30 天——审计记录"事后才知道需要它",
  # 保留期短了等需要时已经滚掉,而且补不回来。
  audit_topic_partitions: "3"
  audit_topic_retention_ms: "2592000000"
  # Karapace(ADR-068)。单副本够用:它是无状态的,状态全在 Kafka 的
  # _schemas topic 里,挂了重启几秒就恢复,而且**它不在查询链路上**——
  # registry 短暂不可用只影响新 schema 注册,不影响已有作业读写数据。
  karapace_replicas: "1"
  karapace_cpu: "100m"
  karapace_memory_request: "384Mi"
  karapace_memory_limit: "768Mi"
  # OpenCost(ADR-069)。单价从这台机器的真实账单反推:
  # ecs.g9i.4xlarge(16 vCPU / 64 GiB)按量约 ¥4.04/小时。按"CPU 占 2/3、
  # 内存占 1/3"这个常用的粗略拆分:
  #   CPU:  4.04 × 2/3 / 16 核  ≈ ¥0.168 /核/小时
  #   内存: 4.04 × 1/3 / 64 GiB ≈ ¥0.021 /GiB/小时
  # 磁盘 ESSD PL0 200GiB 约 ¥0.0005/GiB/小时(月付折算)。
  # **这个拆分比例是行业惯例,不是阿里云的官方口径**——它影响的是"CPU
  # 密集型作业和内存密集型作业谁背更多成本",在没有官方拆分的情况下,
  # 有一个说得清来源的比例,比用 chart 默认的美元单价强得多。
  cost_cpu_hourly: "0.168"
  cost_ram_gb_hourly: "0.021"
  cost_storage_gb_hourly: "0.0005"
  opencost_cpu: "100m"
  opencost_memory_request: "256Mi"
  opencost_memory_limit: "512Mi"





prod:
  # 6 台物理机(见 environments/prod/README.md 的目标硬件)。下面的数字是
  # **按 cloud-full README"请求值×3、限制值×2"那个方向性判断给的起步值,
  # 不是实测容量规划**——真正上生产后要按 `kubectl top pods` 的真实数据
  # 回调,不要把这几个数当成经过验证的推荐配置。
  trino_coordinator_cpu: "2"
  trino_coordinator_memory_request: "8Gi"
  trino_coordinator_memory_limit: "16Gi"
  trino_jvm_max_heap: "12g"
  trino_query_max_memory: "20GB"
  trino_query_max_memory_per_node: "8GB"
  # prod 真的拆出独立 worker,不再让 coordinator 兼职
  trino_workers: "3"
  # 6 台物理机才谈得上真 HA:1 主 2 备,见 environments/prod/README.md
  # 3 broker + 3 副本 + min.insync 2:允许挂一台还能继续写(isr 取 3 的话
  # 挂一台就直接停写)。存储容量同样是方向性起步值,真实容量要按消息量和
  # 保留期算,不是这里能定的。
  # 30 分钟空闲 / 8 小时最长(一个工作日)。**保守起步基线,不是"符合贵
  # 公司安全要求"的证明**——上生产前仍要拿公司自己的基线核对,只是现在
  # 核对的对象是一个明确的配置值,不是一句"记得重新评估"的注释。
  keycloak_sso_session_idle_timeout: "1800"
  keycloak_sso_session_max_lifespan: "28800"
  kafka_replicas: "3"
  kafka_replication_factor: "3"
  kafka_min_insync_replicas: "2"
  kafka_storage_size: "200Gi"
  postgres_instances: "3"

  # 下面这批同样是**方向性起步值,不是实测容量规划**——请求值×3、限制值×2,
  # 副本数按 6 台物理机的 HA 常识给,真上生产后要按 `kubectl top pods` 回调。

  # Superset node 是无状态的 Flask 应用,挂 ingress 后面,2 副本就是最基本
  # 的 HA(单副本重启/滚动更新时会有一瞬间不可用)。
  superset_node_replicas: 2
  superset_node_cpu: "600m"
  superset_node_memory_request: "1536Mi"
  superset_node_memory_limit: "2048Mi"
  # 这次分档没有一并把 Celery/Redis broker 接上(那是架构级改动,超出这次
  # "机械铺开占位符"的范围)——prod 没有 broker,worker 依然起来没用,所以
  # prod 这一档也保持 0,不是漏配。等以后真的接 Redis/Celery 才有必要调大。
  superset_worker_replicas: 0

  # apiServer/scheduler/dagProcessor/triggerer 都是无状态或者靠 DB 锁协调
  # 的组件,Airflow 官方文档明确支持多副本(包括多 scheduler),6 台物理机
  # 上给 2 副本是常规 HA 起点。
  airflow_apiserver_replicas: 2
  airflow_apiserver_cpu: "450m"
  airflow_apiserver_memory_request: "1536Mi"
  airflow_apiserver_memory_limit: "2048Mi"
  airflow_scheduler_replicas: 2
  airflow_scheduler_cpu: "450m"
  airflow_scheduler_memory_request: "1536Mi"
  airflow_scheduler_memory_limit: "2048Mi"
  airflow_dagprocessor_replicas: 2
  airflow_dagprocessor_cpu: "300m"
  airflow_dagprocessor_memory_request: "1536Mi"
  airflow_dagprocessor_memory_limit: "2048Mi"
  airflow_triggerer_replicas: 2
  airflow_triggerer_cpu: "300m"
  airflow_triggerer_memory_request: "768Mi"
  airflow_triggerer_memory_limit: "1024Mi"
  # KubernetesExecutor 每个任务起的 pod 模板,不是常驻副本,只按倍数放大
  # 单个任务 pod 能用的资源上限,不涉及 HA 副本数这个维度。
  airflow_worker_pod_cpu: "150m"
  airflow_worker_pod_memory_request: "768Mi"
  airflow_worker_pod_memory_limit: "1024Mi"

  mlflow_cpu: "600m"
  mlflow_memory_request: "3072Mi"
  mlflow_memory_limit: "5120Mi"

  # OpenSearch 生产建议至少 3 节点做 quorum(避免脑裂),关掉 singleNode
  # 这件事这次没有一并做(那是架构级改动,不是机械铺占位符能覆盖的范围,
  # 见 apps/components/opensearch.yaml 里 singleNode: true 还是写死的)——
  # replicas 先按 3 给,等真正切到集群模式时再回头核对 singleNode 开关。
  # 存储容量给了明显更大的值,搜索索引数据量增长比其它组件更难预估。
  opensearch_single_node: "false"
  opensearch_replicas: 3
  opensearch_cpu: "900m"
  opensearch_memory_request: "2304Mi"
  opensearch_memory_limit: "2560Mi"
  opensearch_storage_size: "100Gi"

  # MinIO 官方 chart 的 replicas 直接决定纠删码(erasure coding)的节点数,
  # 不是简单的"多几个副本更保险"——常见分布式部署是 4/8/16 这类特定档位,
  # 贸然给一个数字有把纠删码配出一个没验证过的诡异形状的风险,比单节点
  # 更不安全。这里保守地把 prod 也维持 1(单节点,和 local-lite/cloud-full
  # 一样),只放大资源和存储——**这是本次改动里唯一没有跟着"6 台物理机
  # 该有 HA"这个方向走的一项,是刻意的保守选择,不是遗漏**。真要上生产
  # 分布式 MinIO,需要单独评估节点数/磁盘布局,超出这次机械铺占位符的范围。
  minio_replicas: 1
  minio_storage_size: "500Gi"
  minio_cpu: "300m"
  minio_memory_request: "768Mi"
  minio_memory_limit: "1024Mi"

  # 2026-08-22 新增(docs/decisions/062-flink-streaming-pipeline.md)。
  # 和这个文件里其它 prod 数值一样,**方向性起步值,不是实测容量规划**
  # ——真正吞吐取决于以后真实的流数据量,现在只是给一个能跑起来、比
  # local-lite/cloud-full 大一档的起点。
  kafka_producer_cpu: "200m"
  kafka_producer_memory_request: "128Mi"
  kafka_producer_memory_limit: "256Mi"

  flink_operator_cpu: "300m"
  flink_operator_memory_request: "512Mi"
  flink_operator_memory_limit: "1024Mi"

  flink_jobmanager_cpu: 1
  flink_jobmanager_memory: "2048m"
  flink_taskmanager_cpu: 1
  # prod 的 taskmanager 给更多:上面那条注释里算过,1792m 只是"能启动"的
  # 舒适下限,真实负载的 task heap 要靠这个数字撑。
  flink_taskmanager_memory: "4096m"
  # 6 台物理机,给 2 个并行度起步——真正该给多少要看 Kafka 分区数和真实
  # 流量,这里只是不再像 local-lite 那样固定卡在 1。
  flink_job_parallelism: 2
  # --- Kueue 队列配额(ADR-064)---
  # **和这一档其它数字一样,是方向性起步值,不是容量规划结论**。真正
  # 分多少要按各组的实际作业量谈,而且这恰恰是引入 Kueue 之后第一次
  # 能拿数据谈的事——在此之前只能拍脑袋。上生产后按 Kueue 自己的指标
  # (队列等待时长、借用次数)回调。
  kueue_controller_cpu: "500m"
  kueue_controller_memory_request: "1Gi"
  kueue_controller_memory_limit: "2Gi"
  kueue_platform_team_cpu: "16"
  kueue_platform_team_memory: "64Gi"
  kueue_platform_team_borrow_cpu: "16"
  kueue_platform_team_borrow_memory: "64Gi"
  kueue_data_analysts_cpu: "32"
  kueue_data_analysts_memory: "128Gi"
  kueue_data_analysts_borrow_cpu: "32"
  kueue_data_analysts_borrow_memory: "128Gi"
  kueue_algorithm_team_cpu: "64"
  kueue_algorithm_team_memory: "256Gi"
  kueue_algorithm_team_borrow_cpu: "64"
  kueue_algorithm_team_borrow_memory: "256Gi"
  # 审计 topic(ADR-066)。90 天;真正的长期留存靠下游 Iceberg 表,
  # Kafka 这段是缓冲 + 下游挂掉时的兜底。具体多久要按公司合规要求定,
  # 90 天是起步值不是合规结论。
  audit_topic_partitions: "6"
  audit_topic_retention_ms: "7776000000"
  # Karapace(ADR-068)。prod 两副本:不是为了扛量(量很小),是为了
  # 滚动升级和节点故障时注册接口不中断。Karapace 自己有 master 选举,
  # 多副本时只有一个是 master 负责写,其余提供读,这是它设计支持的形态。
  karapace_replicas: "2"
  karapace_cpu: "500m"
  karapace_memory_request: "1Gi"
  karapace_memory_limit: "2Gi"
  # OpenCost(ADR-069)。**这三个数字必须由 zhenghe 按自有机房的实际
  # 情况填,不能沿用 cloud-full 的云单价。** 自有服务器的成本构成是
  # "硬件摊销 + 机房托管 + 电费 + 运维人力",算法是:
  #   (整机采购价 / 折旧年限 / 8760 小时 + 每小时托管电费) 按 CPU/内存拆分
  # 现在填的是占位的 0——**填 0 比填一个编造的数字好**:0 会让人一眼看出
  # "还没配",编的数字会被当成真账单拿去分锅。
  cost_cpu_hourly: "0"
  cost_ram_gb_hourly: "0"
  cost_storage_gb_hourly: "0"
  opencost_cpu: "500m"
  opencost_memory_request: "1Gi"
  opencost_memory_limit: "2Gi"




