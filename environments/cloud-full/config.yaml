# cloud-full 环境的唯一配置源——2026-08-16 真实故障(SSO 登录 404/502
# 连环事故)之后建的:这几个值之前散落硬编码在 9 个文件里,改一处不代表
# 其他跟着变,是当天那一路排查的根本原因。现在这些值只在这一份文件里
# 出现,其他文件从模板(templates/ 目录下)渲染生成,不再手写。
#
# 用法:
#   python3 scripts/render-environment-config.py cloud-full
#   python3 scripts/render-environment-config.py cloud-full --check   # CI 用,检测漂移

# ingress-nginx 的 ClusterIP 服务本身没有云 LoadBalancer,走 NodePort
# 暴露(见 platform/apps/ingress-nginx.yaml 的说明,和 Codex 的项目共享
# 节点、抢不到标准 80/443)。domain_suffix 不带协议/路径,纯后缀。
domain_suffix: local-lite.test
http_port_suffix: ":32460"
https_port_suffix: ":32535"
external_scheme: http

# TLS 证书由哪个 ClusterIssuer 签发:selfsigned | acme。
# 三个环境里 ClusterIssuer 的名字统一是 `platform-issuer`,换环境变的是它
# 背后接自签还是真实 CA,**引用它的 Certificate 资源一行都不用改**。
# 这一档是自签:没有真实域名,ACME 的 HTTP-01 挑战根本走不通;而且这里的
# 证书只用于集群内部一跳(ingress-nginx → Trino 的 https 监听器),不需要
# 被浏览器信任。
tls_issuer_mode: selfsigned

# 告警外部通知渠道:none | webhook。见 ADR-060 的条件生成机制。
# 集成环境,告警看 Alertmanager 自己的 UI 就够,不往外推。
# 2026-08-28 从 none 改成 webhook(ADR-081)。**不是因为拿到了真实的企业微信
# 地址**,是因为"告警能不能送出去"这条路径一直没被验证过——规则、
# Alertmanager、路由配置全都在,而从来没有一条告警真的被 POST 出去过。
#
# 现在指向集群内的 alert-echo-sink(它把收到的 payload 存下来能回看)。
# **换真实渠道只要改 monitoring/alertmanager-webhook 这个 Secret 里的 url**,
# 机制那半已经验过了。这样上生产那天不是第一次跑这条路。
alert_notification_mode: webhook

# Postgres 备份传到哪。默认就是集群自己的 MinIO。
# **注意:这不是真正的异地备份。** MinIO 就跑在这台云主机上,机器整个出
# 问题(磁盘损坏、实例被释放)时备份和数据一起没。集成环境接受这个风险,
# prod 不行——见 ADR-033 和 environments/prod/README.md。
backup_s3_endpoint: http://minio.minio.svc.cluster.local:9000
backup_s3_bucket: backups
backup_s3_secret: minio-root

# 2026-08-20 新增(ADR-057 第三批):cloud-full 是"功能完整"环境,目前
# `apps/components/` 下的全部组件都要启用——这份清单和 2026-08-20 渲染
# 这份配置之前 `apps/definitions/` 里实际常驻的 43 个文件逐一核对过,
# 是"当前真实在跑什么"的忠实记录,不是凭空写的期望值。以后新增组件,
# 加进 `apps/components/` 之后记得同步加进这里,不然 `--check` 会报
# "应该启用但还没生成"。
# ---------------------------------------------------------------- 统一运行时镜像
#
# notebook(JupyterHub singleuser)、定时作业(Argo CronWorkflow)、
# `platform-submit` 提交的作业,用的是**同一个镜像** —— "交互开发和调度
# 执行环境一致"这条能力就靠它成立(ADR-058)。
#
# **2026-08-30 之前这个值硬编码在 6 个地方**(render-jobs.py 的默认值、
# platform_sdk/config.py 的默认值、JupyterHub 组件、Airflow 的 DAG、
# 以及两处文档/示例),而且指向 `local/platform-runtime:0.1.0` —— 一个
# **只存在于当时那台机器上、靠手工 docker build 出来的**镜像,没有任何
# 地方记录它是从哪个 commit 来的。换台机器/重装一次就没了。
#
# 现在它是一个配置项,`scripts/check-platform-image-refs.py` 保证那 6 处
# 和这里一致(CI 里跑)。
# tag 是 commit SHA:哪个 commit 构建出来的一目了然,而且不可变 ——
# 和这个仓库其它四个自建镜像同一套做法。
# 升级方式:改了 apps/platform-image/ 或 platform-sdk/ 之后,等 CI 构建完
# 那个 commit,把这里的 SHA 换掉。
platform_job_image: crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/platform-runtime:d805b030dd0427a40a24cc22212221e3372ec9bf

# ---------------------------------------------------------------- 凭据托管
#
# OpenBao 的封印/解封(ADR-089)。**这是这套东西最难的一环。**
#
# OpenBao 每次重启都是**封印**状态,要用解封密钥解开才能服务。而这台云主机
# 是竞价实例、经常关机重开 —— 每次开机都要人来解封的话,"一键拉起"这条
# 底线就不成立了。
#
#   dev-autounseal  解封密钥存进 k8s Secret,启动时由一个 Job 自动解封
#   kms             云 KMS 自动解封(阿里云 KMS / AWS KMS)
#
# **这一档牺牲了什么,必须写在这里而不是只写在 ADR 里**:解封密钥和被它
# 保护的数据在同一个集群里 —— 拿到 k8s Secret 读权限的人,能解开 OpenBao。
# 静态加密的意义因此大打折扣。
#
# 但它**仍然严格优于今天**(裸 K8s Secret):有审计日志(谁读过留痕)、
# 按人隔离(策略模板)、版本化可回滚。做这件事的理由是这三条,不是加密。
seal_mode: dev-autounseal

# ---------------------------------------------------------------- 节点私网 IP
#
# JupyterHub 的 singleuser pod 要连 K8s API server,而在 k3s 上
# `kubernetes.default.svc`(10.43.0.1:443)会被 iptables DNAT 成
# **节点私网 IP:6443** —— NetworkPolicy 匹配的是 DNAT 之后的目的地址,
# 所以这条 egress 规则必须写具体的节点 IP,写 Service 的 ClusterIP 不管用。
#
# **在 2026-09-01 之前这个 IP 是硬编码在 apps/components/jupyterhub.yaml
# 里的**,旁边一句注释写着"如果以后真的换了新实例,这里要跟着改"。靠注释
# 提醒正是这个仓库反复翻车的模式(CLAUDE.md「状态别写两遍」那节),所以
# 改成配置项。写错的症状很隐蔽:notebook 起得来、查数也正常(那走 Trino),
# 只有 `submit_job()` 会超时 —— 而人会去查 RBAC。
# 2026-09-01 迁可用区时从 172.22.9.16 改过来的。**换实例/换可用区必须改
# 这里** —— 迁移脚本 scripts/51 会自动更新它。
node_private_ip: 172.22.9.16

