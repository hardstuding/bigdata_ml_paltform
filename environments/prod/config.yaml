# prod 环境的唯一配置源,见 environments/cloud-full/config.yaml 顶部
# 注释了解这份文件的用途和用法。
#
# 占位值——真正上生产前必须换成真实域名(见 environments/prod/README.md
# "TLS 证书从自签换成真实证书"一节),标准 80/443 端口不需要后缀。
# 这份文件存在的意义是证明"以后换环境只改这一份文件",不代表 prod 已经
# 可以直接拉起来用(还差真实域名本身、cert-manager 接真实 CA 这些,见
# README 里列的其它未完成项)。
domain_suffix: your-real-domain.example.com
http_port_suffix: ""
https_port_suffix: ""
external_scheme: https

# TLS 证书由哪个 ClusterIssuer 签发:selfsigned | acme。
# prod 走 acme——真实域名 + 真实 CA。ClusterIssuer 的名字和另外两个环境
# 一样是 `platform-issuer`,所以引用它的 Certificate 资源不用跟着改。
#
# **这一档还没有在真实环境验证过**(没有真实域名,也还没做 ICP 备案),
# 属于"配置结构就位、改配置就能生效",不是"已经跑通过"。上生产的顺序是:
#   1. 域名解析指到集群入口 + 80 端口从公网可达(HTTP-01 挑战要用)
#   2. tls_acme_server 先保持下面的 staging 地址,跑通一次签发
#   3. 确认没问题再换成 https://acme-v02.api.letsencrypt.org/directory
# 直接上 production 地址反复试错会打光 Let's Encrypt 的每周签发限额,
# 被限流之后只能等一周。
# 用公司内部 CA 而不是 Let's Encrypt 的话,见
# templates/platform-cert-manager-issuers/clusterissuer-acme.yaml 顶部注释。
tls_issuer_mode: acme
tls_acme_server: https://acme-staging-v02.api.letsencrypt.org/directory
# 占位邮箱,上生产前必须换成真实运维邮箱——Let's Encrypt 用它发证书过期
# 提醒,填错了等于放弃唯一的过期预警渠道。
tls_acme_email: platform-ops@your-real-domain.example.com

# 告警外部通知渠道:none | webhook。见 ADR-060 的条件生成机制。
# prod 走通用 webhook。**还没在真实环境验证过**(用户 2026-08-22 明确说
# 等上生产再测)。真正生效还需要在集群里建一个 Secret 放 webhook 地址:
#   kubectl -n monitoring create secret generic alertmanager-webhook \
#     --from-literal=url='https://<真实的 webhook 地址>'
# 没建这个 Secret,Alertmanager 会拒绝加载这份配置——这是有意的,
# 比静默地什么都不发好。细节见
# templates/platform-alertmanager-notification/alertmanagerconfig-webhook.yaml
alert_notification_mode: webhook

# Postgres 备份传到哪。**prod 必须指向真正独立于这几台服务器之外的对象
# 存储**(公有云 S3 / 另一个机房的 MinIO),否则"机房整个出问题"这类场景
# 下备份和数据一起没,备份等于没做(ADR-033 明确记过这个缺口)。
#
# 下面是占位值,上生产前必须换成真实地址,并且**手工建好
# `postgres-backup-target` 这个 Secret**(key 沿用 rootUser/rootPassword,
# 和集群内 MinIO 那份字段名一致,这样 CronJob 不用改):
#   kubectl -n data create secret generic postgres-backup-target \
#     --from-literal=rootUser=<异地存储的 access key> \
#     --from-literal=rootPassword=<secret key>
#
# **这一档没有在真实环境验证过**,和域名/告警那两块一样属于"配置结构就位、
# 改配置就生效",不代表备份真的传得过去。
backup_s3_endpoint: https://s3.your-offsite-storage.example.com
backup_s3_bucket: bigdata-platform-backups
backup_s3_secret: postgres-backup-target

# 2026-08-21 补:之前这份文件**没有 enabled_components**,导致
# `render-environment-config.py prod` 跑一半失败——模板替换那步已经把
# platform/apps/*.yaml 的域名改成 prod 占位域名了,组件选择那步才报错,
# 工作区被留在"一半 prod 一半 cloud-full"的混合状态(渲染脚本已经改成
# 校验前置,现在会在写任何文件之前退出)。没有这份清单,"改配置切换环境"
# 这个承诺对 prod 就是不成立的。
#
# **先照搬 cloud-full 的全量 44 个组件**,理由:prod 的定位是
# "功能完整的生产环境",不是裁剪版;真要裁(比如生产不需要 demo 类组件)
# 应该是有明确理由的减法,不是一开始就少写几个。
#
# **但必须说清楚:这份清单能渲染出来 ≠ prod 能直接拉起来用。** 还差的
# 硬条件见 environments/prod/README.md,其中最关键的是**资源规格分档还
# 没有做**——所有组件的 resources/副本数目前写死的是 local-lite 那套
# 小规格(比如 Trino coordinator 300m CPU、server.workers: 0),照搬到
# 生产硬件上不改,等于用一台笔记本的配置跑生产。这一层是
# `docs/project/roadmap.md` 1.1 明确押后的后半段,没做完之前 prod 只能算
# "配置结构完整",不能算"可用"。
# ---------------------------------------------------------------- 统一运行时镜像
#
# notebook(JupyterHub singleuser)、定时作业(Argo CronWorkflow)、
# `platform-submit` 提交的作业,用的是**同一个镜像** —— "交互开发和调度
# 执行环境一致"这条能力就靠它成立(ADR-058)。
#
# **2026-08-30 之前这个值硬编码在 6 个地方**(render-jobs.py 的默认值、
# platform_sdk/config.py 的默认值、JupyterHub 组件、Airflow 的 DAG、
# 以及两处文档/示例),而且指向 `local/platform-runtime:0.1.0` —— 一个
# **只存在于当时那台机器上、靠手工 docker build 出来的**镜像,没有任何
# 地方记录它是从哪个 commit 来的。换台机器/重装一次就没了。
#
# 现在它是一个配置项,`scripts/check-platform-image-refs.py` 保证那 6 处
# 和这里一致(CI 里跑)。
# 和 cloud-full 用同一个 tag:同一份构建产物一路走到生产,不重新构建 ——
# "测试环境验过的和生产跑的是同一个东西"这条要成立就不能各建各的。
platform_job_image: crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/platform-runtime:d805b030dd0427a40a24cc22212221e3372ec9bf

# ---------------------------------------------------------------- 凭据托管
#
# OpenBao 的封印/解封(ADR-089)。**这是这套东西最难的一环。**
#
# OpenBao 每次重启都是**封印**状态,要用解封密钥解开才能服务。而这台云主机
# 是竞价实例、经常关机重开 —— 每次开机都要人来解封的话,"一键拉起"这条
# 底线就不成立了。
#
#   dev-autounseal  解封密钥存进 k8s Secret,启动时由一个 Job 自动解封
#   kms             云 KMS 自动解封(阿里云 KMS / AWS KMS)
#
# **prod 必须是 kms。** 渲染时会校验:seal_mode=kms 而没配 KMS 参数会
# **直接拒绝渲染**,不会静默退回开发档 —— "配置没配对就悄悄降级"这类坑
# 这个项目踩过太多次(见 CLAUDE.md「状态别写两遍」那节的成因)。
#
# 还要配(现在是占位,上生产前必须换成真的):
#   openbao_kms_key_id / openbao_kms_region / openbao_kms_credentials_secret
seal_mode: kms
# 下面三个是**占位值**,上生产前必须换成真的 —— `scripts/check-prod-secrets-ready.py`
# 会拦住带 REPLACE-ME 的值(它是部署门禁,不在渲染路径上:prod 必须始终
# 能渲染,否则 CI 那步"三档都要能渲染"就废了)。
openbao_kms_key_id: "REPLACE-ME-kms-key-id"
openbao_kms_region: "REPLACE-ME-kms-region"
# 存放访问 KMS 的凭据的 k8s Secret 名字(要**手工**在 openbao 命名空间里建好,
# 和 backup_s3_secret 同一个约定)。
openbao_kms_credentials_secret: "REPLACE-ME-openbao-kms-credentials"

# ---------------------------------------------------------------- 节点私网 IP
#
# JupyterHub 的 singleuser pod 要连 K8s API server,而在 k3s 上
# `kubernetes.default.svc`(10.43.0.1:443)会被 iptables DNAT 成
# **节点私网 IP:6443** —— NetworkPolicy 匹配的是 DNAT 之后的目的地址,
# 所以这条 egress 规则必须写具体的节点 IP,写 Service 的 ClusterIP 不管用。
#
# **在 2026-09-01 之前这个 IP 是硬编码在 apps/components/jupyterhub.yaml
# 里的**,旁边一句注释写着"如果以后真的换了新实例,这里要跟着改"。靠注释
# 提醒正是这个仓库反复翻车的模式(CLAUDE.md「状态别写两遍」那节),所以
# 改成配置项。写错的症状很隐蔽:notebook 起得来、查数也正常(那走 Trino),
# 只有 `submit_job()` 会超时 —— 而人会去查 RBAC。
# prod 从没部署过,这里是占位。真部署时必须填成那台机器的私网 IP。
node_private_ip: 10.255.255.255

