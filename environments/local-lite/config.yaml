# local-lite 环境的唯一配置源,见 environments/cloud-full/config.yaml
# 顶部注释了解这份文件的用途和用法。
#
# local-lite(colima)靠 colima 自动把宿主机的 80/443 转发到
# 127.0.0.1,ingress-nginx 不需要 NodePort 高位端口,后缀留空。
domain_suffix: local-lite.test
http_port_suffix: ""
https_port_suffix: ""
external_scheme: http

# TLS 证书由哪个 ClusterIssuer 签发:selfsigned | acme。
# 三个环境里 ClusterIssuer 的名字统一是 `platform-issuer`,换环境变的是它
# 背后接自签还是真实 CA,**引用它的 Certificate 资源一行都不用改**。
# 这一档是自签:没有真实域名,ACME 的 HTTP-01 挑战根本走不通;而且这里的
# 证书只用于集群内部一跳(ingress-nginx → Trino 的 https 监听器),不需要
# 被浏览器信任。
tls_issuer_mode: selfsigned

# 告警外部通知渠道:none | webhook。见 ADR-060 的条件生成机制。
# 本机验证环境,没有也不需要外部通知渠道。
alert_notification_mode: none

# Postgres 备份传到哪。默认就是集群自己的 MinIO。
# **这一档没有异地可言**——本机验证环境,备份和数据在同一台笔记本上。
backup_s3_endpoint: http://minio.minio.svc.cluster.local:9000
backup_s3_bucket: backups
backup_s3_secret: minio-root

# 2026-08-20 新增(ADR-057 第三批):**这份清单是按 docs/architecture.md
# 组件表里"local-lite(设计归属)"这一列的 ✅/⚠️ 推出来的,不是对着这台
# 机器当前真实状态核对过的**——写这份清单的时候 colima 没有在跑,没办法
# 现场确认。这正是这次要解决的问题本身:以前"这台机器现在到底装了什么"
# 只能翻 `ls apps/definitions/`,现在至少有一份明确写下来的意图,但**下次
# colima 启动时,应该先 `python3 scripts/render-environment-config.py
# local-lite --check` 看有没有和这台机器实际用惯的组件对不上,对不上就
# 更新这份清单,不要假设这份清单天然是对的**。
#
# 没收进来的组件里,Feast 尤其要注意:docs/architecture.md 表格标它
# local-lite 是 ✅,但它的离线特征存储要靠 Spark 读 Iceberg
# (`feast_materialize.py` 那条链路),Spark Operator 在同一张表里标的是
# local-lite "—"(cloud-full 才有)——这是文档本身互相矛盾的地方,没有
# 强行猜一个"应该"的答案,这次先不收进 local-lite,等真正需要在本机验证
# Feast 时再决定要不要连带把 Spark Operator 也一起启用,不在这里悄悄
# 绕过依赖关系。
# ---------------------------------------------------------------- 统一运行时镜像
#
# notebook(JupyterHub singleuser)、定时作业(Argo CronWorkflow)、
# `platform-submit` 提交的作业,用的是**同一个镜像** —— "交互开发和调度
# 执行环境一致"这条能力就靠它成立(ADR-058)。
#
# **2026-08-30 之前这个值硬编码在 6 个地方**(render-jobs.py 的默认值、
# platform_sdk/config.py 的默认值、JupyterHub 组件、Airflow 的 DAG、
# 以及两处文档/示例),而且指向 `local/platform-runtime:0.1.0` —— 一个
# **只存在于当时那台机器上、靠手工 docker build 出来的**镜像,没有任何
# 地方记录它是从哪个 commit 来的。换台机器/重装一次就没了。
#
# 现在它是一个配置项,`scripts/check-platform-image-refs.py` 保证那 6 处
# 和这里一致(CI 里跑)。
# local-lite 仍然用本地构建的那份:这台机器上没有 ACR 拉取凭据,而且
# 本地开发本来就该能改完镜像立刻用,不必绕一圈 CI。
# 本地构建 = 远端不存在这个 tag,pullPolicy 必须是 IfNotPresent,否则
# kubelet 会去联网拉一个不存在的镜像,直接 ErrImagePull。
platform_job_image: local/platform-runtime:0.1.0

# ---------------------------------------------------------------- 凭据托管
#
# OpenBao 的封印/解封(ADR-089)。**这是这套东西最难的一环。**
#
# OpenBao 每次重启都是**封印**状态,要用解封密钥解开才能服务。而这台云主机
# 是竞价实例、经常关机重开 —— 每次开机都要人来解封的话,"一键拉起"这条
# 底线就不成立了。
#
#   dev-autounseal  解封密钥存进 k8s Secret,启动时由一个 Job 自动解封
#   kms             云 KMS 自动解封(阿里云 KMS / AWS KMS)
#
# **本机开发,毫无疑问用自动解封。**
seal_mode: dev-autounseal

enabled_components:
  - hive-metastore.yaml
  - iam-sync.yaml
  - keycloak-db-init.yaml
  - minio.yaml
  - network-policies.yaml
  - opa.yaml
  - permission-request-app-oauth2-proxy.yaml
  - permission-request-app.yaml
  - platform-iam-rbac.yaml
  - platform-portal-oauth2-proxy.yaml
  - platform-portal.yaml
  - postgres-backup.yaml
  - postgres.yaml
  - cloudnative-pg-operator.yaml
  - resource-quotas.yaml
  - kueue.yaml
  - kueue-queues.yaml
  - table-registration-app-oauth2-proxy.yaml
  - table-registration-app.yaml
