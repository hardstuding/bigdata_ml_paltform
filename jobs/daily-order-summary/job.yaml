# 每天把订单按区域汇总一次,写回 Iceberg。
#
# 挑这个作为第一个定时作业,是因为它是**真的有输出、能被验证**的:
# 跑完之后 `iceberg.demo.orders_by_region_daily` 里应该多一批当天的行。
# 一个 print("hello") 的定时作业证明不了这条链路是通的。
name: daily-order-summary
script: job.py
schedule: "30 1 * * *"      # 每天 01:30 UTC,和 Airflow 那三条 DAG 错开
timezone: UTC
cpu: "500m"
memory: "1Gi"
owner_group: data-analysts   # 用分析组的配额

# 这个作业用到的第三方包。**平台不会在运行时安装任何东西** —— 这里声明的
# 名字会和 apps/platform-image/requirements.txt 对账,写了镜像里没有的
# 包,CI 直接红,而不是等作业半夜跑到 import 那一行才 ModuleNotFoundError。
requires:
  - trino

# 作业参数。定时跑用默认值;补数时带上不同的值提交一次:
#   argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01
params:
  run_date: ""     # 空 = 用今天

# 这个作业在哪些环境里生效。不写 = 所有环境。
# **晋级就是往这个列表里加一个环境名**,不是复制一份 yaml 到别处。
environments:
  - local-lite
  - cloud-full
