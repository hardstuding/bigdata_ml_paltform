# 平台门户,见 docs/decisions/047-platform-portal.md。和
# permission-request-app/table-registration-app 同一个"薄自建工具"模式:
# 官方 python:3.12-slim 镜像 + 启动时 pip install + ConfigMap 挂源码,
# 不建专门的容器镜像仓库。这个组件没有状态(不写数据库,现场探测现场展示),
# 不需要 PVC。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-portal
  namespace: platform-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-portal
  template:
    metadata:
      labels:
        app: platform-portal
    spec:
      # 见 ADR-041(队列资源管理):人在看这个页面找工具入口,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          image: python:3.12-slim@sha256:876416ecde9aca2bcc90e1fb0c7a9500bbf749f5788b70f82d4c5a5c2357f8b4
          command:
            - sh
            - -c
            - |
              set -e
              # 2026-08-16 云端部署时发现:192.168.5.2:1087 是 colima 宿主机
              # 专用的本地代理,cloud-full(阿里云 ECS,独立公网出口)连不上,
              # 之前把它写死成 env 会导致 pip 在 cloud-full 上连接超时崩溃。
              # 这里还没有环境 overlay 机制(见 environments/cloud-full/
              # README.md),改成运行时自己探测这个代理还在不在——2 秒连不上
              # 就当作不需要代理(cloud-full 直连 pypi.org 本来就是通的,实测
              # 确认过),不是无条件假设某个环境一定需要/不需要代理。
              if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('192.168.5.2',1087))==0 else 1)" 2>/dev/null; then
                export HTTP_PROXY="http://192.168.5.2:1087"
                export HTTPS_PROXY="http://192.168.5.2:1087"
                export NO_PROXY="localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16"
              fi
              pip install --quiet --timeout 30 flask==3.1.3 requests==2.34.2
              python3 /src/app.py
          env:
            # 2026-08-16 真实故障:门户列出的 13 个工具链接全部没带端口,
            # cloud-full 的 ingress-nginx 是 NodePort(32460 http、32535
            # https),点开必然 404。按 zhenghe 的要求做成配置参数(见
            # src/app.py 里怎么用这两个变量),不是写死——以后接真实域名+
            # 标准 80/443 端口时,把这两个值删掉/留空就行,不用再改代码。
            - name: PUBLIC_HTTP_PORT_SUFFIX
              value: ":32460"
            - name: PUBLIC_HTTPS_PORT_SUFFIX
              value: ":32535"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: src
              mountPath: /src
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
      volumes:
        - name: src
          configMap:
            name: platform-portal-src
---
apiVersion: v1
kind: Service
metadata:
  name: platform-portal
  namespace: platform-portal
spec:
  selector:
    app: platform-portal
  ports:
    - port: 8080
      targetPort: 8080
      name: http
