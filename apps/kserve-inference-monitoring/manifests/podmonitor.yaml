# 抓在线推理服务的指标。
#
# **为什么单独一个组件**:InferenceService 本身是 `scripts/11` 运行时建的
# 一次性 demo 资源(namespace `kserve-demo` 不在 git 里),但"能不能看到
# 推理的延迟和错误率"是一个常驻能力,不该跟着 demo 资源一起来一起走。
# 所以监控这一半放进 GitOps,用 namespaceSelector 去匹配那个运行时命名空间。
#
# **端口和指标名是在集群上实测出来的,不是照文档写的** —— 这里踩了一次:
# KServe 官方文档「Prometheus Metrics」讲的是它自己的 Python 模型服务器
# (`request_predict_seconds` 等,端口 8080)。**但我们的推理服务用的是
# `modelFormat: mlflow`,跑起来是 MLServer**,它暴露的是另一套东西:
#
#   端口 8082(不是 8080),/metrics
#   model_infer_request_success_total{model,version}
#   model_infer_request_failure_total{model,version}
#   model_infer_request_duration_{count,sum,bucket}{model,version}
#   rest_server_request_duration_seconds_*{path,method,status_code}
#
# 第一版按文档写了 8080 + KServe 的指标名,实测 curl 一遍才发现全错。
# 换 runtime(比如 sklearn/xgboost 走 KServe 自己的 server)时这份要重新
# 核对,**不要假设文档说的就是你集群里跑的那个**。
#
# **两半都要有**:InferenceService 上的
# `serving.kserve.io/enable-prometheus-scraping: "true"` 只是让 pod 带上
# prometheus.io/* 注解,KServe 文档自己写明"它不会触发 Prometheus 来抓";
# 真正来抓的是这个 PodMonitor。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kserve-inference
  namespace: monitoring
  labels:
    # kube-prometheus-stack 的 podMonitorSelector 认这个标签,不打的话
    # 对象建出来了也不会被选中(opencost 那次踩过同样的坑,见
    # apps/components/opencost.yaml 里的注释)。
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kserve-demo
  selector:
    matchLabels:
      # KServe 给 predictor pod 打的标准标签(实测确认过)
      component: predictor
  podMetricsEndpoints:
    # **不指定 port / portNumber / targetPort,靠 relabeling 自己拼地址。**
    #
    # 2026-08-29 实测的完整过程,写下来免得下次又走一遍:
    #   1. 按 KServe 文档写 `port: http` → 匹配不到,因为 predictor 容器
    #      **一个命名端口都没有**(`.spec.containers[].ports` 是 null)。
    #   2. 改 `targetPort: 8082` → operator 打 warn 说它已废弃。
    #   3. 改 `portNumber: 8082` → 目标被**发现了但被丢弃**
    #      (`/api/v1/targets` 的 droppedTargets 里能看到 10.42.0.186,
    #      health 是 None)。原因:operator 为 portNumber 生成的是一条
    #      `keep __meta_kubernetes_pod_container_port_number == 8082`,
    #      而容器没声明端口,这个 meta 标签压根不存在,必然被丢。
    #   4. 最后:不给端口字段,自己用 relabeling 把 pod IP + 8082 拼成
    #      `__address__`。
    #
    # 另外注意 KServe 自己打的注解是 `prometheus.kserve.io/port: "8080"`
    # ——**那个值对 MLServer 是错的**(它的 metrics 在 8082),所以这里
    # 写死 8082,不去读那个注解。
    - path: /metrics
      interval: 30s
      relabelings:
        # **只留 kserve-container 这一个容器。** role: pod 的服务发现是
        # **按容器**产生目标的,init 容器 `storage-initializer` 也会算一个;
        # 两个容器都没声明端口,relabeling 又都拼成同一个 pod IP:8082,
        # 结果是同一个地址被抓两遍(实测:activeTargets 里两条,instance
        # 完全相同,只有 container 标签不同)。重复抓不只是浪费,还会产生
        # 时间戳冲突的样本。
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: kserve-container
          action: keep
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: "$1:8082"
        # 指标自带 model 标签,但把 InferenceService 名字也带上,方便和
        # 黄金链路看板、KServe 的其它对象对得上。
        - sourceLabels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
          targetLabel: inferenceservice
