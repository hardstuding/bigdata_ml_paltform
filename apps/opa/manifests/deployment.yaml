# Open Policy Agent 服务器(ADR-051),给 Trino 做细粒度访问控制用。
#
# 镜像用官方 openpolicyagent/opa(不是 -static/distroless 版本,留个 shell
# 方便 kubectl exec 进去排障,和这个项目其他组件的选择一致)。OPA 本身没有
# 官方维护的 Helm chart(实测确认过,见 ADR-051"部署方式"一节),用原生
# K8s manifest 部署,和 permission-request-app/table-registration-app/
# platform-portal 这几个自建薄组件同一个模式——OPA 本身也是单容器、无状态
# 的服务,不需要 chart 那套复杂度。
#
# 策略(trino.rego)通过 ConfigMap 挂载,启动时加载一次;grants 数据不走
# ConfigMap,走 OPA 自己的 Data API 运行时 PUT(见 grants-sync-cronjob.yaml),
# 更新立即生效,不需要重启 OPA 或重新挂载文件——这个机制本地用真实的
# docker run + curl PUT 验证过(ADR-051"验证"一节)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      # 见 ADR-041:Trino 每次鉴权检查都要连它,挂了会导致 Trino 所有查询
      # 直接失败(fail-closed),归 platform-critical 档,和 Keycloak/
      # Postgres 同一优先级,不能被 batch/interactive 抢占掉。
      priorityClassName: platform-critical
      containers:
        - name: opa
          image: openpolicyagent/opa:1.19.0
          args:
            - run
            - --server
            - --addr=:8181
            - --log-level=info
            # **没有 --watch 的话,策略改了永远不生效,直到有人手动重启这个
            # Pod。** 2026-08-23 实测撞到:给审计表加了一条 OPA 规则,
            # ConfigMap 已经同步进集群、`opa test` 本地 33/33 全过、ArgoCD
            # 显示 Synced/Healthy——但活的 OPA 仍然按老策略放行,因为
            # `opa run` 默认只在启动时加载一次策略文件。
            #
            # 这是这个项目最典型的那类失败:**每一层都显示成功,而效果
            # 没有生效**,而且是在权限策略这种"错了不会报错、只会悄悄放行"
            # 的地方。加 --watch 让它监听文件变化自己重载。
            #
            # 注意 ConfigMap 挂载的更新有约 1 分钟的 kubelet 缓存延迟
            # (这个项目记录过),所以改完策略不是秒生效,是分钟级生效。
            # **watch 的必须是目录,不能是文件。** 2026-08-23 实测:写成
            # `--watch /policies/trino.rego` 时,ConfigMap 更新之后活的 OPA
            # 仍然是老策略(直接查 /v1/policies 确认过,还是旧的 288 行)。
            # 原因是 kubelet 更新 ConfigMap 挂载用的是**原子替换 `..data`
            # 符号链接**,文件本身的 inode 没被改动,盯着具体文件路径的
            # inotify watch 收不到事件。盯目录才收得到。
            #
            # 但盯目录会撞上第二个坑,**必须配 --ignore 一起用**:kubelet
            # 的 ConfigMap 挂载目录里除了 `trino.rego` 这个符号链接,还有
            # `..data` 和 `..2026_08_23_08_47_49.xxxx` 这两层真实目录,
            # OPA 会把同一份策略**加载三遍**然后启动失败:
            #   rego_type_error: multiple default rules data.trino.allow found
            #   at /policies/..2026_.../trino.rego:13, /policies/..data/trino.rego:13,
            #   /policies/trino.rego:13
            # (2026-08-23 实测。原以为 OPA 会自动跳过点开头的条目,不会。
            # 好在它是启动失败而不是静默加载错的东西,而且滚动更新时老 Pod
            # 还在跑,Trino 没受影响——fail-closed 的组件配 rollout 策略,
            # 这次真的兜住了。)
            - --watch
            - --ignore=..*
            - /policies
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: policy
              mountPath: /policies
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
      volumes:
        - name: policy
          configMap:
            name: opa-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: opa
spec:
  selector:
    app: opa
  ports:
    - port: 8181
      targetPort: 8181
      name: http
