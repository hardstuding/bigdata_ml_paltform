# apps/airflow/dags/ 底下的 DAG 文件打包成这个 ConfigMap,挂进
# scheduler/dagProcessor/workers.kubernetes 的 dags 目录——Airflow chart 的
# gitSync 需要一个独立可访问的 git 仓库/凭据,这个仓库统一用"没有镜像仓库/
# 额外基础设施依赖时优先 ConfigMap 挂载"的思路(和 iam-sync、
# permission-request-app 是同一个模式),不单独接 gitSync。
#
# 下面每个 data key 的内容和 apps/airflow/dags/ 里对应的同名 .py 保持
# 字节级同步,改动时用 scripts/sync-airflow-dags-configmap.py 重新生成,
# 不要手动改这个文件——手动改会导致下次重新生成时被覆盖丢失。这个脚本
# 是 scripts/sync-app-configmaps.py(3 个自建 Flask 工具用)在 Airflow
# DAG 场景下的对应实现,背景见 docs/project/roadmap.md P1.2a:这个仓库已经踩过
# 一次真实的分叉(dbt_demo.py 的 image digest pin 只在这份 ConfigMap 里
# 有,源文件那边在后续编辑时被意外丢了,靠这个脚本第一次跑起来时才发现
# 并修复)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: airflow
data:
  seatunnel_device_events.py: |
    # 验证 Phase 2 数据工程主线(见 docs/decisions/037-data-engineering-pipeline.md):
    # Airflow 调度 SeaTunnel,SeaTunnel 通过 Hive Catalog 写进和 Trino/Spark
    # 共用的同一个 Iceberg 表(demo.device_events)。
    #
    # 没有走 SeaTunnel 官方的 Airflow provider(apache-airflow-providers-*
    # 里没有 seatunnel 这个包,SeaTunnel 社区也没发布独立的 provider),直接用
    # SeaTunnel Zeta 引擎自带的 REST API(POST /hazelcast/rest/maps/submit-job,
    # 见 apps/seatunnel/manifests/configmap.yaml 里 DATA endpoint group 那条
    # 注释——这个 API 之前只验证过集群健康,从没真的提交过作业)。用标准库
    # urllib 而不是额外装 requests,减少这个 DAG 的依赖面。
    #
    # MinIO 凭据从 Airflow Variable 读(scripts/14-configure-airflow-seatunnel-
    # variable.sh 写入),不是 Secret 挂载——这个凭据只在拼 job 请求体这一刻
    # 用得到,不需要像 apps/spark-iceberg-demo 那样在 pod 启动时就注入。
    from __future__ import annotations

    import json
    import time
    import urllib.error
    import urllib.request
    from datetime import datetime

    from airflow.sdk import DAG, task
    from airflow.sdk import Variable

    SEATUNNEL_REST_URL = "http://seatunnel.seatunnel.svc.cluster.local:5801"
    ICEBERG_NAMESPACE = "demo"
    ICEBERG_TABLE = "device_events"


    def _build_job_config(minio_key: str, minio_secret: str) -> dict:
        return {
            "env": {"job.mode": "batch"},
            "source": [
                {
                    "plugin_name": "FakeSource",
                    "plugin_output": "device_events_fake",
                    "row.num": 20,
                    "schema": {
                        "fields": {
                            "event_id": "int",
                            "device_id": "string",
                            "event_type": "string",
                            "value": "double",
                            "event_time": "timestamp",
                        }
                    },
                }
            ],
            "transform": [],
            "sink": [
                {
                    "plugin_name": "Iceberg",
                    "plugin_input": ["device_events_fake"],
                    "catalog_name": "seatunnel",
                    "namespace": ICEBERG_NAMESPACE,
                    "table": ICEBERG_TABLE,
                    "iceberg.catalog.config": {
                        "type": "hive",
                        "uri": "thrift://hive-metastore.data.svc.cluster.local:9083",
                        "warehouse": "s3a://lakehouse/warehouse",
                    },
                    "hadoop.config": {
                        "fs.s3a.endpoint": "http://minio.minio.svc.cluster.local:9000",
                        "fs.s3a.access.key": minio_key,
                        "fs.s3a.secret.key": minio_secret,
                        "fs.s3a.path.style.access": "true",
                        "fs.s3a.connection.ssl.enabled": "false",
                        "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem",
                    },
                    "iceberg.table.write-props": {"write.format.default": "parquet"},
                }
            ],
        }


    def _post_json(url: str, body: dict | None = None) -> dict:
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(
            url, data=data, headers={"Content-Type": "application/json"}, method="POST"
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            return json.loads(resp.read())


    def _get_json(url: str) -> dict:
        with urllib.request.urlopen(url, timeout=30) as resp:
            return json.loads(resp.read())




    # KubernetesExecutor 起的任务 pod 默认不带任何 resources(BestEffort
    # QoS)——排查一次任务被 SIGKILL(exit_code=-9)的问题时,在节点的
    # kernel OOM 日志里发现这台机器当时确实在被反复 OOM(`journalctl -k`,
    # 连 argocd-application-controller 都被连带杀了几次),BestEffort 的 pod
    # 天然是 OOM killer 第一批目标。加个最小的 resources request,不求解决这台
    # 机器整体资源紧张的根因,至少让这两个任务 pod 不是最先被杀的那批。
    #
    # pod_override 必须是真正的 kubernetes.client.models.V1Pod 对象,不能是
    # 普通 dict——第一次直接传 dict 时 KubernetesExecutor 内部
    # `PodGenerator.from_obj` 会做 isinstance(k8s.V1Pod) 检查,不通过就整个
    # executor_config 判定为 invalid,任务连 pod 都起不来就直接 fail(实测
    # 确认,不是猜的)。
    from kubernetes.client import models as k8s

    POD_OVERRIDE = {
        "pod_override": k8s.V1Pod(
            spec=k8s.V1PodSpec(
                containers=[
                    k8s.V1Container(
                        name="base",
                        resources=k8s.V1ResourceRequirements(
                            # 256Mi 太紧——实测任务 pod 直接被 SIGKILL(exit_code=
                            # -9,这次没有任何 Python 异常堆栈,是容器自己的
                            # cgroup 内存上限被打到,不是节点级别 OOM)。Airflow
                            # 3.x 的任务运行时(SDK supervisor 进程 + 解析整个
                            # DAG 文件)本身占用就不小,调到 512Mi。
                            requests={"cpu": "50m", "memory": "256Mi"},
                            limits={"memory": "512Mi"},
                        ),
                    )
                ]
            )
        )
    }


    @task(executor_config=POD_OVERRIDE)
    def submit_seatunnel_job(**context) -> str:
        # 一开始用 context['ts_nodash'] 拼作业名,这个 DAG 是 schedule=None 手动
        # 触发,没有真正的 logical_date/data_interval——实测确认 Airflow 3.x
        # 在这种情况下压根不会往 context 里塞 ts_nodash 这个键,直接 KeyError。
        # 改用 run_id(手动触发的 dag_run 也一定有,格式是
        # "manual__2026-...+00:00")清理成安全的作业名。
        run_id = context["run_id"]
        safe_run_id = run_id.replace(":", "").replace("+", "").replace(".", "")
        minio_key = Variable.get("minio_access_key")
        minio_secret = Variable.get("minio_secret_key")
        job_config = _build_job_config(minio_key, minio_secret)
        job_name = f"device-events-{safe_run_id}"
        result = _post_json(
            f"{SEATUNNEL_REST_URL}/hazelcast/rest/maps/submit-job?jobName={job_name}",
            job_config,
        )
        if result.get("status") == "fail":
            raise RuntimeError(f"SeaTunnel 拒绝提交作业: {result.get('message')}")
        job_id = result["jobId"]
        print(f"已提交 SeaTunnel 作业 {job_name},jobId={job_id}")
        return job_id


    @task(executor_config=POD_OVERRIDE)
    def wait_for_completion(job_id: str) -> None:
        # SeaTunnel REST API 没有"阻塞直到完成"的接口,只能轮询 job-info——这个
        # demo 作业量很小,预期几秒到十几秒内跑完,轮询间隔不用做得太精细。
        deadline = time.time() + 300
        while time.time() < deadline:
            info = _get_json(f"{SEATUNNEL_REST_URL}/hazelcast/rest/maps/job-info/{job_id}")
            status = info.get("jobStatus")
            print(f"jobId={job_id} status={status}")
            if status == "FINISHED":
                return
            if status in ("FAILED", "CANCELED", "UNKNOWABLE"):
                raise RuntimeError(f"SeaTunnel 作业 {job_id} 失败: {info.get('errorMsg')}")
            time.sleep(10)
        raise TimeoutError(f"SeaTunnel 作业 {job_id} 5 分钟内没跑完")


    # ---- ADR-011/ADR-051 之后补的表级血缘推送 ----
    # 设计:表名直接从 SeaTunnel job 配置结构里读(ADR-011 原文的思路),不解析
    # SQL——这个 DAG 的 sink 是 Iceberg 类型插件,配置里 namespace/table 是
    # 明写的字段。OpenMetadata 里这张表的 databaseService 固定是 "trino"、
    # database 固定是 "iceberg"(和 apps/table-registration-app/src/app.py 里
    # `databaseSchema: f"trino.{catalog}.{schema}"` 是同一个注册方式,这个平台
    # 目前所有 Iceberg 表都是经同一个 Trino service 注册进 OpenMetadata 的,
    # 不是每个数据管道各自另起一套)——SeaTunnel job 配置里自己的
    # `catalog_name`(这里是 "seatunnel")只是它自己连 Hive Metastore 用的
    # 内部命名,和 OpenMetadata 的服务名无关,这里不能直接拿来拼 FQN。
    OPENMETADATA_URL = "http://openmetadata.openmetadata.svc.cluster.local:8585"
    PIPELINE_SERVICE_NAME = "airflow-platform"


    def extract_sink_table_fqns(job_config: dict) -> list[str]:
        """从 SeaTunnel job 配置里的 sink 块提取真正落地的表(OpenMetadata FQN
        形式)。只认 Iceberg 类型的 sink——这个平台现在只有这一种表级 sink 在用,
        以后接 Jdbc/Hive 类型的 sink 时,这里要照着各自插件的字段名补对应分支,
        不能假设所有 sink 插件都用同一套 namespace/table 字段名。"""
        fqns = []
        for sink in job_config.get("sink", []):
            if sink.get("plugin_name") == "Iceberg":
                fqns.append(f"trino.iceberg.{sink['namespace']}.{sink['table']}")
        return fqns


    def _om_request(method: str, path: str, token: str, body: dict | None = None) -> dict | None:
        """OpenMetadata API 请求的通用封装。404 返回 None(调用方按"这个实体
        还不存在"处理,不是异常),其他错误正常抛出——这个函数不吞掉真实的
        权限/网络错误,只吞"实体不存在"这一种,呼应下面 idempotent 创建逻辑的
        "先查再建"模式。"""
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(
            f"{OPENMETADATA_URL}{path}",
            data=data,
            headers={"Content-Type": "application/json", "Authorization": f"Bearer {token}"},
            method=method,
        )
        try:
            with urllib.request.urlopen(req, timeout=20) as resp:
                body_text = resp.read()
                return json.loads(body_text) if body_text else None
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return None
            raise


    def _ensure_pipeline_service(token: str) -> None:
        if _om_request("GET", f"/api/v1/services/pipelineServices/name/{PIPELINE_SERVICE_NAME}", token):
            return
        _om_request(
            "POST",
            "/api/v1/services/pipelineServices",
            token,
            {
                "name": PIPELINE_SERVICE_NAME,
                "serviceType": "Airflow",
                "description": "这个平台自己的 Airflow 实例(apps/airflow),给数据管道的 Pipeline 血缘节点用",
                "connection": {
                    "config": {
                        "type": "Airflow",
                        "hostPort": "http://airflow-api-server.airflow.svc.cluster.local:8080",
                        "connection": {"type": "Backend"},
                    }
                },
            },
        )


    def _ensure_pipeline(token: str, dag_id: str) -> str:
        """返回这个 DAG 对应的 Pipeline 实体 id,不存在就先建(幂等)。"""
        existing = _om_request(
            "GET", f"/api/v1/pipelines/name/{PIPELINE_SERVICE_NAME}.{dag_id}", token
        )
        if existing:
            return existing["id"]
        created = _om_request(
            "POST",
            "/api/v1/pipelines",
            token,
            {
                "name": dag_id,
                "service": PIPELINE_SERVICE_NAME,
                "sourceUrl": f"http://airflow.local-lite.test/dags/{dag_id}",
            },
        )
        return created["id"]


    def _resolve_table_id(token: str, table_fqn: str) -> str | None:
        result = _om_request("GET", f"/api/v1/tables/name/{table_fqn}", token)
        return result["id"] if result else None


    @task(executor_config=POD_OVERRIDE)
    def push_lineage(**context) -> None:
        """把这次运行写进的表登记进 OpenMetadata 的血缘图(Pipeline -> Table)。
        OPENMETADATA_TOKEN 没配就静默跳过——和这个项目其他"可选凭据未配置就
        降级"的模式一致(见 permission-request-app 的 WECOM_WEBHOOK_URL),不
        应该因为血缘这个附加能力没配好就让整条数据管道失败。目标表如果还没在
        OpenMetadata 里注册(比如还没通过 table-registration-app 建过),同样
        只记日志跳过,不是报错——这属于"目录信息滞后于实际数据"的正常过渡态,
        不是这个任务自己的 bug。"""
        token = Variable.get("openmetadata_token", default="")
        if not token:
            print("openmetadata_token 未配置,跳过血缘推送")
            return

        job_config = _build_job_config("", "")  # 只读 sink 结构,凭据字段这里用不到
        sink_fqns = extract_sink_table_fqns(job_config)
        if not sink_fqns:
            print("这个 job 配置里没有可识别的表级 sink,没有血缘可推送")
            return

        _ensure_pipeline_service(token)
        pipeline_id = _ensure_pipeline(token, context["dag"].dag_id)

        for fqn in sink_fqns:
            table_id = _resolve_table_id(token, fqn)
            if not table_id:
                print(f"目标表 {fqn} 还没在 OpenMetadata 里注册,跳过这条血缘边")
                continue
            _om_request(
                "PUT",
                "/api/v1/lineage",
                token,
                {
                    "edge": {
                        "fromEntity": {"id": pipeline_id, "type": "pipeline"},
                        "toEntity": {"id": table_id, "type": "table"},
                    }
                },
            )
            print(f"已推送血缘边:pipeline {context['dag'].dag_id} -> table {fqn}")

    with DAG(
        dag_id="seatunnel_device_events",
        description="SeaTunnel FakeSource -> Iceberg(demo.device_events),验证 Phase 2 数据工程主线",
        start_date=datetime(2026, 8, 1),
        # 2026-08-29:从 schedule=None 改成定时。
        #
        # **为什么反悔**:这些 DAG 原本刻意设成手动触发("验证链路用的 demo,
        # 不是常驻定时任务")。但 08-29 做 dbt 血缘时撞到后果——dbt 产物是
        # `dbt_demo` 产出的,而它从 08-22 推倒重建之后就没人跑过,
        # `s3://lakehouse/dbt-artifacts/` **压根是空的**,血缘无从谈起。
        # 特征物化同理:不跑,Redis 里的在线特征就一直是旧的。
        # 一个"什么都要人手动点一下才会发生"的平台,谈不上生产可用。
        #
        # **为什么是这个时间**:三条 DAG 错开,不要在同一时刻和开机时几十个
        # 组件抢资源(Trino 就因为开机满载被 startupProbe 杀过,见
        # apps/components/trino.yaml)。`catchup=False` 保持不变——这台机器
        # 大部分时间关机,补跑历史区间没有意义,开机后跑最近这一次就够了。
        schedule="0 3 * * *",  # 每天 03:00 UTC,和前两条错开
        catchup=False,
        tags=["demo", "phase2", "seatunnel", "iceberg"],
    ) as dag:
        job_id = submit_seatunnel_job()
        wait_for_completion(job_id) >> push_lineage()
  feast_materialize.py: |
    # 定时把 Feast 的离线特征(Spark 读 Iceberg)物化进 Redis 在线存储,见
    # docs/decisions/042-feast-feature-store.md。
    #
    # 用 KubernetesPodOperator 而不是 @task(跑在 Airflow worker 自带的镜像
    # 里)——feast+pyspark+JRE 这套依赖不轻(pyspark 一个包解压后几百 MB),
    # 每次任务运行现装一遍既慢又占带宽。改用
    # apps/feast/feature-server-image/Dockerfile 构建的自定义镜像(和 Feast
    # Serving 本身用的是同一个镜像,見那份 Dockerfile 顶部注释——两边都要
    # pyspark+JRE 是 Feast 自身的架构限制,不是各自单独的选择)。
    #
    # 2026-08-20(BACKLOG 2.1):这个镜像从"只在本地 docker 里,image_pull_
    # policy=Never"改成 GitHub Actions 自动构建推 GHCR,digest 引用 +
    # IfNotPresent——不再要求"这台机器之前手动 build 过"这个隐藏前提,换
    # 到真正的多节点集群也不用再单独处理镜像分发。
    from __future__ import annotations

    from datetime import datetime

    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator
    from airflow.sdk import DAG
    from kubernetes.client import models as k8s

    FEAST_IMAGE = "crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/feast-feature-server:97301dd24915009cd6cd77bb62af9eb931d026cf"

    # feature_store.yaml/definitions.py 权威源是 scripts/feast_feature_repo/,
    # 部署态的拷贝在 apps/feast/manifests/feature-repo-configmap.yaml——和
    # Feast Serving 的 feature_store_yaml_base64 是同一类"chart/Operator 只认
    # 静态内容,不能引用仓库里的文件"限制,不是这次偷懒复制的。
    # 2026-08-14 实测发现:整个 ConfigMap 目录挂进去,`feast apply` 会报
    # `TypeError: the 'package' argument is required to perform a relative
    # import for '..2026_08_14_10_28_51.1747361403.definitions'`——和
    # Airflow 自己挂 DAG 目录踩过的坑(见上面 DAGS 相关注释)是同一个原因:
    # ConfigMap 卷靠 `..data` 软链 + 带时间戳的隐藏目录做原子更新,Feast 解析
    # `definitions.py` 时(`importlib.import_module`)顺着软链解析到真实路径,
    # 把这个时间戳目录名当成了 Python 包路径的一部分,relative import 直接
    # 炸掉。用 subPath 分别挂每个文件,绕开这层目录结构,和 dags-configmap 的
    # 挂法一致。代价同样是 ConfigMap 改了以后这两个文件不会自动热更新,需要
    # 重启相关 pod(这里是每次任务起新 pod,天然没有这个问题)。
    FEATURE_REPO_VOLUME = k8s.V1Volume(
        name="feature-repo",
        config_map=k8s.V1ConfigMapVolumeSource(name="feast-feature-repo"),
    )
    FEATURE_REPO_MOUNT = [
        k8s.V1VolumeMount(
            name="feature-repo",
            mount_path="/feature_repo/feature_store.yaml",
            sub_path="feature_store.yaml",
        ),
        k8s.V1VolumeMount(
            name="feature-repo",
            mount_path="/feature_repo/definitions.py",
            sub_path="definitions.py",
        ),
    ]

    # 2026-08-14 实测发现:光有 MINIO_ACCESS_KEY/MINIO_SECRET_KEY 不够。
    # registry(type: file, s3:// path)走的是 Feast 自己的 boto3/pyarrow S3
    # 客户端,认标准 AWS_* 环境变量,不是这两个——那两个只在 feature_store.yaml
    # 的 offline_store.spark_conf 里 ${env.*} 替换生效,是 Hadoop S3A 客户端的
    # 配置面,和 boto3 是两条完全独立的路径。缺了 AWS_* 这组,`feast apply`
    # 建 Registry 时直接报 botocore.exceptions.NoCredentialsError。和
    # apps/feast/manifests/feature-server.yaml 里 Feast Serving 自己踩过、
    # 已经修过的同一个坑,这次是 DAG 这边独立配置的 env,没有共享,也要补一份。
    MINIO_ENV = [
        k8s.V1EnvVar(
            name="MINIO_ACCESS_KEY",
            value_from=k8s.V1EnvVarSource(
                secret_key_ref=k8s.V1SecretKeySelector(name="minio-root", key="rootUser")
            ),
        ),
        k8s.V1EnvVar(
            name="MINIO_SECRET_KEY",
            value_from=k8s.V1EnvVarSource(
                secret_key_ref=k8s.V1SecretKeySelector(name="minio-root", key="rootPassword")
            ),
        ),
        k8s.V1EnvVar(
            name="AWS_ACCESS_KEY_ID",
            value_from=k8s.V1EnvVarSource(
                secret_key_ref=k8s.V1SecretKeySelector(name="minio-root", key="rootUser")
            ),
        ),
        k8s.V1EnvVar(
            name="AWS_SECRET_ACCESS_KEY",
            value_from=k8s.V1EnvVarSource(
                secret_key_ref=k8s.V1SecretKeySelector(name="minio-root", key="rootPassword")
            ),
        ),
        k8s.V1EnvVar(name="AWS_ENDPOINT_URL_S3", value="http://minio.minio.svc.cluster.local:9000"),
        k8s.V1EnvVar(name="AWS_DEFAULT_REGION", value="us-east-1"),
        # 2026-08-14 实测发现:容器用的是官方 quay.io/feastdev/feature-server
        # 镜像原生的 USER 1001(数字 UID,/etc/passwd 里没有对应条目,常见的
        # OpenShift 风格"任意 UID"镜像惯例)。Spark/Hadoop 启动时
        # UserGroupInformation.getCurrentUser() 会走 JVM 的 UnixLoginModule,
        # 靠 OS 层查用户名,查不到就抛
        # `KerberosAuthException: ... NullPointerException: invalid null
        # input: name`,把整个 spark-submit 直接搞崩(Java gateway 进程还没起
        # 来就退出,PySpark 报 JAVA_GATEWAY_EXITED)。
        # 补充(实测):单独设 HADOOP_USER_NAME 不够——UnixLoginModule 在
        # doSubjectLogin 里是先建 Subject(这一步就是崩溃点),HADOOP_USER_NAME
        # 是后一步才生效的"改名"机制,不能跳过前面这步。真正绕开的办法是让容器
        # 以 UID 0(root)跑,见下面 BASE_KWARGS 里的 security_context——root 的
        # /etc/passwd 查找天然不会失败。HADOOP_USER_NAME 留着不影响正确性,一起
        # 保留。
        k8s.V1EnvVar(name="HADOOP_USER_NAME", value="feast"),
    ]

    # KubernetesExecutor 这台机器上默认 BestEffort QoS 的 pod 是 OOM killer
    # 第一目标(见 seatunnel_device_events.py 里同样的教训),pyspark 本地模式
    # 启动一个 JVM,内存要给够,不能沿用那个 DAG 的 256Mi/512Mi。这是
    # KubernetesPodOperator 实际拉起来跑 feast 命令那个目标 pod(在 feast
    # 命名空间)的资源。
    CONTAINER_RESOURCES = k8s.V1ResourceRequirements(
        requests={"cpu": "300m", "memory": "1Gi"},
        limits={"memory": "2Gi"},
    )

    # 这条是另一层、容易漏掉的坑:KubernetesPodOperator 自己的调度/轮询逻辑
    # 跑在 KubernetesExecutor 起的"任务运行时" pod 里(在 airflow 命名空间,
    # 不是上面 CONTAINER_RESOURCES 覆盖的那个 feast 命名空间 pod)——这层用的
    # 是平台级默认值(apps/definitions/airflow.yaml 里 workers.kubernetes.
    # resources,256Mi/512Mi),第一次跑就被实测证实不够:任务进程直接
    # SIGKILL(exit_code=-9),不是我这次自定义的目标 pod 出问题。和
    # seatunnel_device_events.py 的 POD_OVERRIDE 是同一个坑,同一个修法,只是
    # 这里在这条 DAG 里第一次真正踩到。
    #
    # 2026-08-14 补充:光加够资源还不够。这台机器 CPU request 常态接近满载
    # (ADR-041 记录过),这个 pod 之前没设 priorityClassName,默认优先级最低,
    # 实测被另一个更高优先级的 pod 抢占杀掉(kubectl get events 里能看到明确
    # 的 Preempted 记录,pod 起来还没 260ms 就被杀,不是业务逻辑报错)。补上
    # ADR-041 已经定义好的 batch 优先级(见 platform/priority-classes/),
    # 这层和下面 CONTAINER_RESOURCES 对应的目标 pod 都要加,不能只加一层。
    EXECUTOR_POD_OVERRIDE = {
        "pod_override": k8s.V1Pod(
            spec=k8s.V1PodSpec(
                priority_class_name="batch",
                containers=[
                    k8s.V1Container(
                        name="base",
                        resources=k8s.V1ResourceRequirements(
                            requests={"cpu": "100m", "memory": "512Mi"},
                            limits={"memory": "1Gi"},
                        ),
                    )
                ]
            )
        )
    }

    # 2026-08-14 实测发现:get_logs=True 在这台机器上会把任务拖垮,不是
    # feast/Spark 本身的问题。本机代理软件拦截了走 kubelet containerLogs 的
    # 流量(docs/operations/troubleshooting.md 里"kubectl logs/exec 报
    # Internal Privoxy Error"那条已经记过,任何走这条路径的组件都会撞上,不只
    # 是本机 kubectl),KubernetesPodOperator 的 get_logs=True 内部走的是同一条
    # 路径,反复 ApiException(500)重试(1/2/4/8秒退避)大概两分半后放弃、直接
    # 把还在正常跑的 pod 删掉判定失败——实测确认业务逻辑(建 Registry、解析
    # Spark 依赖)当时都是成功的,纯粹是读日志流这条路把整个任务拖死。关掉
    # get_logs,operator 改成只轮询 pod phase(走 K8s API,不经过 kubelet
    # containerLogs,不受影响)判断成功/失败,日志本来就有 Loki/Alloy 兜底
    # (见 troubleshooting.md 里同一条记录的"从设计上完全绕开这条路径")。
    # 让容器以 root(UID 0)跑,绕开上面 HADOOP_USER_NAME 那条注释说的
    # UnixLoginModule 崩溃——root 的 /etc/passwd 查找天然能成功。这是本机
    # local-lite 阶段的务实选择,不是长期方案:更干净的修法是重新 build
    # apps/feast/feature-server-image 时在 entrypoint 里给 UID 1001 动态补一条
    # /etc/passwd(常见的"任意 UID"镜像 nss_wrapper 套路),留作后续课题,记进
    # ADR-042。
    ROOT_SECURITY_CONTEXT = k8s.V1PodSecurityContext(run_as_user=0)

    BASE_KWARGS = dict(
        namespace="feast",
        image=FEAST_IMAGE,
        image_pull_policy="IfNotPresent",
        volumes=[FEATURE_REPO_VOLUME],
        volume_mounts=FEATURE_REPO_MOUNT,
        env_vars=MINIO_ENV,
        container_resources=CONTAINER_RESOURCES,
        priority_class_name="batch",
        security_context=ROOT_SECURITY_CONTEXT,
        get_logs=False,
        is_delete_operator_pod=True,
        startup_timeout_seconds=300,
        executor_config=EXECUTOR_POD_OVERRIDE,
    )

    with DAG(
        dag_id="feast_materialize",
        description="feast apply + materialize-incremental,离线 Iceberg 特征刷新到 Redis 在线存储",
        start_date=datetime(2026, 8, 1),
        # 演示/验证阶段手动触发为主,先不定时跑——demo 数据是固定的历史订单,
        # 定时物化不会产生新增量,意义不大。真的接入会持续变化的数据源之后,
        # 再按需要的新鲜度设置 schedule(比如每小时)。
        # 2026-08-29:从 schedule=None 改成定时。
        #
        # **为什么反悔**:这些 DAG 原本刻意设成手动触发("验证链路用的 demo,
        # 不是常驻定时任务")。但 08-29 做 dbt 血缘时撞到后果——dbt 产物是
        # `dbt_demo` 产出的,而它从 08-22 推倒重建之后就没人跑过,
        # `s3://lakehouse/dbt-artifacts/` **压根是空的**,血缘无从谈起。
        # 特征物化同理:不跑,Redis 里的在线特征就一直是旧的。
        # 一个"什么都要人手动点一下才会发生"的平台,谈不上生产可用。
        #
        # **为什么是这个时间**:三条 DAG 错开,不要在同一时刻和开机时几十个
        # 组件抢资源(Trino 就因为开机满载被 startupProbe 杀过,见
        # apps/components/trino.yaml)。`catchup=False` 保持不变——这台机器
        # 大部分时间关机,补跑历史区间没有意义,开机后跑最近这一次就够了。
        schedule="0 2 * * *",  # 每天 02:00 UTC,和 dbt 错开一小时
        catchup=False,
        tags=["demo", "phase3.5", "feast", "feature-store"],
    ) as dag:
        # KubernetesPodOperator 这个版本没有 working_dir 参数(实测 TypeError
        # 才发现,inspect.signature 确认这个 provider 版本压根不支持),feast
        # apply/materialize 又必须在包含 feature_store.yaml 的目录下跑,改用
        # sh -c 手动 cd 到挂载点。
        apply = KubernetesPodOperator(
            task_id="feast_apply",
            name="feast-apply",
            cmds=["sh", "-c"],
            arguments=["cd /feature_repo && feast apply"],
            **BASE_KWARGS,
        )

        # materialize-incremental 的截止时间用当前 UTC 时间,把从上次物化以来
        # (或者第一次跑的话,从 FeatureView 的 ttl 往前推)新增的特征值刷进
        # Redis——不是重新物化全部历史,增量语义。
        # 2026-08-14 实测发现:`{{ ts }}` 这个 Airflow 模板变量在这条 DAG 上
        # 渲染报 `UndefinedError: 'ts' is undefined`——`schedule=None`、手动
        # 触发的 DAG Run 没有 data_interval,`ts`/`ds` 这类基于调度时间的宏
        # 都是未定义的,不是 Airflow 3.x 废弃了这个宏(带 schedule 的 DAG 上
        # 这个宏还能正常用)。改成直接在 shell 里取当前 UTC 时间,不依赖
        # Airflow 的模板渲染上下文,手动触发/定时触发都能一致工作。
        materialize = KubernetesPodOperator(
            task_id="feast_materialize_incremental",
            name="feast-materialize-incremental",
            cmds=["sh", "-c"],
            arguments=[
                "cd /feature_repo && "
                "feast materialize-incremental \"$(date -u +%Y-%m-%dT%H:%M:%S)\""
            ],
            **BASE_KWARGS,
        )

        apply >> materialize
  dbt_demo.py: |
    # 分析师开发平台(ADR-012)最小骨架:dbt build 一遍这个平台的 demo 项目
