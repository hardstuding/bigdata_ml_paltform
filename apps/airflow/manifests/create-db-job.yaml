# Postgres 已经在跑了(不是首次启动),没法再靠 docker-entrypoint-initdb.d
# 建库(那套只在数据目录第一次初始化时执行,见 apps/postgres/manifests/
# init-configmap.yaml 的用法)。用一个 Job 在已运行的实例上补建 airflow
# 专用库/用户,SQL 本身写成幂等的(存在就跳过),可以放心让 ArgoCD 每次
# sync 都重新跑一次。
#
# 注意:不要给这个 Job 加 argocd.argoproj.io/hook 之类的 hook 注解——
# 这个 Application 里只有这一个资源,没有"其他常规资源同步完成"这个前提,
# hook 触发条件永远不满足,Job 实际上从来不会执行,但 Application 会因为
# "没有资源不健康"而误报 Healthy。踩过这个坑,细节见
# docs/operations/troubleshooting.md。就用普通资源,靠上面的幂等 SQL +
# backoffLimit 重试保证正确性。
# 【可插拔基础设施,见 ADR-030】接外部 Postgres 就别装这个 Job——数据库该
# 由 DBA 按平时流程建,同时把 apps/definitions/airflow.yaml 里
# airflow-metadata 这个 Secret 的 connection 值改成外部实例的 DSN。
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-create-db
  namespace: data
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-db
          image: postgres:16.6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-root
                  key: password
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-db
                  key: password
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # 见 apps/mlflow/manifests/create-db-job.yaml 的注释:同一个
              # "刚创建的 pod 第一次连接 Postgres 有短暂延迟"的坑,每个
              # backoffLimit 重试都是全新 pod、各自要重新等,容易把重试
              # 次数耗尽——用 pg_isready 在同一个 pod 内先等到位。
              for i in $(seq 1 10); do
                pg_isready -h postgres -U postgres >/dev/null 2>&1 && break
                echo "第 ${i} 次探测 postgres 未就绪,3 秒后重试" >&2
                sleep 3
              done
              psql -h postgres -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='airflow'" | grep -q 1 \
                || psql -h postgres -U postgres -c "CREATE USER airflow WITH PASSWORD '${AIRFLOW_DB_PASSWORD}';"
              psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 \
                || psql -h postgres -U postgres -c "CREATE DATABASE airflow OWNER airflow;"
