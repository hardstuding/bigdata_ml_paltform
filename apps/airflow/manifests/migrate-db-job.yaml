# chart 自带的 migrateDatabaseJob 是 Helm 原生 hook(post-install,
# post-upgrade),ArgoCD 对这类 hook 的处理是"等主 Sync 阶段的资源都健康了
# 才触发 PostSync"——但这里刚好是个死锁:Deployment 的 wait-for-airflow-
# migrations 这个 initContainer 要等 migrate job 跑完才能启动,Deployment
# 永远到不了 Healthy,PostSync 永远不触发,migrate job 永远不会被创建
# (`kubectl get jobs -n airflow` 空的,`argocd app` 的 syncResult 里也没有
# 这个 Job,只有它的 ServiceAccount——实测确认过,不是猜的)。
#
# 和 apps/airflow/manifests/create-db-job.yaml 踩过的坑是同一类:这个仓库
# 已经在别处明确记录过"不要给 Job 加 argocd.argoproj.io/hook 之类的 hook
# 注解"这个教训,这次是 chart 自带的 Helm hook 触发了同一类问题。改成普通
# 资源,不依赖任何 hook 语义——`airflow db migrate` 本身是幂等的(没有新
# migration 时是空操作),可以放心每次 sync 都重新跑。命令/环境变量照抄
# chart 渲染出来的 migrate-database-job.yaml(`helm template airflow
# airflow/airflow --version 1.22.0` 核对过)。
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-migrate-db
  namespace: airflow
spec:
  ttlSecondsAfterFinished: 300
  # 2026-08-22 推倒重建验证抓到的**唯一一个真实冷启动 bug**:全新集群上,
  # 这个 Job 和 Postgres(CloudNativePG 建集群)、airflow-create-db(建库)
  # 是同时被 ArgoCD 创建的。库还不存在的那一两分钟里,`airflow db migrate`
  # 连着失败三次就把 backoffLimit 烧光,Job 变成永久 Failed——**而 Job 一旦
  # Failed 就不会自己重试,ArgoCD 也不会重建它**(manifest 没变,在它看来
  # 已经 in-sync)。结果是 airflow-db-init 这个 Application 永远 Degraded,
  # Airflow 起不来,而且没有任何东西会自愈,必须人工 `kubectl delete job`。
  #
  # 光调大 backoffLimit 只是把竞态窗口拉宽,治标。真正的修法是**先等依赖
  # 就绪再开始算重试次数**:下面 args 里加了一个有上限的等待循环。
  backoffLimit: 3
  template:
    metadata:
      labels:
        tier: airflow
        component: migrate-db
    spec:
      restartPolicy: OnFailure
      serviceAccountName: airflow-migrate-database-job
      securityContext:
        runAsUser: 50000
        fsGroup: 0
      containers:
        - name: migrate-db
          image: apache/airflow:3.2.2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          args:
            - bash
            - -c
            - |
              # 等 Postgres 和 airflow 这个库真的可连(见上面 backoffLimit
              # 那段注释)。`airflow db check` 就是 chart 自己的
              # wait-for-airflow-migrations initContainer 用的同一个命令,
              # 不是自己发明的探测方式。
              #
              # 上限 60 次 × 5 秒 = 5 分钟,不是无限等——真的连不上要让 Job
              # 失败、在 ArgoCD 上显示出来,而不是挂在那里假装还在初始化
              # (这个仓库对"卡住看起来像在工作"的容忍度很低)。
              for i in $(seq 1 60); do
                if airflow db check; then break; fi
                echo "[$i/60] 数据库还连不上(全新集群上 Postgres/建库可能还没好),5 秒后重试"
                sleep 5
              done
              exec airflow db migrate
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AIRFLOW_HOME
              value: /opt/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-fernet-key
                  key: fernet-key
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-metadata
                  key: connection
