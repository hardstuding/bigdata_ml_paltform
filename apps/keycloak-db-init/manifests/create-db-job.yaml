# 和 mlflow 的 create-db-job.yaml 同样的模式,跑在 keycloak 命名空间,连
# Postgres 用完整域名,见 docs/operations/troubleshooting.md。
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-create-db
  namespace: keycloak
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-db
          image: postgres:16.6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-root
                  key: password
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # 见 apps/mlflow/manifests/create-db-job.yaml 的注释:同一个
              # "刚创建的 pod 第一次连接 Postgres 有短暂延迟"的坑,每个
              # backoffLimit 重试都是全新 pod、各自要重新等,容易把重试
              # 次数耗尽——用 pg_isready 在同一个 pod 内先等到位。
              for i in $(seq 1 10); do
                pg_isready -h postgres.data.svc.cluster.local -p 5432 -U postgres >/dev/null 2>&1 && break
                echo "第 ${i} 次探测 postgres 未就绪,3 秒后重试" >&2
                sleep 3
              done
              psql -h postgres.data.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='keycloak'" | grep -q 1 \
                || psql -h postgres.data.svc.cluster.local -U postgres -c "CREATE USER keycloak WITH PASSWORD '${KEYCLOAK_DB_PASSWORD}';"
              psql -h postgres.data.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 \
                || psql -h postgres.data.svc.cluster.local -U postgres -c "CREATE DATABASE keycloak OWNER keycloak;"
