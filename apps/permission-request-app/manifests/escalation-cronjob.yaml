# 表访问审批的超时提醒/升级(ADR-045)。每小时调一次
# permission-request-app 自己的 /internal/escalation-check 端点,真正的
# 判断逻辑(等了多久、要不要升级、通知谁)都在 app 自己的代码里——这个
# CronJob 只是个定时触发器,不直接碰数据库(那个 PVC 是 ReadWriteOnce,
# 两个进程同时开着写有并发风险,让唯一在跑的那个 app 进程自己处理更安全,
# 不是这个 CronJob 图省事)。
#
# 用 curlimages/curl 而不是 python:3.12-slim + apt-get,这个任务只需要发
# 一个 HTTP POST,没必要背上 apt-get 卡死那整套坑(见
# apps/iam-sync/manifests/cronjob.yaml 的详细教训)——能不装包就不装包。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: permission-request-app-escalation
  namespace: permission-request-app
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      template:
        metadata:
          # 要和 platform/network-policies/manifests/permission-request-app.yaml
          # 里 allow-escalation-cronjob-to-app 那条规则的 podSelector 对上,
          # 不然会被 default-deny-ingress 挡住连不上 app(实测撞过这个坑)。
          labels:
            app: permission-request-app-escalation
        spec:
          # 见 ADR-041(队列资源管理):定时批处理任务,归 batch 档。
          priorityClassName: batch
          restartPolicy: Never
          containers:
            - name: escalation-check
              image: curlimages/curl:8.11.0
              env:
                - name: INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: permission-request-app-internal
                      key: token
              command:
                - sh
                - -c
                - |
                  # --retry-connrefused:实测撞到过的真实坑,Job 的 pod 刚起来时
                  # NetworkPolicy 规则还没在这台机器的 CNI 上生效完,第一次连接
                  # 直接 Connection refused(不是网络不通,是这条新 pod 的
                  # NetworkPolicy 规则有几秒生效延迟)。普通 --retry 默认不会
                  # 重试"连接被拒",要显式加这个选项才会重试。
                  BASE=http://permission-request-app.permission-request-app.svc.cluster.local:8080
                  CURL="curl -fsS -m 30 --retry 5 --retry-delay 2 --retry-connrefused -X POST -H X-Internal-Token:${INTERNAL_TOKEN}"

                  $CURL $BASE/internal/escalation-check

                  # 顺带重试"审批通过了但授权没写进 git"的那些(2026-08-29)。
                  # 挂在这个已有的每小时任务里,而不是新建一个 CronJob:
                  # 它要做的事只是"扫一遍卡住的、重试一次",和升级检查同一个
                  # 节奏就够,不值得为它多一个组件、多一份服务目录条目。
                  # **失败不让整个 Job 变红**——升级检查是主业,补写授权失败
                  # 下一轮还会再试,不该因为它把告警噪音抬起来。
                  $CURL $BASE/internal/retry-pending-applies || \
                    echo "retry-pending-applies 这一轮失败了,下一轮会再试" 
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 64Mi
