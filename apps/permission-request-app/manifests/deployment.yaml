# 见 docs/decisions/032-permission-request-app.md。用官方 python:3.12-slim
# 镜像,启动时 pip install flask + 跑挂载进来的 ConfigMap 源码,不需要建
# 一个专门的容器镜像仓库——和 apps/iam-sync/ 那个 CronJob 是同一个模式。
#
# GIT_TOKEN 从 Secret 读,这个 Secret 需要人手动建(不是任何脚本自动生成
# 的——git 写权限是敏感凭据,不能由自动化流程自己造一个):
#   kubectl -n permission-request-app create secret generic permission-request-app-git \
#     --from-literal=token=<GitHub fine-grained PAT,scope 到这一个仓库,contents:write 权限>
# 没建这个 Secret 之前,app 仍然能跑、能收申请、能批准,只是批准后不会自动
# push,会在页面上提示需要哪一行手动加进 platform/iam/memberships.csv。
#
# OPENMETADATA_TOKEN(ADR-044,表访问分级审批要查表的安全等级/负责人):
# 复用 table-registration-app 那个 table-registration-bot 的同一个 token
# 值就行,不用在 OpenMetadata 里再建一个 bot——Secret 是按命名空间隔离的,
# 这里要单独建一份(值一样,名字不一样):
#   kubectl -n permission-request-app create secret generic permission-request-app-openmetadata \
#     --from-literal=token=<和 table-registration-app-openmetadata 一样的 token>
# 没建这个 Secret 之前,组权限申请(加入某个组)不受影响,只是表访问申请
# 提交时会查不到安全等级,直接被拒绝并提示原因。
#
# ADR-045(可插拔审批后端 + 通知/升级/交接/审计)新增的凭据:
# - internal-token(permission-request-app-internal Secret):纯内部
#   CronJob->app 调用用的共享密钥,不需要人工判断,scripts/00-generate-
#   secrets.sh 已经自动生成,不用手动建。
# - WECOM_WEBHOOK_URL / EXTERNAL_OA_WEBHOOK_URL / EXTERNAL_OA_CALLBACK_TOKEN:
#   都是可选的,不配就走降级路径(通知静默跳过;可插拔审批后端保持
#   APPROVAL_BACKEND=local 不受影响)。要配的话:
#     kubectl -n permission-request-app create secret generic permission-request-app-notify \
#       --from-literal=wecom-webhook-url=<企业微信群机器人 webhook> \
#       --from-literal=external-oa-webhook-url=<外部 OA 系统接收地址,可插拔可留空> \
#       --from-literal=external-oa-callback-token=<外部 OA 回调时要带的共享密钥,可插拔可留空>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: permission-request-app-data
  namespace: permission-request-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permission-request-app
  namespace: permission-request-app
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce 的 PVC,滚动升级会导致新旧 Pod 抢同一个卷,直接重建更简单
  selector:
    matchLabels:
      app: permission-request-app
  template:
    metadata:
      labels:
        app: permission-request-app
    spec:
      # 见 ADR-041(队列资源管理):人在等审批结果,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              # 2026-08-13 加固:同一个 apt-get 卡死的坑再次踩到(见
              # apps/iam-sync/manifests/cronjob.yaml 的注释——apt 自己的
              # "delayed item" 重试队列不受 Acquire::Retries 约束,会卡死
              # 循环,不受普通超时选项控制)。这次是重启这个 Deployment 去
              # 生效新配的 GIT_TOKEN Secret 时实测复现:apt-get update 卡住
              # 不动超过 9 分钟(`crictl exec` 进容器确认一条 ESTABLISHED
              # 的 TCP 连接一直不传数据,不是慢,是真的卡死),外面套
              # `timeout -k 10 90` 是同一个已验证过的修法。
              timeout -k 10 90 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 update -qq
              timeout -k 10 90 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 install -y -qq git >/dev/null
              pip install --quiet --timeout 30 flask requests
              python3 /src/app.py
          env:
            # 2026-08-14 补:table-registration-app 那边同一个 python:3.12-slim
            # 起手式一直没配代理,连续 6 次 pip install 超时崩溃才发现漏了
            # 这个(iam-sync CronJob 早就配了)。这里当时是运气好没踩到,
            # 一起补上,不要等它也开始随机崩溃才修。
            - name: HTTP_PROXY
              value: "http://192.168.5.2:1087"
            - name: HTTPS_PROXY
              value: "http://192.168.5.2:1087"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16"
            - name: DB_PATH
              value: /data/requests.db
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-git
                  key: token
                  optional: true  # 没建这个 Secret 时,GIT_TOKEN 就是空字符串,走降级路径
            # 【可插拔基础设施,见 ADR-030】换外部 OpenMetadata 实例改这个 URL,
            # 和 table-registration-app 保持一致。
            - name: OPENMETADATA_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-openmetadata
                  key: token
                  optional: true  # 没建这个 Secret 时,表访问申请会直接被拒绝并提示原因
            - name: DESIGNATED_ADMIN
              value: admin  # ADR-040 里"安全等级3再加指定负责人"这个人,不是从组织架构推导的
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-internal
                  key: token
                  optional: true  # 没有就是空字符串,/internal/escalation-check 会直接拒绝所有请求(拒绝比误开安全)
            - name: WECOM_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-notify
                  key: wecom-webhook-url
                  optional: true
            - name: APPROVAL_BACKEND
              value: local  # 改成 webhook 才会启用下面两个变量,见 ADR-045
            - name: EXTERNAL_OA_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-notify
                  key: external-oa-webhook-url
                  optional: true
            - name: EXTERNAL_OA_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: permission-request-app-notify
                  key: external-oa-callback-token
                  optional: true
            - name: ESCALATION_HOURS
              value: "48"
            - name: GRANT_EXPIRY_DAYS
              value: "180"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: src
              mountPath: /src
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: src
          configMap:
            name: permission-request-app-src
        - name: data
          persistentVolumeClaim:
            claimName: permission-request-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: permission-request-app
  namespace: permission-request-app
spec:
  selector:
    app: permission-request-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
