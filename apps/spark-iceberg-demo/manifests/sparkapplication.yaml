# 验证 Spark 能读写 Iceberg 表(见 docs/decisions/036-spark-iceberg-pipeline.md)
# 这个一次性验证用的资源,不是常驻组件,不走 GitOps 管理(和
# kserve-demo/scripts/08 建的 Superset demo 是同一类东西)。
#
# 2026-08-21 起用自建镜像(apps/spark-iceberg-image/),Iceberg/S3A 的三个
# jar 在**构建期**就打进 $SPARK_HOME/jars/。此前是官方 apache/spark 镜像 +
# `spark.jars.packages` 运行时从 Maven Central 现拉——那条路在 cloud-full
# 上会卡死(实测:aws-java-sdk-bundle 下载进度停在 0 字节 8 分钟以上),
# 也是"批处理引擎"这条链路一直没法重新验证的直接原因。
#
# hadoop-aws 版本特意不跟 Trino/Hive Metastore 那边保持一致(那两处是
# 3.4.1/3.1.0,各自匹配自己镜像内置的 hadoop-common)——这里必须匹配
# apache/spark:3.5.9-python3 自己镜像内置的 hadoop-client-api/runtime
# 版本,实测是 3.3.4(`docker run --entrypoint sh apache/spark:3.5.9-python3
# -- ls /opt/spark/jars/ | grep hadoop-client` 确认),不是 3.4.1。塞一个
# 3.4.1 的 hadoop-aws 进去会在真正读表时报
# ClassNotFoundException: org.apache.hadoop.fs.BulkDelete(这个类是 Hadoop
# 3.4.0 才加的批量删除 API,3.3.4 里没有)。hadoop-aws 3.3.4 对应的 AWS SDK
# 也不是 Trino 那边用的 SDK v2(software.amazon.awssdk),是 SDK v1 的
# aws-java-sdk-bundle:1.12.262(查的是 hadoop-aws:3.3.4 那份 POM 里
# aws-java-sdk.version 属性)。iceberg-spark-runtime 版本见下面 1.10.0 那条
# 注释。
#
# Hive Metastore URI 和 S3A 端点配置照抄 apps/hive-metastore/manifests/
# core-site-configmap.yaml(和 Trino 连的是同一个 Hive Metastore、同一个
# MinIO warehouse,这是验证"湖仓"这个词的关键——不是自己另起一套)。
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-iceberg-demo
  namespace: spark-operator
spec:
  type: Python
  mode: cluster
  # 2026-08-21:从官方 apache/spark:3.5.9-python3 换成自建镜像——Iceberg/
  # hadoop-aws/aws-sdk 三个 jar 已经在构建期打进 $SPARK_HOME/jars/,不再靠
  # spark.jars.packages 在运行时拉(那条路在这台云主机上会卡死,见
  # apps/spark-iceberg-image/Dockerfile 里的完整说明和实测数据)。
  image: ghcr.io/hardstuding/bigdata_ml_paltform/spark-iceberg@sha256:afbf3cd189045744417d1dc5813fdb31d8664f2e8d080ef512ec947c2012de5b
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark-demo/spark_iceberg_demo.py
  sparkVersion: "3.5.9"
  sparkConf:
    spark.sql.catalog.iceberg: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.iceberg.type: hive
    spark.sql.catalog.iceberg.uri: thrift://hive-metastore.data.svc.cluster.local:9083
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.hadoop.fs.s3a.endpoint: http://minio.minio.svc.cluster.local:9000
    spark.hadoop.fs.s3a.access.key: ${env.MINIO_ACCESS_KEY}
    spark.hadoop.fs.s3a.secret.key: ${env.MINIO_SECRET_KEY}
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    # 2026-08-21:**这两行以前完全没有,所以 Spark History Server 从部署那天
    # 起就是空的**。History Server 读的是 s3a://spark-logs/(见
    # apps/spark-history-server/manifests/deployment.yaml 的
    # spark.history.fs.logDirectory),但从来没有任何作业往那里写过事件日志
    # ——bucket 2026-08-16 就建好了,一直是空的。`docs/roles.md` 当时写着
    # "作业可观测 ✅ 已部署并真实登录验证通过":能登录进去是真的,但进去
    # 看到的是一个空列表,这个能力其实一直不成立。又一个"部署了 ≠ 能用"。
    # S3A 的 endpoint/凭据上面已经配好了,这里只要打开开关 + 指目录。
    spark.eventLog.enabled: "true"
    # 用 /events 子目录而不是 bucket 根:根路径(s3a://spark-logs/)会让
    # S3AFileSystem 的 S3Guard PathMetadata 直接抛
    # "IllegalArgumentException: path must be absolute"(实测,栈在
    # PathMetadata.<init> -> S3Guard.putAndReturn -> innerGetFileStatus),
    # driver 起不来。History Server 那边的 logDirectory 同步改成一样的路径。
    spark.eventLog.dir: s3a://spark-logs/events
    # 2026-08-21:这里原本有 spark.jars.packages + spark.jars.ivy 两行,
    # 现在都删了——三个 jar 已经在镜像构建期放进 $SPARK_HOME/jars/,driver 和
    # executor 都会自动加载,运行时完全不联网。删掉的两行各自解决过一个真实
    # 问题,理由都搬进了 apps/spark-iceberg-image/Dockerfile,没有丢:
    #   - iceberg-spark-runtime 锁 1.10.0 不用 1.11.0:后者用 Java 17 编译
    #     (class file version 61),Spark 镜像自带 JDK 11,driver 直接
    #     UnsupportedClassVersionError(逐版本二分定位过)。
    #   - Ivy 缓存路径要显式指定:spark-operator controller 跑在没有可写
    #     $HOME 的受限用户下。**这条现在自然消失了**,因为压根不再做 Ivy
    #     依赖解析——不是绕过去,是这个问题的前提没有了。
  restartPolicy:
    type: Never
  driver:
    # driver 自己就占了 1000m 的 CPU request,是这台机器上单个 pod 里最大的
    # 一块——降到 500m 之后还是不够(还差 35m),说明真正的瓶颈是 driver 自己
    # 这 1 核,一起降。
    coreRequest: "500m"
    cores: 1
    memory: "1024m"
    # 2026-08-21:原本写的是 `spark`,那是已删除的 spark-rbac.yaml 建的
    # ServiceAccount,集群里根本不存在(`kubectl -n spark-operator get sa`
    # 确认过)。改用 spark-operator chart 自己建的这个,权限是 chart 按
    # 官方设计配好的,不用我们自己维护一套。
    serviceAccount: spark-operator-spark
    env:
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: minio-root, key: rootUser}
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: minio-root, key: rootPassword}
    volumeMounts:
      - name: demo-script
        mountPath: /opt/spark-demo
  executor:
    # 这台机器 colima 只给了 4 vCPU,跑到这一步时 Trino/Hive Metastore/
    # ArgoCD 等常驻组件已经把 CPU request 占到 89%,executor 要 1 整核
    # 排不进去,一直 Pending(kubectl describe 报 Insufficient cpu)。这只是
    # 一次性验证用的 demo 作业,数据量很小,降到 500m 完全够用,不用为了
    # 一次性验证去扩 colima 的 CPU 分配(那个改动影响整个集群,代价更大)。
    coreRequest: "500m"
    cores: 1
    instances: 1
    memory: "1024m"
    env:
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: minio-root, key: rootUser}
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: minio-root, key: rootPassword}
  volumes:
    - name: demo-script
      configMap:
        name: spark-iceberg-demo-script
