# spark-operator 这个 chart 只给它自己的 controller/webhook 建了
# ServiceAccount,没有给"提交上来的 Spark 作业本身"建一个——这是 Spark on
# k8s 原生调度模式的一个特点:driver pod 自己就是个迷你调度器,要有权限
# 直接用 k8s API 建 executor pod/service/configmap,不是 operator 替它做
# 这件事。这是官方 spark-on-k8s 文档一直写明的标准模式,不是这个项目
# 自己发明的权限模型。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark
  namespace: spark-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark
  namespace: spark-operator
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: spark-operator
roleRef:
  kind: Role
  name: spark
  apiGroup: rbac.authorization.k8s.io
