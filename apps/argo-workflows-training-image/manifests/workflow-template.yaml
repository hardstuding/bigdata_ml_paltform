# Argo Workflows 编排训练——ADR-057 P4 里点名的空白("notebook 里触发/
# Argo Workflows 编排训练"这两段从没实现过,训练一直是人直接跑
# scripts/09-train-demo-model.sh)。这份 WorkflowTemplate 是这条链路
# 第一次真正接入 Argo Workflows,不是"重新验证"已有能力。
#
# 设计取舍(为什么不是 notebook+papermill,参考了
# /Users/zhenghe/my_work/ysb/algo 那个真实生产项目的既有模式之后决定
# 不照抄):那边的团队日常在 Jupyter notebook 里交互式开发,notebook 是
# 他们的原生工作产物,notebook+papermill 对他们是零额外成本。但这个
# 平台自己的 notebook 交互式开发体验目前还是明确记录在案的差距(见
# docs/usage-guide.md"交互式开发/Notebook"一节:没有自动连 Trino、没有
# 自动带凭据),在这个体验成熟之前就把 notebook 当成生产流水线的执行
# 单元,是本末倒置——会多背一个 papermill 依赖,却解决不了真正的问题。
# 改成沿用这个项目已有的 apps/spark-iceberg-demo 那个模式:纯 Python
# 脚本(ConfigMap 挂载,见同目录 script-configmap.yaml)+ 专门构建的
# 依赖镜像(见同目录 Dockerfile),更简单、更好 code review、和这个
# 项目自己的工程习惯一致。notebook 交互式开发的体验一旦真正成熟了,
# 到时候重新评估要不要把这条链路也换成 notebook+papermill(向 ysb/algo
# 的模式靠拢),现在不是时候。
#
# WorkflowTemplate 本身不是 ArgoCD Application 管的 chart/repo 资源,是
# 一份纯 K8s 自定义资源(argoproj.io/v1alpha1 WorkflowTemplate,Argo
# Workflows CRD 自带),GitOps 管理方式和 apps/spark-iceberg-demo 的
# SparkApplication 是同一类——ArgoCD 只是把这份 YAML apply 到集群,不
# 需要 helm chart。
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: train-demo-model
  namespace: argo-workflows
spec:
  entrypoint: train
  # 2026-08-19 真实踩坑:没显式指定这个字段,Workflow pod 会落到
  # argo-workflows 命名空间的 default ServiceAccount 上,这个 SA 没有
  # 权限创建 workflowtaskresults(报 "forbidden"),训练本身跑成功了
  # (accuracy/模型都已经写进 MLflow)但 Workflow 整体还是判定 Error。
  # Helm chart(argo-workflows-workflow-controller)本来就建好了一个专门
  # 有这个权限的 argo-workflow ServiceAccount(见对应的 Role/RoleBinding,
  # 是这个项目更早一次"Argo Workflows RBAC 修复"里加的),用它就行,不用
  # 自己再建一套 RBAC。
  serviceAccountName: argo-workflow
  # 2026-08-19:目前只有一步。真要复现 ysb/algo 那种多步骤 DAG(特征
  # 工程 -> 训练 -> 结果落库),在这个 templates 列表下加更多步骤、用
  # dependencies 字段串起来就行,这个模板的结构本身已经是为多步骤准备
  # 的,不是加了限制以后要推倒重来。
  templates:
    - name: train
      container:
        # 2026-08-20 起(BACKLOG 2.1):GitHub Actions 自动构建推 GHCR
        # (apps/argo-workflows-training-image/Dockerfile + .github/
        # workflows/build-images.yml),不再是手动登云主机 build 的本地
        # 镜像——之前 `local/argo-workflows-training:1.0.0` 这个 tag 是
        # 手动 build 出来后靠"节点上已经有"生效的,pullPolicy 必须是
        # IfNotPresent 是因为它压根不在任何 registry 里,现在改成真实
        # digest 引用,`imagePullPolicy` 可以留 IfNotPresent(值不会变,
        # 没必要每次都联网确认),Kubernetes 对 digest 引用的镜像本来就
        # 会做内容校验,不会有拉到旧版本的风险。
        image: "ghcr.io/hardstuding/bigdata_ml_paltform/argo-workflows-training@sha256:5c519d9ed705fbe558c8b24bf623e3965c86112337fdbabd5486d5b40a37b48f"
        imagePullPolicy: IfNotPresent
        command: ["python3", "/scripts/train_demo_model.py"]
        env:
          # 集群内部 Service DNS,不需要 port-forward——和
          # scripts/09-train-demo-model.sh 手动跑时用 localhost 的
          # port-forward 地址是同一份代码,不同的只是这两个环境变量的
          # 值,见 scripts/train_demo_model.py 顶部注释。
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow-mlflow.mlflow.svc.cluster.local:5000"
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://minio.minio.svc.cluster.local:9000"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-root
                key: rootUser
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-root
                key: rootPassword
        volumeMounts:
          - name: train-script
            mountPath: /scripts
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1024Mi
      volumes:
        - name: train-script
          configMap:
            name: train-demo-model-script
