# 这两份脚本的内容分别和 scripts/train_demo_model.py /
# scripts/train_from_feast_features.py 保持同步(手动同步,不是脚本
# 自动生成——和这个仓库其它几份"内容重复"的 ConfigMap 是同一个取舍)。
# ConfigMap 是运行时真正挂载进训练 pod 的那份,scripts/ 下的是给人看/
# 方便本地阅读、也是各自 shell 脚本手动跑时直接用的那份。和
# apps/spark-iceberg-demo/manifests/script-configmap.yaml 是同一个模式,
# 见 docs/decisions/036-spark-iceberg-pipeline.md。
#
# train_from_feast_features.py 是 2026-08-20 新增的(BACKLOG P1.7
# "notebook → Feast 特征 → Argo Workflows 训练 → MLflow 记录"这条完整
# 链路里缺的训练步骤,之前只有 train_demo_model.py 那份用合成数据的
# 版本,从没真的用过 Feast 的历史特征)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: train-demo-model-script
  namespace: argo-workflows
data:
  train_demo_model.py: |
    """
    端到端 demo(AI/ML 主线):训练一个真实的 scikit-learn 模型,把参数/指标/
    模型本身记到 MLflow(后端 Postgres,artifact 存 MinIO),再注册进 Model
    Registry。

    2026-08-19 改成完全靠环境变量配置(不在代码里硬编码 localhost,也不用
    额外的 argparse)——MLFLOW_TRACKING_URI/MLFLOW_EXPERIMENT_NAME 本来就是
    MLflow 客户端自己认的标准环境变量(不调用 mlflow.set_tracking_uri()/
    set_experiment() 时会自动读),MLFLOW_S3_ENDPOINT_URL/AWS_ACCESS_KEY_ID/
    AWS_SECRET_ACCESS_KEY 是 boto3/MLflow S3 客户端的标准变量。这样同一份
    脚本文件不用改一行代码就能在两种场景下跑:
      - 人手动跑(scripts/09-train-demo-model.sh):变量指向 port-forward 到
        localhost 的地址。
      - Argo Workflows 编排跑(apps/definitions/argo-training-workflow-
        template.yaml):变量指向集群内部 Service DNS,不需要 port-forward。
    调用方(shell 脚本 / WorkflowTemplate)负责设置这些变量,这个文件本身
    不关心自己是被谁调用的。

    依赖(见同目录 apps/argo-workflows-training-image/Dockerfile,已经打进
    训练用的容器镜像,不是运行时现装):
        mlflow-skinny scikit-learn pandas boto3
    2026-08-19 真实踩坑:pandas 是 mlflow.sklearn.log_model() 内部隐式
    依赖(推断模型输入 schema 要用),mlflow-skinny 不会自动带上,
    本机手动跑因为 anaconda 环境本来就有 pandas 才没暴露出来——第一次
    在干净的容器镜像里跑这个脚本才真的踩到 ModuleNotFoundError。
    """
    import os

    import mlflow
    import mlflow.sklearn
    from sklearn.datasets import make_classification
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.model_selection import train_test_split
    from sklearn.metrics import accuracy_score, f1_score

    for required in ("MLFLOW_TRACKING_URI", "MLFLOW_S3_ENDPOINT_URL"):
        if not os.environ.get(required):
            raise SystemExit(f"环境变量 {required} 没设置,调用方必须显式指定,不用默认值兜底")

    # 不显式调用 mlflow.set_tracking_uri()——让 mlflow 客户端自己读
    # MLFLOW_TRACKING_URI 这个标准环境变量,调用方(shell 脚本 / Argo
    # WorkflowTemplate)负责设成各自场景该用的地址。
    experiment_name = os.environ.get("MLFLOW_EXPERIMENT_NAME", "demo-classification")
    registered_model_name = os.environ.get("MLFLOW_REGISTERED_MODEL_NAME", "demo-rf-classifier")
    n_estimators = int(os.environ.get("TRAIN_N_ESTIMATORS", "100"))
    max_depth = int(os.environ.get("TRAIN_MAX_DEPTH", "6"))
    random_state = int(os.environ.get("TRAIN_RANDOM_STATE", "42"))

    mlflow.set_experiment(experiment_name)

    X, y = make_classification(n_samples=2000, n_features=20, n_informative=10, random_state=random_state)
    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=random_state)

    params = {"n_estimators": n_estimators, "max_depth": max_depth, "random_state": random_state}

    with mlflow.start_run(run_name="rf-baseline") as run:
        mlflow.log_params(params)

        model = RandomForestClassifier(**params)
        model.fit(X_train, y_train)

        preds = model.predict(X_test)
        acc = accuracy_score(y_test, preds)
        f1 = f1_score(y_test, preds)
        mlflow.log_metric("accuracy", acc)
        mlflow.log_metric("f1_score", f1)

        # serialization_format="pickle":MLflow 3.x 默认改用 skops(更安全,避免
        # pickle 反序列化风险),但 KServe mlserver runtime 镜像(seldonio/mlserver
        # :1.7.1)自带的 mlflow 客户端版本较老,不认 skops 格式,加载会报
        # "Unrecognized serialization format: skops"。这里换回 pickle 是为了兼容
        # 部署目标,不是否定 skops 更安全这个前提——如果以后 mlserver 镜像升级
        # 支持 skops 了,应该改回默认。
        mlflow.sklearn.log_model(
            model,
            name="model",
            registered_model_name=registered_model_name,
            serialization_format="pickle",
        )

        print("RUN_ID:", run.info.run_id)
        print("ACCURACY:", acc)
        print("F1:", f1)
        print("EXPERIMENT_ID:", run.info.experiment_id)
  train_from_feast_features.py: |
    """
    BACKLOG P1.7 的最后一段空白:"notebook → Feast 特征 → Argo Workflows 训练
    → MLflow 记录"这条完整链路,之前每一段都单独验证过,但训练用的是
    `train_demo_model.py`(`sklearn.datasets.make_classification` 生成的
    合成数据),从来没有真的从 Feast 取过特征——这个脚本才是那条链路里
    缺的一环:用 `FeatureStore.get_historical_features()` 取 point-in-time
    正确的历史特征,不是自己另外拼一份数据。

    复用 `iceberg.demo.orders` 这份 demo 数据(和 `scripts/feast_feature_repo/
    definitions.py` 定义的 `customer_order_features` 是同一批数据),训练
    一个玩具分类器:用 `amount`(订单金额)预测 `region`(地区)。这不是一个
    有业务意义的任务,和 `train_demo_model.py` 用合成数据一样,目的是验证
    "链路通不通",不是"模型有没有用"。

    和 `train_demo_model.py` 同样的约定:完全靠环境变量配置,不硬编码
    localhost,同一份文件能在人手动跑(port-forward)和 Argo Workflows
    里跑(集群内部 Service DNS)两种场景下工作,调用方负责设置这些变量。

    依赖(见 apps/argo-workflows-training-image/Dockerfile):
        feast==0.65.0 pyspark==4.1.3 mlflow-skinny scikit-learn pandas redis
    """
    import os

    import mlflow
    import mlflow.sklearn
    import pandas as pd
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.metrics import accuracy_score
    from sklearn.model_selection import train_test_split
    from sklearn.preprocessing import LabelEncoder

    for required in ("MLFLOW_TRACKING_URI", "MLFLOW_S3_ENDPOINT_URL"):
        if not os.environ.get(required):
            raise SystemExit(f"环境变量 {required} 没设置,调用方必须显式指定,不用默认值兜底")

    FEAST_REPO_PATH = os.environ.get("FEAST_REPO_PATH", "/feature_repo")
    experiment_name = os.environ.get("MLFLOW_EXPERIMENT_NAME", "demo-feast-classification")
    registered_model_name = os.environ.get("MLFLOW_REGISTERED_MODEL_NAME", "demo-region-classifier")
    n_estimators = int(os.environ.get("TRAIN_N_ESTIMATORS", "50"))
    random_state = int(os.environ.get("TRAIN_RANDOM_STATE", "42"))

    mlflow.set_experiment(experiment_name)

    # feature_store.yaml 里的 offline_store 是 Spark(读 iceberg.demo.orders)。
    #
    # **2026-08-20 真实踩坑**:本来想直接用 Feast 自己的
    # get_spark_session_or_start_new_with_repoconfig() 拿 SparkSession——这样
    # 能保证用来查 entity_df 的会话和 get_historical_features() 内部用的是
    # 同一套配置。但 feature_store.yaml 里的 `spark.jars.packages` 靠 Spark
    # 运行时从 Maven Central 现拉 Iceberg/hadoop-aws/aws-sdk 这三个 jar,
    # cloud-full 云主机直连 Maven Central 会真的卡死不动(和这个项目到处
    # 踩过的"直连境外源卡死"是同一类问题,加 spark.jars.repositories 指向
    # 阿里云镜像也没用,Ivy 的默认解析器链路不会因为多了候选源就绕开卡住的
    # 那个)。改成在镜像构建期(GitHub Actions,境外 runner,直连 Maven
    # Central 没问题)把这三个 jar 下载好打进镜像(见
    # apps/argo-workflows-training-image/Dockerfile 的 /opt/spark-jars/),
    # 运行时直接从本地加载,不联网。
    #
    # 用自己建的 SparkSession(不是走 feast 那个函数)是关键——PySpark 的
    # `SparkSession.builder.config(...).getOrCreate()` 如果 JVM 里已经有一个
    # 活跃的 session,会直接复用那个已有的,新的 config 不会生效。利用这条
    # 特性:提前用本地 jar 路径建好 session,feast 内部再调用它自己那个
    # "构建/复用 session" 的函数时,拿到的就是这个已经配好本地 jar 的
    # session,不会再触发一次网络下载。其它 catalog/S3A 配置项直接从
    # feature_store.yaml 解析出来的 store.config.offline_store.spark_conf
    # 里读,不在这个脚本里重复写一遍容易漂移的配置。
    from feast import FeatureStore  # noqa: E402  (放在环境变量检查之后,懒加载重依赖)
    from pyspark.sql import SparkSession  # noqa: E402

    store = FeatureStore(repo_path=FEAST_REPO_PATH)
    _spark_conf = dict(store.config.offline_store.spark_conf)
    _spark_conf.pop("spark.jars.packages", None)
    _spark_conf.pop("spark.jars.repositories", None)
    _spark_conf["spark.jars"] = ",".join(
        [
            "/opt/spark-jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar",
            "/opt/spark-jars/hadoop-aws-3.4.2.jar",
            "/opt/spark-jars/bundle-2.29.52.jar",
        ]
    )
    _builder = SparkSession.builder
    for _k, _v in _spark_conf.items():
        _builder = _builder.config(_k, _v)
    spark = _builder.getOrCreate()

    # entity_df 需要每个实体一行 + 一个 event_timestamp(point-in-time 正确性
    # 靠这个字段保证,不是"取最新值"这种简化写法)——直接从同一份 Spark
    # offline store 里查 iceberg.demo.orders 本身拿到,不手写死一批客户名单,
    # 这份 demo 数据以后如果变了,这个脚本不用跟着改。
    entity_df = spark.sql(
        "SELECT customer_name, CAST(order_date AS TIMESTAMP) AS event_timestamp "
        "FROM iceberg.demo.orders"
    ).toPandas()

    features_df = store.get_historical_features(
        entity_df=entity_df,
        features=[
            "customer_order_features:region",
            "customer_order_features:product",
            "customer_order_features:amount",
        ],
    ).to_df()

    if len(features_df) < 4 or features_df["region"].nunique() < 2:
        raise SystemExit(
            f"从 Feast 取到的历史特征只有 {len(features_df)} 行、"
            f"{features_df['region'].nunique()} 个 region 取值,数据太少训不出一个有意义的"
            "分类任务——先确认 iceberg.demo.orders 里的 demo 数据是不是还在"
            "(scripts/08-create-demo-data.sh),不是这个脚本本身的 bug。"
        )

    product_encoder = LabelEncoder()
    region_encoder = LabelEncoder()
    X = pd.DataFrame(
        {
            "amount": features_df["amount"],
            "product_encoded": product_encoder.fit_transform(features_df["product"]),
        }
    )
    y = region_encoder.fit_transform(features_df["region"])

    # 数据量很小(demo 数据本来就只有几笔订单),test_size 用比例会导致某个
    # 切分里某个类别一个样本都没有——固定切 1 条做测试集,够验证"链路能跑完
    # 并且算出一个 accuracy 数字"就行,不是在追求这个数字有统计意义。
    X_train, X_test, y_train, y_test = train_test_split(
        X, y, test_size=1, random_state=random_state
    )

    with mlflow.start_run():
        mlflow.log_param("n_estimators", n_estimators)
        mlflow.log_param("feature_source", "feast:customer_order_features")
        mlflow.log_param("training_rows", len(features_df))

        model = RandomForestClassifier(n_estimators=n_estimators, random_state=random_state)
        model.fit(X_train, y_train)
        accuracy = accuracy_score(y_test, model.predict(X_test))
        mlflow.log_metric("accuracy", accuracy)

        # serialization_format="pickle":同 train_demo_model.py 里的教训——
        # MLflow 3.x 默认改用 skops(更安全,避免 pickle 反序列化风险),但
        # 这个精简训练镜像没装 skops(mlflow-skinny 不带),KServe mlserver
        # runtime 镜像自带的 mlflow 客户端版本也较老、不认 skops 格式。换回
        # pickle 是为了兼容部署目标和这个镜像本身的依赖范围,不是否定 skops
        # 更安全这个前提。
        mlflow.sklearn.log_model(
            model,
            name="model",
            registered_model_name=registered_model_name,
            serialization_format="pickle",
        )
        print(
            f"完成:从 Feast 取了 {len(features_df)} 行历史特征,训练完成,"
            f"accuracy={accuracy:.3f},已注册进 MLflow Model Registry"
            f"({registered_model_name})。"
        )
        # demo 数据只有 10 行(scripts/08-create-demo-data.sh 里写死的 10 笔
        # 订单)、region 有 4 个取值,测试集固定切 1 条——这个规模下 accuracy
        # 只有 0 或 1 两种可能,是个没有统计意义的数字。**不加这句提示的话,
        # 在 MLflow UI 上看到 accuracy=0.000 很容易被误读成"平台坏了"**,
        # 实际上链路是通的,只是数据量决定了这个指标没法看。真要评估模型好坏,
        # 得先有真实规模的数据集,不是调这个脚本的参数。
        if len(features_df) < 100:
            print(
                f"  ⚠️  注意:训练集只有 {len(features_df)} 行(demo 数据规模),"
                f"上面这个 accuracy 没有统计意义——它只反映\"链路跑通了\","
                f"不反映\"模型好不好\"。这是预期行为,不是故障。"
            )
  materialize_features.py: |
    """
    多步骤 DAG 的第一步:把 Feast 的离线特征物化进在线存储(Redis)。

    **为什么不直接用 `feast materialize-incremental` 这个 CLI**:CLI 会按
    `feature_store.yaml` 里的 `spark.jars.packages` 让 Spark 运行时去 Maven
    Central 现拉 Iceberg/hadoop-aws/aws-sdk 三个 jar——cloud-full 云主机直连
    Maven Central 会真的卡死不动(2026-08-20 实测,几百 MB 的
    aws-java-sdk-bundle 下载进度停在 0 字节超过 8 分钟,加阿里云镜像候选源
    也没用)。这个训练镜像已经在构建期把三个 jar 打进 `/opt/spark-jars/`
    (见 `apps/argo-workflows-training-image/Dockerfile`),所以这里走
    Python API + 自己建 SparkSession 指向本地 jar,完全不联网。

    用 `SparkSession.builder...getOrCreate()` 先建好会话、再让 feast 复用它
    这个手法,和 `scripts/train_from_feast_features.py` 是同一套(那份文件
    里有完整的原理说明,这里不重复抄一遍,只标明是刻意一致的)。
    """
    import os
    from datetime import datetime, timedelta, timezone

    for required in ("MLFLOW_S3_ENDPOINT_URL",):
        if not os.environ.get(required):
            raise SystemExit(f"环境变量 {required} 没设置,调用方必须显式指定,不用默认值兜底")

    FEAST_REPO_PATH = os.environ.get("FEAST_REPO_PATH", "/feature_repo")
    # 物化窗口:默认回看 3650 天,和 definitions.py 里 FeatureView 的 ttl 对齐
    # (demo 数据是 2026-07 的固定几笔历史订单,窗口给小了会一条都物化不到)。
    lookback_days = int(os.environ.get("FEAST_MATERIALIZE_LOOKBACK_DAYS", "3650"))

    from feast import FeatureStore  # noqa: E402
    from pyspark.sql import SparkSession  # noqa: E402

    store = FeatureStore(repo_path=FEAST_REPO_PATH)
    _conf = dict(store.config.offline_store.spark_conf)
    _conf.pop("spark.jars.packages", None)
    _conf.pop("spark.jars.repositories", None)
    _conf["spark.jars"] = ",".join(
        [
            "/opt/spark-jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar",
            "/opt/spark-jars/hadoop-aws-3.4.2.jar",
            "/opt/spark-jars/bundle-2.29.52.jar",
        ]
    )
    _builder = SparkSession.builder
    for _k, _v in _conf.items():
        _builder = _builder.config(_k, _v)
    _builder.getOrCreate()

    end = datetime.now(timezone.utc)
    start = end - timedelta(days=lookback_days)
    print(f"物化窗口:{start.isoformat()} → {end.isoformat()}")

    store.materialize(start_date=start, end_date=end)

    print(f"完成:离线特征已物化进在线存储(Redis),窗口 {lookback_days} 天。")
  validate_registered_model.py: |
    """
    多步骤 DAG 的第三步:模型上线前的门禁校验(`docs/project/capability-matrix.md` 算法工程师
    那一节点名的"多步骤 DAG"缺口里的最后一步)。

    **为什么这一步不是"看 accuracy 达没达标"**:这个平台的 demo 数据只有
    10 行(`scripts/08-create-demo-data.sh` 写死的 10 笔订单)、region 有 4 个
    取值、测试集只有 1 条——accuracy 只可能是 0 或 1,拿它当门禁阈值是自欺欺人
    (要么永远过不了,要么把阈值调到形同虚设)。**在这个数据规模下唯一诚实、
    且真的有用的门禁是"这个模型能不能被加载出来、能不能做出形状正确的预测"**
    ——也就是"它到底能不能部署",这恰好是 KServe 上线的真实前置条件,不是
    装饰性的检查。以后真有生产规模数据集了,再在这一步补真正的指标阈值门禁,
    那时候阈值才有意义。

    做的事:
    1. 从 MLflow Model Registry 取指定模型的最新版本(不是某个写死的版本号)
    2. 真的把它 load 出来(会从 MinIO 下载 artifact,这一步能抓出序列化格式
       不兼容这类问题——这个项目已经真实踩过 skops/pickle 那个坑)
    3. 用一个和训练时同 schema 的样本做一次真实推理
    4. 校验输出形状/取值合法
    任何一步失败就非零退出,Argo Workflows 会把这一步判定为失败,后续步骤
    (比如自动上线到 KServe)不会执行。

    环境变量约定和 `train_from_feast_features.py` 一致,调用方负责设置。
    """
    import os
    import sys

    import mlflow
    import numpy as np

    for required in ("MLFLOW_TRACKING_URI", "MLFLOW_S3_ENDPOINT_URL"):
        if not os.environ.get(required):
            raise SystemExit(f"环境变量 {required} 没设置,调用方必须显式指定,不用默认值兜底")

    model_name = os.environ.get("MLFLOW_REGISTERED_MODEL_NAME", "demo-region-classifier")

    client = mlflow.MlflowClient()

    # 取最新版本:不写死版本号,让这一步永远校验"刚训出来的那个"。
    versions = client.search_model_versions(f"name='{model_name}'")
    if not versions:
        raise SystemExit(f"门禁失败:Model Registry 里找不到任何名为 {model_name} 的模型版本")
    latest = max(versions, key=lambda v: int(v.version))
    print(f"取到最新版本:{model_name} v{latest.version}(status={latest.status})")

    if latest.status != "READY":
        raise SystemExit(
            f"门禁失败:v{latest.version} 的 status 是 {latest.status},不是 READY"
            "——artifact 可能还在上传,或者注册过程出错了"
        )

    # 真的 load 出来。这一步会从 MinIO 下载 artifact 并反序列化,能抓出
    # "训练时用的序列化格式,部署环境读不了"这类问题——这个项目真实踩过
    # (MLflow 3.x 默认 skops,KServe 的 mlserver 镜像不认)。
    try:
        model = mlflow.sklearn.load_model(f"models:/{model_name}/{latest.version}")
    except Exception as exc:
        raise SystemExit(f"门禁失败:模型加载不出来(部署到 KServe 也会是同样的结果)—— {exc}")
    print(f"模型加载成功:{type(model).__name__}")

    # 用和训练时同 schema 的样本做一次真实推理。训练脚本的特征是
    # [amount(float), product_encoded(int)],这里构造两条边界样本。
    sample = np.array([[120.50, 0], [45.75, 2]])
    try:
        preds = model.predict(sample)
    except Exception as exc:
        raise SystemExit(f"门禁失败:模型加载出来了但推理报错 —— {exc}")

    if len(preds) != len(sample):
        raise SystemExit(f"门禁失败:输入 {len(sample)} 条,输出 {len(preds)} 条,形状对不上")
    if not all(np.isfinite(np.asarray(preds, dtype=float))):
        raise SystemExit(f"门禁失败:预测结果里有 NaN/Inf —— {preds}")

    print(f"推理成功,预测结果:{preds.tolist()}")
    print(
        f"门禁通过:{model_name} v{latest.version} 可加载、可推理、输出合法,"
        "满足上线到 KServe 的前置条件。"
    )
    print(
        "  注:这一步**不校验模型精度**——demo 数据规模下 accuracy 没有统计"
        "意义(见 train_from_feast_features.py 顶部说明)。有真实规模数据集"
        "之后,应该在这里补真正的指标阈值门禁。"
    )
    sys.exit(0)
