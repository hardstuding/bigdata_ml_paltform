# 2026-08-19 真实踩坑:argo-workflows Helm chart(见 apps/definitions/
# argo-workflows.yaml)自己会建一个 Role/RoleBinding `argo-workflows-workflow`
# ——专门授权"创建/patch workflowtaskresults"这个 workflow 执行阶段必须的权限
# ——RoleBinding 绑的 subject 是 ServiceAccount `argo-workflow`,但 chart 默认
# 配置只建了 Role/RoleBinding,没有实际建出这个 ServiceAccount 本身
# (`workflow.serviceAccount.create` 没打开)。第一次跑训练 Workflow 时,
# 没显式指定 serviceAccountName 就落到了 default SA(报 forbidden),显式
# 指定成 argo-workflow 之后又报 "serviceaccount ... not found"——两次都是
# 因为这个 SA 压根不存在。
#
# 没有去改 apps/definitions/argo-workflows.yaml 里的 chart values 补
# `workflow.serviceAccount.create: true`(那样风险更大,会牵动 chart 对
# "workflow 用哪个 SA" 的默认解析逻辑,当前没有把握改了不连带影响其它已经
# 在跑的东西),而是直接建这一个最小的 ServiceAccount 对象,把 chart 已经
# 建好、指向这个名字的 Role/RoleBinding 补齐——不新增任何权限规则,只是让
# 已经声明好的授权关系能落地。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: argo-workflows
