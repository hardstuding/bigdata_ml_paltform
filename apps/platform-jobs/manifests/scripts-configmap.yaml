# 这个文件是生成的,不要手改。
# 源:jobs/ 下各作业的 job.yaml + 脚本;生成器:scripts/render-jobs.py
# CI 会校验它和 jobs/ 不漂移。
apiVersion: v1
data:
  daily-order-summary--job.py: "\"\"\"每天把 iceberg.demo.orders 按区域汇总,写回 orders_by_region_daily。\n\n用 platform_sdk 拿连接,不手填连接串——连接信息由平台注入(见\nplatform_sdk.config),换环境不用改这个脚本。\n\"\"\"\nfrom platform_sdk import query\n\n# 同目录下的 jobkit.py —— 多文件作业(2026-08-29)。平台把作业目录下所有\n# .py 一起挂进容器并把 PYTHONPATH 指过去,所以这行 import 直接可用。\nfrom jobkit import rows_of, run_date\n\nTARGET = \"iceberg.demo.orders_by_region_daily\"\n\n# 处理哪一天:默认今天,可以用 run_date 参数覆盖 —— **这就是补数**:\n#   argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\nRUN_DATE = run_date()\n\n\n# 目标表不存在就先建。CREATE TABLE IF NOT EXISTS 让这个作业可以从零开始跑,\n# 不需要谁先手动建表——\"从空环境可恢复\"这条对作业同样成立。\nquery(f\"\"\"\n    CREATE TABLE IF NOT EXISTS {TARGET} (\n        run_date     date,\n        region       varchar,\n        order_count  bigint,\n        total_amount double\n    )\n\"\"\")\n\n# 先删当天的,再插入。这样重跑不会产生重复行(幂等)——定时作业迟早会被\n# 重跑一次(补数、失败重试、开机补跑),不幂等的作业到那天才会暴露问题。\nquery(f\"DELETE FROM {TARGET} WHERE run_date = DATE '{RUN_DATE}'\")\n\nquery(f\"\"\"\n    INSERT INTO {TARGET}\n    SELECT DATE '{RUN_DATE}', region, count(*), sum(amount)\n    FROM iceberg.demo.orders\n    GROUP BY region\n\"\"\")\n\ncheck = rows_of(query(\n    f\"SELECT region, order_count, total_amount FROM {TARGET} \"\n    f\"WHERE run_date = DATE '{RUN_DATE}' ORDER BY region\"))\n\nprint(f\"{RUN_DATE} 汇总完成,{len(check)} 个区域:\")\nfor region, cnt, amount in check:\n    print(f\"  {region:<8} {cnt:>4} 单  {float(amount):>10.2f}\")\n\n# 写完要核实真的写进去了。作业\"没报错\"和\"产出了东西\"是两回事——这个平台\n# 被\"看起来成功了\"坑过太多次。\nif not check:\n    raise SystemExit(\"汇总结果是空的——上游 iceberg.demo.orders 可能没有数据\")\n"
  daily-order-summary--jobkit.py: "\"\"\"平台作业的公共小工具。**这份是权威源。**\n\n`jobs/<每个作业>/jobkit.py` 是它的逐字节副本,由\n`scripts/check-duplicated-sources.py` 在 CI 里保证不漂移。\n\n**为什么是复制而不是共享一份**:作业的文件是按目录挂进容器的\n(`scripts/render-jobs.py` 把每个作业目录下的 .py 放进 ConfigMap),\n一个作业看不到另一个作业的文件。要真正共享得打成内部包(ADR-083)——\n对几十行工具函数不值得。复制的代价(会漂移)由那个检查器兜住。\n\n改这个文件之后跑 `python3 scripts/check-duplicated-sources.py --fix`。\n\n---\n\n\n**它存在的意义是证明多文件作业真的能用**:同目录下的 .py 会被一起挂进\n容器,`import jobkit` 直接可用(PYTHONPATH 指向 /scripts)。在这之前一个\n作业只能是一个文件,稍长一点就只能把所有东西堆进一个几百行的脚本。\n\"\"\"\nimport datetime\nimport os\n\n\ndef param(name, default=None):\n    \"\"\"读作业参数。\n\n    参数在 `job.yaml` 的 `params` 里声明,平台以 `PARAM_<大写名>` 注进环境\n    变量。**补数就靠它** —— 没有参数,重跑一个日更作业只会再算一遍今天:\n\n        argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\n    \"\"\"\n    value = os.environ.get(f\"PARAM_{name.upper()}\", \"\")\n    # Argo 没有替换到值时会原样留下 `{{workflow.parameters.x}}`,那不是一个\n    # 有意义的值 —— 当成没传,用默认值。不这么处理的话它会被当成日期字符串\n    # 一路带进 SQL,报出来的错和真正的原因差着十万八千里。\n    if not value or value.startswith(\"{{\"):\n        return default\n    return value\n\n\ndef run_date():\n    \"\"\"这次要处理哪一天。默认今天,可以用 run_date 参数覆盖(补数)。\"\"\"\n    return param(\"run_date\") or datetime.date.today().isoformat()\n\n\ndef rows_of(result):\n    \"\"\"`query()` 装了 pandas 返回 DataFrame、没装返回 (列名, 行)。\n\n    **不要直接 `for r in result`** —— 在 DataFrame 上那是遍历列名,不是遍历\n    行,而且不会报错,只会安静地给出错的东西。\n    \"\"\"\n    if hasattr(result, \"itertuples\"):\n        return [tuple(t)[1:] for t in result.itertuples()]\n    return result[1]\n"
  feature-drift--job.py: "\"\"\"特征漂移监控:线上推理输入的分布,和训练时的分布比,变了多少(ADR-087)。\n\n**为什么这件事值得单独做一个作业。** 模型上线之后不会报错 —— 它对任何\n输入都会给出一个预测。真正的失效方式是**输入的数据慢慢变了**(用户结构\n变化、上游埋点改了口径、某个特征的采集坏了变成恒定值),而模型还在按旧\n世界的规律给答案。这类失效**没有任何告警会响**:服务是 200,延迟正常,\nPod 健康。只有把线上分布和训练分布放在一起比,才看得见。\n\n**怎么比:PSI(Population Stability Index,群体稳定性指数)。**\n\n    PSI = Σ (线上占比 - 训练占比) × ln(线上占比 / 训练占比)\n\n按训练集的分位数把每个特征分成 10 个等频桶,看线上样本落进各桶的比例\n偏离了多少。业界的经验分界是 0.1 / 0.2(见 job.yaml 里 psi_threshold\n的注释,那不是理论值)。\n\n**为什么是 PSI 而不是均值方差**:只看均值方差的话,\"分布形状变了但均值\n没变\"这种漂移完全看不出来 —— 比如一个特征从单峰变成双峰,均值可能纹丝\n不动。分桶比较看得见形状。\n\n**基线从哪来**:训练时写进 MLflow 的 `feature_baseline` tag(见\n`scripts/train_demo_model.py`)。**不在这里重建训练集分布** —— 重建出来\n的是\"现在\"的数据,不是训练时的,结论会是错的而且不会有任何地方报错。\n没有这个 tag 的模型版本会被跳过并说明原因,不猜。\n\"\"\"\nimport json\nimport math\nimport os\n\nfrom platform_sdk import query\n\nfrom jobkit import param, rows_of\n\nWINDOW_DAYS = int(param(\"window_days\", \"7\"))\nPSI_THRESHOLD = float(param(\"psi_threshold\", \"0.2\"))\nONLY_MODEL = (param(\"model\") or \"\").strip()\nDRY_RUN = bool(param(\"dry_run\"))\n\nDRIFT_TABLE = \"iceberg.ml.feature_drift\"\n\n\ndef ensure_drift_table():\n    \"\"\"结果表。**建在 `ml` 里而不是 `demo`** —— 它按特征列出线上分布的\n    统计量,虽然是聚合值,仍然是从个人数据推出来的,该和推理留痕受同一套\n    OPA 保护(敏感 schema 只有 platform-team 和拿到专门口子的服务账号能读)。\n    \"\"\"\n    query(f\"\"\"\n        CREATE TABLE IF NOT EXISTS {DRIFT_TABLE} (\n            computed_at   TIMESTAMP(6) WITH TIME ZONE,\n            model         VARCHAR,\n            model_version VARCHAR,\n            window_days   INTEGER,\n            n_online      BIGINT,\n            feature_index INTEGER,\n            psi           DOUBLE,\n            online_mean   DOUBLE,\n            baseline_mean DOUBLE,\n            drifted       BOOLEAN\n        )\n    \"\"\")\n\n\ndef baselines_from_mlflow():\n    \"\"\"每个注册模型版本的特征基线。返回 {(model, version): baseline}。\n\n    走 mlflow 客户端的 REST 接口,不碰 artifact —— 平台镜像里是\n    `mlflow-skinny`,没有 boto3,下载 artifact 会在运行时才炸\n    (而那时候已经跑了一半)。基线本来就是存成 tag 的,见 ADR-087。\n    \"\"\"\n    from mlflow import MlflowClient\n\n    if not os.environ.get(\"MLFLOW_TRACKING_URI\"):\n        raise SystemExit(\"MLFLOW_TRACKING_URI 没设置 —— 平台应该注入它,\"\n                         \"见 scripts/render-jobs.py\")\n    client = MlflowClient()\n    out = {}\n    for rm in client.search_registered_models():\n        if ONLY_MODEL and rm.name != ONLY_MODEL:\n            continue\n        for mv in client.search_model_versions(f\"name='{rm.name}'\"):\n            # **基线在「产生这个版本的那次 run」的 tag 上,不在模型版本的\n            # tag 上。** 这两个是不同的东西,而 `mlflow.set_tag()`(训练脚本\n            # 用的那个)写的是 run tag。\n            #\n            # 2026-09-01 自查时抓到:第一版这里读的是 `mv.tags`,那永远是空的\n            # —— 作业会一路正常跑完,然后报\"一个带 feature_baseline 的模型版本\n            # 都没有\",而训练脚本明明写了。**整个功能静默失效,而且报错信息\n            # 指向的是训练那一侧。**\n            #\n            # 读 run tag 也更符合语义:基线是那次训练的产物,和那次 run 绑在\n            # 一起;同一个 run 注册出多个版本时,它们共享同一份基线,本来就该\n            # 是同一个值。\n            raw = (mv.tags or {}).get(\"feature_baseline\")\n            if not raw and getattr(mv, \"run_id\", None):\n                try:\n                    raw = client.get_run(mv.run_id).data.tags.get(\"feature_baseline\")\n                except Exception as exc:   # noqa: BLE001\n                    print(f\"  读不到 {rm.name} v{mv.version} 对应的 run \"\n                          f\"({mv.run_id}):{str(exc).splitlines()[0][:80]}\")\n                    raw = None\n            if not raw:\n                # 没有基线的版本(2026-08-30 之前训练的)不是错误,跳过并说明。\n                continue\n            try:\n                out[(rm.name, str(mv.version))] = json.loads(raw)\n            except ValueError as exc:\n                print(f\"  !! {rm.name} v{mv.version} 的 feature_baseline \"\n                      f\"不是合法 JSON,跳过:{exc}\")\n    return out\n\n\ndef online_vectors(model_name):\n    \"\"\"窗口内这个模型收到的推理输入,拆成一个个特征向量。\n\n    **只取 request,不取 response** —— 漂移看的是进来的数据。\n    payload 是 KServe V2 的 JSON:\n        {\"inputs\": [{\"name\": ..., \"shape\": [n, f], \"data\": [...]}]}\n    `data` 是**按行展平的**,要按 shape 的第二维切回去。\n    \"\"\"\n    rows = rows_of(query(f\"\"\"\n        SELECT payload\n        FROM iceberg.ml.inference_log\n        WHERE event_type = 'request'\n          AND inference_service = '{model_name}'\n          AND ingest_ts > current_timestamp - INTERVAL '{WINDOW_DAYS}' DAY\n    \"\"\"))\n    vectors = []\n    for (payload,) in rows:\n        try:\n            body = json.loads(payload)\n        except (ValueError, TypeError):\n            # 解析不了的单条不该让整个作业失败,但要能看出来有多少条坏的。\n            vectors.append(None)\n            continue\n        for inp in body.get(\"inputs\") or []:\n            data = inp.get(\"data\") or []\n            shape = inp.get(\"shape\") or []\n            width = int(shape[-1]) if shape else len(data)\n            if width <= 0:\n                continue\n            for i in range(0, len(data) - width + 1, width):\n                chunk = data[i:i + width]\n                if all(isinstance(v, (int, float)) for v in chunk):\n                    vectors.append(chunk)\n    bad = sum(1 for v in vectors if v is None)\n    good = [v for v in vectors if v is not None]\n    if bad:\n        print(f\"  {bad} 条 payload 解析不了(已跳过)\")\n    return good\n\n\ndef psi(baseline_edges, online_values):\n    \"\"\"一个特征的 PSI。\n\n    两个刻意的选择:\n\n    1. **空桶不跳过,按一个很小的占比算**。跳过的话,\"线上完全没有落进\n       某个桶\"这种最强的漂移信号会被算成 0 贡献 —— 而它恰恰是最该报的。\n       用 1e-6 代替 0,是 PSI 的标准处理(否则 ln(0) 是 -inf)。\n    2. **训练侧的占比按等频桶固定是 1/桶数**,不重新数 —— 边界就是按分位数\n       切出来的,每桶本来就是 10%。重新数只会引入分箱边界上的取整噪声。\n    \"\"\"\n    n_bins = len(baseline_edges) - 1\n    if n_bins <= 0 or not online_values:\n        return None\n    counts = [0] * n_bins\n    for v in online_values:\n        # 线性扫描:桶只有 10 个,二分不值得,而且边界含 ±inf,二分要多写\n        # 一堆边界处理。\n        for b in range(n_bins):\n            if baseline_edges[b] <= v < baseline_edges[b + 1]:\n                counts[b] += 1\n                break\n    total = len(online_values)\n    expected = 1.0 / n_bins\n    score = 0.0\n    for c in counts:\n        actual = max(c / total, 1e-6)\n        score += (actual - expected) * math.log(actual / expected)\n    return score\n\n\ndef main():\n    baselines = baselines_from_mlflow()\n    if not baselines:\n        raise SystemExit(\n            \"一个带 feature_baseline 的模型版本都没有。\\n\"\n            \"  这不是「没有漂移」,是**算不了** —— 基线是训练时写进 MLflow \"\n            \"tag 的,\\n\"\n            \"  2026-08-30 之前训练的版本没有它。重新训一次(scripts/\"\n            \"train_demo_model.py)就有了。\")\n\n    if not DRY_RUN:\n        ensure_drift_table()\n\n    rows_to_write = []\n    for (model_name, version), baseline in sorted(baselines.items()):\n        vectors = online_vectors(model_name)\n        print(f\"\\n{model_name} v{version}:窗口内 {len(vectors)} 条推理输入\")\n        if not vectors:\n            print(\"  没有推理请求 —— 跳过(不是「没漂移」,是没数据)\")\n            continue\n\n        edges = baseline.get(\"bin_edges\") or []\n        n_feat = min(len(edges), min(len(v) for v in vectors))\n        if n_feat < len(edges):\n            print(f\"  !! 基线有 {len(edges)} 个特征,线上只有 \"\n                  f\"{min(len(v) for v in vectors)} 个 —— 只比前 {n_feat} 个。\"\n                  f\"**这本身就值得查**:输入形状变了。\")\n\n        drifted = []\n        for i in range(n_feat):\n            col = [v[i] for v in vectors]\n            score = psi(edges[i], col)\n            if score is None:\n                continue\n            online_mean = sum(col) / len(col)\n            base_mean = (baseline.get(\"mean\") or [None] * n_feat)[i]\n            is_drift = score > PSI_THRESHOLD\n            if is_drift:\n                drifted.append((i, score))\n            rows_to_write.append((model_name, version, len(vectors), i, score,\n                                  online_mean, base_mean, is_drift))\n\n        if drifted:\n            print(f\"  ** {len(drifted)} 个特征 PSI 超过 {PSI_THRESHOLD}:\")\n            for i, score in sorted(drifted, key=lambda t: -t[1]):\n                print(f\"       特征 {i}: PSI={score:.3f}\")\n        else:\n            print(f\"  所有特征 PSI 都在 {PSI_THRESHOLD} 以内\")\n\n    if DRY_RUN:\n        print(f\"\\n[dry-run] 算出 {len(rows_to_write)} 行,没有写表\")\n        return\n    if not rows_to_write:\n        # **不当成失败。** 窗口内没有推理请求是完全正常的(demo 环境、\n        # 或者这个模型本来就没流量),把作业标红会让人学会忽略它。\n        print(\"\\n没有可写的结果(窗口内没有推理请求)\")\n        return\n\n    values = \",\".join(\n        f\"(current_timestamp, '{m}', '{v}', {WINDOW_DAYS}, {n}, {i}, \"\n        f\"{s}, {om}, {'NULL' if bm is None else bm}, {str(d).lower()})\"\n        for m, v, n, i, s, om, bm, d in rows_to_write)\n    query(f\"INSERT INTO {DRIFT_TABLE} VALUES {values}\")\n    print(f\"\\n写入 {DRIFT_TABLE}:{len(rows_to_write)} 行\")\n\n\nmain()\n"
  feature-drift--jobkit.py: "\"\"\"平台作业的公共小工具。**这份是权威源。**\n\n`jobs/<每个作业>/jobkit.py` 是它的逐字节副本,由\n`scripts/check-duplicated-sources.py` 在 CI 里保证不漂移。\n\n**为什么是复制而不是共享一份**:作业的文件是按目录挂进容器的\n(`scripts/render-jobs.py` 把每个作业目录下的 .py 放进 ConfigMap),\n一个作业看不到另一个作业的文件。要真正共享得打成内部包(ADR-083)——\n对几十行工具函数不值得。复制的代价(会漂移)由那个检查器兜住。\n\n改这个文件之后跑 `python3 scripts/check-duplicated-sources.py --fix`。\n\n---\n\n\n**它存在的意义是证明多文件作业真的能用**:同目录下的 .py 会被一起挂进\n容器,`import jobkit` 直接可用(PYTHONPATH 指向 /scripts)。在这之前一个\n作业只能是一个文件,稍长一点就只能把所有东西堆进一个几百行的脚本。\n\"\"\"\nimport datetime\nimport os\n\n\ndef param(name, default=None):\n    \"\"\"读作业参数。\n\n    参数在 `job.yaml` 的 `params` 里声明,平台以 `PARAM_<大写名>` 注进环境\n    变量。**补数就靠它** —— 没有参数,重跑一个日更作业只会再算一遍今天:\n\n        argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\n    \"\"\"\n    value = os.environ.get(f\"PARAM_{name.upper()}\", \"\")\n    # Argo 没有替换到值时会原样留下 `{{workflow.parameters.x}}`,那不是一个\n    # 有意义的值 —— 当成没传,用默认值。不这么处理的话它会被当成日期字符串\n    # 一路带进 SQL,报出来的错和真正的原因差着十万八千里。\n    if not value or value.startswith(\"{{\"):\n        return default\n    return value\n\n\ndef run_date():\n    \"\"\"这次要处理哪一天。默认今天,可以用 run_date 参数覆盖(补数)。\"\"\"\n    return param(\"run_date\") or datetime.date.today().isoformat()\n\n\ndef rows_of(result):\n    \"\"\"`query()` 装了 pandas 返回 DataFrame、没装返回 (列名, 行)。\n\n    **不要直接 `for r in result`** —— 在 DataFrame 上那是遍历列名,不是遍历\n    行,而且不会报错,只会安静地给出错的东西。\n    \"\"\"\n    if hasattr(result, \"itertuples\"):\n        return [tuple(t)[1:] for t in result.itertuples()]\n    return result[1]\n"
  iceberg-maintenance--job.py: "\"\"\"Iceberg 表维护:过期快照 + 清孤儿文件 + 合并小文件。\n\n**为什么需要**:Iceberg 每次写入都产生一个新快照,旧快照和它引用的数据\n文件不会自动清理;失败的写入会留下没人引用的孤儿文件;流式写入每个\ncheckpoint 落一批小文件。三件事都是**只增不减**的,不管的话:\n\n- 存储无限增长(而这个平台的 MinIO 是单副本、没有备份)\n- 查询越来越慢(小文件多 → 打开的文件句柄多、元数据大)\n\n**最先出问题的是持续写入的表**:`audit.query_events`、\n`ml.inference_log`、`demo.device_events_stream`。\n\n用 Trino 的 `ALTER TABLE ... EXECUTE` 做,不引入新组件 —— Iceberg 的这几个\n维护动作 Trino 原生支持。\n\"\"\"\nfrom platform_sdk import query\n\nfrom jobkit import param, rows_of\n\nRETAIN_DAYS = int(param(\"retain_days\", \"7\"))\nDRY_RUN = bool(param(\"dry_run\"))\n\n# **只维护平台自己产生的表。** 不去动 tpch/tpcds 这类只读的基准数据集\n# (它们不写入,没有快照堆积),也不自作主张动用户自己建的表 —— 合并小\n# 文件会重写数据,那是一个有副作用的操作,不该由平台默默对所有表执行。\nSCHEMAS = [\"audit\", \"ml\", \"demo\"]\n\n\ndef tables_in(schema):\n    \"\"\"**只要真正的表,不要视图。**\n\n    2026-08-30 实机第一次跑就撞到:`iceberg.demo.stg_orders` 是 dbt 建的\n    视图,而 `ALTER TABLE ... EXECUTE` 对视图直接报 `NOT_SUPPORTED` ——\n    三个动作全失败。视图没有数据文件也没有快照,本来就不需要维护。\n    \"\"\"\n    try:\n        return [r[0] for r in rows_of(query(\n            f\"SELECT table_name FROM iceberg.information_schema.tables \"\n            f\"WHERE table_schema = '{schema}' AND table_type = 'BASE TABLE'\"))]\n    except Exception as exc:   # noqa: BLE001\n        # schema 不存在是正常的(比如 ml 要等推理留痕启用之后才有)\n        print(f\"  跳过 schema {schema}:{str(exc).splitlines()[0][:80]}\")\n        return []\n\n\ndef maintain(fqn):\n    \"\"\"三个动作。**任何一个失败都继续做下一个** —— 一张表的维护失败不该\n    让其它表也不做,而\"这次没清干净\"的后果只是下次多清一点。\"\"\"\n    done, failed = [], []\n    actions = [\n        # 顺序有讲究:先合并小文件(会产生新快照),再过期快照(把合并前\n        # 的旧快照清掉),最后清孤儿文件。反过来的话刚合并出来的旧文件\n        # 还被快照引用着,清不掉。\n        (\"optimize\", f\"ALTER TABLE {fqn} EXECUTE optimize\"),\n        (\"expire_snapshots\",\n         f\"ALTER TABLE {fqn} EXECUTE expire_snapshots(retention_threshold => '{RETAIN_DAYS}d')\"),\n        (\"remove_orphan_files\",\n         f\"ALTER TABLE {fqn} EXECUTE remove_orphan_files(retention_threshold => '{RETAIN_DAYS}d')\"),\n    ]\n    for name, sql in actions:\n        if DRY_RUN:\n            print(f\"  [dry-run] {name}\")\n            continue\n        try:\n            query(sql)\n            done.append(name)\n        except Exception as exc:   # noqa: BLE001\n            failed.append(f\"{name}({str(exc).splitlines()[0][:60]})\")\n    return done, failed\n\n\nprint(f\"Iceberg 表维护:保留 {RETAIN_DAYS} 天快照\"\n      f\"{'(dry-run,只打印不执行)' if DRY_RUN else ''}\")\n\ntotal, all_failed = 0, []\nfor schema in SCHEMAS:\n    names = tables_in(schema)\n    if not names:\n        continue\n    print(f\"\\nschema {schema}:{len(names)} 张表\")\n    for t in names:\n        fqn = f\"iceberg.{schema}.{t}\"\n        done, failed = maintain(fqn)\n        total += 1\n        status = f\"{len(done)}/3 成功\" if not DRY_RUN else \"dry-run\"\n        print(f\"  {fqn:50s} {status}\" + (f\"  失败:{'; '.join(failed)}\" if failed else \"\"))\n        all_failed += [f\"{fqn}: {f}\" for f in failed]\n\nprint(f\"\\n处理了 {total} 张表\")\nif all_failed:\n    # **不让整个作业失败** —— 部分表维护失败是常态(表正在被写、权限不够、\n    # Trino 版本不支持某个动作),而把作业标成红色会让人学会忽略它。\n    # 但要把失败列出来,不能静默。\n    print(f\"\\n有 {len(all_failed)} 个动作失败(作业本身不算失败,下次会再试):\")\n    for f in all_failed:\n        print(f\"  - {f}\")\nif total == 0:\n    raise SystemExit(\"一张表都没处理到 —— 检查 iceberg catalog 是否可访问\")\n"
  iceberg-maintenance--jobkit.py: "\"\"\"平台作业的公共小工具。**这份是权威源。**\n\n`jobs/<每个作业>/jobkit.py` 是它的逐字节副本,由\n`scripts/check-duplicated-sources.py` 在 CI 里保证不漂移。\n\n**为什么是复制而不是共享一份**:作业的文件是按目录挂进容器的\n(`scripts/render-jobs.py` 把每个作业目录下的 .py 放进 ConfigMap),\n一个作业看不到另一个作业的文件。要真正共享得打成内部包(ADR-083)——\n对几十行工具函数不值得。复制的代价(会漂移)由那个检查器兜住。\n\n改这个文件之后跑 `python3 scripts/check-duplicated-sources.py --fix`。\n\n---\n\n\n**它存在的意义是证明多文件作业真的能用**:同目录下的 .py 会被一起挂进\n容器,`import jobkit` 直接可用(PYTHONPATH 指向 /scripts)。在这之前一个\n作业只能是一个文件,稍长一点就只能把所有东西堆进一个几百行的脚本。\n\"\"\"\nimport datetime\nimport os\n\n\ndef param(name, default=None):\n    \"\"\"读作业参数。\n\n    参数在 `job.yaml` 的 `params` 里声明,平台以 `PARAM_<大写名>` 注进环境\n    变量。**补数就靠它** —— 没有参数,重跑一个日更作业只会再算一遍今天:\n\n        argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\n    \"\"\"\n    value = os.environ.get(f\"PARAM_{name.upper()}\", \"\")\n    # Argo 没有替换到值时会原样留下 `{{workflow.parameters.x}}`,那不是一个\n    # 有意义的值 —— 当成没传,用默认值。不这么处理的话它会被当成日期字符串\n    # 一路带进 SQL,报出来的错和真正的原因差着十万八千里。\n    if not value or value.startswith(\"{{\"):\n        return default\n    return value\n\n\ndef run_date():\n    \"\"\"这次要处理哪一天。默认今天,可以用 run_date 参数覆盖(补数)。\"\"\"\n    return param(\"run_date\") or datetime.date.today().isoformat()\n\n\ndef rows_of(result):\n    \"\"\"`query()` 装了 pandas 返回 DataFrame、没装返回 (列名, 行)。\n\n    **不要直接 `for r in result`** —— 在 DataFrame 上那是遍历列名,不是遍历\n    行,而且不会报错,只会安静地给出错的东西。\n    \"\"\"\n    if hasattr(result, \"itertuples\"):\n        return [tuple(t)[1:] for t in result.itertuples()]\n    return result[1]\n"
