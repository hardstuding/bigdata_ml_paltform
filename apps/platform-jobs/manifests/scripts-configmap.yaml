# 这个文件是生成的,不要手改。
# 源:jobs/ 下各作业的 job.yaml + 脚本;生成器:scripts/render-jobs.py
# CI 会校验它和 jobs/ 不漂移。
apiVersion: v1
data:
  daily-order-summary--job.py: "\"\"\"每天把 iceberg.demo.orders 按区域汇总,写回 orders_by_region_daily。\n\n用 platform_sdk 拿连接,不手填连接串——连接信息由平台注入(见\nplatform_sdk.config),换环境不用改这个脚本。\n\"\"\"\nfrom platform_sdk import query\n\n# 同目录下的 jobkit.py —— 多文件作业(2026-08-29)。平台把作业目录下所有\n# .py 一起挂进容器并把 PYTHONPATH 指过去,所以这行 import 直接可用。\nfrom jobkit import rows_of, run_date\n\nTARGET = \"iceberg.demo.orders_by_region_daily\"\n\n# 处理哪一天:默认今天,可以用 run_date 参数覆盖 —— **这就是补数**:\n#   argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\nRUN_DATE = run_date()\n\n\n# 目标表不存在就先建。CREATE TABLE IF NOT EXISTS 让这个作业可以从零开始跑,\n# 不需要谁先手动建表——\"从空环境可恢复\"这条对作业同样成立。\nquery(f\"\"\"\n    CREATE TABLE IF NOT EXISTS {TARGET} (\n        run_date     date,\n        region       varchar,\n        order_count  bigint,\n        total_amount double\n    )\n\"\"\")\n\n# 先删当天的,再插入。这样重跑不会产生重复行(幂等)——定时作业迟早会被\n# 重跑一次(补数、失败重试、开机补跑),不幂等的作业到那天才会暴露问题。\nquery(f\"DELETE FROM {TARGET} WHERE run_date = DATE '{RUN_DATE}'\")\n\nquery(f\"\"\"\n    INSERT INTO {TARGET}\n    SELECT DATE '{RUN_DATE}', region, count(*), sum(amount)\n    FROM iceberg.demo.orders\n    GROUP BY region\n\"\"\")\n\ncheck = rows_of(query(\n    f\"SELECT region, order_count, total_amount FROM {TARGET} \"\n    f\"WHERE run_date = DATE '{RUN_DATE}' ORDER BY region\"))\n\nprint(f\"{RUN_DATE} 汇总完成,{len(check)} 个区域:\")\nfor region, cnt, amount in check:\n    print(f\"  {region:<8} {cnt:>4} 单  {float(amount):>10.2f}\")\n\n# 写完要核实真的写进去了。作业\"没报错\"和\"产出了东西\"是两回事——这个平台\n# 被\"看起来成功了\"坑过太多次。\nif not check:\n    raise SystemExit(\"汇总结果是空的——上游 iceberg.demo.orders 可能没有数据\")\n"
  daily-order-summary--jobkit.py: "\"\"\"平台作业的公共小工具。**这份是权威源。**\n\n`jobs/<每个作业>/jobkit.py` 是它的逐字节副本,由\n`scripts/check-duplicated-sources.py` 在 CI 里保证不漂移。\n\n**为什么是复制而不是共享一份**:作业的文件是按目录挂进容器的\n(`scripts/render-jobs.py` 把每个作业目录下的 .py 放进 ConfigMap),\n一个作业看不到另一个作业的文件。要真正共享得打成内部包(ADR-083)——\n对几十行工具函数不值得。复制的代价(会漂移)由那个检查器兜住。\n\n改这个文件之后跑 `python3 scripts/check-duplicated-sources.py --fix`。\n\n---\n\n\n**它存在的意义是证明多文件作业真的能用**:同目录下的 .py 会被一起挂进\n容器,`import jobkit` 直接可用(PYTHONPATH 指向 /scripts)。在这之前一个\n作业只能是一个文件,稍长一点就只能把所有东西堆进一个几百行的脚本。\n\"\"\"\nimport datetime\nimport os\n\n\ndef param(name, default=None):\n    \"\"\"读作业参数。\n\n    参数在 `job.yaml` 的 `params` 里声明,平台以 `PARAM_<大写名>` 注进环境\n    变量。**补数就靠它** —— 没有参数,重跑一个日更作业只会再算一遍今天:\n\n        argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\n    \"\"\"\n    value = os.environ.get(f\"PARAM_{name.upper()}\", \"\")\n    # Argo 没有替换到值时会原样留下 `{{workflow.parameters.x}}`,那不是一个\n    # 有意义的值 —— 当成没传,用默认值。不这么处理的话它会被当成日期字符串\n    # 一路带进 SQL,报出来的错和真正的原因差着十万八千里。\n    if not value or value.startswith(\"{{\"):\n        return default\n    return value\n\n\ndef run_date():\n    \"\"\"这次要处理哪一天。默认今天,可以用 run_date 参数覆盖(补数)。\"\"\"\n    return param(\"run_date\") or datetime.date.today().isoformat()\n\n\ndef rows_of(result):\n    \"\"\"`query()` 装了 pandas 返回 DataFrame、没装返回 (列名, 行)。\n\n    **不要直接 `for r in result`** —— 在 DataFrame 上那是遍历列名,不是遍历\n    行,而且不会报错,只会安静地给出错的东西。\n    \"\"\"\n    if hasattr(result, \"itertuples\"):\n        return [tuple(t)[1:] for t in result.itertuples()]\n    return result[1]\n"
  iceberg-maintenance--job.py: "\"\"\"Iceberg 表维护:过期快照 + 清孤儿文件 + 合并小文件。\n\n**为什么需要**:Iceberg 每次写入都产生一个新快照,旧快照和它引用的数据\n文件不会自动清理;失败的写入会留下没人引用的孤儿文件;流式写入每个\ncheckpoint 落一批小文件。三件事都是**只增不减**的,不管的话:\n\n- 存储无限增长(而这个平台的 MinIO 是单副本、没有备份)\n- 查询越来越慢(小文件多 → 打开的文件句柄多、元数据大)\n\n**最先出问题的是持续写入的表**:`audit.query_events`、\n`ml.inference_log`、`demo.device_events_stream`。\n\n用 Trino 的 `ALTER TABLE ... EXECUTE` 做,不引入新组件 —— Iceberg 的这几个\n维护动作 Trino 原生支持。\n\"\"\"\nfrom platform_sdk import query\n\nfrom jobkit import param, rows_of\n\nRETAIN_DAYS = int(param(\"retain_days\", \"7\"))\nDRY_RUN = bool(param(\"dry_run\"))\n\n# **只维护平台自己产生的表。** 不去动 tpch/tpcds 这类只读的基准数据集\n# (它们不写入,没有快照堆积),也不自作主张动用户自己建的表 —— 合并小\n# 文件会重写数据,那是一个有副作用的操作,不该由平台默默对所有表执行。\nSCHEMAS = [\"audit\", \"ml\", \"demo\"]\n\n\ndef tables_in(schema):\n    try:\n        return [r[0] for r in rows_of(query(\n            f\"SELECT table_name FROM iceberg.information_schema.tables \"\n            f\"WHERE table_schema = '{schema}'\"))]\n    except Exception as exc:   # noqa: BLE001\n        # schema 不存在是正常的(比如 ml 要等推理留痕启用之后才有)\n        print(f\"  跳过 schema {schema}:{str(exc).splitlines()[0][:80]}\")\n        return []\n\n\ndef maintain(fqn):\n    \"\"\"三个动作。**任何一个失败都继续做下一个** —— 一张表的维护失败不该\n    让其它表也不做,而\"这次没清干净\"的后果只是下次多清一点。\"\"\"\n    done, failed = [], []\n    actions = [\n        # 顺序有讲究:先合并小文件(会产生新快照),再过期快照(把合并前\n        # 的旧快照清掉),最后清孤儿文件。反过来的话刚合并出来的旧文件\n        # 还被快照引用着,清不掉。\n        (\"optimize\", f\"ALTER TABLE {fqn} EXECUTE optimize\"),\n        (\"expire_snapshots\",\n         f\"ALTER TABLE {fqn} EXECUTE expire_snapshots(retention_threshold => '{RETAIN_DAYS}d')\"),\n        (\"remove_orphan_files\",\n         f\"ALTER TABLE {fqn} EXECUTE remove_orphan_files(retention_threshold => '{RETAIN_DAYS}d')\"),\n    ]\n    for name, sql in actions:\n        if DRY_RUN:\n            print(f\"  [dry-run] {name}\")\n            continue\n        try:\n            query(sql)\n            done.append(name)\n        except Exception as exc:   # noqa: BLE001\n            failed.append(f\"{name}({str(exc).splitlines()[0][:60]})\")\n    return done, failed\n\n\nprint(f\"Iceberg 表维护:保留 {RETAIN_DAYS} 天快照\"\n      f\"{'(dry-run,只打印不执行)' if DRY_RUN else ''}\")\n\ntotal, all_failed = 0, []\nfor schema in SCHEMAS:\n    names = tables_in(schema)\n    if not names:\n        continue\n    print(f\"\\nschema {schema}:{len(names)} 张表\")\n    for t in names:\n        fqn = f\"iceberg.{schema}.{t}\"\n        done, failed = maintain(fqn)\n        total += 1\n        status = f\"{len(done)}/3 成功\" if not DRY_RUN else \"dry-run\"\n        print(f\"  {fqn:50s} {status}\" + (f\"  失败:{'; '.join(failed)}\" if failed else \"\"))\n        all_failed += [f\"{fqn}: {f}\" for f in failed]\n\nprint(f\"\\n处理了 {total} 张表\")\nif all_failed:\n    # **不让整个作业失败** —— 部分表维护失败是常态(表正在被写、权限不够、\n    # Trino 版本不支持某个动作),而把作业标成红色会让人学会忽略它。\n    # 但要把失败列出来,不能静默。\n    print(f\"\\n有 {len(all_failed)} 个动作失败(作业本身不算失败,下次会再试):\")\n    for f in all_failed:\n        print(f\"  - {f}\")\nif total == 0:\n    raise SystemExit(\"一张表都没处理到 —— 检查 iceberg catalog 是否可访问\")\n"
  iceberg-maintenance--jobkit.py: "\"\"\"平台作业的公共小工具。**这份是权威源。**\n\n`jobs/<每个作业>/jobkit.py` 是它的逐字节副本,由\n`scripts/check-duplicated-sources.py` 在 CI 里保证不漂移。\n\n**为什么是复制而不是共享一份**:作业的文件是按目录挂进容器的\n(`scripts/render-jobs.py` 把每个作业目录下的 .py 放进 ConfigMap),\n一个作业看不到另一个作业的文件。要真正共享得打成内部包(ADR-083)——\n对几十行工具函数不值得。复制的代价(会漂移)由那个检查器兜住。\n\n改这个文件之后跑 `python3 scripts/check-duplicated-sources.py --fix`。\n\n---\n\n\n**它存在的意义是证明多文件作业真的能用**:同目录下的 .py 会被一起挂进\n容器,`import jobkit` 直接可用(PYTHONPATH 指向 /scripts)。在这之前一个\n作业只能是一个文件,稍长一点就只能把所有东西堆进一个几百行的脚本。\n\"\"\"\nimport datetime\nimport os\n\n\ndef param(name, default=None):\n    \"\"\"读作业参数。\n\n    参数在 `job.yaml` 的 `params` 里声明,平台以 `PARAM_<大写名>` 注进环境\n    变量。**补数就靠它** —— 没有参数,重跑一个日更作业只会再算一遍今天:\n\n        argo submit --from cronwf/daily-order-summary -p run_date=2026-08-01\n    \"\"\"\n    value = os.environ.get(f\"PARAM_{name.upper()}\", \"\")\n    # Argo 没有替换到值时会原样留下 `{{workflow.parameters.x}}`,那不是一个\n    # 有意义的值 —— 当成没传,用默认值。不这么处理的话它会被当成日期字符串\n    # 一路带进 SQL,报出来的错和真正的原因差着十万八千里。\n    if not value or value.startswith(\"{{\"):\n        return default\n    return value\n\n\ndef run_date():\n    \"\"\"这次要处理哪一天。默认今天,可以用 run_date 参数覆盖(补数)。\"\"\"\n    return param(\"run_date\") or datetime.date.today().isoformat()\n\n\ndef rows_of(result):\n    \"\"\"`query()` 装了 pandas 返回 DataFrame、没装返回 (列名, 行)。\n\n    **不要直接 `for r in result`** —— 在 DataFrame 上那是遍历列名,不是遍历\n    行,而且不会报错,只会安静地给出错的东西。\n    \"\"\"\n    if hasattr(result, \"itertuples\"):\n        return [tuple(t)[1:] for t in result.itertuples()]\n    return result[1]\n"
kind: ConfigMap
metadata:
  name: platform-jobs-scripts
  namespace: argo-workflows
