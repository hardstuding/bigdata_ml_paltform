# 这个文件是生成的,不要手改。
# 源:jobs/ 下各作业的 job.yaml + 脚本;生成器:scripts/render-jobs.py
# CI 会校验它和 jobs/ 不漂移。
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  labels:
    app.kubernetes.io/managed-by: render-jobs
    platform-jobs/name: daily-order-summary
  name: daily-order-summary
  namespace: argo-workflows
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedules:
  - 30 1 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  timezone: UTC
  workflowSpec:
    entrypoint: main
    serviceAccountName: argo-workflow
    templates:
    - container:
        command:
        - python3
        - /scripts/daily-order-summary--job.py
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://minio.minio.svc.cluster.local:9000
        - name: MLFLOW_TRACKING_URI
          value: http://mlflow.mlflow.svc.cluster.local:5000
        - name: PLATFORM_TRINO_HOST
          value: trino.trino.svc.cluster.local
        - name: PLATFORM_TRINO_PORT
          value: '8443'
        envFrom:
        - secretRef:
            name: platform-job-credentials
            optional: true
        image: local/platform-runtime:0.1.0
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /scripts
          name: scripts
      metadata:
        labels:
          app.kubernetes.io/managed-by: render-jobs
          kueue.x-k8s.io/queue-name: data-analysts
      name: main
      volumes:
      - configMap:
          name: platform-jobs-scripts
        name: scripts
