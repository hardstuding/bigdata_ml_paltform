# 【重要,见 docs/decisions/042-feast-feature-store.md"已知限制"】feast-dev/feast
# 官方 Helm chart 曾经在 apps/definitions/feast.yaml 里尝试过,已经放弃——
# 实测发现 https://feast-helm-charts.storage.googleapis.com 上真正发布的
# 0.65.0 这个版本,和 GitHub `master` 分支当前的模板代码是两套完全不同的
# 东西:发布的是旧的、纯 Java 实现(`command: java -jar
# /opt/feast/feast-serving.jar ...`,读 `/etc/feast/application-*.yaml`),
# 不是 README 里描述的、支持 `feature_store_yaml_base64` 的新版 Python
# 实现——`helm pull feast/feast --version 0.65.0` 下来直接看
# `charts/feature-server/templates/deployment.yaml` 才发现,GitHub 上看到的
# 模板源码属于还没发布的开发分支,不能直接当已发布 chart 的行为来用(这是
# 这次踩得最深的一个坑,记录下来提醒以后："helm pull 下来看实际内容"比
# "读 GitHub 源码"更可信,两者可能不是同一个东西)。而且这个 Java server
# 默认镜像 `feature-server-java` 在 0.65.0 这个 tag 下根本不存在(那个仓库
# 停更在 0.49.0)。两条路都走不通,索性不用这个 chart,改裸 manifest——
# 和 Redis(同目录 redis.yaml)是同一个先例。
#
# 用官方 Python 镜像 quay.io/feastdev/feature-server 直接跑 `feast serve`
# ——这是 Feast CLI 自己文档化的标准命令,不是绕开官方支持的自建路径。
# FEATURE_STORE_YAML_BASE64 这个环境变量注入方式也是 Feast 自己代码里
# 认的(feast/cli/serve.py 会读这个变量落地成 feature_store.yaml),不是
# 猜的,已经用 `docker run` 直接对官方镜像验证过。
#
# 但官方镜像没带 pyspark/JRE,配了 offline_store.type: spark 时
# FeatureStore() 初始化会 `import pyspark` 直接崩(这是 Feast 自身"看配置
# 里写了哪些 store,启动就全部 import"的架构限制,不是这次配置的问题,
# 详见 ADR-042)。用 apps/feast/feature-server-image/Dockerfile 在官方镜像
# 基础上加 pyspark + JRE 17,本地 `docker build` 出来,不推到任何
# registry——colima 这台机器 k3s 和本机 docker 共用镜像存储,
# imagePullPolicy: Never。换到真正的多节点集群时需要改成推到一个大家都能
# 拉到的 registry(这个仓库目前还没有 Harbor,Phase 4 才会补),记在
# ADR-042 里的已知限制,不是这次的疏漏。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-feature-server
  labels:
    app: feast-feature-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feast-feature-server
  template:
    metadata:
      labels:
        app: feast-feature-server
    spec:
      containers:
        - name: feature-server
          # 2026-08-20(BACKLOG 2.1):从"只在本地 docker 里,imagePullPolicy:
          # Never"改成 GitHub Actions 自动构建推 GHCR + digest 引用,见
          # apps/feast/feature-server-image/Dockerfile。
          image: ghcr.io/hardstuding/bigdata_ml_paltform/feast-feature-server:3a01421f1383c9028ed8fb6754f244c7680b49b5
          imagePullPolicy: IfNotPresent
          command: ["feast", "serve", "-h", "0.0.0.0"]
          ports:
            - containerPort: 6566
          # cpu request 压到 50m——这台机器 4 vCPU 常态就已经把 96% 都
          # request 满了(见 ADR-041 的背景),200m 直接导致
          # FailedScheduling(Insufficient cpu),实测调整。
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              memory: 1536Mi
          env:
            # feature_store.yaml 的内容(见 scripts/feast_feature_repo/
            # feature_store.yaml,权威源)base64 编码后塞进这个变量——Feast
            # 自己的 `feast/cli/serve.py` 认这个环境变量。和 dags-configmap.
            # yaml/feature-repo-configmap.yaml 是同一类"手动同步的重复内容"
            # 已知限制,改一处记得跟着改另一处(重新生成:`base64 -i
            # scripts/feast_feature_repo/feature_store.yaml | tr -d '\n'`)。
            - name: FEATURE_STORE_YAML_BASE64
              value: ""
            # 【可插拔基础设施,见 ADR-030】接外部 S3 改这两行的
            # secretKeyRef,不用碰上面的 base64 blob 本身(离线存储的
            # spark_conf 里引用的是这两个变量名,不是明文)。
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            # 实测坑:registry(type: file, s3:// path)走的是 Feast 自己的
            # boto3/pyarrow S3 客户端,认标准 AWS_* 环境变量,不是上面给
            # Spark 的 MINIO_ACCESS_KEY/MINIO_SECRET_KEY(那两个只在
            # spark_conf 的 ${env.*} 替换里生效,是 Hadoop S3A 客户端的配置
            # 面,和 boto3 是两条完全独立的路径)。缺了这组会在启动时后台
            # refresh registry 报 NoCredentialsError 直接崩,不是配置漏写
            # 而是两个客户端各认各的变量名。
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: AWS_ENDPOINT_URL_S3
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
---
apiVersion: v1
kind: Service
metadata:
  name: feast-feature-server
spec:
  selector:
    app: feast-feature-server
  ports:
    - port: 6566
      targetPort: 6566
