# Feast 特征仓库(feature_store.yaml + definitions.py)打包成 ConfigMap,给
# apps/airflow/dags/feast_materialize.py 的 KubernetesPodOperator 挂载用。
# 和 apps/airflow/manifests/dags-configmap.yaml 是同一个"内容重复"的取舍:
# 权威源是 scripts/feast_feature_repo/,这里是手动同步的一份拷贝,不是靠
# kustomize configMapGenerator 自动生成——这个仓库里已有的两个"内容重复"
# 先例(dags-configmap.yaml、feast.yaml 的 feature_store_yaml_base64)都是
# 手动同步,不是这次单独引入的新模式。
apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-feature-repo
  namespace: feast
data:
  feature_store.yaml: |
    # Feast 特征仓库配置(见 docs/decisions/042-feast-feature-store.md)。
    #
    # 【可插拔基础设施,见 ADR-030】registry.path 和 offline_store.spark_conf 里的
    # S3A 配置都指向本仓库自带的 MinIO;接外部 S3 只需要改
    # fs.s3a.endpoint/access.key/secret.key 这三行(access/secret 走
    # ${env.MINIO_ACCESS_KEY}/${env.MINIO_SECRET_KEY} 变量展开,不是写死在这个
    # 文件里,和 apps/hive-metastore/manifests/core-site-configmap.yaml 是同一个
    # 模式——运行前用 scripts/12-feast-feature-pipeline.sh 从 minio-root 这个
    # k8s Secret 读值导出成环境变量,这个文件本身不含明文凭据)。offline_store
    # 接的是 apps/spark-iceberg-demo 已验证过的同一个 Iceberg catalog
    # (catalog 名固定叫 "iceberg",见 ADR-036),不是另起一套。
    project: demo
    provider: local

    registry:
      registry_type: file
      path: s3://lakehouse/feast/registry.pb

    offline_store:
      type: spark
      spark_conf:
        spark.master: "local[2]"
        spark.sql.catalog.iceberg: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.iceberg.type: hive
        spark.sql.catalog.iceberg.uri: thrift://hive-metastore.data.svc.cluster.local:9083
        spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        spark.hadoop.fs.s3a.endpoint: http://minio.minio.svc.cluster.local:9000
        spark.hadoop.fs.s3a.access.key: ${env.MINIO_ACCESS_KEY}
        spark.hadoop.fs.s3a.secret.key: ${env.MINIO_SECRET_KEY}
        spark.hadoop.fs.s3a.path.style.access: "true"
        spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
        spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
        # 版本对齐 apps/spark-iceberg-demo/manifests/sparkapplication.yaml 已经
        # 验证过的组合(ADR-036),不是另挑一套。
        spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.hadoop:hadoop-aws:3.4.2,software.amazon.awssdk:bundle:2.29.52"
        spark.jars.ivy: "/tmp/.ivy2"
        # 2026-08-20 真实踩坑:`spark.jars.packages` 触发的 Ivy 解析直连
        # repo1.maven.org(Maven Central 官方源)在这片网络下会真的卡死不动
        # (不是慢,是某个 jar——这次是 aws-java-sdk-bundle,一个几百 MB 的大
        # 包——下载进度停在 0 字节超过 8 分钟没有任何变化),和这个项目到处
        # 踩过的"直连境外 CDN/官方源带宽瓶颈或直接卡死"是同一类问题(PyPI/apt
        # 官方源那几次)。加一个阿里云的 Maven 公共镜像仓库当额外候选源——
        # Ivy 按 `spark.jars.repositories` 列出的顺序尝试,不会移除默认的
        # Maven Central,只是多一个更快的选项。
        spark.jars.repositories: "https://maven.aliyun.com/repository/public"

    online_store:
      type: redis
      # 集群内部访问用这个 Service DNS;本机脚本跑 feast materialize 时通过
      # scripts/12-feast-feature-pipeline.sh 里的 port-forward 改写成 localhost。
      connection_string: "feast-redis.feast.svc.cluster.local:6379"

    entity_key_serialization_version: 3
  definitions.py: |
    # Demo 特征定义:复用 scripts/08-create-demo-data.sh 已经建好的
    # iceberg.demo.orders 表(不新起一套无关的 demo 数据)。把每一笔订单当一个
    # "事件":entity 是下单客户,features 是这笔订单的地区/品类/金额——用来演示
    # point-in-time 正确的特征检索,不是刻意设计的最佳实践 schema。
    from datetime import timedelta

    from feast import Entity, FeatureView, Field
    from feast.infra.offline_stores.contrib.spark_offline_store.spark_source import (
        SparkSource,
    )
    from feast.types import Float32, String

    customer = Entity(
        name="customer_name",
        join_keys=["customer_name"],
        description="demo.orders 表里的下单客户姓名,demo 用,不是真实生产实体键设计",
    )

    # 用 query 而不是 table:iceberg.demo.orders 的 order_date 是 DATE 类型,
    # Feast 的 timestamp_field 要求 TIMESTAMP,这里显式 CAST 一次。
    orders_source = SparkSource(
        name="orders_source",
        query=(
            "SELECT customer_name, region, product, amount, "
            "CAST(order_date AS TIMESTAMP) AS event_timestamp "
            "FROM iceberg.demo.orders"
        ),
        timestamp_field="event_timestamp",
    )

    customer_order_features = FeatureView(
        name="customer_order_features",
        entities=[customer],
        ttl=timedelta(days=3650),  # demo 数据是固定的几笔历史订单,ttl 给大一点避免过期
        schema=[
            Field(name="region", dtype=String),
            Field(name="product", dtype=String),
            Field(name="amount", dtype=Float32),
        ],
        source=orders_source,
    )
