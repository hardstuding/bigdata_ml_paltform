# 定期(每 5 分钟)把 platform/iam/ 下的组织架构/角色数据同步进
# Keycloak,不用等人手动想起来跑 scripts/12-sync-iam.py。见 ADR-031。
#
# 权限设计上刻意和"谁能改 platform/iam/ 里的数据"这件事分开:这个
# CronJob 只读 git(公开仓库,不需要凭据),只有 `pods/exec` 到 keycloak
# 这一个 namespace 里那一个 pod 的权限,没有 git 写权限、没有其他任何
# namespace 的权限。真正能改权限数据的是走 apps/permission-request-app/
# 那个自助申请门户(或者人自己发 PR)——那边有 git 写权限但没有集群权限,
# 这边有集群权限但没有 git 写权限,没有任何一个组件同时拿到两种能力,是
# 故意的纵深防御,不是疏漏。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-sync
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-sync
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["keycloak-keycloakx-0"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["keycloak-keycloakx-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-sync
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: iam-sync
    namespace: keycloak
roleRef:
  kind: Role
  name: iam-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iam-sync
  namespace: keycloak
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 2026-08-12 打开 Alertmanager 后第一批告警就抓到:这个原来设成和
      # 调度间隔一样的 5 分钟,在内存紧张的时候不够用(apt-get install git +
      # pip install pyyaml + git clone 这几步本身正常就要一段时间,资源紧张
      # 时更慢),连续踩到 DeadlineExceeded 被强杀,`kubectl describe job`
      # 确认过真实原因。放宽到 10 分钟,配合 concurrencyPolicy: Forbid——
      # 跑慢的那次结束前,下一次调度会跳过,不会堆积,不会因为放宽这个值
      # 就产生并发跑多份的风险。
      #
      # 2026-08-12 补充(colima 内存从 9G 提到 11G、重启之后):亲眼看到一次
      # Job 跑了 39 分钟还没被 activeDeadlineSeconds(600 秒)杀掉——不是
      # 这个字段配错,是 k3s 的 job-controller 在集群刚重启、有一堆
      # controller 在追之前积压的 reconcile 工作时,执行"到期检查"这个
      # 动作本身会明显滞后,`kubectl delete job` 这种最简单的操作当时也
      # 卡了 2 分钟才返回,side 证据指向同一个根因。真正卡住那次 Job 的
      # 原因另有其事(见下面 apt-get 那几行的注释),但"deadline killer
      # 本身可能会迟到"这条本身也值得记录:不能假设"设了 deadline 就一定
      # 会准时被杀",这只是兜底,不是能百分之百依赖的即时保证。
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: iam-sync
          restartPolicy: Never
          initContainers:
            # 官方 kubectl 二进制,不是社区打包的"kubectl 专用镜像"(那类
            # 镜像来源良莠不齐,和 ADR-008 只用官方来源的原则一致)。
            #
            # 架构必须动态探测,不能硬编码 amd64:实测在 arm64 节点(colima
            # 跑在 Apple Silicon 上默认就是 aarch64)上,amd64 的 kubectl
            # 靠 QEMU 模拟执行时,`kubectl exec` 会稳定触发 client-go 的一个
            # 真实并发 bug(REST discovery mapper 并发写同一个 map,
            # `fatal error: concurrent map writes`,栈跟踪在
            # k8s.io/client-go/restmapper/discovery.go),不是环境偶发抖动
            # ——换成原生架构的二进制,不走模拟层,问题消失。这台机器上能
            # 装起来不代表能跑,这类"模拟执行下的真实并发 bug"只有真的调用
            # 到那条代码路径才会暴露,静态检查/helm template 都测不出来。
            # apt-get 的 http/https 方法默认没有超时——2026-08-12 亲眼
            # 抓到一次:一台 colima 刚重启、网络还在收敛的机器上,
            # `apt-get install` 卡在某一次 HTTP 连接上超过半小时都不会
            # 自己放弃(`crictl exec` 进容器用 /proc 确认了具体是
            # `/usr/lib/apt/methods/http` 这个子进程挂着不动)——不是网络
            # 彻底不通(同一时刻宿主机自己 curl 同样的地址是通的),是这一次
            # TCP 连接本身卡住了,apt 不会主动放弃重连。显式加
            # `Acquire::http::Timeout`/`Acquire::Retries`,让它按重试上限
            # 失败退出,而不是无限期挂着等 activeDeadlineSeconds 来兜底
            # (兜底本身也可能迟到,见上面的补充说明,不能只指望这一层)。
            - name: fetch-kubectl
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set -e
                  apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 update -qq
                  apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 install -y -qq curl git >/dev/null
                  ARCH=$(uname -m)
                  case "$ARCH" in
                    x86_64) KARCH=amd64 ;;
                    aarch64) KARCH=arm64 ;;
                    *) echo "未知架构: $ARCH" >&2; exit 1 ;;
                  esac
                  KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
                  curl -fsSL -o /tools/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KARCH}/kubectl"
                  chmod +x /tools/kubectl
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: sync
              image: python:3.12-slim
              # 直连 github.com 在这台机器上会卡住/超时(和 Argo Workflows
              # 的 CRD 安装 Job 当初踩的是同一个网络限制,见 ADR-026),要走
              # colima 虚拟机内部看到的宿主机代理。地址来自
              # `colima ssh -- env | grep -i proxy`,换了网络或者重启
              # colima 后如果这个 Job 又卡在 git clone 上,先重新跑一遍这条
              # 命令确认地址没变。dl.k8s.io(kubectl 二进制)不受影响,不需要
              # 代理也能直连,只有这一步的 github.com 需要。
              env:
                - name: HTTP_PROXY
                  value: "http://192.168.5.2:1087"
                - name: HTTPS_PROXY
                  value: "http://192.168.5.2:1087"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16"
              command:
                - sh
                - -c
                - |
                  set -e
                  export PATH="/tools:$PATH"
                  apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 update -qq
                  apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 install -y -qq git >/dev/null
                  pip install --quiet pyyaml
                  git clone --depth 1 https://github.com/hardstuding/bigdata_ml_paltform.git /tmp/repo
                  cd /tmp/repo
                  python3 scripts/12-sync-iam.py --no-create-users
              volumeMounts:
                - name: tools
                  mountPath: /tools
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tools
              emptyDir: {}
