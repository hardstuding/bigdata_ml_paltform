# 定期(每 5 分钟)把 platform/iam/ 下的组织架构/角色数据同步进
# Keycloak,不用等人手动想起来跑 scripts/12-sync-iam.py。见 ADR-031。
#
# 权限设计上刻意和"谁能改 platform/iam/ 里的数据"这件事分开:这个
# CronJob 只读 git(公开仓库,不需要凭据),只有 `pods/exec` 到 keycloak
# 这一个 namespace 里那一个 pod 的权限,没有 git 写权限、没有其他任何
# namespace 的权限。真正能改权限数据的是走 apps/permission-request-app/
# 那个自助申请门户(或者人自己发 PR)——那边有 git 写权限但没有集群权限,
# 这边有集群权限但没有 git 写权限,没有任何一个组件同时拿到两种能力,是
# 故意的纵深防御,不是疏漏。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-sync
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-sync
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["keycloak-keycloakx-0"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["keycloak-keycloakx-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-sync
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: iam-sync
    namespace: keycloak
roleRef:
  kind: Role
  name: iam-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iam-sync
  namespace: keycloak
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 2026-08-12 打开 Alertmanager 后第一批告警就抓到:这个原来设成和
      # 调度间隔一样的 5 分钟,在内存紧张的时候不够用(apt-get install git +
      # pip install pyyaml + git clone 这几步本身正常就要一段时间,资源紧张
      # 时更慢),连续踩到 DeadlineExceeded 被强杀,`kubectl describe job`
      # 确认过真实原因。放宽到 10 分钟,配合 concurrencyPolicy: Forbid——
      # 跑慢的那次结束前,下一次调度会跳过,不会堆积,不会因为放宽这个值
      # 就产生并发跑多份的风险。
      #
      # 2026-08-12 补充(colima 内存从 9G 提到 11G、重启之后):亲眼看到一次
      # Job 跑了 39 分钟还没被 activeDeadlineSeconds(600 秒)杀掉——不是
      # 这个字段配错,是 k3s 的 job-controller 在集群刚重启、有一堆
      # controller 在追之前积压的 reconcile 工作时,执行"到期检查"这个
      # 动作本身会明显滞后,`kubectl delete job` 这种最简单的操作当时也
      # 卡了 2 分钟才返回,side 证据指向同一个根因。真正卡住那次 Job 的
      # 原因另有其事(见下面 apt-get 那几行的注释),但"deadline killer
      # 本身可能会迟到"这条本身也值得记录:不能假设"设了 deadline 就一定
      # 会准时被杀",这只是兜底,不是能百分之百依赖的即时保证。
      activeDeadlineSeconds: 600
      template:
        spec:
          # 见 ADR-041(队列资源管理):定时批处理任务,归 batch 档。
          priorityClassName: batch
          serviceAccountName: iam-sync
          restartPolicy: Never
          containers:
            - name: sync
              # 2026-08-20(BACKLOG 2.1):git/kubectl/pyyaml 这几个工具
              # 构建期固化进镜像(见 apps/iam-sync/Dockerfile),不用再在
              # initContainer + 主容器里各自现装一遍——那套 apt-get/curl
              # 加固代码(超时、镜像源、delayed-item 重试队列的坑)本身踩过
              # 的教训是真实的,但已经不需要在运行时规避了,历史留在 git
              # log 里。**kubectl 的多架构支持这次没有丢**:构建这个镜像的
              # GitHub Actions workflow(build-images.yml)显式建了
              # linux/amd64 + linux/arm64 两个平台,`apt-get install
              # kubectl` 在交叉构建时装的是目标架构原生的包,不会重新引入
              # "amd64 kubectl 在 arm64 节点上用 QEMU 模拟执行触发
              # client-go 并发 bug" 这个已经修过的坑(问题详情仍保留在这次
              # commit 的历史版本里)。
              #
              # 保留在运行时的只有 `git clone` 这一步——这是这个 CronJob
              # 存在的意义本身(每次都要拿 platform/iam/ 最新数据,不是
              # 构建时固化的静态内容),用 `http.lowSpeedLimit`/
              # `http.lowSpeedTime`(git 自己的传输层超时机制,能容忍真实
              # 慢速网络,只掐真正卡死不动的连接)。这个 digest 是
              # linux/amd64+linux/arm64 多架构 manifest list 的 digest,
              # 对应 commit 8fbb640b396670cfdd08ae7beef4d322aae93421,
              # 本地(colima/arm64)docker build + 容器内 `git --version`/
              # `kubectl version --client`/`python3 -c "import yaml"`
              # 三个工具都确认能用,还没在真实集群里跑过一次(下次开云
              # 主机时应该验证 CronJob 真的能触发、Job 能 Complete)。
              image: ghcr.io/hardstuding/bigdata_ml_paltform/iam-sync@sha256:fb9ffde1ae04ca954339f3fb942070899d466a19a266a471d663de23f8c84467
              command:
                - sh
                - -c
                - |
                  set -e
                  git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 clone --depth 1 https://github.com/hardstuding/bigdata_ml_paltform.git /tmp/repo
                  cd /tmp/repo
                  python3 scripts/12-sync-iam.py --no-create-users
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
