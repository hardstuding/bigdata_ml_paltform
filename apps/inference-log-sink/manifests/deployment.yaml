# 推理留痕的接收端(ADR-085)。KServe 的 payload logger 把请求/响应作为
# CloudEvents POST 过来,这个服务把它们丢进 Kafka,下游由
# streams/inference-log/ 那个 Flink 作业落到 Iceberg。
#
# **常驻 Deployment 而不是 CronJob**:它是被动接收的,推理什么时候来
# 就什么时候收,不能只在某个时刻活着。
apiVersion: v1
kind: Namespace
metadata:
  name: inference-log-sink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-log-sink
  namespace: inference-log-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-log-sink
  template:
    metadata:
      labels:
        app: inference-log-sink
    spec:
      containers:
        - name: app
          # **启用之前要把这个 tag 换成一个真实存在的 commit SHA。**
          # 顺序不能颠倒:先让 CI 构建成功一次(这个组件进 build-images.yml
          # 的矩阵之后,下一次 push 就会构建),拿到确实存在的 SHA,再改这里
          # 并把 inference-log-sink.yaml 加进 enabled_components。
          # 同一轮做完的话,镜像名拼错或构建失败会直接变成 ImagePullBackOff,
          # 而那在本地验证不了。platform-runtime 那次也是这么排的。
          image: crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/inference-log-sink:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: inference-log
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
          # **liveness 探 /healthz(不探 Kafka),readiness 探 /readyz(探
          # Kafka)。** 反过来的话 Kafka 一抖动这个 Pod 就被重启,而重启
          # 解决不了 Kafka 的问题,只会让接收端也不可用。
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-log-sink
  namespace: inference-log-sink
spec:
  selector:
    app: inference-log-sink
  ports:
    - port: 80
      targetPort: 8080
      name: http
