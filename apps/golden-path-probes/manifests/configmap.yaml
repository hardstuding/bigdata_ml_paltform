# 黄金链路探针的脚本(ADR-079)。**这是渲染产物的源文件**,改这里。
#
# 只用 Python 标准库,不 pip install——和 openmetadata-quality-alerts 那个
# CronJob 同一个模式(`python:3.12-slim` + 内联 stdlib),不引新镜像。
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-probes
  namespace: monitoring
data:
  probe.py: |
    """按"链路"而不是"组件"探测平台是否可用。

    这个平台反复吃过同一个亏:**每个组件都绿,而链路是断的**——
    ArgoCD Synced 不等于生效、Pod Running 不等于健康、Job Complete 不等于
    业务逻辑跑对。所以这里探的不是"某个进程活着",是"**一件真实的事情能不
    能从头做到尾**"。

    每条链路一个 CronJob(而不是一个 CronJob 跑所有链路),为的是让
    kube-state-metrics 天然给出每条链路的
    `kube_cronjob_status_last_successful_time` ——看板和告警都不用再引
    Pushgateway 之类的新组件。失败就非零退出,让 Job 变成 Failed。
    """
    import json
    import os
    import pathlib
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request
    from base64 import b64encode

    TRINO = os.environ.get("TRINO_URL", "https://trino.trino.svc.cluster.local:8443")
    USER = os.environ.get("TRINO_USER", "goldenpath_probe")
    PASSWORD = os.environ.get("TRINO_PASSWORD", "")
    OM = os.environ.get("OPENMETADATA_URL",
                        "http://openmetadata.openmetadata.svc.cluster.local:8585")
    MLFLOW = os.environ.get("MLFLOW_TRACKING_URI",
                            # Service 名是 mlflow-mlflow(chart 的 fullname 拼出来的),不是 mlflow
    # ——从 platform-sdk/platform_sdk/config.py 抄的实际值,不是猜的。
                            "http://mlflow-mlflow.mlflow.svc.cluster.local:5000")

    # Trino 的 https 是 cert-manager 自签的(ADR-016),集群内这一跳不需要
    # 被信任 —— 和 table-registration-app / Superset 连 Trino 的做法一致。
    _CTX = ssl.create_default_context()
    _CTX.check_hostname = False
    _CTX.verify_mode = ssl.CERT_NONE


    def _req(url, data=None, headers=None):
        r = urllib.request.Request(url, data=data, headers=headers or {},
                                   method="POST" if data else "GET")
        return json.load(urllib.request.urlopen(r, timeout=60, context=_CTX))


    def trino_query(sql):
        """跑一条 SQL,返回第一行第一列。

        用 Trino 的 REST 协议(POST /v1/statement 之后跟着 nextUri 翻页),
        不装 trino 客户端 —— 这个 CronJob 刻意只用标准库。
        """
        auth = b64encode(f"{USER}:{PASSWORD}".encode()).decode()
        headers = {"X-Trino-User": USER, "Authorization": f"Basic {auth}",
                   "Content-Type": "text/plain"}
        resp = _req(f"{TRINO}/v1/statement", data=sql.encode(), headers=headers)
        rows = resp.get("data") or []
        # Trino 是流式返回的:第一个响应通常还没有数据,要一直跟着 nextUri
        # 拿到 state=FINISHED 为止。**不跟到底就判断"没有数据"是错的**,
        # 这是用裸 REST 调 Trino 最容易踩的坑。
        while "nextUri" in resp:
            resp = _req(resp["nextUri"], headers={"Authorization": f"Basic {auth}"})
            rows += resp.get("data") or []
            if resp.get("error"):
                raise RuntimeError(f"Trino 报错: {resp['error'].get('message')}")
        return rows[0][0] if rows else None


    def probe_query():
        """链路一:查询。Trino -> Iceberg -> MinIO/Hive Metastore -> OPA。

        任何一环挂了这条都会失败:OPA 挂了 Trino 是 fail-closed 会拒绝、
        HMS 挂了找不到表、MinIO 挂了读不到文件。
        """
        n = trino_query("select count(*) from iceberg.demo.orders")
        if n is None or int(n) < 1:
            raise RuntimeError(f"iceberg.demo.orders 查到 {n} 行,期望至少 1 行")
        return f"iceberg.demo.orders 有 {n} 行"


    def probe_streaming():
        """链路二:流式接入。Kafka -> Flink -> Iceberg。

        看的是**数据的新鲜度**,不是"Flink 进程活着"——ADR-062 实测过
        JM/TM 都 Running 而作业已经 FAILED 的情况。
        """
        max_age_min = int(os.environ.get("MAX_AGE_MIN", "60"))
        age = trino_query(
            "select coalesce(date_diff('minute', max(event_time), current_timestamp), 99999) "
            "from iceberg.demo.device_events_stream")
        if age is None or int(age) > max_age_min:
            raise RuntimeError(
                f"device_events_stream 最新一条数据是 {age} 分钟前,超过阈值 {max_age_min} 分钟"
                "(producer 每 5 分钟发一批,Flink 每分钟 checkpoint 一次)")
        return f"最新数据 {age} 分钟前"


    def probe_audit():
        """链路七:查询审计。Trino event listener -> Kafka -> Flink -> Iceberg。

        **判据是"审计表里有没有新行",不是"Flink 作业在不在跑"。**
        这条区别是这个探针存在的全部理由:

        - `AuditSinkJobNotRunning` 那条告警盯的是作业还在不在。作业**在跑
          但消费停滞**(卡在某个算子、反压、写 Iceberg 一直失败)它看不出来。
        - 而审计这条链路的失效**补不回来**:Trino 的 event listener 配了
          `terminate-on-initialization-failure=false`(否则 Kafka 挂了 Trino
          起不来),代价就是事件会静默丢失;Kafka 保留期一到就永久没了。
          ADR-066 里那个取舍,靠的就是"断了要有人立刻知道"。

        探针自己这次查询也会被审计记下来,所以**不需要额外造流量** ——
        只要看最近有没有任何审计行进来就够了。
        """
        max_age_min = int(os.environ.get("AUDIT_MAX_AGE_MIN", "60"))
        age = trino_query(
            "select coalesce(date_diff('minute', max(event_ts), current_timestamp), 99999) "
            "from iceberg.audit.query_events")
        if age is None or int(age) > max_age_min:
            raise RuntimeError(
                f"audit.query_events 最新一条是 {age} 分钟前,超过阈值 {max_age_min} 分钟。"
                "**审计没法事后补,没记就是没记。** 这条链有两个完全不同的断法,"
                "先分清是哪一个再动手 —— 原来这里直接断言是第二种,"
                "2026-09-02 真出事时把排查方向带偏了:\n"
                "  1) 源头没产生事件:发一条 Trino 查询,再看 Kafka 的 offset 动没动\n"
                "     kubectl -n kafka exec platform-kafka-dual-role-0 -- \\\n"
                "       /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 \\\n"
                "       --topic trino-query-events\n"
                "     offset 不动 = Trino 的 event listener 没工作(它坏掉时**没有任何"
                "报错**,插件照常加载、配置文件也对)\n"
                "  2) 事件在 Kafka 里但没落库:看消费组 LAG\n"
                "     kubectl -n kafka exec platform-kafka-dual-role-0 -- \\\n"
                "       /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 \\\n"
                "       --describe --group flink-trino-audit-sink\n"
                "     LAG 大 = 消费端的问题,查 kubectl -n flink get flinkdeployment "
                "trino-audit-sink")
        return f"最新审计记录 {age} 分钟前"


    def probe_catalog_connection():
        """数据目录里那份 Trino 连接配置是不是完整的。

        **为什么单独探这一条,而不是靠采集 Job 自己失败暴露。**

        这个配置上的 `username` 掉过两次(2026-08-30、2026-09-02),而它掉了
        之后的表现是:OpenMetadata 拿这份配置去挨个匹配几十种数据库连接类型,
        吐出 **483 条 pydantic 校验错误**,真正那一句
        `[TrinoConnection].username Field required` 夹在中间,最后以一句毫不
        相干的 `AttributeError: 'NoneType' object has no attribute 'root'`
        收尾 —— **没人会从那 483 行里读出"少了个用户名"**。

        更麻烦的是它的失败是**渐进的**:数据质量任务只是"6 条里坏 1 条"
        (Success 83.33%),CronJob 变红,而目录本身照常能查、页面照常能开。
        很容易被当成"某条测试写错了"放着。

        `scripts/47` 里有同样的检查,但那只在跑那个脚本的时候查一次 ——
        拦不住"配置在运行期丢失"。这里每 10 分钟查一次。
        """
        token = os.environ.get("OPENMETADATA_TOKEN", "")
        if not token:
            raise RuntimeError("没有 OPENMETADATA_TOKEN,先跑 scripts/27-configure-openmetadata-bot.sh")
        try:
            svc = _req(f"{OM}/api/v1/services/databaseServices/name/trino",
                       headers={"Authorization": f"Bearer {token}"})
        except urllib.error.HTTPError as e:
            raise RuntimeError(f"查不到 trino 这个 DatabaseService(HTTP {e.code})")
        cfg = (svc.get("connection") or {}).get("config") or {}
        missing = [f for f in ("username", "authType", "hostPort") if not cfg.get(f)]
        if missing:
            raise RuntimeError(
                f"trino 的连接配置缺了 {missing} —— 数据质量/血缘采集会以 483 条 "
                f"pydantic 校验错误失败,真正的原因埋在里面。"
                f"处置:./scripts/29-configure-openmetadata-trino-ingestion.sh")
        return f"连接配置完整(username={cfg.get('username')})"

    def probe_catalog():
        """链路三:数据目录。Trino 元数据 -> OpenMetadata 采集 -> 目录可查。

        **第一版以为表实体匿名可读,实测 HTTP 401** —— OpenMetadata 的
        /api/v1/tables 需要带 token。复用 openmetadata-quality-alerts 那个
        CronJob 已经在用的同一个 bot token(scripts/27 建的),不另发一份:
        多一份 token 就多一个会过期、会漏配、会忘了轮换的东西。
        """
        token = os.environ.get("OPENMETADATA_TOKEN", "")
        if not token:
            raise RuntimeError("没有 OPENMETADATA_TOKEN,先跑 scripts/27-configure-openmetadata-bot.sh")
        try:
            t = _req(f"{OM}/api/v1/tables/name/trino.iceberg.demo.orders?fields=columns",
                     headers={"Authorization": f"Bearer {token}"})
        except urllib.error.HTTPError as e:
            raise RuntimeError(f"OpenMetadata 查不到 trino.iceberg.demo.orders(HTTP {e.code})")
        cols = t.get("columns") or []
        if not cols:
            raise RuntimeError("目录里有这张表,但一个字段都没有——采集只跑了一半")
        return f"目录里有这张表,{len(cols)} 个字段"


    def probe_authz():
        """链路四:授权还在不在生效。

        **这条探的是"该拒的有没有被拒",不是"该通的有没有通"。** 前三条链路
        探的都是"事情做得成";这一条反过来——如果 OPA 悄悄不生效了(策略加载
        失败、有人加了一条放行所有的规则、grants 同步挂了导致判断失效),
        前面那些探针**全都还是绿的**,而平台已经门户大开。

        这不是假想:2026-08-26/27 两天里这个控制悄悄坏过两次——
        `is_platform_admin` 因为 Trino 没配 group provider 从来没触发过
        (ADR-078),Superset 用共享服务账号导致列级脱敏在 BI 路径上完全
        不生效(ADR-074)。**两次都是查别的东西时顺手发现的,不是被监控发现的。**

        探法:goldenpath_probe 只被授予了 demo.orders 和 demo.device_events_stream
        两张表(platform/iam/table-access-grants.csv)。让它去查一张**没有被
        授予**的表,期望被拒。**查得通才是故障。**
        """
        table = os.environ.get("AUTHZ_DENY_TABLE", "iceberg.demo.access_test_l1")
        try:
            trino_query(f"select count(*) from {table}")
        except Exception as exc:  # noqa: BLE001
            if "PERMISSION_DENIED" in str(exc) or "Access Denied" in str(exc):
                return f"没有 grant 的表({table})确实被拒了"
            # 别的错误(表不存在、Trino 挂了)不能当成"授权生效"——那会让这条
            # 探针在平台整体故障时反而变绿,是最坏的一种假阳性。
            raise RuntimeError(f"期望 PERMISSION_DENIED,实际是另一种失败:{exc}")
        raise RuntimeError(
            f"**{table} 被放行了**,而 goldenpath_probe 并没有它的 grant。"
            "OPA 的表级授权可能已经不生效——检查 opa 的策略是否加载成功、"
            "grants 同步 CronJob 是否还在跑。")


    def probe_model():
        """链路五:模型注册表。训练 -> MLflow -> 模型可被取用。

        探的是"**注册表里那个模型还在、而且是 READY**",不是"MLflow 进程活着"
        ——模型的元数据在 Postgres 里、产物在 MinIO 上,任何一个断了模型都取
        不出来,而 MLflow 的首页照样打得开。

        刻意不探 KServe 推理:现在集群里一个 InferenceService 都没有
        (`kubectl get inferenceservice -A` 是空的),探它只会得到一条永远红
        的告警——**一直红的告警比没有告警更糟**。等真有常驻推理服务了再加。
        """
        name = os.environ.get("MODEL_NAME", "demo-rf-classifier")
        try:
            d = _req(f"{MLFLOW}/api/2.0/mlflow/registered-models/get?name={name}")
        except urllib.error.HTTPError as e:
            raise RuntimeError(f"MLflow 里查不到模型 {name}(HTTP {e.code})")
        versions = (d.get("registered_model") or {}).get("latest_versions") or []
        if not versions:
            raise RuntimeError(f"模型 {name} 存在,但一个版本都没有")
        ready = [v for v in versions if v.get("status") == "READY"]
        if not ready:
            raise RuntimeError(
                f"模型 {name} 有 {len(versions)} 个版本,但没有一个是 READY"
                "(产物可能没上传成功,元数据却写进去了)")
        return f"{name} 有 {len(ready)} 个 READY 版本"


    def probe_inference():
        """链路六:在线推理。KServe 服务能不能真的返回预测。

        **ADR-079 第一版刻意跳过了这条**,理由是"集群里一个 InferenceService
        都没有,探它只会得到一条永远红的告警"。2026-08-28 那条链路真正跑通之后
        (ADR-080:训练→注册→审批→部署),这个理由不成立了,补上。

        探的是**发一次真实请求拿到预测**,不是"Pod Ready"。这个区分在这条链路
        上格外重要:2026-08-28 实测过 Ready=True 但模型拉不下来的中间态,
        以及模型拉下来了但特征维度对不上直接报错的情况——**两种都是 Pod 健康
        而服务不可用**。

        特征维度从环境变量来,因为它取决于训练用的数据集(demo 模型是 20 维)。
        """
        import urllib.error as _ue

        url = os.environ.get(
            "INFERENCE_URL",
            "http://demo-rf-classifier-predictor.kserve-demo.svc.cluster.local/"
            "v2/models/demo-rf-classifier/infer")
        n = int(os.environ.get("INFERENCE_FEATURES", "20"))
        body = json.dumps({
            "inputs": [{"name": "input-0", "shape": [1, n], "datatype": "FP32",
                        "data": [0.1] * n, "parameters": {"content_type": "np"}}],
            "parameters": {"content_type": "np"},
        }).encode()
        try:
            out = _req(url, data=body, headers={"Content-Type": "application/json"})
        except _ue.HTTPError as e:
            raise RuntimeError(f"推理请求失败(HTTP {e.code}):{e.read()[:160].decode(errors='ignore')}")
        outputs = out.get("outputs") or []
        if not outputs or not outputs[0].get("data"):
            # 有 200 但没有预测值,说明模型加载了却没真的算——这种"半通"
            # 状态只有看返回内容才发现,看状态码是看不出来的。
            raise RuntimeError(f"返回里没有预测值:{json.dumps(out, ensure_ascii=False)[:160]}")
        return f"返回预测 {outputs[0]['data'][:3]}"


    def probe_gitops():
        """每个 ArgoCD Application 都还能读到自己的源。

        **为什么这条值得单独探。** 一个 Application 拉不到 chart 时会停在
        `sync=Unknown`,而 `health` 仍然是 Healthy —— 活对象好好跑着,只是
        **git 里改的任何配置都同步不下去了**,而 ArgoCD 界面上不会红。

        2026-09-03 一天之内在三个组件上撞到(trino / minio / ingress-nginx,
        都是境外 helm repo 拉不动)。其中 ingress-nginx 那次的代价最直观:
        它因为内存上限太小反复 OOM,把整个平台的外部访问搞断了,而"把上限
        调大"这个修复**同步不下去** —— 改完之后活对象纹丝不动,回头看
        Application 的 conditions 才发现根本没同步。

        判据是 sync 状态,不是 health。健康的活对象说明不了配置是新的。
        """
        import urllib.request as _u
        token = pathlib.Path(
            "/var/run/secrets/kubernetes.io/serviceaccount/token").read_text().strip()
        url = ("https://kubernetes.default.svc/apis/argoproj.io/v1alpha1"
               "/namespaces/argocd/applications")
        req = _u.Request(url, headers={"Authorization": f"Bearer {token}"})
        ctx = ssl.create_default_context(
            cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
        apps = json.loads(_u.urlopen(req, timeout=30, context=ctx).read())["items"]

        # **判据是 ComparisonError,不是"此刻 sync==Unknown"。**
        # 一个 Application 在**正常刷新的那几秒**里 sync 也是 Unknown ——
        # 第一版按 Unknown 判,上线第一次跑就误报了一个正在刷新的组件。
        # 一个会误报的探针没人会信,和没有探针差不多。
        # 真正"读不到源"时,ArgoCD 会挂一条 ComparisonError condition 上去,
        # 里面就是 helm pull 的原始报错,而且它会一直挂着直到恢复。
        bad = []
        for a in apps:
            errs = [c for c in (a.get("status", {}).get("conditions") or [])
                    if c.get("type") in ("ComparisonError", "UnknownError")]
            if errs:
                bad.append((a["metadata"]["name"],
                            (errs[0].get("message") or "")[:60]))
        if bad:
            names = ", ".join(f"{n}({st})" for n, st in bad[:6])
            raise RuntimeError(
                f"{len(bad)} 个 Application 读不到自己的源:{names}。"
                "**它们的 health 多半还是 Healthy,活对象也在跑** —— 但 git 里改的"
                "配置同步不下去了,而且界面上不会红。"
                "看具体原因:kubectl -n argocd get app <名字> "
                "-o jsonpath='{.status.conditions[0].message}'。"
                "常见原因是境外 helm repo 拉不动,做法是把 chart vendor 进仓库"
                "(scripts/28-vendor-helm-chart.sh,见 ADR-061)")
        return f"{len(apps)} 个 Application 都读得到源"


    PROBES = {"query": probe_query, "streaming": probe_streaming,
              "catalog": probe_catalog, "authz": probe_authz,
              "model": probe_model, "inference": probe_inference,
              "audit": probe_audit,
              "catalog-connection": probe_catalog_connection,
              "gitops": probe_gitops}

    if __name__ == "__main__":
        name = sys.argv[1]
        fn = PROBES.get(name)
        if not fn:
            print(f"未知链路 {name},可选:{sorted(PROBES)}", file=sys.stderr)
            sys.exit(2)
        t0 = time.time()
        try:
            detail = fn()
        except Exception as exc:  # noqa: BLE001 - 探针要把任何失败都变成非零退出
            print(f"链路 [{name}] 不通({time.time() - t0:.1f}s):{exc}", file=sys.stderr)
            sys.exit(1)
        print(f"链路 [{name}] 通({time.time() - t0:.1f}s):{detail}")
