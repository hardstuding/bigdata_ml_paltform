# Spark 官方(Apache 项目本身)发布的镜像(apache/spark),不是社区/第三方
# 构建的,和 ADR-008 拒绝 Bitnami 的筛选标准一致。
#
# 没有官方 Helm chart(Spark 项目本身不维护 History Server 的 chart),所以
# 直接写裸 manifest,和 platform/coredns-custom/、
# platform/grafana-audit-dashboard/ 是同一类"没有官方 chart 时怎么办"的
# 处理方式。
#
# 用 `spark-class org.apache.spark.deploy.history.HistoryServer` 直接调
# History Server 的 Java 入口类,不依赖官方镜像 entrypoint 脚本的参数分发
# 约定(那个约定是给 spark-submit 的 driver/executor 场景设计的,没有确认过
# 是否支持直接跑 history-server,直接调 Java 类更明确、不用猜)。
#
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY 用环境变量而不是塞进
# SPARK_HISTORY_OPTS 字符串里——Hadoop 的 S3A 连接器本来就认这两个环境变量
# (默认凭据提供链的一部分),不需要在 Java opts 里手写一遍凭据。
# 2026-08-19 真实故障:部署后 CrashLoopBackOff,
# `ClassNotFoundException: Class org.apache.hadoop.fs.s3a.S3AFileSystem
# not found`——apache/spark 官方镜像故意不打包云存储连接器 jar(s3a 属于
# 可选依赖,体积原因)。当时的解法是用 initContainer 在**每次 Pod 启动时**
# 从 Maven Central 现拉 hadoop-aws + aws-java-sdk-bundle。
#
# **2026-08-22:那个解法在 cloud-full 上被实测证伪,已经换掉。** 那天 VM
# 重启后 History Server 起不来,init 容器报
# `curl: (28) Operation timed out after 120000 milliseconds with 44908902
# out of 280645251 bytes received`——aws-java-sdk-bundle 有 280MB,从境内
# 节点拉 Maven Central 拉不完,Pod 进 CrashLoopBackOff。这不是偶发网络
# 抖动,是同一个坑第三次出现:apps/spark-iceberg-image/Dockerfile 和
# apps/argo-workflows-training-image/Dockerfile 顶部都记过同一件事
# (运行时联网拉依赖在这个环境里不可靠)。
#
# 现在直接复用 apps/spark-iceberg-image/ 那个镜像——它构建期就把这两个
# jar(版本完全一致)打进了 ${SPARK_HOME}/jars/。**Pod 启动不再需要任何
# 外网访问**,initContainer 和 emptyDir 卷一起删掉了。多带的
# iceberg-spark-runtime jar 对 History Server 无害(只是多几十 MB)。
#
# 这条改动的意义超出"修一个坏掉的组件":一键部署的承诺是"从空环境可恢复"
# ——一个每次重启都要成功下载 280MB 才能起来的组件,不满足这个承诺。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  labels:
    app: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
        - name: history-server
          image: ghcr.io/hardstuding/bigdata_ml_paltform/spark-iceberg@sha256:342b8eb40a5a670e97559797a10cdca61066210a650cd1a3cf2e1c8203aec250
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          # 【可插拔基础设施,见 ADR-030】又一份独立的 S3A 配置(和 Hive
          # Metastore/Trino 各自的那份不共用),接外部 S3 要同步改这里 +
          # 下面的 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,取舍(path-
          # style-access/ssl.enabled 等)说明见
          # apps/hive-metastore/manifests/core-site-configmap.yaml。
          env:
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-logs/events
                -Dspark.hadoop.fs.s3a.endpoint=http://minio.minio.svc.cluster.local:9000
                -Dspark.hadoop.fs.s3a.path.style.access=true
                -Dspark.hadoop.fs.s3a.connection.ssl.enabled=false
                -Dspark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          ports:
            - containerPort: 18080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
spec:
  selector:
    app: spark-history-server
  ports:
    - port: 18080
      targetPort: 18080
      name: http
