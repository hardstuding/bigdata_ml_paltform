# 和 apps/airflow/manifests/create-db-job.yaml 同样的模式:在已运行的 Postgres
# 实例上补建 superset 专用库/用户。不要加 argocd hook 注解,原因见那个文件的
# 注释和 troubleshooting.md。
#
# 【可插拔基础设施,见 ADR-030】接外部 Postgres 就别装这个 Job——数据库该
# 由 DBA 按平时流程建,同时把 apps/definitions/superset.yaml 里说明的
# superset-db-secrets 这个 Secret 的 DB_HOST/DB_USER/DB_PASS/DB_NAME 改成
# 外部实例的值。
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-create-db
  namespace: data
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-db
          image: postgres:16.15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-root
                  key: password
            - name: SUPERSET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-db
                  key: password
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # 见 apps/mlflow/manifests/create-db-job.yaml 的注释:同一个
              # "刚创建的 pod 第一次连接 Postgres 有短暂延迟"的坑,每个
              # backoffLimit 重试都是全新 pod、各自要重新等,容易把重试
              # 次数耗尽——用 pg_isready 在同一个 pod 内先等到位。
              for i in $(seq 1 10); do
                pg_isready -h postgres -U postgres >/dev/null 2>&1 && break
                echo "第 ${i} 次探测 postgres 未就绪,3 秒后重试" >&2
                sleep 3
              done
              psql -h postgres -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='superset'" | grep -q 1 \
                || psql -h postgres -U postgres -c "CREATE USER superset WITH PASSWORD '${SUPERSET_DB_PASSWORD}';"
              psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='superset'" | grep -q 1 \
                || psql -h postgres -U postgres -c "CREATE DATABASE superset OWNER superset;"
