# 见 docs/decisions/043-table-registration-tool.md。用官方 python:3.12-slim
# 镜像,启动时 pip install 依赖 + 跑挂载进来的 ConfigMap 源码,和
# apps/permission-request-app/ 是同一个模式,不建专门的容器镜像仓库。
#
# 需要手动建的 Secret(和 permission-request-app 的 GIT_TOKEN 是同一类考虑
# ——敏感凭据不该由自动化流程自己造):
#   OPENMETADATA_TOKEN:去 OpenMetadata UI -> Settings -> Bots -> Add Bot
#   建一个 table-registration-bot,生成 JWT token 后:
#     kubectl -n table-registration-app create secret generic table-registration-app-openmetadata \
#       --from-literal=token=<token>
#   没建这个 Secret 之前,表还是能正常建(Trino 建表这条路径不依赖它),
#   只是负责人/安全等级不会回写进 OpenMetadata,页面上会提示。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-registration-app-data
  namespace: table-registration-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce 的 PVC,同 permission-request-app 的理由
  selector:
    matchLabels:
      app: table-registration-app
  template:
    metadata:
      labels:
        app: table-registration-app
    spec:
      # 见 ADR-041(队列资源管理):人在等建表结果,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              # apt-get 卡死的坑(见 apps/iam-sync/manifests/cronjob.yaml 的
              # 注释)这个组件不需要 git/系统包,只用 pip,不会踩到,但保留
              # 同样的超时习惯以防万一网络问题导致 pip 卡住。
              timeout -k 10 120 pip install --quiet --timeout 30 flask requests trino
              python3 /src/app.py
          env:
            - name: DB_PATH
              value: /data/registrations.db
            - name: TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_USER
              value: table_registration_service
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-service-account
                  key: password-table_registration_service
            # 【可插拔基础设施,见 ADR-030】换外部 OpenMetadata 实例改这个 URL。
            - name: OPENMETADATA_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: table-registration-app-openmetadata
                  key: token
                  optional: true  # 没建这个 Secret 时,OPENMETADATA_TOKEN 就是空字符串,走降级路径
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: src
              mountPath: /src
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: src
          configMap:
            name: table-registration-app-src
        - name: data
          persistentVolumeClaim:
            claimName: table-registration-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  selector:
    app: table-registration-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
