# 见 docs/decisions/043-table-registration-tool.md。用官方 python:3.12-slim
# 镜像,启动时 pip install 依赖 + 跑挂载进来的 ConfigMap 源码,和
# apps/permission-request-app/ 是同一个模式,不建专门的容器镜像仓库。
#
# 需要手动建的 Secret(和 permission-request-app 的 GIT_TOKEN 是同一类考虑
# ——敏感凭据不该由自动化流程自己造):
#   OPENMETADATA_TOKEN:去 OpenMetadata UI -> Settings -> Bots -> Add Bot
#   建一个 table-registration-bot,生成 JWT token 后:
#     kubectl -n table-registration-app create secret generic table-registration-app-openmetadata \
#       --from-literal=token=<token>
#   没建这个 Secret 之前,表还是能正常建(Trino 建表这条路径不依赖它),
#   只是负责人/安全等级不会回写进 OpenMetadata,页面上会提示。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-registration-app-data
  namespace: table-registration-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce 的 PVC,同 permission-request-app 的理由
  selector:
    matchLabels:
      app: table-registration-app
  template:
    metadata:
      labels:
        app: table-registration-app
    spec:
      # 见 ADR-041(队列资源管理):人在等建表结果,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          image: python:3.12-slim@sha256:876416ecde9aca2bcc90e1fb0c7a9500bbf749f5788b70f82d4c5a5c2357f8b4
          command:
            - sh
            - -c
            - |
              set -e
              # apt-get 卡死的坑(见 apps/iam-sync/manifests/cronjob.yaml 的
              # 注释)这个组件不需要 git/系统包,只用 pip,原以为不会踩到。
              # 2026-08-14 实测推翻了这个假设:pip install 本身反复 exit
              # 124(timeout 触发),连续 6 次。排查发现这个 Deployment 一直
              # 没配 HTTP_PROXY/HTTPS_PROXY——iam-sync 的 CronJob 老早就配了
              # 这两个(colima 虚拟网络里直连外网不稳定,需要走宿主机代理),
              # 这个组件当初漏配了。
              # 2026-08-16 云端部署时又发现:192.168.5.2:1087 是 colima
              # 宿主机专用地址,cloud-full 连不上,写死成 env 反而会让 pip
              # 在 cloud-full 上连接超时崩溃。还没有环境 overlay 机制(见
              # environments/cloud-full/README.md),改成运行时探测这个代理
              # 还在不在——2 秒连不上就当作不需要(cloud-full 直连 pypi.org
              # 本来就是通的,实测确认过)。
              if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('192.168.5.2',1087))==0 else 1)" 2>/dev/null; then
                export HTTP_PROXY="http://192.168.5.2:1087"
                export HTTPS_PROXY="http://192.168.5.2:1087"
                export NO_PROXY="localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16"
              fi
              # 2026-08-16 云端部署时观测到:trino 这个依赖比 flask/requests
              # 多拉几个包(orjson/lz4/zstandard 等带 wheel 编译产物,体积
              # 更大),PyPI 下载耗时波动明显——单独实测过一次 1-2 分钟内
              # 完成,也有一次跟一堆并发的镜像拉取任务抢带宽时卡了 10+
              # 分钟。120 秒在这台机器网络繁忙时余量不够,调到 240 秒,
              # 不改变"这本来就该正常完成"这个前提。
              timeout -k 10 240 pip install --quiet --timeout 60 flask==3.1.3 requests==2.34.2 trino==0.338.0
              python3 /src/app.py
          env:
            - name: DB_PATH
              value: /data/registrations.db
            - name: TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_USER
              value: table_registration_service
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-service-account
                  key: password-table_registration_service
            # 【可插拔基础设施,见 ADR-030】换外部 OpenMetadata 实例改这个 URL。
            - name: OPENMETADATA_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: table-registration-app-openmetadata
                  key: token
                  optional: true  # 没建这个 Secret 时,OPENMETADATA_TOKEN 就是空字符串,走降级路径
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: src
              mountPath: /src
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: src
          configMap:
            name: table-registration-app-src
        - name: data
          persistentVolumeClaim:
            claimName: table-registration-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  selector:
    app: table-registration-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
