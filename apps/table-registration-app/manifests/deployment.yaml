# 见 docs/decisions/043-table-registration-tool.md。2026-08-20 起(BACKLOG
# 2.1)用构建期固化依赖 + 源码的自建镜像(apps/table-registration-app/
# Dockerfile,GitHub Actions 推到 GHCR),不再是运行时 pip install 官方
# python:3.12-slim 镜像那套——见 apps/permission-request-app/deployment.yaml
# 顶部注释,同一个原因。
#
# OPENMETADATA_TOKEN:2026-08-22 起由 scripts/27-configure-openmetadata-bot.sh
# 自动建(部署阶段跑,不用人工去 OpenMetadata UI 建 bot)——复用
# OpenMetadata 安装时自带的 ingestion-bot 那个 unlimited JWT,从 Postgres
# 里读出来解密,建成 table-registration-app-openmetadata 这个 Secret(key
# 是 token)。想手动建/覆盖:
#     kubectl -n table-registration-app create secret generic table-registration-app-openmetadata \
#       --from-literal=token=<token>
#   没建这个 Secret 之前,表还是能正常建(Trino 建表这条路径不依赖它),
#   只是负责人/安全等级不会回写进 OpenMetadata,页面上会提示。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-registration-app-data
  namespace: table-registration-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce 的 PVC,同 permission-request-app 的理由
  selector:
    matchLabels:
      app: table-registration-app
  template:
    metadata:
      labels:
        app: table-registration-app
    spec:
      # 见 ADR-041(队列资源管理):人在等建表结果,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          # 2026-08-20(BACKLOG 2.1):构建期固化依赖 + 源码,见
          # apps/table-registration-app/Dockerfile。这个 digest 是
          # linux/amd64+linux/arm64 多架构 manifest list 的 digest(见
          # apps/permission-request-app/deployment.yaml 顶部的详细说明,
          # 同一次重新构建),对应 commit
          # 8fbb640b396670cfdd08ae7beef4d322aae93421。
          image: ghcr.io/hardstuding/bigdata_ml_paltform/table-registration-app@sha256:cf69b99da7eaee4e1f4ee337951f1731f3a5f651a3d218831c28355ee430b99e
          env:
            - name: DB_PATH
              value: /data/registrations.db
            - name: TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_USER
              value: table_registration_service
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-service-account
                  key: password-table_registration_service
            # 【可插拔基础设施,见 ADR-030】换外部 OpenMetadata 实例改这个 URL。
            - name: OPENMETADATA_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: table-registration-app-openmetadata
                  key: token
                  optional: true  # 没建这个 Secret 时,OPENMETADATA_TOKEN 就是空字符串,走降级路径
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: table-registration-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  selector:
    app: table-registration-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
