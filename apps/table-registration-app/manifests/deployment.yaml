# 见 docs/decisions/043-table-registration-tool.md。2026-08-20 起(BACKLOG
# 2.1)用构建期固化依赖 + 源码的自建镜像(apps/table-registration-app/
# Dockerfile,GitHub Actions 推到 GHCR),不再是运行时 pip install 官方
# python:3.12-slim 镜像那套——见 apps/permission-request-app/deployment.yaml
# 顶部注释,同一个原因。
#
# 需要手动建的 Secret(和 permission-request-app 的 GIT_TOKEN 是同一类考虑
# ——敏感凭据不该由自动化流程自己造):
#   OPENMETADATA_TOKEN:去 OpenMetadata UI -> Settings -> Bots -> Add Bot
#   建一个 table-registration-bot,生成 JWT token 后:
#     kubectl -n table-registration-app create secret generic table-registration-app-openmetadata \
#       --from-literal=token=<token>
#   没建这个 Secret 之前,表还是能正常建(Trino 建表这条路径不依赖它),
#   只是负责人/安全等级不会回写进 OpenMetadata,页面上会提示。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-registration-app-data
  namespace: table-registration-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce 的 PVC,同 permission-request-app 的理由
  selector:
    matchLabels:
      app: table-registration-app
  template:
    metadata:
      labels:
        app: table-registration-app
    spec:
      # 见 ADR-041(队列资源管理):人在等建表结果,归 interactive 档。
      priorityClassName: interactive
      containers:
        - name: app
          # 2026-08-20(BACKLOG 2.1):构建期固化依赖 + 源码,见
          # apps/table-registration-app/Dockerfile。tag 是构建时的
          # commit SHA(25e91945e172768ba40deda79a264c8ea26cddff),已经
          # 本地 docker pull + /healthz 验证过能正常拉取和跑起来。
          image: ghcr.io/hardstuding/bigdata_ml_paltform/table-registration-app@sha256:7122bb2f9ec821f067f03aa405bac6372cde322efb6c100d1d9b4765dc0146bf
          env:
            - name: DB_PATH
              value: /data/registrations.db
            - name: TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_USER
              value: table_registration_service
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-service-account
                  key: password-table_registration_service
            # 【可插拔基础设施,见 ADR-030】换外部 OpenMetadata 实例改这个 URL。
            - name: OPENMETADATA_URL
              value: http://openmetadata.openmetadata.svc.cluster.local:8585
            - name: OPENMETADATA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: table-registration-app-openmetadata
                  key: token
                  optional: true  # 没建这个 Secret 时,OPENMETADATA_TOKEN 就是空字符串,走降级路径
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: table-registration-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: table-registration-app
  namespace: table-registration-app
spec:
  selector:
    app: table-registration-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
