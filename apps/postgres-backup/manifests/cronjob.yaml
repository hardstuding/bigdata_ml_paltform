# 每天备份一次共享 Postgres(Keycloak/Hive Metastore/MLflow/Airflow/
# Superset 等好几个组件共用同一个实例,见 apps/postgres/)。之前这块完全
#是空白——见 docs/operations/backup.md 和 docs/decisions/033-postgres-backup.md。
#
# pg_dumpall(不是 pg_dump 单个库):这个 Postgres 是共享实例,一次性把
# 所有数据库都备份,不用逐个组件维护一份备份配置。
#
# initContainer 用官方 postgres:16.15 镜像(和 apps/postgres/ 本体同一个
# 镜像,自带 pg_dumpall,不用额外装东西)做 dump,主容器用官方
# minio/mc(MinIO 项目自己的客户端工具,这个仓库里 apps/definitions/
# minio.yaml 已经在用,不是新引入的镜像来源)上传到 MinIO 的 backups
# bucket——两步分开是因为没有一个官方镜像同时装了 psql 工具链和 mc,
# 不想为了省一个 initContainer 去装一个不知道来源的第三方镜像。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: data
spec:
  # 【可调参数,见 docs/operations/tuning.md】每天 02:00(UTC)跑一次。
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          # 见 ADR-041(队列资源管理):定时批处理任务,能容忍被抢占后
          # 下次调度重跑,归 batch 档。
          priorityClassName: batch
          restartPolicy: Never
          initContainers:
            - name: dump
              image: postgres:16.15
              env:
                - name: PGHOST
                  value: postgres.data.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: {name: postgres-root, key: username}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: postgres-root, key: password}
              command:
                - sh
                - -c
                - |
                  set -e
                  # 2026-08-13 实测发现的真实 bug:`pg_dumpall | gzip > file`
                  # 这种写法,`set -e` 在管道里只检查最后一个命令
                  # (gzip)的退出码——这是 POSIX shell 的标准行为,不是
                  # 这个镜像的 bug(bash 的 `set -o pipefail` 能解决,但
                  # 这里的 /bin/sh 不一定是 bash,不能假设有这个选项)。
                  # 实测确认过:pg_dumpall 因为一次真实的连接失败报错
                  # (Connection refused),但 gzip 收到空输入照样能成功
                  # 压缩出一个 20 字节的"空"文件,`set -e` 完全没察觉,
                  # 整个 Job 照常标记成功——一次"看起来备份成功、实际是
                  # 空文件"的真实事故,不是假设性风险。改成先落盘再单独
                  # 压缩,两步分开,`set -e` 才能真正捕捉到 pg_dumpall
                  # 自己的失败。
                  #
                  # 修完上面那个 bug、实测验证时又抓到一个真实现象:刚
                  # 创建的 pod 第一次连 Postgres 有一定概率报
                  # Connection refused(不是超时、不是 DNS 解析失败,是
                  # 明确的连接被拒),几秒后用一个新 pod 重试就正常了——
                  # 怀疑是这台机器上 k3s/Flannel 的 NetworkPolicy 规则对
                  # 新 pod 生效有一个短暂的编程延迟(同一类现象在这次会话
                  # 里验证 NetworkPolicy 时也见过,见 ADR-035),没有深挖
                  # 确认,不重要——按这个仓库一贯的原则(网络操作必须自带
                  # 重试/超时),加个简单的重试,不去猜/等这个延迟具体多长。
                  for i in 1 2 3 4 5; do
                    if pg_dumpall > /tmp/dump.sql 2>/tmp/dump.err; then
                      break
                    fi
                    echo "第 ${i} 次 pg_dumpall 失败,5 秒后重试:" >&2
                    cat /tmp/dump.err >&2
                    if [ "$i" = 5 ]; then
                      echo "重试 5 次都失败,放弃" >&2
                      exit 1
                    fi
                    sleep 5
                  done
                  gzip -c /tmp/dump.sql > /backup/postgres-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
                  rm -f /tmp/dump.sql /tmp/dump.err
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
          # 【可插拔基础设施,见 ADR-030】mc 本身就是通用 S3 兼容客户端,不是
          # MinIO 专用的——接外部 S3 只用改下面 `mc alias set` 那行的 endpoint
          # + 这两个凭据 Secret,备份逻辑本身不用动。
          containers:
            - name: upload
              image: minio/mc:RELEASE.2025-08-13T08-35-41Z
              env:
                - name: MINIO_USER
                  valueFrom:
                    secretKeyRef: {name: minio-root, key: rootUser}
                - name: MINIO_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: minio-root, key: rootPassword}
              command:
                - sh
                - -c
                - |
                  set -e
                  mc alias set backupminio http://minio.minio.svc.cluster.local:9000 "$MINIO_USER" "$MINIO_PASSWORD"
                  mc mb --ignore-existing backupminio/backups
                  for f in /backup/*.sql.gz; do
                    # 第二道防线,不指望它是唯一防线:dump 那一步已经改成
                    # 会在 pg_dumpall 真的失败时让整个 Job 失败(见
                    # initContainer 的注释,那次真实事故的根因在那一层),
                    # 这里再加一道体积检查——哪怕以后又出现别的、还没
                    # 遇到过的失败模式导致产出一个异常小的文件,也不会
                    # 被当成正常备份传上去。这个仓库里真实的
                    # `pg_dumpall` 输出压缩后是几百 KB 量级,1KB 是一个
                    # 明显留有余量、不会误伤正常备份的下限。
                    SIZE=$(stat -c%s "$f")
                    if [ "$SIZE" -lt 1024 ]; then
                      echo "!!! $f 只有 ${SIZE} 字节,明显不是一份完整的备份,拒绝上传" >&2
                      exit 1
                    fi
                    mc cp "$f" "backupminio/backups/postgres/$(basename "$f")"
                  done
                  # 【可调参数,见 docs/operations/tuning.md】保留 14 天,更久的自动清掉,
                  # 不然会一直无限增长。
                  mc rm --older-than 14d --recursive --force backupminio/backups/postgres/ || true
                  echo "=== 当前 backups/postgres/ 下的文件 ==="
                  mc ls backupminio/backups/postgres/
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 128Mi}
          volumes:
            - name: backup
              emptyDir: {}
