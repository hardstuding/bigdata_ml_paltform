# 官方 apache/hive 镜像不带 Postgres JDBC 驱动,也不带连 S3 的 hadoop-aws/
# awssdk 客户端 jar,两个都用 initContainer 下载(参考
# https://github.com/apache/hive/blob/master/standalone-metastore/packaging/src/docker/README.md)。
#
# S3A 客户端不是"把 HDFS 加回来"——hadoop-aws 只是 Hadoop 文件系统客户端 API
# 里连 S3 的实现(s3a://),元数据服务本身建 schema/表的时候要验证/创建
# S3 上的目录,所以也需要这份凭据,不是只有 Trino 需要,见
# docs/decisions/003-no-hdfs-on-k8s.md。
#
# 连接参数用 core-site.xml(ConfigMap 挂载),不是 SERVICE_OPTS 里的 -D 参数:
# Hadoop 的 Configuration 只认 XML 配置文件,不会读 JVM 系统属性,-D 传
# fs.s3a.* 完全不生效,报错还很含糊("... : null"),踩过一次坑,细节见
# docs/operations/troubleshooting.md。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: data
  labels:
    app: hive-metastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      initContainers:
        - name: fetch-postgres-driver
          image: curlimages/curl:8.11.0
          command:
            - sh
            - -c
            - curl -fsSL -o /drivers/postgres.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.13/postgresql-42.7.13.jar
          volumeMounts:
            - name: jdbc-driver
              mountPath: /drivers
        - name: fetch-s3a-client
          image: curlimages/curl:8.11.0
          command:
            - sh
            - -c
            - |
              curl -fsSL -o /drivers/hadoop-aws.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.1/hadoop-aws-3.4.1.jar
              curl -fsSL -o /drivers/awssdk-bundle.jar https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.51.3/bundle-2.51.3.jar
          volumeMounts:
            - name: jdbc-driver
              mountPath: /drivers
      containers:
        - name: hive-metastore
          image: apache/hive:standalone-metastore-4.2.0
          ports:
            - containerPort: 9083
              name: thrift
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: HIVE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hive-metastore-db
                  key: password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: HADOOP_CONF_DIR
              value: /opt/hive/conf
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres.data.svc.cluster.local:5432/metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(HIVE_DB_PASSWORD)
          volumeMounts:
            - name: jdbc-driver
              mountPath: /opt/hive/lib/postgres.jar
              subPath: postgres.jar
            - name: jdbc-driver
              mountPath: /opt/hive/lib/hadoop-aws.jar
              subPath: hadoop-aws.jar
            - name: jdbc-driver
              mountPath: /opt/hive/lib/awssdk-bundle.jar
              subPath: awssdk-bundle.jar
            - name: core-site
              mountPath: /opt/hive/conf/core-site.xml
              subPath: core-site.xml
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: jdbc-driver
          emptyDir: {}
        - name: core-site
          configMap:
            name: hive-metastore-core-site
