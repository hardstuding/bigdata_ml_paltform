# 官方 apache/hive 镜像不带 Postgres JDBC 驱动,也不带连 S3 的 hadoop-aws/
# awssdk 客户端 jar,两个都用 initContainer 下载(参考
# https://github.com/apache/hive/blob/master/standalone-metastore/packaging/src/docker/README.md)。
#
# S3A 客户端不是"把 HDFS 加回来"——hadoop-aws 只是 Hadoop 文件系统客户端 API
# 里连 S3 的实现(s3a://),元数据服务本身建 schema/表的时候要验证/创建
# S3 上的目录,所以也需要这份凭据,不是只有 Trino 需要,见
# docs/decisions/003-no-hdfs-on-k8s.md。
#
# 连接参数用 core-site.xml(ConfigMap 挂载),不是 SERVICE_OPTS 里的 -D 参数:
# Hadoop 的 Configuration 只认 XML 配置文件,不会读 JVM 系统属性,-D 传
# fs.s3a.* 完全不生效,报错还很含糊("... : null"),踩过一次坑,细节见
# docs/operations/troubleshooting.md。
#
# 镜像特意钉在 3.1.3,不用官方 Docker Hub 上更新的 4.x(standalone-metastore-
# 4.1.0/4.2.0)——验证 Spark+Iceberg 链路(ADR-036)时踩到一个真实的上游
# 不兼容:Hive 4.x 在 HIVE-26537 里把老式 Thrift 方法 `get_table` 删掉了,
# 换成 `get_table_req`(fixVersions 确认是 4.0.1/4.1.0,4.2.0 自然也没有,
# Docker Hub 上又没发布 4.0.0 这个还带着老方法的版本)。Iceberg 的 Hive
# Catalog 客户端(iceberg-spark-runtime 内置)一直绑死用 Spark 内置的
# Hive 2.3.x 客户端,只会发 `get_table`,连 Hive 4.x metastore 直接报
# `TApplicationException: Invalid method name: 'get_table'`——这是 Iceberg
# 社区自己确认"还不支持 Hive 4"的已知限制(github.com/apache/iceberg/
# issues/12878),不是这个项目配错了什么。3.1.3 是 Spark 官方文档里明确列出
# 支持的最高 Hive 2.x 系列版本(“0.12.0 through 2.3.9 and 3.0.0 through
# 3.1.3”),Trino 那边不受影响(Trino 自己实现了一套独立的、更宽容的 Thrift
# 客户端,不依赖这个已废弃方法)。
# 换版本连带 Postgres 里 metastore 库的 schema 也要重新初始化(HMS 有
# SCHEMA_VERSION 门禁,4.x 初始化过的 schema 不能被 3.x 客户端直接复用)——
# 这台机器上 metastore 库里当时只有 demo 数据(default/demo 两个库,一张
# orders 表),整库 drop 重建后让 3.1.3 自己首次启动时重新建 schema,不是
# 生产数据,可以这样处理;cloud-full/prod 上如果已经有真实数据,这个操作
# 需要走真正的 Hive schematool 版本升降级流程,不能直接 drop。
#
# 2026-08-15 补充验证(外部 review 提出"升级到 Spark 4 是不是就不用锁
# Hive 3.1.3 了",专门查证过,结论是不能):Spark 4.0 的 SPARK-45265
# "Support Hive 4.0 metastore" 是真实存在的,但那是 Spark 自己内置的
# HiveExternalCatalog 客户端(Spark 原生读写 Hive 表用的那条路径),不是
# Iceberg 自己的 Hive Catalog 客户端(iceberg-spark-runtime 里的
# HiveTableOperations,走的是完全独立的一份 Thrift 客户端代码)。真实证据:
# apache/iceberg#13572,有人在 Spark 4.0.0 + iceberg-spark-runtime-4.0 上
# 连 Hive 4.0.1 metastore,报的还是同一个
# `TApplicationException: Invalid method name: 'get_table'`——说明升级
# Spark 大版本本身解不开这个限制,是 Iceberg 自己的 Hive Catalog 客户端
# 需要跟进适配(HIVE-26537 之后的 `get_table_req`),不是 Spark 版本问题。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: data
  labels:
    app: hive-metastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      # 见 ADR-041(队列资源管理):裸 manifest,不像 Helm chart 那样要
      # 先确认 values 有没有暴露这个字段,直接加。表元数据服务,归
      # platform-critical 档。
      priorityClassName: platform-critical
      initContainers:
        # **等 Postgres 真的能连上再启动。**
        #
        # 2026-08-26/27 连着两次开机都撞到:云主机停机重启之后,
        # hive-metastore 比 Postgres 先起来,连不上库直接退出,然后一路
        # CrashLoop——**而它本身不重试**。表现是 Trino 查任何表都报
        # `Failed connecting to Hive metastore`,人得手动
        # `kubectl rollout restart` 一次才好。
        #
        # 这和 airflow-migrate-db 那次是同一类冷启动顺序问题(那次是 Job
        # 把 backoffLimit 烧光变成永久 Failed),解法也一样:**在启动前等
        # 依赖就绪,而不是指望应用自己重试**。
        #
        # 用 postgres 镜像自带的 pg_isready,不额外引镜像(create-db-job
        # 用的就是同一个镜像)。
        - name: wait-for-postgres
          image: postgres:16.15
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.data.svc.cluster.local -p 5432 -q; do
                echo "Postgres 还没就绪,5 秒后重试..."
                sleep 5
              done
              echo "Postgres 就绪"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: hive-metastore
          # 自建镜像:三个 jar 在构建期打进去了(apps/hive-metastore-image/)。
          # 原来是两个 initContainer 每次启动现下,实测每次要等约 6 分钟,
          # 而且把整条查询链路挂在境外网络上——见那个 Dockerfile 的说明。
          # tag 由 CI 按 commit SHA 打,这里的值改动时要一起更新。
          image: ghcr.io/hardstuding/bigdata_ml_paltform/hive-metastore:REPLACE_ME
          # 官方镜像的 entrypoint.sh 只看 IS_RESUME 这一个静态开关决定要不要
          # initSchema,不会自己探测 schema 是不是已经建过——第一次能正常
          # 初始化,但 pod 只要重启(改配置、节点重调度、colima 重启……)就会
          # 对着已经建好的库重新跑一遍 initSchema,报 "relation ... already
          # exists" 直接崩溃重启循环(实测踩过)。这里包一层:先用
          # `schematool -info` 探测 schema 是否已存在(不存在时 exit 1,这是
          # 官方 schematool 自带的检测方式,不是猜的),根据结果动态设
          # IS_RESUME 再调用原本的 entrypoint.sh——保证首次全新部署能自动建
          # schema,后续重启不会重复建、不会崩溃循环,一键部署/重复部署两种
          #场景都要能用。
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # HADOOP_CLIENT_OPTS 里的 JDBC 连接参数(ConnectionURL 等)是
              # SERVICE_OPTS 拼进去的,原版 entrypoint.sh 自己也是这么组装完
              # 才调 schematool——不这样做的话 schematool 会用默认的内嵌
              # Derby 连接,永远查不到真实 Postgres 里的 schema 状态(踩过,
              # 见下面直接测试的记录)。
              export HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Xmx1G $SERVICE_OPTS"
              if /opt/hive/bin/schematool -dbType postgres -info >/tmp/schema-info.log 2>&1; then
                echo "metastore schema 已存在,跳过 initSchema"
                export IS_RESUME=true
              else
                echo "metastore schema 不存在,首次初始化"
                export IS_RESUME=false
              fi
              exec /entrypoint.sh
          ports:
            - containerPort: 9083
              name: thrift
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: HIVE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hive-metastore-db
                  key: password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: HADOOP_CONF_DIR
              value: /opt/hive/conf
            # 【可插拔基础设施,见 ADR-030】ConnectionURL 指向公司已有的
            # 外部 Postgres 就行,改这一行。**但这个组件比 Keycloak 那个例子
            # 多一层坑**:metastore 这个库不是靠独立的 xxx-db-init.yaml Job
            # 建的,是写死在 apps/postgres/manifests/init-configmap.yaml 里,
            # 跟着 Postgres 自己首次启动的 docker-entrypoint-initdb.d 一起跑
            # ——这是历史遗留的不一致(其他组件都是独立 Job 模式),真要接外部
            # Postgres,数据库本身还是得让你们 DBA 单独建,这行只是改客户端
            # 连哪,不会帮你建库。这处不一致目前还没重构,是已知欠账。
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres.data.svc.cluster.local:5432/metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(HIVE_DB_PASSWORD)
          volumeMounts:
            - name: core-site
              mountPath: /opt/hive/conf/core-site.xml
              subPath: core-site.xml
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: core-site
          configMap:
            name: hive-metastore-core-site
