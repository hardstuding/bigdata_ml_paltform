# 官方 open-metadata/openmetadata chart。数据库用 Postgres(官方支持,不是
# 只能 MySQL,chart 默认值是 MySQL),接我们已有的共享 Postgres 实例,不额外
# 起一个。采集任务编排用官方的 k8s 模式(pipelineServiceClientConfig.type:
# k8s),不需要 Airflow——认真比较过"复用现有业务 Airflow" vs "拆分一个独立
# Airflow" vs "用 k8s 原生模式"之后选的:复用会把 OpenMetadata 的升级节奏和
# 承载核心业务调度的 Airflow 耦合在一起(采集插件版本要跟 OpenMetadata 对齐,
# 意味着升级 OpenMetadata 可能要连带重建业务 Airflow 镜像),拆分又要多背一个
# Airflow 实例的运维成本;k8s 模式两个问题都不存在,采集任务就是原生 k8s Job,
# 官方支持,不是变通方案。
#
# Keycloak SSO:OpenMetadata 的 OIDC 支持两种 clientType——public(SPA 直接
# 找 IdP 换 token,不需要 client secret)和 confidential(后端代持 client
# secret 做 code 换 token,和我们给 Trino/Superset 用的是同一套模式)。选
# confidential,更安全,也和其他组件的接入方式保持一致。provider 要填
# "custom-oidc"(Keycloak 不是 chart 内置的具名 provider 之一,通用 OIDC
# 走这个)。注意 authentication 顶层的 publicKeys/authority/clientId 这些
# 字段依然要填(不是只填 oidcConfiguration 那一段)——即使是 confidential
# 模式,OpenMetadata 后端自己签发的会话 JWT 也要用同一套 JWKS 校验,两段
# 配置都不能省,见 open-metadata/openmetadata-helm-charts#316 这个已知的
# 社区坑(publicKeys 漏配会报 SigningKeyNotFoundException)。
# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/openmetadata.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.open-metadata.org/
    chart: openmetadata
    targetRevision: 1.13.3
    helm:
      valuesObject:
        image:
          pullPolicy: IfNotPresent
        openmetadata:
          config:
            elasticsearch:
              host: opensearch-cluster-master
              scheme: https
              # OpenSearch 官方镜像自带自签名 demo 证书,Java 客户端默认不
              # 信任,报 PKIX path building failed。用
              # scripts/20-configure-openmetadata-search-truststore.sh
              # 从运行中的 OpenSearch pod 提取证书生成的 truststore,通过
              # extraVolumes 挂载(见下面 pod 级别的 extraVolumes/
              # extraVolumeMounts)。
              trustStore:
                enabled: true
                path: /opt/openmetadata-ssl/truststore.jks
                password:
                  secretRef: openmetadata-search-truststore-password
                  secretKey: password
              auth:
                enabled: true
                username: admin
                password:
                  secretRef: opensearch-admin
                  secretKey: password
            # 【可插拔基础设施,见 ADR-030】host/port/databaseName/
            # auth.username 都是独立字段(这几个组件里和 Keycloak 一样干净
            # 的一个),接外部 Postgres 直接改这几行 + openmetadata-
            # postgresql-secrets 这个 Secret 的密码。配套的
            # apps/definitions/openmetadata-db-init.yaml 接外部 Postgres
            # 时应该跳过(数据库该由 DBA 按平时流程建)。
            database:
              host: postgres.data.svc.cluster.local
              port: 5432
              driverClass: org.postgresql.Driver
              dbScheme: postgresql
              databaseName: openmetadata_db
              auth:
                username: openmetadata_user
                password:
                  secretRef: openmetadata-postgresql-secrets
                  secretKey: openmetadata-postgresql-password
              dbParams: ""
            pipelineServiceClientConfig:
              type: "k8s"
              k8s:
                namespace: openmetadata
                # chart 默认是 `ingestion-base:latest`,这里锁死成和
                # OpenMetadata 本体同一个版本。两个理由:
                #
                # 1. 这个仓库不用 latest(ADR-010),而且这个镜像特别隐蔽
                #    ——它不出现在任何静态 manifest 里,是 OpenMetadata
                #    运行时自己创建采集 Job 时才引用的。不写在这里的话,
                #    `scripts/list-project-images.py` 扫不到它,镜像缓存
                #    (`export-image-cache.sh` / `17-load-image-cache.sh`)
                #    也就不会包含它。
                # 2. **这个镜像有 1.5GB**。这台境内云主机上"运行时现拉大
                #    镜像"已经栽过两次(Spark History Server 的 280MB
                #    aws-java-sdk-bundle 直接超时崩溃,见那个 Deployment
                #    顶部注释;Maven 拉 jar 卡死,见 ADR-061)。写在这里
                #    让它进得了缓存清单,是这类问题的预防手段而不是事后
                #    补救。
                ingestionImage: "docker.getcollate.io/openmetadata/ingestion-base:1.13.3"
            authentication:
              enabled: true
              clientType: confidential
              provider: "custom-oidc"
              publicKeys:
                - "http://openmetadata:8585/api/v1/system/config/jwks"
                - "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/certs"
              authority: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform"
              clientId: "openmetadata"
              callbackUrl: "{{EXTERNAL_SCHEME}}://openmetadata.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/callback"
              jwtPrincipalClaims:
                - "email"
                - "preferred_username"
                - "sub"
              oidcConfiguration:
                enabled: true
                oidcType: "Keycloak"
                clientId:
                  secretRef: openmetadata-oidc-secret
                  secretKey: clientId
                clientSecret:
                  secretRef: openmetadata-oidc-secret
                  secretKey: clientSecret
                scope: "openid email profile"
                discoveryUri: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/.well-known/openid-configuration"
                callbackUrl: "{{EXTERNAL_SCHEME}}://openmetadata.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/callback"
                serverUrl: "{{EXTERNAL_SCHEME}}://openmetadata.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}"
        extraVolumes:
          - name: search-truststore
            secret:
              secretName: openmetadata-search-truststore
        extraVolumeMounts:
          - name: search-truststore
            mountPath: /opt/openmetadata-ssl
            readOnly: true
        resources:
          requests:
            cpu: 300m
            memory: 1024Mi
          limits:
            memory: 2048Mi
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: openmetadata.{{DOMAIN_SUFFIX}}
              paths:
                - path: /
                  pathType: ImplementationSpecific
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
