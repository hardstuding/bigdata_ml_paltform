# 平台门户本体。见 docs/decisions/047-platform-portal.md。
# 前面挂 oauth2-proxy 做 SSO,见同目录下的 platform-portal-oauth2-proxy.yaml。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/platform-portal/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
