# 黄金链路探针(ADR-079)——按"一件真实的事能不能从头做到尾"探测,
# 不是按"某个进程活着"。
#
# 依赖 monitoring 命名空间里有 trino-service-account 这个 Secret
# (scripts/00-generate-secrets.sh 的 copy_secret 复制过去的)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-probes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/golden-path-probes/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
