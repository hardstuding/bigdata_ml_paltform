# 官方 apache/superset chart,默认自带的 postgresql/redis 子 chart 是
# bitnamilegacy 镜像(见 ADR-008),关掉换成我们自己的 Postgres(库由
# apps/superset/manifests/create-db-job.yaml 建)。Redis 也关了(local-lite
# 简化,没有它 Superset 能跑,只是缺异步查询/告警这些高级功能)。
#
# 数据库连接和 SECRET_KEY 不写在这份 values 里——chart 默认行为是从
# DB_USER/DB_PASS/DB_HOST/DB_PORT/DB_NAME 这几个环境变量读连接串
# (`database.uri` 不设置时的默认逻辑)。注意用的是 envFromSecret(单数,
# 覆盖主 Secret 的名字),不是 envFromSecrets(复数,追加一个)——踩过一次
# 坑:initContainer(wait-for-postgres)的 envFrom 硬编码只引用 envFromSecret
# 指向的那一个 Secret,用复数形式追加进去的内容它读不到,会一直连不上
# 卡在 Init 状态。
#
# init.adminUser.password 是 chart 自己的硬编码默认值("admin"),不是我们
# 写的——这个值不会出现在我们的 git 历史里(是 helm template 渲染时才展开的),
# 但运行时的实际密码确实很弱,cloud-full/prod 之前要处理掉(改 init.command
# 或者关掉 init.createAdmin 自己建,和 Airflow 那次一样)。
#
# Keycloak SSO:和 Trino 不一样,Superset(Flask-AppBuilder)的 OAuth 不要求
# 自己起 HTTPS,直接走 configOverrides 加 AUTH_OAUTH 就行,踩坑成本低很多
# (见 ADR-017 记的 Trino 那堆坑,Superset 这边基本不适用)。用
# server_metadata_url 走 OIDC discovery,不用手动拼 auth/token/jwks 各个
# endpoint。AUTH_USER_REGISTRATION_ROLE=Admin 是 local-lite 简化(第一个登录
# 的人自动拿 Admin),和 ArgoCD/Grafana 那两条待办一样,以后要换成按 Keycloak
# group 映射角色。
#
# 2026-08-16 cloud-full 真实故障(端到端 curl 登录模拟,不是猜的):前面
# 端口/discovery 那批修完之后,授权码能换回来,但最后一步报
# "Error returning OAuth user info: Invalid URL 'openid-connect/userinfo':
# No scheme supplied"。根因是 Flask-AppBuilder 对 provider name ==
# "keycloak" 有一段专门写死的分支(`security/manager.py` 里
# `get_oauth_user_info`),不走 server_metadata_url discovery 出来的
# userinfo_endpoint,而是自己手动拼 `oauth_remotes["keycloak"].get(
# "openid-connect/userinfo")`——这是一个相对路径,authlib 要靠
# remote_app 里单独配置的 `api_base_url` 做前缀拼接,server_metadata_url
# 管不到这条路径,漏配就是这个报错。补上 api_base_url(内部地址、不带
# 端口,和 server_metadata_url 一样是服务端到服务端调用),对齐
# Keycloak 官方 protocol 端点这段公共前缀。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # **chart 是 vendor 进仓库的,不是让 ArgoCD 去外网拉**
    # (platform/superset-chart/,见 ADR-061 和 scripts/28-vendor-helm-chart.sh)。
    #
    # 2026-09-02 撞到:`helm pull` 拉 apache.github.io/superset 的 index.yaml
    # 超时,Application 卡在 `Unknown`/ComparisonError。和同一天 jupyterhub
    # 那次、以及更早 grafana/loki/kueue 是**完全同一个模式**:境内云主机拉
    # 这些 GitHub Pages 上的大 index.yaml 只有几十 KB/s,而 **helm 自己有一个
    # 写死的 HTTP 超时,先于 ARGOCD_EXEC_TIMEOUT 触发** —— 调大 ArgoCD 的
    # 超时没用。
    #
    # 症状有欺骗性:集群里的 Superset 一直正常跑着,只有 ArgoCD 状态是
    # Unknown,而且**新的配置改动推不上去**(这次就是发现企微告警的配置
    # 同步不过去才查出来的)。
    #
    # 换版本的做法:
    #   ./scripts/28-vendor-helm-chart.sh https://apache.github.io/superset \
    #     superset <新版本> platform/superset-chart
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/superset-chart
    helm:
      valuesObject:
        # 2026-08-19 从"运行时 bootstrapScript 现装依赖"改成"构建时镜像
        # 已经装好"——见 apps/superset-image/Dockerfile 的完整说明
        # (psycopg2-binary/authlib/trino 为什么需要、构建过程踩的两个真实
        # 坑:venv 和系统 pip 不是同一个 Python 环境、构建期默认用户对
        # site-packages 没写权限)。这解决的是 docs/project/roadmap.md P2.1 点名
        # 的"运行时 pip install"反模式本身——之前只能靠调大
        # startupProbe(见下面 supersetNode.startupProbe)硬扛网络慢,
        # 现在镜像已经带齐依赖,不再需要联网。
        #
        # 2026-08-20:镜像来源从手动登云主机 build 的 `local/superset:
        # 6.1.0-custom` 改成 GitHub Actions 自动构建推到 GHCR(见
        # .github/workflows/build-images.yml)。这个 chart 的 image 字段
        # 是简单的 `repository:tag` 字符串拼接(`helm show values` 确认
        # 没有 digest 字段,不像 apps/permission-request-app/manifests/
        # deployment.yaml 那种自己写的裸 manifest 能直接用 `@sha256:...`
        # 语法),用构建时的 commit SHA 当 tag 达到等价的可追溯性——GHCR
        # 里同一个 SHA tag 只会被这一次构建推送一次,不会被覆盖,和 digest
        # 引用的不可变性是一回事,只是表达方式不同。
        image:
          repository: crpi-t6h2mzjka4hzoldo.cn-hangzhou.personal.cr.aliyuncs.com/bigdata-platform/superset
          # ee61412 = 除了 pybabel compile,还生成了 React 前端的 language pack 那版
          # (ADR-077)。用 commit SHA 做 tag,
          # 因为 chart 的 image 是 repository:tag 字符串拼接,塞不进 digest。
          tag: 97301dd24915009cd6cd77bb62af9eb931d026cf
          pullPolicy: IfNotPresent
        postgresql:
          enabled: false
        redis:
          enabled: false
        cache:
          enabled: false
        # 【可插拔基础设施,见 ADR-030】chart 默认从 DB_USER/DB_PASS/
        # DB_HOST/DB_PORT/DB_NAME 这几个环境变量拼连接串,这几个键都在
        # superset-db-secrets 这个 Secret 里(scripts/00-generate-
        # secrets.sh 生成)——接外部 Postgres 改这个 Secret 的值就行,不用
        # 改这份 Application yaml。配套的
        # apps/superset/manifests/create-db-job.yaml 接外部 Postgres 时
        # 应该跳过(数据库该由 DBA 按平时流程建)。
        envFromSecret: superset-db-secrets
        extraEnvRaw:
          - name: OAUTH2_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: superset-oidc-secret
                key: clientSecret
        configOverrides:
          enable_oauth: |
            from flask_appbuilder.security.manager import AUTH_OAUTH
            AUTH_TYPE = AUTH_OAUTH
            OAUTH_PROVIDERS = [
                {
                    "name": "keycloak",
                    "icon": "fa-key",
                    "token_key": "access_token",
                    "remote_app": {
                        "client_id": "superset",
                        "client_secret": os.environ.get("OAUTH2_CLIENT_SECRET"),
                        # **必须请求 groups**,否则拿不到用户在 Keycloak
                        # 里的组,下面的 AUTH_ROLES_MAPPING 永远匹配不上,
                        # 所有人都会落到 AUTH_USER_REGISTRATION_ROLE。
                        # (scripts/03 里给 superset client 挂了 groups
                        # 这个 default client scope,两边缺一不可。)
                        "client_kwargs": {"scope": "openid profile email groups"},
                        "api_base_url": "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/",
                        "server_metadata_url": "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/.well-known/openid-configuration",
                    },
                }
            ]
            AUTH_ROLE_ADMIN = "Admin"
            AUTH_ROLE_PUBLIC = "Public"
            AUTH_USER_REGISTRATION = True

            # **按 Keycloak 的组分配 Superset 角色,不再是"人人 Admin"。**
            #
            # 2026-08-29 之前这里是 AUTH_USER_REGISTRATION_ROLE = "Admin",
            # 注释里自己写着"local-lite 简化,以后要换成按组映射"。后果是
            # **任何能登录平台的人在 Superset 里都是管理员** —— 能改数据源
            # 连接串(那里面是 Trino 服务账号的凭据)、能删别人的看板、能进
            # Security 菜单改所有人的权限。数据层有 OPA 挡着(ADR-074),
            # 但产品层是全开的。
            #
            # **两层权限的分工要说清楚,否则很容易配重或配漏**:
            #   - 数据层(能看到哪张表、哪些列):Trino + OPA,按登录用户判,
            #     和 Superset 的角色**无关**。分析师在 Superset 里是 Alpha,
            #     也一样看不到没 grant 的表。
            #   - 产品层(能不能建看板、能不能改数据源):就是下面这张表。
            AUTH_ROLES_SYNC_AT_LOGIN = True
            AUTH_ROLES_MAPPING = {
                # 平台组:维护这套东西的人,需要改数据源、装插件
                "platform-team": ["Admin"],
                # 分析师:建看板、用 SQL Lab 是他们的本职工作
                "data-analysts": ["Alpha", "sql_lab"],
                # 算法工程组:主要在 notebook 里干活,这里只需要看板 + 查数
                "algorithm-team": ["Gamma", "sql_lab"],
                # 只读访客:只能看别人做好的看板
                "viewers": ["Gamma"],
            }
            # 不在上面任何一个组里的人,落到最小权限,**不是 Admin**。
            # Gamma 在 Superset 里本身看不到任何数据源,要显式授权才行 ——
            # 对一个"没被分进任何组"的账号,这是正确的默认。
            AUTH_USER_REGISTRATION_ROLE = "Gamma"

            def _superset_groups(sm, provider, response=None):
                """从 id_token 里取 groups —— Superset 的通用 OAuth provider
                默认只认 userinfo 端点返回的字段,而 Keycloak 的
                oidc-group-membership-mapper 把 groups 放进 token。
                不取的话 AUTH_ROLES_MAPPING 拿不到东西可匹配。"""
                # **相对路径必须是 `openid-connect/userinfo`,不是 `userinfo`。**
                #
                # authlib 把它拼在 remote_app 的 api_base_url 后面,而那个值
                # 以 `protocol/` 结尾(FAB 内置的 keycloak 分支就是按
                # `get("openid-connect/userinfo")` 设计的,见本文件上方注释)。
                # 写成 `userinfo` 拼出来是 `.../protocol/userinfo` —— **404**。
                #
                # **这个错的表现极具欺骗性**:FAB 把异常吞掉,只是让登录回到
                # 登录页,日志里一个 ERROR 都没有。用户看到的是"点了 Keycloak
                # 登录没反应",而实际上认证已经成功、也跳回来了,只在最后一步
                # 静默失败。
                #
                # 2026-09-01 实测:`.../protocol/userinfo` 返回 404,
                # `.../protocol/openid-connect/userinfo` 返回 401(要 token,
                # 说明路径是对的)。
                #
                # **这个 bug 从 2026-08-29 加这个自定义 SecurityManager 起就
                # 存在**,一直没被发现,因为此前所有验证都是程序化的
                # (impersonation 用 override_user、门户用伪造的请求头),
                # **没有一次真的用浏览器走完 SSO 登录**。
                me = sm.oauth_remotes[provider].get("openid-connect/userinfo")
                data = me.json() if hasattr(me, "json") else me
                return {
                    "username": data.get("preferred_username") or data.get("sub"),
                    "email": data.get("email", ""),
                    "first_name": data.get("given_name", ""),
                    "last_name": data.get("family_name", ""),
                    "role_keys": data.get("groups", []) or [],
                }

            from superset.security import SupersetSecurityManager

            class PlatformSecurityManager(SupersetSecurityManager):
                def oauth_user_info(self, provider, response=None):
                    return _superset_groups(self, provider, response)

            CUSTOM_SECURITY_MANAGER = PlatformSecurityManager
          examples_db: |
            # 2026-08-19:load_examples 默认的 examples 连接不配就落到 pod
            # 本地 SQLite(见 apps/superset/manifests/create-db-job.yaml 的
            # 说明),没有持久化,pod 一重启示例数据就没了、仪表盘报
            # "no such table"。改成用 envFromSecret 里已经有的这几个
            # DB_* 变量(和主 superset 库同一个 Postgres 实例、同一个账号),
            # 接到 create-db-job.yaml 新建的 superset_examples 这个库上。
            SQLALCHEMY_EXAMPLES_URI = (
                f"postgresql://{os.environ['DB_USER']}:{os.environ['DB_PASS']}@"
                f"{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/superset_examples"
            )
          wecom_alert: |
            # 企业微信告警(二开示例)。**这是「层次一」的二开:不改镜像、
            # 不改上游源码,只在 configOverrides 里注入一段 Python。**
            #
            # 为什么走这条路,而不是像以前那样改 Superset 源码重新打包:
            # 见 ADR-090。一句话是**升级代价** —— 这个平台 2026-08-26 把
            # OpenMetadata 从 1.13.3 升到 2.0.0、09-02 升到 2.0.1,都是逐条
            # 核对 breaking changes 做的;如果组件是分叉版本,这两次升级的
            # 代价会高一个量级,而且很可能就此不升了。
            #
            # **Superset 的通知是一个插件系统**:`BaseNotification` 的
            # `__init_subclass__` 会把子类自动注册进 `plugins`,后定义的同
            # `type` 子类覆盖先定义的。所以只要在这里定义一个子类就生效,
            # 不需要碰镜像里的任何文件。
            #
            # **为什么是继承 WebhookNotification 而不是新增一个通知类型**:
            # `ReportRecipientType` 是一个固定的 StrEnum(Email/Slack/
            # SlackV2/Webhook),**没法在配置里加新成员**。所以复用 Webhook
            # 这个类型,只把 payload 换成企微机器人要的格式 —— 二开面缩到
            # 一个方法。
            # **不能在这里顶层 import。**
            #
            # `superset_config.py` 是在 Flask app 初始化**之前**被导入的,而
            # `superset.reports.notifications.webhook` 会连锁加载
            # `superset.models.core`,后者在 app 还没初始化时直接抛
            # `Exception: App not initialized yet. Please call init_app first`
            # —— 整个 Superset 起不来(2026-09-02 实测,第一版就是这么写的,
            # 新 pod CrashLoopBackOff)。
            #
            # 解法是**推迟到 app 初始化之后再定义子类**:Superset 支持在配置里
            # 定义 `FLASK_APP_MUTATOR`,它在 app 建好之后被调用。子类只要在
            # 第一次发通知之前定义完就行,而那必然晚于 app 初始化。
            def FLASK_APP_MUTATOR(app):  # noqa: N802
                from superset.reports.notifications.webhook import WebhookNotification

                class WeComWebhookNotification(WebhookNotification):
                    """把 Superset 的告警内容转成企业微信机器人的 markdown 消息。

                    企微机器人只认这个形状:
                        {"msgtype": "markdown", "markdown": {"content": "..."}}
                    而 Superset 内置的 webhook 发的是它自己的 payload,字段对不上,
                    企微会直接返回 errcode != 0。
                    """

                    def _get_req_payload(self):
                        c = self._content
                        lines = [f"**{c.name}**"]
                        if c.description:
                            lines.append(c.description)
                        if c.text:
                            # 企微 markdown 单条上限 4096 字节,留出余量截断 ——
                            # 超长会整条发送失败,而不是被截断,那样告警就丢了。
                            lines.append(f"```\n{c.text[:2000]}\n```")
                        if c.url:
                            lines.append(f"[在 Superset 里查看]({c.url})")
                        return {
                            "msgtype": "markdown",
                            "markdown": {"content": "\n".join(lines)},
                        }

                    def _get_files(self):
                        # **企微机器人的 webhook 不接受 multipart 附件。**
                        # 父类在有 files 时会改用 multipart 发送,那样企微直接
                        # 拒收;返回空让它始终走 JSON 那条分支。
                        # 代价:图表截图/CSV 发不出去,只能靠上面那个链接跳回
                        # Superset 看 —— 这是企微机器人本身的限制,不是实现问题。
                        return None

            # Webhook 通知默认是关的。
            FEATURE_FLAGS = {**globals().get("FEATURE_FLAGS", {}),
                             "ALERT_REPORT_WEBHOOK": True}
            # 企微机器人地址是 http/https 都可能(内网自建代理常见 http),
            # 而且这里发到集群内的 echo-sink 验证机制,所以不强制 HTTPS。
            # **上生产接真实企微地址时应该改回 True**(企微官方地址是 https)。
            ALERT_REPORTS_WEBHOOK_HTTPS_ONLY = False
          chinese_ui: |
            # 界面汉化(2026-08-26 落地)。**确实就是一个配置的
            # 事吗"——**是的,确实就是一个配置**,Superset 自带简体中文翻译,
            # 不需要自己翻译或者打补丁)。
            #
            # 两个键都要设,只设 BABEL_DEFAULT_LOCALE 是不够的:
            #   - BABEL_DEFAULT_LOCALE 决定**默认**语言
            #   - LANGUAGES 决定右上角语言切换菜单里**列出哪些**
            # 只设前者的话默认变中文了,但用户想切回英文找不到入口;只设
            # 后者的话菜单里有中文、默认还是英文,每个人都得自己切一次。
            #
            # 保留英文不是可有可无:这个平台的报错信息、官方文档、社区搜到的
            # 答案全是英文的,排障时切回英文对得上号。
            BABEL_DEFAULT_LOCALE = "zh"
            LANGUAGES = {
                "zh": {"flag": "cn", "name": "简体中文"},
                "en": {"flag": "us", "name": "English"},
            }
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - superset.{{DOMAIN_SUFFIX}}
        init:
          # 2026-08-19:实测确认这些示例数据(birth_names/video_game_sales/
          # world_health 等)是打包在 apache-superset 这个 pip 包里的
          # .parquet 文件,`superset load_examples` 不联网、不依赖外部
          # 数据源,纯本地加载,开着不会引入这个项目一直在提防的"运行时
          # 联网"问题。用来给刚接触这个平台的人一个开箱即用的可视化demo,
          # 不影响这个项目自己的 iceberg.demo.orders 那张真实业务 demo 表
          # (scripts/08-create-demo-data.sh)。
          loadExamples: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1024Mi
        supersetNode:
          replicas:
            replicaCount: {{RES:superset_node_replicas}}
          # 2026-08-16 真实故障:chart 默认的 startupProbe 预算(15s 初始
          # 延迟 + 60 次 * 5s = 315 秒)在这台机器网络慢的时候不够用——
          # 实测确认(exitCode 137,SIGKILL,从 Started 到 Terminated 正好
          # 5分44秒,不是随机崩溃),当时是 bootstrapScript 运行时装依赖
          # 卡住导致的。2026-08-19 已经把依赖改成构建时装进镜像(见上面
          # image 那段注释),理论上不再需要这么大的预算,但这次没有专门
          # 收紧验证过(改镜像本身已经是这次的改动,不想在同一次改动里
          # 顺手收紧探针又碰上别的边界情况),先保留这个已知能用的预算,
          # 之后有余量再单独收紧验证。
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 5
          # 规格分档,见 environments/resource-profiles.yaml
          resources:
            requests:
              cpu: {{RES:superset_node_cpu}}
              memory: {{RES:superset_node_memory_request}}
            limits:
              memory: {{RES:superset_node_memory_limit}}
        supersetWorker:
          # 没有 Redis/Celery broker,worker 起来也没用。replicaCount 压到 0
          # (Deployment 对象还在,但不占资源,比强行让 enabled:false 生效更可靠)。
          # 三个环境都是 0(见 resource-profiles.yaml 里的注释——prod 也一样,
          # 这次分档没有一并把 Celery/Redis 接上,不是漏配)。
          replicas:
            replicaCount: {{RES:superset_worker_replicas}}
        supersetCeleryBeat:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
