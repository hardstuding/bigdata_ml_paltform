# 和 permission-request-app/table-registration-app 同一个 oauth2-proxy
# 模式(ADR-032)。这个组件不需要 pass_access_token/解 groups——门户页面
# 不做任何权限判断,登录过就能看,只是显示"当前登录:XX"。
#
# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/platform-portal-oauth2-
# proxy.yaml + environments/<env>/config.yaml——改动请改模板文件,不要
# 直接改这份生成结果(下次渲染会被覆盖)。见
# environments/cloud-full/config.yaml 顶部说明背景。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-portal-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            # 2026-08-16 cloud-full 真实故障,分两层:①redirect_url 之前
            # 没带端口,local-lite 靠 colima 自动转发 80/443 不需要端口,
            # cloud-full 的 ingress-nginx 是 NodePort(32460/32535),不带
            # 端口登录跳转回来就 404。②修完①之后又炸出更深的问题:加了
            # 端口的 Keycloak(见 platform/apps/keycloak.yaml 的
            # KC_HOSTNAME)让 discovery 文档里 issuer 变成带端口的地址,
            # oauth2-proxy 自动 OIDC discovery 会拿这个 issuer 和自己配的
            # oidc_issuer_url 做精确字符串比对,不匹配直接拒绝启动
            # ("oidc: issuer did not match")——但 oauth2-proxy 在集群内部
            # 又连不通这个带端口的外部地址(NodePort 只在节点网卡上监听,
            # ClusterIP 没有这个端口,实测 HTTP:000)。改成关掉自动
            # discovery,手动分别指定:login_url(浏览器要跳转去的地址,
            # 带端口,走外部路径)、redeem_url/oidc_jwks_url/profile_url
            # (oauth2-proxy 自己服务端发起的调用,不带端口,走集群内部
            # 能连通的路径)——和 Grafana(kube-prometheus-stack.yaml)
            # 一直以来的做法是同一个模式,不是新发明的方案。oidc_issuer_url
            # 仍然要填带端口的完整值,这个不是网络请求,是本地校验收到的
            # JWT 的 iss claim 用的,必须和 Keycloak 实际签发的 issuer
            # 完全一致。
            oidc_issuer_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform"
            skip_oidc_discovery = true
            login_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth"
            redeem_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/token"
            oidc_jwks_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/certs"
            profile_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/userinfo"
            redirect_url = "{{EXTERNAL_SCHEME}}://portal.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/oauth2/callback"
            upstreams = [ "http://platform-portal.platform-portal.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - portal.{{DOMAIN_SUFFIX}}
        # 这个进程在**认证请求路径上**:它一重启(滚更、节点漂移、OOM),
        # 对应服务的 SSO 就断一次。prod 给 2 副本,见
        # environments/resource-profiles.yaml。
        replicaCount: {{RES:oauth2_proxy_replicas}}
        resources:
          requests:
            cpu: {{RES:oauth2_proxy_cpu}}
            memory: {{RES:oauth2_proxy_memory_request}}
          limits:
            memory: {{RES:oauth2_proxy_memory_limit}}
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
