# Apache 官方 Flink Kubernetes Operator(不是社区/Bitnami 套壳,见
# ADR-008)。装在自己的 flink 命名空间,只 watch 这一个命名空间——和
# apps/components/kafka-operator.yaml(Strimzi,watchAnyNamespace: false)
# 是同一个"最小权限"取舍,不做成集群范围的 operator。
#
# 版本/兼容性选择的完整依据见 docs/decisions/062-flink-streaming-pipeline.md
# 和 apps/flink-iceberg-image/Dockerfile 顶部注释,这里只记结论:
#   - chart/操作符版本 1.15.0(downloads.apache.org 上当前最新稳定发布版,
#     查过官方下载页确认,不是拍的)。
#   - 操作符自己内部跑在 Flink 1.20.1 上(它自己的 pom.xml 确认),但它
#     管理的 FlinkDeployment 可以是任意受支持的 Flink 版本——这次选
#     Flink 1.20.5 作为被管理作业的版本,见 flink-iceberg-image 的说明。
#
# **这份文件没有加进任何环境的 enabled_components,需要人工确认后再加**
# ——按这个仓库"分工边界"的约定,架构级新增组件不由执行方自己拍板启用。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-kubernetes-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 官方按版本发布独立的 chart repo(不是一个持续滚动更新的单一 repo
    # URL)——`helm repo add` 官方文档推荐的做法就是这样,见
    # https://downloads.apache.org/flink/。这个 URL 本身已经把版本锁死在
    # 地址里,不会像滚动 repo 那样"repoURL 不变、但哪天悄悄换了内容"。
    repoURL: https://downloads.apache.org/flink/flink-kubernetes-operator-1.15.0/
    chart: flink-kubernetes-operator
    targetRevision: 1.15.0
    helm:
      valuesObject:
        image:
          repository: ghcr.io/apache/flink-kubernetes-operator
          # chart 默认值是一个 git commit SHA 短哈希(79d730b),不是稳定
          # 版本 tag——那是"最新构建"的移动指针,不满足"版本要锁定具体
          # 版本号"这条要求,显式覆盖成和 chart 版本对应的稳定 tag。
          tag: "1.15.0"
        # 只 watch 这一个命名空间:RBAC 只会在这个命名空间里创建(Role/
        # RoleBinding/jobServiceAccount),不会尝试对整个集群授权。同时把
        # 这个命名空间设成和 operator 自己的 release 命名空间一致(见
        # destination.namespace),这样 chart 的
        # "该不该在 watchNamespaces 里额外建 Role.Release.Namespace" 判断
        # 会跳过重复的那份——更重要的是避免了"FlinkDeployment 所在的
        # 命名空间还没建出来,operator 的 RBAC 资源就先尝试往里面建"
        # 这种跨 Application 的启动顺序竞态(ArgoCD 的 CreateNamespace=
        # true 只保证这个 Application 自己的 destination 命名空间存在,
        # 不保证 values 里手写的其它命名空间存在)。
        watchNamespaces:
          - flink

        # 作业失败后自动重启。2026-08-23 真实踩到:云主机重启时 Flink 作业
        # 在 Hive Metastore 还没就绪的窗口里提交,CREATE DATABASE 失败——
        # 那是**作业提交阶段**的失败,Flink 自己的 restart-strategy 管不着
        # (它只管运行期 task 失败),整个 application 进 FAILED 且**不会
        # 自己恢复**。结果是集群重启一次,这条流式链路就永久停了,没人盯着
        # 就一直停着。
        #
        # 作业脚本里已经加了"等 HMS 就绪再建库"的重试(治本),这条是兜底:
        # 万一还有别的启动期竞态,让 operator 把它拉起来,而不是躺在 FAILED。
        defaultConfiguration:
          create: true
          append: true
          flink-conf.yaml: |
            kubernetes.operator.job.restart.failed: true
        resources:
          # 规格分档,见 environments/resource-profiles.yaml
          requests:
            cpu: {{RES:flink_operator_cpu}}
            memory: {{RES:flink_operator_memory_request}}
          limits:
            memory: {{RES:flink_operator_memory_limit}}
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
