# 官方 jupyterhub/jupyterhub chart(hub.jupyter.org 发布,不是社区非官方
# 维护的,和当初否决 PostHog 是同一条筛选标准)。KubeSpawner 是这个 chart
# 的默认 spawner,每个用户登录后会拉起一个独立的 notebook Pod,不需要额外
# 配置。
#
# 认证:hub 镜像自带 oauthenticator 包(实测确认过,不是猜的),用
# GenericOAuthenticator 接 Keycloak。
#
# 2026-08-11 补充:最早三个 URL 按 Grafana 那套"浏览器/后端分开配"模式写的
# (token_url/userdata_url 用集群内部域名),实测浏览器登录后卡在
# /hub/oauth_callback 报 500,Keycloak 日志给的真实原因:
#   USER_INFO_REQUEST_ERROR ... reason="Invalid token issuer.
#   Expected 'http://keycloak-keycloakx-http.keycloak.svc.cluster.local/...'"
# 根因:Keycloak 签发的 access token 里 iss 是发起 /auth 授权请求时用的域名
# (浏览器打的 keycloak.local-lite.test),但 userinfo 端点会按"当前这次请求
# 打进来时用的 Host"重新算一遍期望的 issuer,两者对不上就直接拒绝
# ——这是 Keycloak 自己的 token 校验行为,不是配置错误。Grafana 当初这样配
# 没出问题,是因为 Grafana 的 OAuth 客户端只解码 id_token 里的 claim,压根
# 没有单独发请求去 userinfo 端点;JupyterHub 的 GenericOAuthenticator会
# 真的对 userdata_url 发一次 HTTP 请求,才踩中这个校验。
#
# 修复:token_url/userdata_url 也改成外部域名,和 authorize_url 保持一致
# (单一 issuer 模式,和 ArgoCD/Trino/Argo Workflows 是同一套)。hub pod 靠
# platform/coredns-custom/ 的自定义 DNS zone(集群内全局生效,不用每个
# chart 单独配 hostAliases)解析 keycloak.local-lite.test。
#
# 2026-08-19 补:cloud-full 是 NodePort(32460),浏览器打的
# authorize_url/oauth_callback_url 必须带端口(不带端口本来就连不上,
# 和 8-16 那批组件的第一层坑一样)。token_url/userdata_url 保持不带
# 端口——上面 2026-08-11 那次"单一 issuer"的结论是在 Keycloak 还是
# KC_HOSTNAME_STRICT=false 时代 debug 出来的,2026-08-16 已经换成
# KC_HOSTNAME_STRICT=true + 固定 issuer + KC_HOSTNAME_BACKCHANNEL_
# DYNAMIC=true(和 Trino/Grafana/oauth2-proxy 现在用的是同一套),
# 理论上内部无端口地址现在也能通过 issuer 校验——但这是本次新做的
# 判断,没有真实登录验证过,先按这个部署,登录测试如果又踩中旧的
# issuer 不匹配,再回退成三个 URL 都用外部带端口地址。
# db 用 chart 默认的 sqlite-pvc,不接共享 Postgres——hub 的状态(谁登录过、
# 谁的 server 在跑)不是别的组件需要联动的数据,没有理由为了这个单独接一次
# Postgres,和当初给 Keycloak/Trino 接 Postgres(数据会被其他东西依赖,或者
# 丢了代价很大)是不同的权衡。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyterhub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://hub.jupyter.org/helm-chart/
    chart: jupyterhub
    targetRevision: 4.4.1
    helm:
      valuesObject:
        hub:
          config:
            JupyterHub:
              authenticator_class: generic-oauth
              admin_access: true
            Authenticator:
              # 2026-08-11 从 allow_all(谁认证通过都放行)改成按 Keycloak
              # group 收紧,和 ArgoCD/Grafana 是同一次企业级权限收拢(见
              # ADR-028、platform/iam/)。GenericOAuthenticator 原生支持
              # allowed_groups/admin_groups 读 token 的 groups claim,
              # claim_groups_key 默认就是 "groups",不用额外配
              # (kubectl exec 进 hub pod 实测确认过默认值)。
              #
              # 背景(JupyterHub 3.x 起 Authenticator.allow_all 默认 false,
              # 不配任何 allowed_*/admin_* 会导致认证成功但 403 "not
              # currently authorized",见 ADR-025 更正 2):这次是主动配
              # allowed_groups,不是碰到那个坑再补。
              #
              # manage_groups 必须开:admin_groups 单独配不生效,真实报错是
              # "GenericOAuthenticator.admin_groups requires
              # GenericOAuthenticator.manage_groups to also be set",hub
              # 直接 CrashLoopBackOff 起不来(第一次部署时踩到,补的这行)。
              manage_groups: true
              allowed_groups:
                - platform-team
                - algorithm-team
                - data-analysts  # 2026-08-14 补:数分角色一直没在白名单里,原配置漏了,
                                 # 之前从没在这个组件 un-park 时被真正测过登录
              admin_groups:
                - platform-team
            GenericOAuthenticator:
              client_id: jupyterhub
              authorize_url: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth"
              token_url: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/token"
              userdata_url: "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/userinfo"
              login_service: "Keycloak"
              username_claim: "preferred_username"
              scope:
                - "openid"
                - "profile"
                - "email"
              oauth_callback_url: "{{EXTERNAL_SCHEME}}://jupyterhub.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/hub/oauth_callback"
          extraEnv:
            OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-oidc-secret
                  key: clientSecret
          extraConfig:
            "01-oauth-secret": |
              import os
              c.GenericOAuthenticator.client_secret = os.environ["OAUTH_CLIENT_SECRET"]
            # 把用户在 Keycloak 里的组注入 notebook pod 的环境变量。
            #
            # **这是 ADR-064 那套按组配额能不能真正生效的关键一环**:
            # platform_sdk 提交作业时要按提交者的组决定进哪个 Kueue 队列
            # (config.queue_name()),而 notebook 里的代码没有任何别的途径
            # 知道"当前登录的人属于哪个组"——hub 知道(manage_groups 已开,
            # 上面 allowed_groups 就是靠它生效的),但这个信息默认不会传给
            # singleuser pod。不注入的话,队列只能靠用户手填,而"让用户手填
            # 自己该用哪个组的配额"等于没有配额。
            #
            # spawner.user.groups 里是 JupyterHub 的 Group 对象,不是字符串,
            # 要取 .name;而且 manage_groups 关掉时这个列表会是空的——那种
            # 情况下注入一个空字符串,SDK 那边会推断不出队列、作业不打标签,
            # 退化成引入 Kueue 之前的行为,不会报错。
            "03-inject-groups": |
              def _inject_groups(spawner):
                  groups = [g.name for g in getattr(spawner.user, "groups", [])]
                  spawner.environment["PLATFORM_GROUPS"] = ",".join(groups)
              c.KubeSpawner.pre_spawn_hook = _inject_groups
          resources:
            requests:
              cpu: {{RES:jupyterhub_hub_cpu}}
              memory: {{RES:jupyterhub_hub_memory_request}}
            limits:
              memory: {{RES:jupyterhub_hub_memory_limit}}
        singleuser:
          # 2026-08-19(ADR-058):从"用户自己按需装包"改成用平台统一镜像
          # (apps/platform-image/),里面已经带了 platform_sdk + Trino/
          # MLflow/scikit-learn/pandas 客户端。这就是"打开 notebook 自动
          # 连好 Trino"这个体验缺口(docs/usage-guide.md 记录过)的解法。
          # 本地构建镜像,pullPolicy 必须是 IfNotPresent(和这个项目其它
          # 自建镜像同一个坑:kubelet 会尝试联网拉一个不存在的远程镜像,
          # 直接 ErrImagePull)。
          # **镜像名和 tag 从环境配置来**(`platform_job_image`),不再硬编码
          # —— notebook 和定时作业必须是同一个镜像,而"同一个"这件事以前
          # 靠六个地方各自写对同一个字符串来保证。
          #
          # pullPolicy 保持 IfNotPresent:local-lite 那档是本地构建的镜像,
          # 远端根本不存在这个 tag,用 Always 会直接 ErrImagePull;
          # cloud-full/prod 那档 tag 是 commit SHA、不可变,IfNotPresent
          # 也不会拿到过期的东西。
          image:
            name: "{{PLATFORM_JOB_IMAGE_NAME}}"
            tag: "{{PLATFORM_JOB_IMAGE_TAG}}"
            pullPolicy: IfNotPresent
          # 2026-08-19 真实踩坑(镜像/RBAC 都配好之后,platform_sdk.query()
          # 报 ConnectionRefused,一开始怀疑是 Trino/MLflow 本身没起来,
          # 排查发现两边真实服务都健康、连它们自己也没问题,问题出在调用方
          # 这一侧):chart 默认给 singleuser pod 挂了一条 NetworkPolicy
          # (`singleuser.networkPolicy`,z2jh 的既定安全姿态——notebook 允许
          # 出公网但不许碰集群内部 IP,防止 notebook 变成打内网的跳板),
          # 默认的 `egressAllowRules.privateIPs` 是 false。Trino/MLflow 的
          # ClusterIP 都是私网段,被这条规则原样挡掉,不联网也报
          # ConnectionRefused(不是 DNS 失败、不是超时,容易误判成对端服务
          # 本身的问题)。和 platform/network-policies/manifests/minio.yaml
          # 里"新命名空间要连 MinIO 必须显式加白名单"是同一个设计思路——这里
          # 反过来,是"新的调用方要出站,必须显式放行目标"。不整体打开
          # privateIPs(那会让这条防跳板的策略形同虚设),按命名空间精确放行。
          networkPolicy:
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: trino
                ports:
                  - port: 8443
                    protocol: TCP
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: mlflow
                ports:
                  - port: 5000
                    protocol: TCP
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: minio
                ports:
                  - port: 9000
                    protocol: TCP
              # submit_job() 用 kubernetes 客户端建 ConfigMap/Workflow 对象,
              # 走的是 K8s API server 本身。2026-08-19 当晚查到这条规则该
              # 长什么样(过程:①先想当然写成 argo-workflows 命名空间的
              # namespaceSelector,不通;②`kubectl get svc kubernetes
              # -n default` 查到 Service 在 default 命名空间,改成对应的
              # namespaceSelector 还是不通;③`kubectl get endpoints
              # kubernetes -n default` 查到真相:k3s 的 API server 不是
              # 普通 pod,是 k3s 进程自己在节点上起的,这个 Service 的
              # Endpoints 指向的是**节点 IP**,不是任何 pod IP——
              # namespaceSelector/podSelector 天然匹配不到一个节点 IP,
              # 必须用 ipBlock 直接放行节点 IP + 6443 端口),但当晚会话
              # 结束前没有来得及重新触发验证,写进 commit 时如实标注成
              # "没有验证通过,是已知未解决的限制"。
              #
              # **2026-08-20 补验证:这条规则从一开始就是对的**——起一个带
              # `singleuser-server` 标签、挂 `platform-sdk-submitter` SA
              # 的 debug pod(模拟真实 notebook pod 的网络身份),
              # `submit_job()` 和新增的 `run_workflow_template()`
              # (见 platform-sdk/platform_sdk/submit.py)都端到端成功
              # (建 Workflow→pod 里跑→Succeeded),`job_status()` 也能查到
              # 状态。**这个 known limitation 已经不存在了**,docs/
              # project/roadmap.md 2.6 和 .claude/skills/submit-job/SKILL.md 都
              # 已经同步更新。172.22.9.16 是这台 ECS 的私网 IP(VPC 内网
              # IP,和会变的公网 IP 不是一回事,`stop/start` 不会变,只有
              # 整个实例被重建才会变——如果以后真的换了新实例,这里要跟着
              # 改成新的私网 IP,`kubectl get nodes -o wide` 能查到)。
              - to:
                  - ipBlock:
                      cidr: 172.22.9.16/32
                ports:
                  - port: 6443
                    protocol: TCP
          # platform_sdk 的 submit_job() 要能往 argo-workflows 命名空间建
          # ConfigMap/Workflow,见
          # apps/platform-image/manifests/submitter-rbac.yaml。
          serviceAccountName: platform-sdk-submitter
          # notebook 里 `platform_sdk.query()` 要用的 Trino 凭据。
          # **2026-08-29 之前这里什么都没有**,notebook 里查数直接抛
          # MissingCredential;文档让人自己 export 一个服务账号,而那个账号
          # 在 OPA 里无条件放行,等于「要么用不了,要么用了就越权」。
          #
          # 现在注入的是 notebook_service —— 它**只有代理权限,自己什么都
          # 查不了**。SDK 会自动带上 JupyterHub 注入的 JUPYTERHUB_USER 作为
          # 代理目标,所以权限按登录用户算,和 Superset 走同一条路(ADR-074)。
          extraEnv:
            - name: PLATFORM_TRINO_USER
              valueFrom:
                secretKeyRef: {name: platform-job-credentials, key: PLATFORM_TRINO_USER}
            - name: PLATFORM_TRINO_PASSWORD
              valueFrom:
                secretKeyRef: {name: platform-job-credentials, key: PLATFORM_TRINO_PASSWORD}
            - name: PLATFORM_TRINO_HOST
              value: trino.trino.svc.cluster.local
            - name: PLATFORM_TRINO_PORT
              value: "8443"
            # notebook 里 `platform_sdk.submit_job()` 不指定镜像时用哪个。
            # **必须和 notebook 自己跑的镜像是同一个** —— "交互开发和调度
            # 执行环境一致"(ADR-058)靠的就是这一条。以前它靠
            # platform_sdk/config.py 里的默认值兜着,而那个默认值和这里的
            # singleuser 镜像是两个独立写死的字符串,谁也不保证一致。
            - name: PLATFORM_JOB_IMAGE
              value: "{{PLATFORM_JOB_IMAGE}}"
          memory:
            # 这两个字段最终传进 KubeSpawner 自己的 mem_guarantee/mem_limit
            # traitlet(ByteSpecification),只认 K/M/G/T(十进制)后缀,不认
            # Kubernetes 资源规格常见的 Ki/Mi/Gi(二进制)后缀——写成
            # "1536Mi" 会在用户登录、hub 要给这个用户建 spawner 时直接
            # TraitError,500。和下面 cpu.guarantee 必须是纯数字是同一类
            # "chart 里这个字段最终走 Python 校验,不是走 k8s 校验"的坑。
            guarantee: {{RES:jupyterhub_singleuser_memory_guarantee}}
            limit: {{RES:jupyterhub_singleuser_memory_limit}}
          cpu:
            # chart 的 schema 要求这里是纯数字(CPU 核数),不是
            # Kubernetes 常见的 "100m" 这种带单位字符串,0.1 = 100m。
            guarantee: {{RES:jupyterhub_singleuser_cpu_guarantee}}
          storage:
            capacity: {{RES:jupyterhub_singleuser_storage}}
          # 2026-08-19 更正:上面这条"用户自己按需装"的旧注释已经不成立
          # (见上面 image 那段)——scikit-learn/mlflow 这些包现在打进了
          # 统一镜像。这里只保留 startTimeout 本身。
          startTimeout: 300
        # 数分/算法工程师开着 notebook 一段时间不用是常态,不显式配的话就是
        # 依赖 chart 默认值(cull.enabled: true, timeout: 3600),这次改成
        # 显式写出来,不是新加了这个能力——chart 自带的 jupyterhub-idle-culler
        # 服务本来就在跑(hub pod 日志里能看到它定期调 /hub/api/users),只是
        # 之前没在 git 里显式声明,配置真实生效的值应该让人一眼看到,不用去
        # 翻 chart 默认值文档才知道超时是多久。
        # timeout=7200(2 小时无活动就关,比 chart 默认的 1 小时宽松,给
        # 数分/算法工程师留够思考/开会中途不动的余量)、every=600(每 10
        # 分钟检查一次,chart 默认值)。
        # 【可调参数,见 docs/operations/tuning.md】
        cull:
          enabled: true
          timeout: 7200
          every: 600
          # 管理员的 server 也一起清,不搞特殊——admin 账号也可能是真的在用
          # notebook 而不是常驻资源。
          adminUsers: true
        proxy:
          # 前面已经有 ingress-nginx 做外部入口了,不需要 chart 默认的
          # LoadBalancer 类型再单独暴露一次(k3s 上会占用 ServiceLB 的
          # 另一个端口,没必要)。
          service:
            type: ClusterIP
          chp:
            # configurable-http-proxy —— **每一个 notebook 的每一个请求都
            # 经过它**,和 oauth2-proxy 是同一类"在请求路径上"的组件,所以
            # 也按环境分档,不写死。
            resources:
              requests:
                cpu: {{RES:jupyterhub_chp_cpu}}
                memory: {{RES:jupyterhub_chp_memory_request}}
              limits:
                memory: {{RES:jupyterhub_chp_memory_limit}}
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - jupyterhub.{{DOMAIN_SUFFIX}}
        scheduling:
          userPlaceholder:
            enabled: false
          userScheduler:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: jupyterhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
