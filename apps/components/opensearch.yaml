# OpenMetadata 的搜索后端(不是 Elasticsearch,官方 chart 默认已经切到
# OpenSearch)。官方 opensearch-project chart,单节点模式给 local-lite。
#
# sysctlInit.enabled: OpenSearch 要求宿主机内核参数 vm.max_map_count>=262144
# (mmap 数量限制,JVM 索引引擎要用),用 chart 自带的特权 initContainer 设置,
# 不需要我们手动登进 colima 虚拟机改内核参数。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch
    targetRevision: 3.8.0
    helm:
      valuesObject:
        # singleNode 必须和 replicas 一起切:chart 的 singleNode=true 会写
        # discovery.type=single-node,那个模式下 OpenSearch 根本不组集群,
        # 副本数写 3 也只是起 3 个互不相干的单节点实例——比单节点更糟(数据
        # 分散在三份互相看不见的存储里)。所以这两个键在 resource-profiles.yaml
        # 里是绑定的:selfsigned 单机档 true/1,prod 档 false/3。
        singleNode: {{RES:opensearch_single_node}}
        replicas: {{RES:opensearch_replicas}}
        sysctlInit:
          enabled: true
        # OpenSearch 2.12+ 的 security 插件强制要求这个,不设直接拒绝启动。
        # 这个密码要和 openmetadata.yaml 里 elasticsearch.auth 配的一致
        # (都引用同一个 opensearch-admin Secret)。
        extraEnvs:
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opensearch-admin
                key: password
        resources:
          requests:
            cpu: {{RES:opensearch_cpu}}
            memory: {{RES:opensearch_memory_request}}
          limits:
            memory: {{RES:opensearch_memory_limit}}
        persistence:
          enabled: true
          size: {{RES:opensearch_storage_size}}
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
