# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/table-registration-app-
# oauth2-proxy.yaml + environments/<env>/config.yaml——改动请改模板
# 文件,不要直接改这份生成结果(下次渲染会被覆盖)。见
# environments/cloud-full/config.yaml 顶部说明背景。
#
# 和 permission-request-app 同一个 oauth2-proxy 模式(ADR-032)。这个不需要
# pass_access_token/解 groups——建表注册这次没有审批门槛,任何登录用户都能
# 提交(见 ADR-043),不需要拿 groups claim 判断谁是审批人。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: table-registration-app-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            # 2026-08-16 cloud-full 真实故障(和 platform-portal-oauth2-proxy
            # 同一个坑,那边有完整两层说明:①redirect_url 不带端口 404,
            # ②修完之后 Keycloak 的 issuer 带了端口,自动 discovery 校验
            # 不通过 + 集群内部又连不上带端口的外部地址,改成关掉自动
            # discovery,手动分开配置)。
            oidc_issuer_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform"
            skip_oidc_discovery = true
            login_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/auth/realms/platform/protocol/openid-connect/auth"
            redeem_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/token"
            oidc_jwks_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/certs"
            profile_url = "{{EXTERNAL_SCHEME}}://keycloak.{{DOMAIN_SUFFIX}}/auth/realms/platform/protocol/openid-connect/userinfo"
            redirect_url = "{{EXTERNAL_SCHEME}}://table-registration.{{DOMAIN_SUFFIX}}{{HTTP_PORT_SUFFIX}}/oauth2/callback"
            upstreams = [ "http://table-registration-app.table-registration-app.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
            # 2026-08-29:app 要按登录用户所在的组做事(门户按角色显示、
            # 建表工具判断谁能代他人建表),legacy config 没有"把 groups 转成
            # 请求头"的选项,只能把整个 access token 传下去让 app 自己解 ——
            # 和 permission-request-app 同一个模式。
            #
            # **不要在这里往 scope 里加 groups**:groups 是挂在 Keycloak
            # client 上的 *default* client scope(见
            # scripts/03-configure-keycloak.sh),不请求也会带上;而请求一个
            # client 没配的 scope,Keycloak 直接 invalid_scope,登录页都进不去
            # (MLflow 2026-08-19 就是这么炸的)。
            pass_access_token = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - table-registration.{{DOMAIN_SUFFIX}}
        # 这个进程在**认证请求路径上**:它一重启(滚更、节点漂移、OOM),
        # 对应服务的 SSO 就断一次。prod 给 2 副本,见
        # environments/resource-profiles.yaml。
        replicaCount: {{RES:oauth2_proxy_replicas}}
        resources:
          requests:
            cpu: {{RES:oauth2_proxy_cpu}}
            memory: {{RES:oauth2_proxy_memory_request}}
          limits:
            memory: {{RES:oauth2_proxy_memory_limit}}
  destination:
    server: https://kubernetes.default.svc
    namespace: table-registration-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
