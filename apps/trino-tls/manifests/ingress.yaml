# chart 自带的 ingress.enabled 硬编码只转发到 Service 的 8080(http)端口
# (helm template 验证过,没有开关能改),但我们要禁用 http 监听器只留
# OAuth2 要求的 https:8443(见 apps/definitions/trino.yaml 里
# http-server.http.enabled=false),所以这个 Ingress 自己写,不用 chart 那份。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino-coordinator-https
  namespace: trino
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: trino.local-lite.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino
                port:
                  number: 8443
