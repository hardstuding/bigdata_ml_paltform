# Trino OAuth2 认证硬性要求它自己的 HTTPS 监听器打开(不是浏览器可见的证书,
# 只是 ingress-nginx 到 Trino coordinator 之间集群内部这一跳,ingress-nginx
# 默认不校验后端证书,自签名够用)。additionalOutputFormats.CombinedPEM 让
# cert-manager 直接生成一份 cert+key 拼在一起的 PEM 文件。实测这个
# cert-manager 版本(v1.21.1)生成的 key 名是 "tls-combined.pem"(不是网上
# 常见示例里写的 "key+crt.pem",用 `kubectl get secret trino-tls -o
# jsonpath='{.data}'` 验证过,不是猜的)。Trino 支持直接把这种合并 PEM 当
# keystore 用,不用转成 JKS/PKCS12。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-tls
  namespace: trino
spec:
  secretName: trino-tls
  # 不写 commonName 的话,自签证书的 issuer DN 是空的,Java 的 X509 解析器
  # (Trino 用来读 PEM keystore)直接拒绝:CertificateParsingException:
  # Empty issuer DN not allowed in X509Certificates。实测踩过,不是猜的。
  commonName: trino.local-lite.test
  issuerRef:
    name: platform-issuer
    kind: ClusterIssuer
  dnsNames:
    - trino.local-lite.test
    - trino.trino.svc.cluster.local
  additionalOutputFormats:
    - type: CombinedPEM
