# 回显接收端的脚本。只用标准库。
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-echo-sink-script
  namespace: monitoring
data:
  sink.py: |
    """收 Alertmanager 的 webhook POST,存在内存里,能用 HTTP 取回来看。

    **为什么要"能取回来看"而不只是打日志**:日志会滚掉,而且看日志要
    kubectl。这里留一个 /alerts 接口,门户和排障的人都能直接拿——想知道
    "接企业微信之后对方会收到什么",看这个就够了,不用先接真实渠道再猜。

    只留最近 50 条:这不是存储,是一个观察窗口。
    """
    import json
    import time
    from collections import deque
    from http.server import BaseHTTPRequestHandler, HTTPServer

    RECEIVED = deque(maxlen=50)


    class Handler(BaseHTTPRequestHandler):
        def _json(self, code, payload):
            body = json.dumps(payload, ensure_ascii=False).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                return self._json(200, {"status": "ok", "received": len(RECEIVED)})
            if self.path.startswith("/alerts"):
                return self._json(200, {"count": len(RECEIVED), "items": list(RECEIVED)})
            self._json(404, {"error": "只有 /healthz 和 /alerts"})

        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(n) if n else b""
            try:
                body = json.loads(raw or b"{}")
            except json.JSONDecodeError:
                body = {"_unparsed": raw.decode(errors="replace")[:500]}
            RECEIVED.append({"at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                             "path": self.path, "body": body})
            # 把关键字段打进日志,这样 kubectl logs 也能一眼看到收没收到。
            names = [a.get("labels", {}).get("alertname")
                     for a in (body.get("alerts") or [])]
            print(f"收到 {len(names)} 条告警: {names} status={body.get('status')}",
                  flush=True)
            self._json(200, {"ok": True})

        def log_message(self, *args):
            pass  # 默认的 access log 太吵,上面已经打了有意义的那行


    if __name__ == "__main__":
        print("alert-echo-sink 监听 :8080(POST / 收告警,GET /alerts 回看)", flush=True)
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
