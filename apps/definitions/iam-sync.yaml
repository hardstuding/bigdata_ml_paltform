# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/iam-sync.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/iam-sync.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 每 5 分钟自动把 platform/iam/ 同步进 Keycloak,见 ADR-031 和
# apps/iam-sync/manifests/cronjob.yaml 里的详细设计说明(权限拆分:这个
# CronJob 只有集群内 Keycloak 的 exec 权限,没有 git 写权限)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iam-sync
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/iam-sync/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
