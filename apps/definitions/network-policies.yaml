# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/network-policies.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/network-policies.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# NetworkPolicy,见 docs/decisions/035-network-policy.md。试点阶段
# (2026-08-12)只覆盖 permission-request-app 这一个 namespace;2026-08-13
# 推广到 keycloak/data(Postgres)/minio 这三个核心命名空间——这个
# Application 的 `destination.namespace` 字段本身只是个默认值,实际每份
# manifest 都显式写了自己的 `metadata.namespace`,不受这个字段影响。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/network-policies/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: permission-request-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
