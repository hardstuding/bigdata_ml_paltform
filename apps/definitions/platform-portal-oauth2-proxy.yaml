# 和 permission-request-app/table-registration-app 同一个 oauth2-proxy
# 模式(ADR-032)。这个组件不需要 pass_access_token/解 groups——门户页面
# 不做任何权限判断,登录过就能看,只是显示"当前登录:XX"。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-portal-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            oidc_issuer_url = "http://keycloak.local-lite.test/auth/realms/platform"
            # 2026-08-16 cloud-full 真实故障:redirect_url 之前没带端口,
            # local-lite 上 ingress-nginx 靠 colima 自动把 80/443 转发到
            # 127.0.0.1 所以不需要写端口,但 cloud-full 上 ingress-nginx
            # 是 NodePort(32460/32535,见 ADR 对应记录),浏览器打开门户
            # 页面第一步(带着 :32460)是正常的,登录完 Keycloak 跳回这个
            # 写死不带端口的 URL 就会打到没人监听的 80 端口,404。加上端口
            # 号是真正修好登录流程,不是权宜之计——这个仓库目前没有环境
            # overlay 机制(见 docs/BACKLOG.md P1.3),local-lite 如果之后
            # 也要验证登录流程,这里要记得改回不带端口的版本。
            redirect_url = "http://portal.local-lite.test:32460/oauth2/callback"
            upstreams = [ "http://platform-portal.platform-portal.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - portal.local-lite.test
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
