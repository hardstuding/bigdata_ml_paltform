# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/minio.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/minio.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# local-lite: standalone 单节点单盘,chart 默认是 16 副本分布式模式(16Gi 内存起),
# 本地资源画像必须整体覆盖,不能只调 replicas。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        # 这台机器的网络到 quay.io 老是连不上(TLS handshake timeout/EOF,
        # docker hub 反而是通的),chart 默认镜像源是 quay.io,这里改成
        # docker hub 上 MinIO 官方也在发布的同名镜像。
        image:
          repository: minio/minio
          tag: RELEASE.2025-09-07T16-13-09Z
        mcImage:
          repository: minio/mc
          tag: RELEASE.2025-08-13T08-35-41Z
        mode: standalone
        # 规格分档,见 environments/resource-profiles.yaml
        replicas: 1
        existingSecret: minio-root
        persistence:
          enabled: true
          size: 8Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        consoleService:
          type: ClusterIP
        # ---- 控制台对外入口 + Keycloak 单点登录(ADR-088)----
        #
        # 在这之前 MinIO 控制台**根本没有对外入口**,要看对象存储只能
        # kubectl port-forward。数据工程师排查"这张 Iceberg 表的文件长什么
        # 样""备份真的传上去了吗",只能靠命令行。
        consoleIngress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - minio.local-lite.test
        oidc:
          enabled: true
          # 走**集群内**地址取 .well-known,不绕一圈公网 —— 和别的组件
          # 一致(见 apps/components/superset.yaml)。浏览器那一侧的跳转
          # 地址由 Keycloak 自己按 KC_HOSTNAME 生成,不受这个影响。
          configUrl: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/platform/.well-known/openid-configuration"
          clientId: minio
          existingClientSecretName: minio-oidc-secret
          existingClientSecretKey: clientSecret
          # MinIO 把这个 claim 的值**当成策略名**去套。Keycloak 那边有一个
          # 专门的 minio-policy scope 把组名写进这个 claim(见
          # templates/scripts/03-configure-keycloak.sh)。
          claimName: policy
          scopes: "openid,profile,email"
          redirectUri: "http://minio.local-lite.test:32460/oauth_callback"
          displayName: "用 Keycloak 登录"
        # ---- 策略:**只有 platform-team**,这是一条安全决定,不是偷懒 ----
        #
        # MinIO 里放的是 Iceberg 的 parquet 原始文件。**谁能读 lakehouse 桶,
        # 谁就绕过了整套 OPA 权限** —— 表级授权(ADR-051)、行过滤、列脱敏
        # (ADR-074)全部失效,因为那套的前提是"数据只通过 Trino 访问"。
        # 分析师在 Superset 里被脱敏的手机号,从 MinIO 控制台点一下就能下载
        # 明文。
        #
        # platform-team 拿 consoleAdmin 不增加暴露面:他们本来就能通过 Trino
        # 读全部数据(is_platform_admin 不受表级授权约束)。
        #
        # **其余组没有策略 = 能通过 SSO 登录但看不到任何桶。** 这是有意的。
        # 想给某个组开权限之前,先回答:它绕过的那些行列级策略,你打算怎么办?
        policies:
          - name: platform-team
            statements:
              - effect: Allow
                resources:
                  - "arn:aws:s3:::*"
                actions:
                  - "s3:*"
              # 控制台本身要能列桶、看用量,这些是 admin 面的动作,不在 s3:* 里。
              #
              # **`resources` 必须是空列表,不能写 arn。** MinIO 内置的
              # consoleAdmin 策略里 `admin:*` 这条就是不带 Resource 的,
              # 而 chart 的模板只在 resources 非空时才渲染 Resource 字段。
              # 第一版按 s3 那条的写法给它也加了 `arn:aws:s3:::*` —— 自查时
              # 对照 MinIO 官方策略发现不对。带 Resource 的 admin 语句可能被
              # 策略解析拒绝,而失败发生在 chart 的 post-install Job 里,表现
              # 成"MinIO 同步失败",不会指向策略本身。
              - effect: Allow
                resources: []
                actions:
                  - "admin:*"
        service:
          type: ClusterIP
        buckets:
          - name: lakehouse
            policy: none
            purge: false
          - name: mlflow
            policy: none
            purge: false
          # Spark 作业的 eventLog 写这里(spark.eventLog.dir),Spark History
          # Server 从这里读出来展示——见 ADR-029、
          # environments/cloud-full/pending-definitions/spark-history-server.yaml
          - name: spark-logs
            policy: none
            purge: false
          # Airflow 任务日志(ADR-092)。**不配远程日志的话,任务一失败就
          # 查不到原因** —— KubernetesExecutor 的 task pod 跑完就被删,
          # 日志跟着没,界面上只剩一句
          # `Could not read served logs: ... Name or service not known`
          # (它去连一个已经不存在的 pod 的 8793 端口)。2026-09-02 排查
          # dbt_demo 为什么失败时撞到,那次失败的原因就此再也查不到了。
          - name: airflow-logs
            policy: none
            purge: false
        # 2026-08-21:光有 bucket 不够,还要**建出 events/ 这个前缀**,否则
        # Spark 和 History Server 两边都起不来:
        #   - Spark driver:eventLog.dir 指向不存在的目录,报
        #     `FileNotFoundException: No such file or directory`(Spark 只
        #     检查目录存在,自己不会创建)
        #   - History Server:同样找不到目录,直接 CrashLoopBackOff
        # 而且**不能退回用 bucket 根路径**(s3a://spark-logs/)——根路径会让
        # S3AFileSystem 的 S3Guard PathMetadata 抛
        # `IllegalArgumentException: path must be absolute`,实测过。
        # chart 的 buckets: 只建 bucket 不建前缀,用 customCommands 补。
        # `mc mb <bucket>/<prefix>` 实测能建前缀(不只是建 bucket),
        # `--ignore-existing` 保证 ArgoCD 反复同步时幂等。
        customCommands:
          - command: "mb --ignore-existing myminio/spark-logs/events"
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
