# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/seatunnel.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/seatunnel.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Zeta 引擎单节点 Hybrid 模式,配置细节见 apps/seatunnel/manifests/configmap.yaml
# 顶部注释——官方没有完整配置示例,这是照文档片段 + 社区实践拼的,先验证能不能
# 起得来,不代表是钉死的最终配置。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seatunnel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/seatunnel/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: seatunnel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
