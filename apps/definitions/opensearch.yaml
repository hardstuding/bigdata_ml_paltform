# OpenMetadata 的搜索后端(不是 Elasticsearch,官方 chart 默认已经切到
# OpenSearch)。官方 opensearch-project chart,单节点模式给 local-lite。
#
# sysctlInit.enabled: OpenSearch 要求宿主机内核参数 vm.max_map_count>=262144
# (mmap 数量限制,JVM 索引引擎要用),用 chart 自带的特权 initContainer 设置,
# 不需要我们手动登进 colima 虚拟机改内核参数。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch
    targetRevision: 3.8.0
    helm:
      valuesObject:
        singleNode: true
        replicas: 1
        sysctlInit:
          enabled: true
        # OpenSearch 2.12+ 的 security 插件强制要求这个,不设直接拒绝启动。
        # 这个密码要和 openmetadata.yaml 里 elasticsearch.auth 配的一致
        # (都引用同一个 opensearch-admin Secret)。
        extraEnvs:
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opensearch-admin
                key: password
        # 官方镜像默认给 REST 层(9200)套自签名 demo 证书,OpenMetadata
        # 的 Java 客户端不信任这个证书链,会报 PKIX path building failed。
        # 这个集群只在 NetworkPolicy 保护的内网访问,不对外暴露,关掉 REST
        # 层 TLS 比给 OpenMetadata 建一套 Java truststore 更省事——两边都
        # 改成 http 而不是死磕证书信任链。用户名密码鉴权(security 插件)
        # 不受影响,继续生效。transport 层(节点间通信)不受影响,单节点
        # 模式本来就不走这条路。
        config:
          opensearch.yml: |
            cluster.name: opensearch-cluster
            network.host: 0.0.0.0
            plugins.security.ssl.http.enabled: false
        resources:
          requests:
            cpu: 300m
            memory: 768Mi
          limits:
            memory: 1280Mi
        persistence:
          enabled: true
          size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
