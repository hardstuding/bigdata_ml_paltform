# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/opensearch.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/opensearch.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# OpenMetadata 的搜索后端(不是 Elasticsearch,官方 chart 默认已经切到
# OpenSearch)。官方 opensearch-project chart,单节点模式给 local-lite。
#
# sysctlInit.enabled: OpenSearch 要求宿主机内核参数 vm.max_map_count>=262144
# (mmap 数量限制,JVM 索引引擎要用),用 chart 自带的特权 initContainer 设置,
# 不需要我们手动登进 colima 虚拟机改内核参数。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch
    targetRevision: 3.8.0
    helm:
      valuesObject:
        # singleNode 必须和 replicas 一起切:chart 的 singleNode=true 会写
        # discovery.type=single-node,那个模式下 OpenSearch 根本不组集群,
        # 副本数写 3 也只是起 3 个互不相干的单节点实例——比单节点更糟(数据
        # 分散在三份互相看不见的存储里)。所以这两个键在 resource-profiles.yaml
        # 里是绑定的:selfsigned 单机档 true/1,prod 档 false/3。
        singleNode: true
        replicas: 1
        sysctlInit:
          enabled: true
        # OpenSearch 2.12+ 的 security 插件强制要求这个,不设直接拒绝启动。
        # 这个密码要和 openmetadata.yaml 里 elasticsearch.auth 配的一致
        # (都引用同一个 opensearch-admin Secret)。
        extraEnvs:
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opensearch-admin
                key: password
          # **关掉 HTTP 层的 TLS(传输层的照旧开着)。** ADR-093。
          #
          # 镜像自带的是 demo 证书:CN=node-0.example.com,SAN 里只有
          # node-0.example.com / localhost / 127.0.0.1 —— **没有集群内的
          # 服务名 `opensearch-cluster-master`**。OpenMetadata 用服务名连
          # 它,Java 的主机名校验直接拒:
          #     No subject alternative DNS name matching
          #     opensearch-cluster-master found
          #
          # 后果不是"搜索慢一点",是**写血缘直接 500** —— OpenMetadata 在
          # PUT /api/v1/lineage 时要更新搜索索引,连不上就整个请求失败。
          # 2026-09-02 seatunnel_device_events 这条 DAG 的 push_lineage
          # 任务每天失败,查出来就是这个。
          #
          # 之前那个 truststore(scripts/20-...)只解决了"证书不被信任",
          # 解决不了"主机名对不上" —— 这两件事是分开的,加多少信任也没用。
          #
          # 为什么不签一张正确的证书:那要替换镜像里的 demo 证书、重做
          # truststore、改 security 插件的一整段配置,而这一跳是**同一个
          # 命名空间内、只有 OpenMetadata 一个客户端、还有 NetworkPolicy
          # 挡着**的内部通信。生产环境应该签(记在 production-readiness-gaps)。
          #
          # OpenSearch 支持用同名环境变量覆盖 opensearch.yml 里的任何设置,
          # 所以不用整个替换那个文件 —— 覆盖式地提供 config.opensearch.yml
          # 会把镜像里 security 插件那一整段 demo 配置也顶掉,那才是真危险。
          - name: plugins.security.ssl.http.enabled
            value: "false"
        resources:
          requests:
            cpu: 300m
            memory: 768Mi
          limits:
            memory: 1280Mi
        persistence:
          enabled: true
          size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
