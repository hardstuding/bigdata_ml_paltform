# 官方 apache/superset chart,默认自带的 postgresql/redis 子 chart 是
# bitnamilegacy 镜像(见 ADR-008),关掉换成我们自己的 Postgres(库由
# apps/superset/manifests/create-db-job.yaml 建)。Redis 也关了(local-lite
# 简化,没有它 Superset 能跑,只是缺异步查询/告警这些高级功能)。
#
# 数据库连接和 SECRET_KEY 不写在这份 values 里——chart 默认行为是从
# DB_USER/DB_PASS/DB_HOST/DB_PORT/DB_NAME 这几个环境变量读连接串
# (`database.uri` 不设置时的默认逻辑)。注意用的是 envFromSecret(单数,
# 覆盖主 Secret 的名字),不是 envFromSecrets(复数,追加一个)——踩过一次
# 坑:initContainer(wait-for-postgres)的 envFrom 硬编码只引用 envFromSecret
# 指向的那一个 Secret,用复数形式追加进去的内容它读不到,会一直连不上
# 卡在 Init 状态。
#
# init.adminUser.password 是 chart 自己的硬编码默认值("admin"),不是我们
# 写的——这个值不会出现在我们的 git 历史里(是 helm template 渲染时才展开的),
# 但运行时的实际密码确实很弱,cloud-full/prod 之前要处理掉(改 init.command
# 或者关掉 init.createAdmin 自己建,和 Airflow 那次一样)。
#
# Keycloak SSO:和 Trino 不一样,Superset(Flask-AppBuilder)的 OAuth 不要求
# 自己起 HTTPS,直接走 configOverrides 加 AUTH_OAUTH 就行,踩坑成本低很多
# (见 ADR-017 记的 Trino 那堆坑,Superset 这边基本不适用)。用
# server_metadata_url 走 OIDC discovery,不用手动拼 auth/token/jwks 各个
# endpoint。AUTH_USER_REGISTRATION_ROLE=Admin 是 local-lite 简化(第一个登录
# 的人自动拿 Admin),和 ArgoCD/Grafana 那两条待办一样,以后要换成按 Keycloak
# group 映射角色。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://apache.github.io/superset
    chart: superset
    targetRevision: 0.22.4
    helm:
      valuesObject:
        # apache/superset 官方镜像默认不带 postgres 驱动(psycopg2),chart
        # 默认的 bootstrapScript 也不装,踩过一次坑(ModuleNotFoundError:
        # No module named 'psycopg2'),这是接外部 Postgres 时的常见已知问题。
        # authlib 是这次接 Keycloak OAuth2 才发现也不在基础镜像里——
        # AUTH_TYPE = AUTH_OAUTH 这条路径 import 的时候才报
        # ModuleNotFoundError: No module named 'authlib',启动阶段的
        # bootstrapScript 之前完全测不出来,只有真的启用 OAuth 才会暴露。
        #
        # trino 这个包是 SQLAlchemy 的 trino:// dialect,Superset 要把 Trino
        # 当数据源接进来(SQL Lab / 建 Dataset / 画 Dashboard)才需要,不装的话
        # 添加数据源那一步会报 "Could not load database driver"。这不是
        # Superset 自己连元数据库用的,是给 Superset 连**其他**业务数据库用的,
        # 每接一种新数据源(以后可能还要 ClickHouse/Doris/MySQL 等)大概率都要
        # 在这里补一个对应的 SQLAlchemy dialect 包,踩到就加,参考
        # docs/operations/troubleshooting.md 里 psycopg2/authlib 那条记录的
        # 处理方式。
        # 2026-08-16 抢占式实例迁移后实测踩到:直连 pypi.org 反复卡住
        # (`Resolved 20 packages in 1m 22s` 之后下载 psycopg2-binary/lz4
        # 这两个几 MB 的小包卡住不动,删 pod 重试过两次都是同一个卡点)
        # ——和这次会话里其他几个自建工具踩的是同一类网络问题。第一版
        # 直接改成裸调 `pip install -i ...` 绕开了官方
        # `/app/docker/pip-install.sh` 包装脚本,结果装到了 Superset 进程
        # 读不到的路径(`ModuleNotFoundError: No module named 'psycopg2'`,
        # pip 本身退出码是 0,没报错但装错地方了)——`bootstrapScript` 里
        # 没有 `set -e`,这个"假成功"还把 `~/bootstrap` 标记文件写上了,
        # 之后每次启动都会跳过重装,是个更隐蔽的坏状态。改成用
        # `PIP_INDEX_URL` 环境变量(pip 全局认,不需要改官方脚本本身),
        # 继续走原来验证过的 `/app/docker/pip-install.sh`,只是外面套一层
        # `timeout` 兜底,`&&` 保证 pip 真失败时不会误写标记文件。
        env:
          - name: PIP_INDEX_URL
            value: "https://mirrors.aliyun.com/pypi/simple/"
        bootstrapScript: |
          #!/bin/bash
          if [ ! -f ~/bootstrap ]; then
            timeout -k 10 240 /app/docker/pip-install.sh psycopg2-binary authlib trino \
              && echo "Running Superset with uid 0" > ~/bootstrap
          fi
        postgresql:
          enabled: false
        redis:
          enabled: false
        cache:
          enabled: false
        # 【可插拔基础设施,见 ADR-030】chart 默认从 DB_USER/DB_PASS/
        # DB_HOST/DB_PORT/DB_NAME 这几个环境变量拼连接串,这几个键都在
        # superset-db-secrets 这个 Secret 里(scripts/00-generate-
        # secrets.sh 生成)——接外部 Postgres 改这个 Secret 的值就行,不用
        # 改这份 Application yaml。配套的
        # apps/superset/manifests/create-db-job.yaml 接外部 Postgres 时
        # 应该跳过(数据库该由 DBA 按平时流程建)。
        envFromSecret: superset-db-secrets
        extraEnvRaw:
          - name: OAUTH2_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: superset-oidc-secret
                key: clientSecret
        configOverrides:
          enable_oauth: |
            from flask_appbuilder.security.manager import AUTH_OAUTH
            AUTH_TYPE = AUTH_OAUTH
            OAUTH_PROVIDERS = [
                {
                    "name": "keycloak",
                    "icon": "fa-key",
                    "token_key": "access_token",
                    "remote_app": {
                        "client_id": "superset",
                        "client_secret": os.environ.get("OAUTH2_CLIENT_SECRET"),
                        "client_kwargs": {"scope": "openid profile email"},
                        "server_metadata_url": "http://keycloak.local-lite.test/auth/realms/platform/.well-known/openid-configuration",
                    },
                }
            ]
            AUTH_ROLE_ADMIN = "Admin"
            AUTH_ROLE_PUBLIC = "Public"
            AUTH_USER_REGISTRATION = True
            AUTH_USER_REGISTRATION_ROLE = "Admin"
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - superset.local-lite.test
        init:
          loadExamples: false
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1024Mi
        supersetNode:
          replicas:
            replicaCount: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1024Mi
        supersetWorker:
          # 没有 Redis/Celery broker,worker 起来也没用。replicaCount 压到 0
          # (Deployment 对象还在,但不占资源,比强行让 enabled:false 生效更可靠)。
          replicas:
            replicaCount: 0
        supersetCeleryBeat:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
