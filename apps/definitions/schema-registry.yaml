# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/schema-registry.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/schema-registry.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Kafka Schema Registry(Karapace),见
# docs/decisions/068-schema-registry.md。源 manifest 在
# templates/apps-schema-registry-manifests/(副本数/规格按环境分档)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schema-registry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/schema-registry/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
