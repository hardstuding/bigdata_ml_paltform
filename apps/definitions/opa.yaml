# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/opa.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/opa.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Open Policy Agent(ADR-051),Trino 细粒度访问控制用。原生 K8s manifest
# 部署,不是 Helm chart——OPA 没有官方维护的 Helm chart(实测确认,见
# ADR-051),用官方 Docker 镜像 + 这个项目自己写的 manifest,和
# permission-request-app 等自建薄组件同一个模式。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/opa/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: opa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
