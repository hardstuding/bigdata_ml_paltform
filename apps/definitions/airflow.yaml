# 官方 apache-airflow chart 默认自带 postgresql(Bitnami 的,见 ADR-008)和
# redis(CeleryExecutor 用的)子 chart,两个都关掉:数据库用我们自己已经在跑
# 的 Postgres 实例(apps/postgres,库由 airflow-db-init 那个 Job 建好),
# executor 用 KubernetesExecutor 就不需要 Celery/Redis 这层broker了,任务
# 天然是 k8s 原生调度,也更符合"组件独立、不多背一层"的原则。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.22.0
    helm:
      valuesObject:
        executor: KubernetesExecutor
        # 任务失败/重试时 KubernetesExecutor 默认会很快删掉对应的 pod,排查
        # 问题时经常等 kubectl 反应过来 pod 已经没了,连 crictl 都抓不到日志
        # (实测踩过好几次)。关掉自动删除,这台本地机器不缺这点残留 pod 的
        # 存储空间,方便调试;真要清理手动 kubectl delete 就行。用 env 而不是
        # config.kubernetes_executor.*——试过后者,chart 的 config 合并只认
        # 预置在模板里的固定键,新加的键会被静默丢掉(实测确认,渲染出来的
        # airflow.cfg 里根本没有这两个键),env 是更直接、保证生效的路径。
        env:
          - name: AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS
            value: "False"
          - name: AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS_ON_FAILURE
            value: "False"
        postgresql:
          enabled: false
        redis:
          enabled: false
        data:
          metadataSecretName: airflow-metadata
        fernetKeySecretName: airflow-fernet-key
        apiSecretKeySecretName: airflow-api-secret
        jwtSecretName: airflow-jwt-secret
        # 内置的 createUserJob 要把初始密码明文写进 values(会进公开仓库的 git
        # 历史),关掉改用 scripts/05-configure-airflow.sh 走 Secret 建管理员账号。
        createUserJob:
          enabled: false
        # 2026-08-12 实测发现:chart 自带的 migrateDatabaseJob 是 Helm 原生
        # post-install/post-upgrade hook,ArgoCD 要等主 Sync 阶段所有资源
        # Healthy 才会触发 PostSync——但 Deployment 的 initContainer 又要等
        # 这个 migrate job 跑完才能启动,死锁(Deployment 永远到不了
        # Healthy,hook 永远不触发,`kubectl get jobs -n airflow` 里这个
        # Job 从始至终没被创建过)。关掉 chart 自带的这个,改用
        # apps/airflow/manifests/migrate-db-job.yaml 里手写的普通 Job(不带
        # 任何 hook 注解,和 create-db-job.yaml 是同一个思路)。
        migrateDatabaseJob:
          enabled: false
        webserver:
          replicas: 1
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
        scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
          # 挂整个 ConfigMap 目录会踩 Airflow 3.x 的坑:k8s ConfigMap 卷靠
          # `..data` 软链 + 带时间戳的隐藏目录做原子更新,Airflow 3.x 新的
          # DAG 目录遍历逻辑会把这些隐藏目录识别成"递归循环"直接崩溃退出
          # (RuntimeError: Detected recursive loop when walking DAG
          # directory)——实测确认。用 subPath 只挂这一个文件,绕开整个
          # 软链目录结构;代价是 ConfigMap 改了以后这个文件不会自动热更新,
          # 需要重启 pod 才能生效,这个 demo DAG 可以接受。
          extraVolumes:
            - name: dags
              configMap:
                name: airflow-dags
          extraVolumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/seatunnel_device_events.py
              subPath: seatunnel_device_events.py
        # dagProcessor 是 Airflow 3.x 才拆出来的独立组件(DAG 解析不再是
        # scheduler 自己干),之前没配 resources,这次一起补上。DAG 文件同样
        # 要挂进这里——scheduler 和 dagProcessor 都要能看到 dags 目录,不是
        # 只挂一边。
        dagProcessor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1024Mi
          # 挂整个 ConfigMap 目录会踩 Airflow 3.x 的坑:k8s ConfigMap 卷靠
          # `..data` 软链 + 带时间戳的隐藏目录做原子更新,Airflow 3.x 新的
          # DAG 目录遍历逻辑会把这些隐藏目录识别成"递归循环"直接崩溃退出
          # (RuntimeError: Detected recursive loop when walking DAG
          # directory)——实测确认。用 subPath 只挂这一个文件,绕开整个
          # 软链目录结构;代价是 ConfigMap 改了以后这个文件不会自动热更新,
          # 需要重启 pod 才能生效,这个 demo DAG 可以接受。
          extraVolumes:
            - name: dags
              configMap:
                name: airflow-dags
          extraVolumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/seatunnel_device_events.py
              subPath: seatunnel_device_events.py
        triggerer:
          replicas: 1
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        statsd:
          enabled: false
        dags:
          gitSync:
            enabled: false
        # KubernetesExecutor 每个任务起一个独立 pod,用的是 workers.kubernetes
        # 这份 pod 模板——不是 scheduler/dagProcessor 那份。一开始只挂了
        # scheduler/dagProcessor,任务 pod 里根本没有 DAG 文件,报
        # "Dag not found during start up"(实测确认,DAG 逻辑本身用
        # `airflow tasks test` 在 scheduler pod 里跑是完全正常的,问题只在
        # KubernetesExecutor 起的任务 pod 缺这个挂载)。
        workers:
          kubernetes:
            extraVolumes:
              - name: dags
                configMap:
                  name: airflow-dags
            extraVolumeMounts:
              - name: dags
                mountPath: /opt/airflow/dags/seatunnel_device_events.py
                subPath: seatunnel_device_events.py
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
