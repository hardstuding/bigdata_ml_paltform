# 官方 apache-airflow chart 默认自带 postgresql(Bitnami 的,见 ADR-008)和
# redis(CeleryExecutor 用的)子 chart,两个都关掉:数据库用我们自己已经在跑
# 的 Postgres 实例(apps/postgres,库由 airflow-db-init 那个 Job 建好),
# executor 用 KubernetesExecutor 就不需要 Celery/Redis 这层broker了,任务
# 天然是 k8s 原生调度,也更符合"组件独立、不多背一层"的原则。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.22.0
    helm:
      valuesObject:
        executor: KubernetesExecutor
        postgresql:
          enabled: false
        redis:
          enabled: false
        data:
          metadataSecretName: airflow-metadata
        fernetKeySecretName: airflow-fernet-key
        apiSecretKeySecretName: airflow-api-secret
        jwtSecretName: airflow-jwt-secret
        # 内置的 createUserJob 要把初始密码明文写进 values(会进公开仓库的 git
        # 历史),关掉改用 scripts/05-configure-airflow.sh 走 Secret 建管理员账号。
        createUserJob:
          enabled: false
        # 2026-08-12 实测发现:chart 自带的 migrateDatabaseJob 是 Helm 原生
        # post-install/post-upgrade hook,ArgoCD 要等主 Sync 阶段所有资源
        # Healthy 才会触发 PostSync——但 Deployment 的 initContainer 又要等
        # 这个 migrate job 跑完才能启动,死锁(Deployment 永远到不了
        # Healthy,hook 永远不触发,`kubectl get jobs -n airflow` 里这个
        # Job 从始至终没被创建过)。关掉 chart 自带的这个,改用
        # apps/airflow/manifests/migrate-db-job.yaml 里手写的普通 Job(不带
        # 任何 hook 注解,和 create-db-job.yaml 是同一个思路)。
        migrateDatabaseJob:
          enabled: false
        webserver:
          replicas: 1
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
        scheduler:
          replicas: 1
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1024Mi
          extraVolumes:
            - name: dags
              configMap:
                name: airflow-dags
          extraVolumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
        # dagProcessor 是 Airflow 3.x 才拆出来的独立组件(DAG 解析不再是
        # scheduler 自己干),之前没配 resources,这次一起补上。DAG 文件同样
        # 要挂进这里——scheduler 和 dagProcessor 都要能看到 dags 目录,不是
        # 只挂一边。
        dagProcessor:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1024Mi
          extraVolumes:
            - name: dags
              configMap:
                name: airflow-dags
          extraVolumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
        triggerer:
          replicas: 1
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        statsd:
          enabled: false
        dags:
          gitSync:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
