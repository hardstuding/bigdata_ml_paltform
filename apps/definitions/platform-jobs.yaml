# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/platform-jobs.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/platform-jobs.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 定时作业(A 线「作业模板 + CI/CD」的后半)。
#
# 源是 `jobs/` 下每个作业的 job.yaml + 脚本,`scripts/render-jobs.py` 渲染成
# 这个 Application 读的 manifest(脚本 ConfigMap + Argo CronWorkflow)。
# 用户加一个定时作业 = 在 jobs/ 里加一个目录 + 写个 schedule + push,
# 不用写 Airflow DAG、不用手动提交。说明见 jobs/README.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-jobs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/platform-jobs/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
