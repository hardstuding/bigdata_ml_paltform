# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/argo-training-workflow-template.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/argo-training-workflow-template.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Argo Workflows 编排训练——WorkflowTemplate + 训练脚本 ConfigMap(裸
# manifest,见 apps/argo-workflows-training-image/manifests/ 里的完整
# 设计说明,包括为什么不采用 notebook+papermill 这个曾经考虑过的方案)。
#
# 依赖的镜像(apps/argo-workflows-training-image/Dockerfile)2026-08-20
# 起由 GitHub Actions 自动构建推到 GHCR(见 .github/workflows/
# build-images.yml),workflow-template.yaml 里引用的是带 digest 的
# ghcr.io 地址,不再是"本地构建、手动确保节点上已经有"那套。
#
# 2026-08-19 新增,这是这条链路第一次真正接入 Argo Workflows,不是"重新
# 验证"已有能力——之前训练一直是人直接跑 scripts/09-train-demo-model.sh。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-training-workflow-template
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/argo-workflows-training-image/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
