# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/spark-history-server.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/spark-history-server.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Spark History Server 本体(裸 manifest,见 apps/spark-history-server/
# manifests/deployment.yaml 里的说明)。前面挂 oauth2-proxy 做 SSO,见同目录
# 下的 spark-history-server-oauth2-proxy.yaml,和 MLflow(ADR-019)是同一个
# "应用本身没有原生 OIDC,用 oauth2-proxy 挡在前面"模式。
#
# 和 spark-operator.yaml 一起 park:History Server 读的是 Spark 作业写的
# eventLog,Spark Operator 不跑、没有真实作业,这个组件本身没有意义,两个
# 一起启用/一起收起来。见 ADR-029。
#
# 只装了服务端,没有验证过——需要真的有 Spark 作业写了 eventLog 到
# s3://spark-logs/ 才能测出这一层到底通不通,留到 Spark Operator 真正启用、
# 跑第一个真实作业时一起验证。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-history-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/spark-history-server/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: spark-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
