# CloudNativePG(CNCF 沙箱项目,EDB 主导)。评估用,给 apps/postgres/ 那个
# 单实例原生 manifest 找一条 HA 升级路径——见 docs/decisions/033-postgres-
# backup.md 的"后果"部分提到过备份是有了,但真正的高可用(自动故障转移/
# 多副本)还是空白;用户确认过"换组件也是可以换的,问题不大"。
#
# 这一步只装 operator 本身(轻量,不影响现有共享 Postgres),不代表已经
# 决定切换——真正的迁移(建新 Cluster、导数据、切各组件连接串、下线旧
# 实例)是更大的动作,牵一发动全身(几乎所有组件都连着这个共享实例),
# 需要用户在场安排一个可以接受短暂中断的窗口,不适合无人监督执行。评估
# 记录见 docs/decisions/038-cloudnativepg-evaluation.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      valuesObject:
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CNPG 的 Cluster CRD 是这个生态里出了名的大(实测确认 operator 装完
      # 之后 clusters.postgresql.cnpg.io 这一个 CRD 没能真的建成,其余 8 个
      # 小的 CRD 都建好了),超过 kubectl client-side apply 的
      # last-applied-configuration annotation 262144 字节上限——和 KServe
      # CRD 踩的是同一个坑(见 ADR-027),同样的解法。
      - ServerSideApply=true
