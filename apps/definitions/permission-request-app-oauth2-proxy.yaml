# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/permission-request-app-oauth2-proxy.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/permission-request-app-oauth2-proxy.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/permission-request-app-
# oauth2-proxy.yaml + environments/<env>/config.yaml——改动请改模板
# 文件,不要直接改这份生成结果(下次渲染会被覆盖)。见
# environments/cloud-full/config.yaml 顶部说明背景。
#
# 和 MLflow(ADR-019)、Spark History Server(ADR-029)是同一个 oauth2-proxy
# 模式。这里刻意**不设 allowed_groups**——权限申请门户本来就该是"任何登录
# 用户都能提申请",谁能审批是 app 自己内部按 platform-team 判断的(见
# ADR-032),不是 oauth2-proxy 这一层的事,卡在这一层反而会出现"想申请
# algorithm-team 权限,但没有 algorithm-team 权限进不了申请页面"的死锁。
#
# pass_access_token 是这个组件比 MLflow/Spark History Server 多开的一个
# 选项:app 自己要读 token 里的 groups claim 判断谁是审批人,legacy config
# 格式没有单独一个"把 groups 转成请求头"的选项,只能把整个 access token
# 传下去,app 自己解。
#
# **2026-08-29 补的关键一句**:传下去的 token 里**有没有 groups 这个 claim,
# 由 Keycloak 那边决定,不由这里决定**。这个 client 此前不在
# scripts/03-configure-keycloak.sh 挂 groups scope 的名单里,所以 groups
# 永远是空的、`is_approver` 永远是 False、组权限申请的批准/审计/交接页对
# **所有人**都是 403 —— 而这里的 pass_access_token 是开着的,看上去一切正常。
# 名单已经补上,但要**跑一次那个脚本并重新登录**才生效。
#
# 注意挂的是 **default** client scope,不是 optional,所以这里的 scope 里
# **不要**去加 `groups`:请求一个 client 没配的 scope,Keycloak 直接
# `invalid_scope`,登录页都进不去(MLflow 2026-08-19 就是这么炸的)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: permission-request-app-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            # 2026-08-16 cloud-full 真实故障(和 platform-portal-oauth2-proxy
            # 同一个坑,那边有完整两层说明:①redirect_url 不带端口 404,
            # ②修完之后 Keycloak 的 issuer 带了端口,自动 discovery 校验
            # 不通过 + 集群内部又连不上带端口的外部地址,改成关掉自动
            # discovery,手动分开配置)。
            oidc_issuer_url = "http://keycloak.local-lite.test:32460/auth/realms/platform"
            skip_oidc_discovery = true
            login_url = "http://keycloak.local-lite.test:32460/auth/realms/platform/protocol/openid-connect/auth"
            redeem_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/token"
            oidc_jwks_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/certs"
            profile_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/userinfo"
            redirect_url = "http://permission-request.local-lite.test:32460/oauth2/callback"
            upstreams = [ "http://permission-request-app.permission-request-app.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
            pass_access_token = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - permission-request.local-lite.test
        # 这个进程在**认证请求路径上**:它一重启(滚更、节点漂移、OOM),
        # 对应服务的 SSO 就断一次。prod 给 2 副本,见
        # environments/resource-profiles.yaml。
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: permission-request-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
