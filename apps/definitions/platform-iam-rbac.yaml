# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/platform-iam-rbac.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/platform-iam-rbac.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# AI 运维角色的 K8s RBAC 身份(ADR-048)。和 network-policies 同一个模式:
# 这个 Application 的 destination.namespace 只是个默认值,ServiceAccount
# 显式写了 namespace,ClusterRole/ClusterRoleBinding 本身是集群范围资源,
# 不受这个字段影响。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-iam-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: platform/iam/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
