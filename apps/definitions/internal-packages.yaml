# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/internal-packages.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/internal-packages.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 内部包发布(ADR-083)。把 packages/ 下的包构建成 wheel 发到 MinIO 上的
# PEP 503 静态索引,notebook 和作业 pod 的 pip 已经配好了这个索引。
#
# 放在 data 命名空间:它是"平台自己的数据处理任务"这一类,和 postgres-backup
# 同一个处境,不值得为它单开一个命名空间。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-packages
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/internal-packages/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
