# 官方 feast-dev/feast Helm chart(infra/charts/feast,发布在
# https://feast-helm-charts.storage.googleapis.com)。只开 feature-server
# 子 chart(在线特征检索服务),transformation-service 关掉——demo 不需要
# on-demand transform,local-lite 资源也紧张,不为用不到的组件占内存。
# chart 自带的 redis 子 chart 依赖已失效的 charts.helm.sh/stable 仓库(见
# apps/feast/manifests/redis.yaml 顶部注释),这里关掉(redis.enabled: false),
# Redis 改用同目录下的裸 manifest,通过 apps/feast/manifests 这份独立的
# Application(见下面 kustomize 那份定义)一起纳入同一个 feast 命名空间。
#
# feature_store_yaml_base64 是 chart 唯一支持注入 feature_store.yaml 的方式
# ——只能是一整个 base64 字符串,不能引用外部文件,所以和
# scripts/feast_feature_repo/feature_store.yaml 是两份需要手动保持同步的
# 内容(改一处记得跟着改另一处;正文一致,重新生成用
# `base64 -i scripts/feast_feature_repo/feature_store.yaml | tr -d '\n'`)。
# 这是 chart 设计本身的限制,不是这次图省事的选择。
#
# 【可插拔基础设施,见 ADR-030】MinIO 凭据走 extraEnvs 从 minio-root 这个
# Secret 读,和 apps/mlflow 是同一个模式——接外部 S3 改这两行的
# secretKeyRef,不用碰 base64 blob 本身(offline_store.spark_conf 里引用的
# 是 ${env.MINIO_ACCESS_KEY}/${env.MINIO_SECRET_KEY} 这两个变量名,不是明文)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feast
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://feast-helm-charts.storage.googleapis.com
    chart: feast
    targetRevision: 0.65.0
    helm:
      valuesObject:
        feature-server:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          extraEnvs:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          feature_store_yaml_base64: ""
        transformation-service:
          enabled: false
        redis:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: feast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Redis(裸 manifest,见 apps/feast/manifests/redis.yaml 顶部注释)单独一个
# Application,和上面的 feast chart 是同一个命名空间,分开定义是因为一个是
# Helm chart 源、一个是 git 目录源,ArgoCD Application 的 source 类型不能混。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feast-redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/feast/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: feast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
