# 官方 argo-helm 仓库(和 ArgoCD 自己用的是同一个 repoURL,argoproj 官方
# 维护)。SSO 用 server.sso(不是 server.authModes: [server]/[client] 那两种
# 更简单但没有真实身份的模式):这个和 ArgoCD 自己的内置 OIDC 是同一种设计
# ——只有一个 issuer 字段,服务端自己发起 OIDC discovery/token 交换也用它,
# 不像 Grafana/JupyterHub 那样能把"浏览器跳转用的地址"和"后端自己发请求
# 用的地址"分开配(见 ADR-025)。好在 keycloak.local-lite.test 已经在
# platform/coredns-custom/ 的自定义 DNS zone 里(当初是给 ArgoCD/Trino 配的,
# 见 ADR-016/017),这里直接复用,不需要再加什么。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.24
    helm:
      valuesObject:
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        server:
          authModes:
            - sso
          sso:
            enabled: true
            issuer: "http://keycloak.local-lite.test/auth/realms/platform"
            clientId:
              name: argo-workflows-oidc-secret
              key: client-id
            clientSecret:
              name: argo-workflows-oidc-secret
              key: client-secret
            redirectUrl: "http://argo-workflows.local-lite.test/oauth2/callback"
            scopes:
              - openid
              - profile
              - email
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - argo-workflows.local-lite.test
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
