# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/argo-workflows.yaml +
# environments/<env>/config.yaml——改动请改模板文件,不要直接改这份
# 生成结果(下次渲染会被覆盖)。见 environments/cloud-full/config.yaml
# 顶部说明背景。
#
# 官方 argo-helm 仓库(和 ArgoCD 自己用的是同一个 repoURL,argoproj 官方
# 维护)。SSO 用 server.sso(不是 server.authModes: [server]/[client] 那两种
# 更简单但没有真实身份的模式)。
#
# 2026-08-19 真实故障(argo-workflows-server 启动就 CrashLoopBackOff,
# 2 天多没人发现,直到这次角色能力盘点才追出来):日志报 "oidc: issuer
# did not match the issuer returned by provider, expected 'X' got 'Y'"。
# 读了 argo-workflows 官方源码
# (server/auth/sso/sso.go newSso 函数)才搞清楚真正的机制,不是靠猜的:
# `oidc.NewProvider(ctx, c.Issuer)` 会真的去请求
# "{c.Issuer}/.well-known/openid-configuration",然后校验返回文档里的
# "issuer" 字段是否**逐字节等于** c.Issuer 这个字符串。Keycloak 的
# discovery 文档里 "issuer" 字段是 KC_HOSTNAME 固定值(带端口,不会像
# token_endpoint 那样根据请求方式动态变化,这条在 Trino 那次修复时已经
# 验证清楚——见 platform/apps/keycloak.yaml 的说明)。之前这里 issuer 配的
# 是不带端口的内部地址,能连通(discovery 请求本身走内部路径没问题),但
# 拿回来的文档里 issuer 字段是带端口的外部值,两者对不上,`NewProvider`
# 直接拒绝,进程根本起不来。
#
# 解法是 chart 暴露的 `sso.issuerAlias` 字段,对应源码里的
# `oidc.InsecureIssuerURLContext(ctx, c.IssuerAlias)`——这个 go-oidc 库
# 函数的实际语义(读源码确认,库自己的注释也写了是给"discovery 文档里的
# issuer 字段和真正拿去请求 discovery 的地址不一致"这种场景用的)是:
# **拿 issuerAlias 去比对文档里的 issuer 字段,不是拿 c.Issuer 比对**。
# 所以现在这份配置是:issuer(下面这行)留不带端口的内部地址,只用来
# 发起 discovery 请求;issuerAlias 填带端口的外部固定值,拿去跟文档里的
# issuer 字段比对——两个字段各司其职,不是随便填一个"备用地址"。
# provider.Endpoint() 里的 authorization_endpoint 本来就是
# frontchannel、固定用带端口的外部地址(和 issuer 字段同一个道理),浏览器
# 跳转不受这次改动影响。
#
# 2026-08-19 SSO 登录成功后调 API 403(RBAC 层,和上面 issuer 问题是两个
# 独立故障):读了官方源码(server/auth/gatekeeper.go 的 rbacAuthorization/
# getServiceAccount/authorizationForServiceAccount)才搞清楚
# server.sso.rbac 的真实机制,不是简单打开一个开关就行——
#   1. `sso.rbac.enabled: true` 只是让 argo-workflows-server 自己的
#      ServiceAccount 多一条权限(get/list/watch serviceaccounts、get
#      secrets),不代表任何登录用户就有权限了。
#   2. 真正授权靠额外建一个 ServiceAccount,打
#      `workflows.argoproj.io/rbac-rule` 注解(一段 expr 表达式,能读
#      id_token 里的 groups/sub/iss),server 收到登录请求后按
#      `workflows.argoproj.io/rbac-rule-precedence` 从高到低找第一个
#      规则匹配的 ServiceAccount。
#   3. 匹配到 ServiceAccount 之后,server 不是用 TokenRequest API 现场
#      换 token,是去读一个**长期存在**的 `kubernetes.io/service-account-
#      token` 类型 Secret(K8s 1.24+ 不会给 ServiceAccount 自动建这种
#      Secret 了,必须手动建,chart 本身不会替你建)。
#   4. 这个 ServiceAccount 自己要有 Role/RoleBinding 授权 workflows 相关
#      资源,不然换到 token 也一样 403——chart 只建它自己 server 用的
#      ClusterRole,不会替任意 SSO 用户建这份。
# 下面 extraObjects 里的四个资源就是补这一整套:ServiceAccount(挂
# platform-team 组的匹配规则,对应 admin 用户所在的组——2026-08-19 同一天
# 修的 Keycloak groups client scope,argo-workflows 这个 client 也要挂,
# 见 scripts/03-configure-keycloak.sh)、长期 token Secret、Role、
# RoleBinding。授权范围限定在 argo-workflows 这一个命名空间(和 curl 测试
# 的 `/api/v1/workflows/argo-workflows` 一致),没有覆盖 cluster 级的
# clusterworkflowtemplates。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.24
    helm:
      valuesObject:
        # 这个 chart 默认靠一个 pre-install Job 从 raw.githubusercontent.com
        # 实时下载完整版 CRD 再 apply。之前用 HTTP_PROXY/HTTPS_PROXY 指向
        # colima 宿主机本地代理(192.168.5.2:1087)让 local-lite 能连上,
        # 但这个地址只在这台 Mac 上存在——2026-08-16 云端部署时发现
        # cloud-full(独立公网出口)连不到这个代理,Job 卡死超时。改成把
        # 7 个 CRD vendor 进仓库(apps/argo-workflows-crds/manifests/),
        # 由 scripts/25-install-argo-workflows-crds.sh 一次性
        # `kubectl apply --server-side` 装好,GitOps 同步路径完全不再
        # 依赖任何网络/代理,local-lite 和 cloud-full 用同一份操作,不用
        # 各自适配网络环境。crds.install 关掉,不用 chart 自带的下载 Job。
        crds:
          install: false
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        server:
          authModes:
            - sso
          sso:
            enabled: true
            issuer: "http://keycloak.local-lite.test/auth/realms/platform"
            issuerAlias: "http://keycloak.local-lite.test:32460/auth/realms/platform"
            clientId:
              name: argo-workflows-oidc-secret
              key: client-id
            clientSecret:
              name: argo-workflows-oidc-secret
              key: client-secret
            redirectUrl: "http://argo-workflows.local-lite.test:32460/oauth2/callback"
            scopes:
              - openid
              - profile
              - email
            rbac:
              enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - argo-workflows.local-lite.test
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        extraObjects:
          # platform-team 组(admin 用户所在组)在 argo-workflows
          # 命名空间的授权——见上面大段注释,server.sso.rbac.enabled
          # 本身不建这四个资源,chart 不替 SSO 用户建。
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: argo-workflows-sso-platform-team
              namespace: argo-workflows
              annotations:
                workflows.argoproj.io/rbac-rule: "'platform-team' in groups"
                workflows.argoproj.io/rbac-rule-precedence: "1"
          - apiVersion: v1
            kind: Secret
            metadata:
              name: argo-workflows-sso-platform-team.service-account-token
              namespace: argo-workflows
              annotations:
                kubernetes.io/service-account.name: argo-workflows-sso-platform-team
            type: kubernetes.io/service-account-token
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: argo-workflows-sso-platform-team
              namespace: argo-workflows
            rules:
              - apiGroups:
                  - argoproj.io
                resources:
                  - workflows
                  - workflows/finalizers
                  - workflowtemplates
                  - cronworkflows
                  - cronworkflows/finalizers
                  - workfloweventbindings
                  - workflowtasksets
                  - workflowtaskresults
                verbs:
                  - get
                  - list
                  - watch
                  - create
                  - update
                  - patch
                  - delete
              - apiGroups:
                  - ""
                resources:
                  - pods
                  - pods/log
                  - configmaps
                  - events
                verbs:
                  - get
                  - list
                  - watch
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: argo-workflows-sso-platform-team
              namespace: argo-workflows
            subjects:
              - kind: ServiceAccount
                name: argo-workflows-sso-platform-team
                namespace: argo-workflows
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: argo-workflows-sso-platform-team
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
