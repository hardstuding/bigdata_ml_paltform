# 建表注册工具本体。见 docs/decisions/043-table-registration-tool.md。
# 前面挂 oauth2-proxy 做 SSO,见同目录下的 table-registration-app-oauth2-proxy.yaml。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: table-registration-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/table-registration-app/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: table-registration-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
