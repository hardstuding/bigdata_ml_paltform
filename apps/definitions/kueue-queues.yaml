# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/kueue-queues.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/kueue-queues.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# Kueue 的队列对象(ResourceFlavor / ClusterQueue / LocalQueue),源文件在
# templates/apps-kueue-manifests/ ——配额数字按环境分档,渲染产物落在
# apps/kueue/manifests/,这个 Application 的 path 不用跟着改。
#
# sync-wave 1:必须排在 kueue(wave 0)后面,因为这些对象用的 CRD 是那个
# Application 装出来的。**第一次部署时这个 Application 会先失败一次再
# 自愈**——ArgoCD 的 wave 只保证顺序,不等 CRD 在 API server 里注册完成。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue-queues
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/kueue/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
