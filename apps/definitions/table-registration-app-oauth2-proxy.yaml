# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/table-registration-app-oauth2-proxy.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/table-registration-app-oauth2-proxy.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 templates/apps-definitions/table-registration-app-
# oauth2-proxy.yaml + environments/<env>/config.yaml——改动请改模板
# 文件,不要直接改这份生成结果(下次渲染会被覆盖)。见
# environments/cloud-full/config.yaml 顶部说明背景。
#
# 和 permission-request-app 同一个 oauth2-proxy 模式(ADR-032)。这个不需要
# pass_access_token/解 groups——建表注册这次没有审批门槛,任何登录用户都能
# 提交(见 ADR-043),不需要拿 groups claim 判断谁是审批人。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: table-registration-app-oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.7.0
    helm:
      valuesObject:
        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "oidc"
            # 2026-08-16 cloud-full 真实故障(和 platform-portal-oauth2-proxy
            # 同一个坑,那边有完整两层说明:①redirect_url 不带端口 404,
            # ②修完之后 Keycloak 的 issuer 带了端口,自动 discovery 校验
            # 不通过 + 集群内部又连不上带端口的外部地址,改成关掉自动
            # discovery,手动分开配置)。
            oidc_issuer_url = "http://keycloak.local-lite.test:32460/auth/realms/platform"
            skip_oidc_discovery = true
            login_url = "http://keycloak.local-lite.test:32460/auth/realms/platform/protocol/openid-connect/auth"
            redeem_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/token"
            oidc_jwks_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/certs"
            profile_url = "http://keycloak.local-lite.test/auth/realms/platform/protocol/openid-connect/userinfo"
            redirect_url = "http://table-registration.local-lite.test:32460/oauth2/callback"
            upstreams = [ "http://table-registration-app.table-registration-app.svc.cluster.local:8080/" ]
            email_domains = [ "*" ]
            cookie_secure = false
            skip_provider_button = true
        ingress:
          enabled: true
          className: nginx
          hosts:
            - table-registration.local-lite.test
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: table-registration-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
