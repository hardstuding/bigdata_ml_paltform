# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/alert-echo-sink.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/alert-echo-sink.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 告警回显接收端(ADR-081)。见 apps/alert-echo-sink/manifests/ 里的说明:
# 它把"告警能不能送出去"从一条从未验证过的路径,变成一条一直在被验证的路径。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-echo-sink
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/alert-echo-sink/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: ["CreateNamespace=true"]
