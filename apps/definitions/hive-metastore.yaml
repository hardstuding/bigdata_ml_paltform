# 这个文件是自动生成的(python3 scripts/render-environment-config.py
# <env>),源头是 apps/components/hive-metastore.yaml +
# environments/<env>/config.yaml 里的 enabled_components 列表——改动
# 请改 apps/components/hive-metastore.yaml,不要直接改这份生成结果(下次渲染会被
# 覆盖)。这个组件要不要在这个环境启用,改 config.yaml 的
# enabled_components 列表,不要手动删/加这个文件。见
# docs/decisions/057-architecture-review-2026-08-19.md 第三批。
# 依赖 postgres(metastore 库由 postgres 的 init 脚本建好,见 apps/postgres/)。
# ArgoCD 的 sync wave 没配也没关系:metastore 建表用的是 datanucleus 的
# autoCreateSchema,postgres 没起来之前 hive-metastore 会 CrashLoop 重试,
# 自愈之后能追上,不需要显式排队。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-metastore
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardstuding/bigdata_ml_paltform.git
    targetRevision: main
    path: apps/hive-metastore/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
