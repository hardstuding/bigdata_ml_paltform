# 和 apps/airflow、apps/superset 下的 create-db-job.yaml 同样的模式。
# 注意这个 Job 建在 openmetadata 命名空间(不是 data)——它要读的密码
# 存在 openmetadata-postgresql-secrets 里,那个 Secret 是给 openmetadata
# 命名空间用的,放这里避免又踩一次跨命名空间引用不了的坑(见
# troubleshooting.md 里 Trino 连 MinIO 那次)。Job 本身通过网络连
# postgres.data.svc.cluster.local,不需要和 Postgres 同命名空间——注意必须用完整域名,不能用短名"postgres",短名只有同命名空间才能解析(airflow/superset 的 db-init job 能用短名是因为它们本来就建在 data 命名空间里,这个不一样)。
# 【可插拔基础设施,见 ADR-030】接外部 Postgres 就别装这个 Job——数据库该
# 由 DBA 按平时流程建,同时把 apps/definitions/openmetadata.yaml 里
# database.host/port/databaseName/auth.username 改成外部实例的值。
apiVersion: batch/v1
kind: Job
metadata:
  name: openmetadata-create-db
  namespace: openmetadata
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-db
          image: postgres:16.15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-root
                  key: password
            - name: OM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openmetadata-postgresql-secrets
                  key: openmetadata-postgresql-password
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # 见 apps/mlflow/manifests/create-db-job.yaml 的注释:同一个
              # "刚创建的 pod 第一次连接 Postgres 有短暂延迟"的坑,每个
              # backoffLimit 重试都是全新 pod、各自要重新等,容易把重试
              # 次数耗尽——用 pg_isready 在同一个 pod 内先等到位。
              for i in $(seq 1 10); do
                pg_isready -h postgres.data.svc.cluster.local -p 5432 -U postgres >/dev/null 2>&1 && break
                echo "第 ${i} 次探测 postgres 未就绪,3 秒后重试" >&2
                sleep 3
              done
              psql -h postgres.data.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='openmetadata_user'" | grep -q 1 \
                || psql -h postgres.data.svc.cluster.local -U postgres -c "CREATE USER openmetadata_user WITH PASSWORD '${OM_DB_PASSWORD}';"
              psql -h postgres.data.svc.cluster.local -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='openmetadata_db'" | grep -q 1 \
                || psql -h postgres.data.svc.cluster.local -U postgres -c "CREATE DATABASE openmetadata_db OWNER openmetadata_user;"
