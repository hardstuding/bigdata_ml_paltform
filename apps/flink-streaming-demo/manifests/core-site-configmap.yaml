# 这是 apps/hive-metastore/manifests/core-site-configmap.yaml 的**内容
# 复制**,不是共用同一份——ConfigMap 是命名空间级资源,Flink 的
# JobManager/TaskManager pod 跑在 flink 命名空间,没法直接挂载 data
# 命名空间里的 ConfigMap。Flink 官方文档说明的机制是:设置
# HADOOP_CONF_DIR 环境变量指向一个挂了 core-site.xml 的目录,Flink 的
# HadoopUtils 会自动从那里加载 Hadoop Configuration(不需要把 core-site.xml
# 打进镜像,ConfigMap 挂载即可)——这份文件提供的正是那个目录的内容。
#
# **已知的维护成本,记录下来不是藏着**:这是这个仓库第一次出现"同一份
# S3A 配置需要在两个命名空间各存一份"的情况(Trino/Spark 都是把 s3a.*
# 属性直接写进自己的组件配置里,不需要一份独立的 core-site.xml 文件;
# 只有 Flink 走 HADOOP_CONF_DIR 这条路径)。MinIO endpoint/访问方式变了,
# 这份文件要跟着 apps/hive-metastore/manifests/core-site-configmap.yaml
# 一起改,不会自动同步。如果这类需要 HADOOP_CONF_DIR 的组件以后还会
# 增多,值得考虑用 Kustomize 之类的机制统一生成多份 ConfigMap,但这次
# 只有一个消费者,先手动维护,不提前做没有第二个使用场景验证过的抽象。
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-hadoop-core-site
  namespace: flink
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio.minio.svc.cluster.local:9000</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>${env.MINIO_ACCESS_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>${env.MINIO_SECRET_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.defaultFS</name>
        <value>s3a://lakehouse/</value>
      </property>
    </configuration>
